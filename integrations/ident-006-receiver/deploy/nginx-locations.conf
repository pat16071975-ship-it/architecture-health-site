# Include only in the explicitly verified HTTPS server block.
location = /api/ident-bridge/v1/batches {
    if ($request_method != POST) { return 405; }
    if ($scheme != https) { return 400; }
    if ($host != __IDENT_HTTPS_HOST__) { return 404; }
    if ($ssl_server_name != __IDENT_HTTPS_HOST__) { return 404; }
    if ($args != "") { return 404; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_encoding != "") { return 400; }
    auth_basic off;
    auth_request off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    client_body_timeout 15s;
    send_timeout 15s;
    limit_req zone=az_ident006b_rate burst=10 nodelay;
    limit_req_status 429;
    limit_conn az_ident006b_conn 3;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection close;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 40s;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_pass http://az_ident006b_backend;
}
