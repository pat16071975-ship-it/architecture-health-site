le:-30deg" data-zones="head,neck,spine,pelvis"><span>Остеопатия</span></button><button class="direction" style="--angle:0deg" data-zones="jaw,neck,chest"><span>Миофункциональная<br>терапия</span></button><button class="direction" style="--angle:30deg" data-zones="head,chest,abdomen,pelvis"><span>Превентивная<br>медицина</span></button><button class="direction" style="--angle:60deg" data-zones="abdomen"><span>Гастроэнтерология</span></button><button class="direction" style="--angle:90deg" data-zones="abdomen,chest"><span>Нутрициология</span></button><button class="direction" style="--angle:120deg" data-zones="chest,abdomen"><span>Терапия</span></button><button class="direction" style="--angle:150deg" data-zones="head,spine"><span>Неврология</span></button><button class="direction" style="--angle:180deg" data-zones="head"><span>Нейропсихология</span></button><button class="direction" style="--angle:210deg" data-zones="spine,pelvis,legs,feet"><span>DIERS<br>диагностика</span></button><button class="direction" style="--angle:240deg" data-zones="chest,head"><span>ИГГТ</span></button></div><p class="hint"><span>Наведите на направление — соответствующие зоны тела начнут пульсировать</span></p></section></main><script>const btn=[...document.querySelectorAll('.direction')],hot=[...document.querySelectorAll('.hot')];function clear(){btn.forEach(b=>b.classList.remove('active'));hot.forEach(h=>h.classList.remove('on'))}function show(b){clear();b.classList.add('active');(b.dataset.zones||'').split(',').forEach(z=>{const e=document.querySelector('[data-zone="'+z.trim()+'"]');if(e)e.classList.add('on')})}btn.forEach(b=>{b.addEventListener('mouseenter',()=>show(b));b.addEventListener('mouseleave',clear);b.addEventListener('focus',()=>show(b));b.addEventListener('blur',clear);b.addEventListener('click',()=>show(b))})</script></body></html>
