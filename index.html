<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архитектура здоровья</title><style>
:root{--paper:#f6f1e8;--paper2:#eee6da;--ink:#293029;--green:#405c48;--gold:#b59662}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fbf8f2 0,var(--paper) 62%,var(--paper2) 100%);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}.page{width:1400px;max-width:96vw;margin:auto;padding:26px 0 54px}.top{display:grid;grid-template-columns:240px 1fr 240px;gap:30px;align-items:start;min-height:230px}.left,.right{width:240px;display:flex;flex-direction:column;align-items:center}.logo{width:220px;height:178px;object-fit:contain;display:block}.founder{width:220px;height:178px;object-fit:cover;display:block;border:1px solid rgba(64,92,72,.16);box-shadow:0 10px 28px rgba(63,52,36,.08)}.caption{margin-top:10px;text-align:center;font-size:14px;line-height:1.35;color:#515951}.caption strong{color:var(--ink)}.center{align-self:center;text-align:center;padding-top:8px}h1{margin:0;font:400 76px/1.02 Georgia,'Times New Roman',serif;letter-spacing:.005em}.rule{width:220px;height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.map-shell{height:860px;position:relative}.map{position:absolute;left:50%;top:0;width:1140px;height:860px;transform:translateX(-50%)}.orbit{position:absolute;left:190px;top:50px;width:760px;height:760px;border:1px solid rgba(181,150,98,.22);border-radius:50%;pointer-events:none}.orbit:before,.orbit:after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(181,150,98,.12)}.orbit:before{inset:38px}.orbit:after{inset:76px}.stage{position:absolute;left:290px;top:150px;width:560px;height:560px;border-radius:50%;overflow:hidden;background:#efe6d8;border:1px solid rgba(181,150,98,.52);box-shadow:0 18px 60px rgba(76,58,34,.11);z-index:2}.stage:before{content:'';position:absolute;inset:25px;border-radius:50%;border:1px solid rgba(181,150,98,.28);z-index:4;pointer-events:none}.vit{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:sepia(.12) saturate(.83) contrast(.96) brightness(1.06);mix-blend-mode:multiply;opacity:.9;z-index:1}.direction{position:absolute;transform:translate(-50%,-50%);width:190px;height:58px;border:1px solid rgba(64,92,72,.27);background:rgba(250,247,241,.96);color:#30372f;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.16;font-weight:650;cursor:pointer;z-index:8;box-shadow:0 5px 16px rgba(71,58,38,.06);transition:.18s}.direction:hover,.direction.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 9px 24px rgba(64,92,72,.2);transform:translate(-50%,-50%) scale(1.04)}.hot{position:absolute;z-index:6;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.72);border-radius:50%;background:radial-gradient(circle,rgba(190,72,59,.9),rgba(190,72,59,.42) 32%,rgba(190,72,59,.11) 58%,transparent 74%)}.hot.on{opacity:1;animation:pulse 1.05s ease-in-out infinite}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.72);opacity:.45}50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}}.head{left:50%;top:22%;width:17%;height:17%}.jaw{left:50%;top:30%;width:16%;height:10%}.neck{left:50%;top:35%;width:14%;height:11%}.chest{left:50%;top:43%;width:28%;height:19%}.abdomen{left:50%;top:53%;width:24%;height:20%}.spine{left:50%;top:49%;width:12%;height:38%;border-radius:45%}.pelvis{left:50%;top:62%;width:25%;height:15%}.legs{left:50%;top:75%;width:34%;height:31%}.feet{left:50%;top:88%;width:35%;height:11%}.hint{text-align:center;margin:0;color:#6e756d;font-size:13px}.hint span{display:inline-block;padding:9px 16px;border-top:1px solid rgba(181,150,98,.45)}
@media(max-width:1180px){.page{width:1000px;max-width:96vw}.top{grid-template-columns:170px 1fr 170px;min-height:180px}.left,.right{width:170px}.logo,.founder{width:150px;height:120px}.caption{font-size:10px}h1{font-size:50px}.map-shell{height:690px}.map{transform:translateX(-50%) scale(.8);transform-origin:top center}}
@media(max-width:720px){.page{width:100%;padding:14px 10px 36px}.top{grid-template-columns:84px 1fr 84px;gap:7px;min-height:120px}.left,.right{width:84px}.logo,.founder{width:80px;height:68px}.caption{font-size:7px;margin-top:5px}h1{font-size:31px}.rule{width:100px;margin-top:10px}.map-shell{height:795px}.map{width:100%;height:795px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding-bottom:10px}.orbit{display:none}.stage{left:50%;top:10px;transform:translateX(-50%);width:min(78vw,430px);height:min(78vw,430px)}.direction{position:relative!important;left:auto!important;top:auto!important;transform:none!important;width:calc(50% - 10px);height:45px;margin:5px;font-size:10px}}
</style></head><body><main class="page"><header class="top"><div class="left"><img class="logo" src="assets/logo.webp" alt="Архитектура здоровья"></div><div class="center"><h1>Архитектура здоровья</h1><div class="rule"></div></div><div class="right"><img class="founder" src="assets/founder.webp" alt="Зубачёв Роман Николаевич"><div class="caption">Основатель клиники<br><strong>Зубачёв Роман Николаевич</strong></div></div></header><section><div class="map-shell"><div class="map"><div class="orbit"></div><div class="stage"><img class="vit" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Leonardo_da_Vinci-_Vitruvian_Man.JPG" alt="Витрувианский человек Леонардо да Винчи"><span class="hot head" data-zone="head"></span><span class="hot jaw" data-zone="jaw"></span><span class="hot neck" data-zone="neck"></span><span class="hot chest" data-zone="chest"></span><span class="hot abdomen" data-zone="abdomen"></span><span class="hot spine" data-zone="spine"></span><span class="hot pelvis" data-zone="pelvis"></span><span class="hot legs" data-zone="legs"></span><span class="hot feet" data-zone="feet"></span></div><button class="direction" style="left:570px;top:50px" data-zones="jaw,head,neck">Функциональная<br>стоматология</button><button class="direction" style="left:760px;top:101px" data-zones="jaw,head">Ортодонтия</button><button class="direction" style="left:899px;top:240px" data-zones="head,neck,spine,pelvis">Остеопатия</button><button class="direction" style="left:950px;top:430px" data-zones="jaw,neck,chest">Миофункциональная<br>терапия</button><button class="direction" style="left:899px;top:620px" data-zones="head,chest,abdomen,pelvis">Превентивная<br>медицина</button><button class="direction" style="left:760px;top:759px" data-zones="abdomen">Гастроэнтерология</button><button class="direction" style="left:570px;top:810px" data-zones="abdomen,chest">Нутрициология</button><button class="direction" style="left:380px;top:759px" data-zones="chest,abdomen">Терапия</button><button class="direction" style="left:241px;top:620px" data-zones="head,spine">Детская<br>неврология</button><button class="direction" style="left:190px;top:430px" data-zones="head">Нейропсихология</button><button class="direction" style="left:241px;top:240px" data-zones="spine,pelvis,legs,feet">DIERS<br>диагностика</button><button class="direction" style="left:380px;top:101px" data-zones="head,chest">ИГГТ</button></div></div><p class="hint"><span>Наведите на направление — соответствующие зоны тела начнут пульсировать</span></p></section></main><script>const dirs=[...document.querySelectorAll('.direction')],hots=[...document.querySelectorAll('.hot')];function clearZ(){dirs.forEach(b=>b.classList.remove('active'));hots.forEach(h=>h.classList.remove('on'))}function showZ(b){clearZ();b.classList.add('active');(b.dataset.zones||'').split(',').forEach(z=>{const e=document.querySelector('[data-zone="'+z.trim()+'"]');if(e)e.classList.add('on')})}dirs.forEach(b=>{b.addEventListener('mouseenter',()=>showZ(b));b.addEventListener('mouseleave',clearZ);b.addEventListener('focus',()=>showZ(b));b.addEventListener('blur',clearZ)});</script></body></html>
