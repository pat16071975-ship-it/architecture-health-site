<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архитектура здоровья</title>
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--gold:#b59662;--line:#786d61}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fcfaf6 0,var(--paper) 65%,var(--paper2) 100%);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}
.page{width:1400px;max-width:96vw;margin:auto;padding:18px 0 40px}.top{display:grid;grid-template-columns:220px 1fr 220px;gap:24px;align-items:start}.left,.right{display:flex;flex-direction:column;align-items:center}.logo,.founder{width:156px;height:156px;object-fit:contain}.founder{object-fit:cover;border:1px solid rgba(64,92,72,.15);border-radius:2px}.caption{margin-top:10px;text-align:center;font-size:14px;line-height:1.35;color:#515951}.caption strong{color:var(--ink)}
.center{text-align:center;padding-top:8px}h1{margin:6px 0 0;font:400 76px/1.02 Georgia,'Times New Roman',serif;letter-spacing:.005em}.rule{width:220px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.map-shell{height:850px;position:relative}.map{position:absolute;left:50%;top:-88px;width:1120px;height:920px;transform:translateX(-50%)}
.ring{position:absolute;border:1px solid rgba(181,150,98,.18);border-radius:50%;pointer-events:none}.ring.one{left:180px;top:44px;width:760px;height:760px}.ring.two{left:215px;top:79px;width:690px;height:690px}.ring.three{left:250px;top:114px;width:620px;height:620px}
.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.09);z-index:2}.stage:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:4;pointer-events:none}.vit-img{position:absolute;left:50%;top:55%;width:102%;height:102%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);z-index:2;filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
.direction{position:absolute;transform:translate(-50%,-50%);width:170px;height:54px;border:1px solid rgba(64,92,72,.22);background:rgba(250,247,241,.97);color:#30372f;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.15;font-weight:650;cursor:pointer;z-index:8;box-shadow:0 5px 16px rgba(71,58,38,.06);transition:border-color .2s,box-shadow .2s,color .2s,background .2s;border-radius:2px}.direction:hover,.direction.active{border-color:rgba(68,99,79,.6);color:var(--green);background:#fbf8f2;box-shadow:0 7px 18px rgba(71,58,38,.09)}
.relation-panel{position:absolute;z-index:12;min-width:146px;max-width:172px;padding:10px 13px 9px 16px;background:rgba(249,246,239,.98);border:1px solid rgba(181,150,98,.34);border-left:3px solid rgba(181,150,98,.78);box-shadow:0 11px 26px rgba(58,49,37,.08);pointer-events:none;opacity:0;transform:translate(-50%,-50%) translate(var(--sx,0),var(--sy,0));transition:opacity .18s ease,transform .22s ease;backdrop-filter:blur(8px)}.relation-panel.on{opacity:1;transform:translate(-50%,-50%) translate(0,0)}.relation-title{font:600 9px/1.2 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#8f7b58;margin:0 0 6px}.relation-list{display:grid;gap:0}.relation-item{font:500 11.5px/1.25 Inter,Segoe UI,Arial,sans-serif;color:#394139;padding:5px 0;border-top:1px solid rgba(181,150,98,.16)}.relation-item:first-child{border-top:0;padding-top:1px}
.hint{text-align:center;margin:-58px 0 0;color:#6e756d;font-size:13px}.hint span{display:inline-block;padding:9px 16px;border-top:1px solid rgba(181,150,98,.45)}
@media(max-width:1180px){.page{width:1000px;max-width:96vw}.top{grid-template-columns:160px 1fr 160px}.logo,.founder{width:120px;height:120px}.caption{font-size:12px}h1{font-size:54px}.map-shell{height:700px}.map{transform:translateX(-50%) scale(.84);transform-origin:top center}}
@media(max-width:720px){.page{padding:12px 8px 28px}.top{grid-template-columns:84px 1fr 84px;gap:8px}.logo,.founder{width:72px;height:72px}.caption{font-size:8px;margin-top:4px}h1{font-size:32px}.rule{width:110px;margin-top:10px}.map-shell{height:860px}.map{width:100%;height:860px;top:0;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding-bottom:10px}.ring{display:none}.stage{left:50%;top:120px;transform:translateX(-50%);width:min(78vw,420px);height:min(78vw,420px)}.stage:before{inset:28px}.direction{position:relative!important;left:auto!important;top:auto!important;transform:none!important;width:calc(50% - 10px);height:46px;margin:5px;font-size:10px}.relation-panel{display:none}.hint{margin-top:0}}
</style></head>
<body><main class="page"><header class="top"><div class="left"><img class="logo" src="assets/logo-site.webp" alt="Архитектура здоровья"></div><div class="center"><h1>Архитектура здоровья</h1><div class="rule"></div></div><div class="right"><img class="founder" src="assets/founder-site.webp" alt="Зубачёв Роман Николаевич"><div class="caption">Основатель клиники<br><strong>Зубачёв Роман Николаевич</strong></div></div></header>
<section><div class="map-shell"><div class="map">
<div class="ring one"></div><div class="ring two"></div><div class="ring three"></div>
<div class="stage"><img class="vit-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Leonardo_da_Vinci-_Vitruvian_Man.JPG" alt="Витрувианский человек Леонардо да Винчи"></div>
<div class="relation-panel" aria-hidden="true"><div class="relation-title">Связано с</div><div class="relation-list"></div></div>
<button class="direction" style="left:560px;top:70px" data-related="ВНЧС|челюсти|мышцы лица и шеи">Функциональная<br>стоматология</button>
<button class="direction" style="left:750px;top:110px" data-related="зубные ряды|челюсти|ВНЧС">Ортодонтия</button>
<button class="direction" style="left:895px;top:250px" data-related="позвоночник|таз|мышцы и фасции">Остеопатия</button>
<button class="direction" style="left:940px;top:430px" data-related="язык|губы|мышцы лица">Миофункциональная<br>терапия</button>
<button class="direction" style="left:895px;top:610px" data-related="обмен веществ|сердечно-сосудистая система|гормональная система">Превентивная<br>медицина</button>
<button class="direction" style="left:750px;top:760px" data-related="желудок|кишечник|печень">Гастроэнтерология</button>
<button class="direction" style="left:560px;top:800px" data-related="ЖКТ|обмен веществ|дефициты">Нутрициология</button>
<button class="direction" style="left:370px;top:760px" data-related="сердце|лёгкие|внутренние органы">Терапия</button>
<button class="direction" style="left:225px;top:610px" data-related="головной мозг|нервная система|двигательное развитие">Детская<br>неврология</button>
<button class="direction" style="left:180px;top:430px" data-related="головной мозг|внимание и память|когнитивные функции">Нейропсихология</button>
<button class="direction" style="left:225px;top:250px" data-related="позвоночник|таз|нижние конечности">DIERS<br>диагностика</button>
<button class="direction" style="left:370px;top:110px" data-related="дыхательная система|сосуды|головной мозг">ИГГТ</button>
</div></div><p class="hint"><span>Наведите на направление — появятся связанные органы и системы</span></p></section></main>
<script>
const dirs=[...document.querySelectorAll('.direction')],panel=document.querySelector('.relation-panel'),list=document.querySelector('.relation-list');
const CX=560,CY=424;
function clearPanel(){dirs.forEach(b=>b.classList.remove('active'));panel.classList.remove('on');panel.setAttribute('aria-hidden','true')}
function showPanel(b){dirs.forEach(x=>x.classList.remove('active'));b.classList.add('active');const items=(b.dataset.related||'').split('|').filter(Boolean);list.innerHTML=items.map(x=>'<div class="relation-item">'+x+'</div>').join('');const bx=parseFloat(b.style.left),by=parseFloat(b.style.top),vx=CX-bx,vy=CY-by,len=Math.hypot(vx,vy)||1,ux=vx/len,uy=vy/len;const horizontal=Math.abs(vx)>Math.abs(vy)*1.15;const vertical=Math.abs(vy)>Math.abs(vx)*1.15;const travel=horizontal?160:vertical?105:135;panel.style.left=(bx+ux*travel)+'px';panel.style.top=(by+uy*travel)+'px';panel.style.setProperty('--sx',(-ux*12)+'px');panel.style.setProperty('--sy',(-uy*12)+'px');panel.classList.add('on');panel.setAttribute('aria-hidden','false')}
dirs.forEach(b=>{b.addEventListener('mouseenter',()=>showPanel(b));b.addEventListener('mouseleave',clearPanel);b.addEventListener('focus',()=>showPanel(b));b.addEventListener('blur',clearPanel)})
</script></body></html>
