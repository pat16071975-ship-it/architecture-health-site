<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архитектура здоровья</title>
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--gold:#b59662;--line:#786d61}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fcfaf6 0,var(--paper) 65%,var(--paper2) 100%);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}
.page{width:1400px;max-width:96vw;margin:auto;padding:18px 0 40px}.top{display:grid;grid-template-columns:220px 1fr 220px;gap:24px;align-items:start}.left,.right{display:flex;flex-direction:column;align-items:center}.logo,.founder{width:156px;height:156px;object-fit:contain}.founder{object-fit:cover;border:1px solid rgba(64,92,72,.15);border-radius:2px}.caption{margin-top:10px;text-align:center;font-size:14px;line-height:1.35;color:#515951}.caption strong{color:var(--ink)}
.center{text-align:center;padding-top:8px}h1{margin:6px 0 0;font:400 76px/1.02 Georgia,'Times New Roman',serif;letter-spacing:.005em}.rule{width:220px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.map-shell{height:850px;position:relative}.map{position:absolute;left:50%;top:-88px;width:1120px;height:920px;transform:translateX(-50%)}
.ring{position:absolute;border:1px solid rgba(181,150,98,.18);border-radius:50%;pointer-events:none}.ring.one{left:180px;top:44px;width:760px;height:760px}.ring.two{left:215px;top:79px;width:690px;height:690px}.ring.three{left:250px;top:114px;width:620px;height:620px}
.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.09);z-index:2}
.stage:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:4;pointer-events:none}
.vit-img{position:absolute;left:50%;top:55%;width:102%;height:102%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);z-index:2;filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
.direction{position:absolute;transform:translate(-50%,-50%);width:170px;height:54px;border:1px solid rgba(64,92,72,.22);background:rgba(250,247,241,.97);color:#30372f;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.15;font-weight:650;cursor:pointer;z-index:8;box-shadow:0 5px 16px rgba(71,58,38,.06);transition:background .2s,border-color .2s,color .2s,box-shadow .2s,transform .2s;border-radius:2px}.direction:hover,.direction.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 9px 24px rgba(64,92,72,.18),0 0 0 1px rgba(181,150,98,.24);transform:translate(-50%,-50%) scale(1.04)}
.hot{position:absolute;z-index:6;pointer-events:none;opacity:0;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(181,150,98,.38) 0%,rgba(181,150,98,.20) 42%,rgba(68,99,79,.08) 65%,transparent 78%);filter:blur(.3px);transition:opacity .22s ease}.hot.on{opacity:1}
.head{left:50%;top:23%;width:12%;height:12%}.jaw{left:50%;top:29%;width:12%;height:7%}.neck{left:50%;top:35%;width:10%;height:8%}.chest{left:50%;top:43%;width:20%;height:13%}.abdomen{left:50%;top:54%;width:18%;height:14%}.spine{left:50%;top:49%;width:8%;height:28%}.pelvis{left:50%;top:63%;width:17%;height:10%}.legs{left:50%;top:77%;width:21%;height:19%}.feet{left:50%;top:89%;width:18%;height:7%}
.focus-overlay{position:absolute;inset:0;width:1120px;height:920px;z-index:7;pointer-events:none;overflow:visible}.focus-arc,.focus-line{fill:none;opacity:0;transition:opacity .2s ease}.focus-arc{stroke:var(--gold);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 2px 5px rgba(181,150,98,.28))}.focus-line{stroke:rgba(68,99,79,.72);stroke-width:1.35;stroke-linecap:round;stroke-dasharray:2 5}.focus-dot{fill:var(--gold);opacity:0;transition:opacity .2s ease;filter:drop-shadow(0 1px 3px rgba(181,150,98,.35))}.focus-overlay.on .focus-arc,.focus-overlay.on .focus-line,.focus-overlay.on .focus-dot{opacity:1}
.hint{text-align:center;margin:-58px 0 0;color:#6e756d;font-size:13px}.hint span{display:inline-block;padding:9px 16px;border-top:1px solid rgba(181,150,98,.45)}
@media(max-width:1180px){.page{width:1000px;max-width:96vw}.top{grid-template-columns:160px 1fr 160px}.logo,.founder{width:120px;height:120px}.caption{font-size:12px}h1{font-size:54px}.map-shell{height:700px}.map{transform:translateX(-50%) scale(.84);transform-origin:top center}}
@media(max-width:720px){.page{padding:12px 8px 28px}.top{grid-template-columns:84px 1fr 84px;gap:8px}.logo,.founder{width:72px;height:72px}.caption{font-size:8px;margin-top:4px}h1{font-size:32px}.rule{width:110px;margin-top:10px}.map-shell{height:860px}.map{width:100%;height:860px;top:0;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding-bottom:10px}.ring,.focus-overlay{display:none}.stage{left:50%;top:120px;transform:translateX(-50%);width:min(78vw,420px);height:min(78vw,420px)}.stage:before{inset:28px}.direction{position:relative!important;left:auto!important;top:auto!important;transform:none!important;width:calc(50% - 10px);height:46px;margin:5px;font-size:10px}.direction:hover,.direction.active{transform:none!important}.hint{margin-top:0}}
</style></head>
<body><main class="page"><header class="top"><div class="left"><img class="logo" src="assets/logo-site.webp" alt="Архитектура здоровья"></div><div class="center"><h1>Архитектура здоровья</h1><div class="rule"></div></div><div class="right"><img class="founder" src="assets/founder-site.webp" alt="Зубачёв Роман Николаевич"><div class="caption">Основатель клиники<br><strong>Зубачёв Роман Николаевич</strong></div></div></header>
<section><div class="map-shell"><div class="map">
<div class="ring one"></div><div class="ring two"></div><div class="ring three"></div>
<svg class="focus-overlay" viewBox="0 0 1120 920" aria-hidden="true"><path class="focus-arc"></path><path class="focus-line"></path><circle class="focus-dot" r="4"></circle></svg>
<div class="stage">
<img class="vit-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Leonardo_da_Vinci-_Vitruvian_Man.JPG" alt="Витрувианский человек Леонардо да Винчи">
<span class="hot head" data-zone="head"></span><span class="hot jaw" data-zone="jaw"></span><span class="hot neck" data-zone="neck"></span><span class="hot chest" data-zone="chest"></span><span class="hot abdomen" data-zone="abdomen"></span><span class="hot spine" data-zone="spine"></span><span class="hot pelvis" data-zone="pelvis"></span><span class="hot legs" data-zone="legs"></span><span class="hot feet" data-zone="feet"></span>
</div>
<button class="direction" style="left:560px;top:70px" data-zones="jaw,head,neck">Функциональная<br>стоматология</button>
<button class="direction" style="left:750px;top:110px" data-zones="jaw,head">Ортодонтия</button>
<button class="direction" style="left:895px;top:250px" data-zones="head,neck,spine,pelvis">Остеопатия</button>
<button class="direction" style="left:940px;top:430px" data-zones="jaw,neck,chest">Миофункциональная<br>терапия</button>
<button class="direction" style="left:895px;top:610px" data-zones="head,chest,abdomen,pelvis">Превентивная<br>медицина</button>
<button class="direction" style="left:750px;top:760px" data-zones="abdomen">Гастроэнтерология</button>
<button class="direction" style="left:560px;top:800px" data-zones="abdomen,chest">Нутрициология</button>
<button class="direction" style="left:370px;top:760px" data-zones="chest,abdomen">Терапия</button>
<button class="direction" style="left:225px;top:610px" data-zones="head,spine">Детская<br>неврология</button>
<button class="direction" style="left:180px;top:430px" data-zones="head">Нейропсихология</button>
<button class="direction" style="left:225px;top:250px" data-zones="spine,pelvis,legs">DIERS<br>диагностика</button>
<button class="direction" style="left:370px;top:110px" data-zones="head,chest">ИГГТ</button>
</div></div><p class="hint"><span>Наведите на направление — увидите связанные с ним зоны</span></p></section></main>
<script>
const map=document.querySelector('.map'),dirs=[...document.querySelectorAll('.direction')],hots=[...document.querySelectorAll('.hot')],overlay=document.querySelector('.focus-overlay'),arc=document.querySelector('.focus-arc'),line=document.querySelector('.focus-line'),dot=document.querySelector('.focus-dot');
const CX=560,CY=424,R=380;
function polar(cx,cy,r,a){const q=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(q),y:cy+r*Math.sin(q)}}
function arcPath(cx,cy,r,a0,a1){const s=polar(cx,cy,r,a1),e=polar(cx,cy,r,a0),large=a1-a0<=180?0:1;return`M ${s.x.toFixed(1)} ${s.y.toFixed(1)} A ${r} ${r} 0 ${large} 0 ${e.x.toFixed(1)} ${e.y.toFixed(1)}`}
function clearZ(){dirs.forEach(b=>b.classList.remove('active'));hots.forEach(h=>h.classList.remove('on'));overlay.classList.remove('on')}
function showZ(b){clearZ();b.classList.add('active');const zones=(b.dataset.zones||'').split(',').map(s=>s.trim()).filter(Boolean),active=zones.map(z=>document.querySelector('[data-zone="'+z+'"]')).filter(Boolean);active.forEach(e=>e.classList.add('on'));
 const bx=parseFloat(b.style.left),by=parseFloat(b.style.top),ang=(Math.atan2(by-CY,bx-CX)*180/Math.PI+90+360)%360;arc.setAttribute('d',arcPath(CX,CY,R,ang-11,ang+11));
 let tx=CX,ty=CY;if(active.length){let sx=0,sy=0;active.forEach(e=>{sx+=270+e.offsetLeft;sy+=150+e.offsetTop});tx=sx/active.length;ty=sy/active.length}
 const vx=tx-bx,vy=ty-by,len=Math.hypot(vx,vy)||1,startX=bx+vx/len*45,startY=by+vy/len*45,endX=tx-vx/len*24,endY=ty-vy/len*24;line.setAttribute('d',`M ${startX.toFixed(1)} ${startY.toFixed(1)} L ${endX.toFixed(1)} ${endY.toFixed(1)}`);dot.setAttribute('cx',tx.toFixed(1));dot.setAttribute('cy',ty.toFixed(1));overlay.classList.add('on')}
dirs.forEach(b=>{b.addEventListener('mouseenter',()=>showZ(b));b.addEventListener('mouseleave',clearZ);b.addEventListener('focus',()=>showZ(b));b.addEventListener('blur',clearZ)})
</script></body></html>
