{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2 class="section-title">Задайте свой пароль</h2>
  <p class="muted">Временный пароль больше использоваться не будет. Новый пароль должен содержать не менее 10 символов.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label>Новый пароль</label><input name="password" type="password" autocomplete="new-password" required></div>
    <div class="field"><label>Повторите пароль</label><input name="password2" type="password" autocomplete="new-password" required></div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:8px">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
