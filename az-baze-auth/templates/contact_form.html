{% extends "base.html" %}
{% set title = title ~ " — AZ-BAZE" %}
{% block content %}
<style>
.contact-form{max-width:760px;margin:0 auto}
.contact-form textarea{width:100%;min-height:120px;resize:vertical;padding:11px 12px;border:1px solid #cfc5b5;border-radius:9px;background:#fff;font:500 14px/1.45 Montserrat,Arial,sans-serif}
@media(max-width:650px){.contact-form .row.actions{display:grid;grid-template-columns:1fr}.contact-form .row.actions .btn{width:100%}}
</style>
<div class="card contact-form">
  <div class="row between"><h2 class="section-title">{{ title.split(' — ')[0] }}</h2><a class="btn" href="/contacts/">Назад</a></div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label>Организация</label><input name="organization" value="{{ values.organization }}" maxlength="240"></div>
    <div class="field"><label>Роль в организации</label><input name="organization_role" value="{{ values.organization_role }}" maxlength="240"></div>
    <div class="field"><label>ФИО</label><input name="full_name" value="{{ values.full_name }}" maxlength="240"></div>
    <div class="field"><label>Телефон</label><input name="phone" value="{{ values.phone }}" maxlength="120" inputmode="tel"></div>
    <div class="field"><label>Какие вопросы курирует</label><textarea name="responsibility" maxlength="2000">{{ values.responsibility }}</textarea></div>
    <p class="muted">Обязательных полей нет. Заполняйте только то, что считаете нужным.</p>
    <div class="row actions"><button class="btn primary" type="submit">Сохранить</button><a class="btn" href="/contacts/">Отмена</a></div>
  </form>
</div>
{% endblock %}
