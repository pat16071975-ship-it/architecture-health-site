{% extends "base.html" %}
{% set title = title ~ " — AZ-BAZE" %}
{% block content %}
<style>
.credential-form{max-width:760px;margin:0 auto}
.credential-form textarea{width:100%;min-height:110px;resize:vertical;padding:11px 12px;border:1px solid #cfc5b5;border-radius:9px;background:#fff;font:500 14px/1.45 Montserrat,Arial,sans-serif}
.form-note{margin-top:-4px}
@media(max-width:650px){
  .credential-form .row.actions{display:grid;grid-template-columns:1fr}
  .credential-form .row.actions .btn{width:100%}
}
</style>
<div class="card credential-form">
  <div class="row between">
    <h2 class="section-title">{{ title.split(' — ')[0] }}</h2>
    <a class="btn" href="/credentials/">Назад</a>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label>Сервис</label>
      <input name="service_name" value="{{ values.service_name }}" maxlength="160" required>
    </div>
    <div class="field">
      <label>Сайт</label>
      <input name="site_url" value="{{ values.site_url }}" maxlength="500" inputmode="url" placeholder="https://example.ru">
    </div>
    <div class="field">
      <label>Логин</label>
      <input name="login" value="{{ values.login }}" maxlength="320" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label>Пароль{% if not password_required %} — оставьте пустым, чтобы не менять{% endif %}</label>
      <input name="password" type="password" maxlength="1024" autocomplete="new-password" spellcheck="false" {% if password_required %}required{% endif %}>
    </div>
    <div class="field">
      <label>Комментарий</label>
      <textarea name="note" maxlength="2000">{{ values.note }}</textarea>
    </div>
    <p class="muted form-note">Пароль сохраняется на сервере только в зашифрованном виде и не попадает в GitHub.</p>
    <div class="row actions">
      <button class="btn primary" type="submit">Сохранить</button>
      <a class="btn" href="/credentials/">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
