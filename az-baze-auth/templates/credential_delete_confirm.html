{% extends "base.html" %}
{% set title = "Переместить в корзину — AZ-BAZE" %}
{% block content %}
<div class="card narrow">
  <h2 class="section-title">Переместить в корзину</h2>
  <div class="muted">
    Запись не будет удалена окончательно. Её можно восстановить из Корзины.
  </div>

  <div class="spacer"></div>
  <div class="code">{{ row['service_name'] }}</div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <div class="field">
      <label for="current_password">Ваш текущий пароль AZ-BAZE</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>

    <div class="field">
      <label for="service_confirmation">Введите точное название сервиса</label>
      <input id="service_confirmation" name="service_confirmation" type="text" autocomplete="off" required>
    </div>

    <div class="row">
      <button class="btn warn" type="submit">Переместить в корзину</button>
      <a class="btn" href="/credentials/">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
