<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or 'AZ-BAZE — Архитектура здоровья' }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--gold:#b59662;--line:#d8cdbb;--red:#9a4b48}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6 0,var(--paper) 65%,var(--paper2) 100%);color:var(--ink);font-family:'Montserrat',Arial,sans-serif}body{min-height:100vh}.shell{width:min(1060px,94vw);margin:0 auto;padding:34px 0 60px}.brand{text-align:center;margin-bottom:28px}.brand-kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#607067;font-weight:600}.brand h1{margin:8px 0 0;font-size:36px;font-weight:500;letter-spacing:-.03em}.card{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 46px rgba(69,55,35,.09);padding:26px}.card.narrow{width:min(430px,100%);margin:0 auto}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:600;color:#5f685f}.field input{width:100%;padding:11px 12px;border:1px solid #cfc5b5;border-radius:9px;background:#fff;font:500 14px Montserrat,Arial,sans-serif}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;border:1px solid rgba(68,99,79,.34);border-radius:9px;background:#fff;color:#334039;text-decoration:none;font:600 12px Montserrat,Arial,sans-serif;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.warn{color:#7e3d39;border-color:#c98d89}.btn:disabled{opacity:.62;cursor:wait}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.error{margin:12px 0;color:var(--red);font-size:12px;line-height:1.45}.muted{color:#6c746d;font-size:12px;line-height:1.5}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:14px 0}.check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #ded5c8;border-radius:9px;background:#fff}.check input{width:16px;height:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid #e6ded1;text-align:left;font-size:12px;vertical-align:top}.table th{color:#626b63;font-size:11px}.badge{display:inline-block;margin:2px 4px 2px 0;padding:4px 7px;border-radius:999px;background:#edf2ed;border:1px solid #d5e0d5;font-size:10px}.badge.admin{background:#f3eadb;border-color:#e2d1b5}.section-title{margin:0 0 16px;font-size:22px;font-weight:500}.code{display:block;padding:12px;border:1px solid #d9cfbf;border-radius:9px;background:#fff;font:600 14px/1.45 monospace;word-break:break-all}.spacer{height:18px}
.az-upload-modal[hidden]{display:none!important}.az-upload-modal{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:20px;background:rgba(32,38,34,.56);backdrop-filter:blur(3px)}.az-upload-modal-card{width:min(640px,94vw);padding:30px 28px 26px;border:4px solid var(--green);border-radius:18px;background:#fffdf8;box-shadow:0 28px 90px rgba(28,33,29,.34);text-align:center}.az-upload-modal-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:#e4eee6;color:var(--green);font-size:32px;font-weight:700}.az-upload-modal-title{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.015em;color:#2f5b40}.az-upload-modal-message{margin:14px auto 0;max-width:560px;font-size:14px;line-height:1.55;color:#505a52}.az-upload-modal-ok{min-width:150px;margin-top:22px;font-size:14px}.az-upload-modal[data-status="duplicate"] .az-upload-modal-card{border-color:var(--gold)}.az-upload-modal[data-status="duplicate"] .az-upload-modal-icon{background:#f5ecd9;color:#7b6038}.az-upload-modal[data-status="duplicate"] .az-upload-modal-title{color:#6e5634}.az-upload-modal[data-status="error"] .az-upload-modal-card{border-color:var(--red)}.az-upload-modal[data-status="error"] .az-upload-modal-icon{background:#f7e4e2;color:var(--red)}.az-upload-modal[data-status="error"] .az-upload-modal-title{color:var(--red)}.az-upload-modal[data-status="loading"] .az-upload-modal-card{border-color:var(--gold)}.az-upload-modal[data-status="loading"] .az-upload-modal-icon{background:#f5ecd9;color:#7b6038}.az-upload-modal[data-status="loading"] .az-upload-modal-title{color:#6e5634}.az-upload-modal[data-status="loading"] .az-upload-modal-ok{display:none}
@media(max-width:650px){.shell{padding-top:20px}.card{padding:18px}.brand h1{font-size:29px}.table{min-width:700px}.az-upload-modal-card{padding:24px 18px 20px}.az-upload-modal-title{font-size:26px}.az-upload-modal-message{font-size:12px}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-kicker">Медицинская клиника системного подхода</div><h1>Архитектура здоровья</h1></div>
  {% block content %}{% endblock %}
</div>

<div id="azUploadModal" class="az-upload-modal" data-status="imported" hidden aria-hidden="true">
  <div class="az-upload-modal-card" role="alertdialog" aria-modal="true" aria-labelledby="azUploadModalTitle" aria-describedby="azUploadModalMessage">
    <div id="azUploadModalIcon" class="az-upload-modal-icon" aria-hidden="true">✓</div>
    <h2 id="azUploadModalTitle" class="az-upload-modal-title">ДАННЫЕ ЗАГРУЖЕНЫ</h2>
    <div id="azUploadModalMessage" class="az-upload-modal-message"></div>
    <button id="azUploadModalOk" class="btn primary az-upload-modal-ok" type="button">OK</button>
  </div>
</div>

<script>
(() => {
  const modal = document.getElementById('azUploadModal');
  const title = document.getElementById('azUploadModalTitle');
  const message = document.getElementById('azUploadModalMessage');
  const icon = document.getElementById('azUploadModalIcon');
  const ok = document.getElementById('azUploadModalOk');
  if (!modal || !title || !message || !icon || !ok) return;

  const presets = {
    imported: ['ДАННЫЕ ЗАГРУЖЕНЫ', '✓'],
    replaced: ['ДАННЫЕ ЗАМЕНЕНЫ', '✓'],
    duplicate: ['ДУБЛЬ — ДАННЫЕ НЕ ИЗМЕНЕНЫ', 'i'],
    error: ['ЗАГРУЗКА НЕ ВЫПОЛНЕНА', '!'],
    loading: ['ЗАГРУЗКА ДАННЫХ…', '…']
  };

  function showUploadFeedback(options = {}) {
    const status = presets[options.status] ? options.status : 'imported';
    const preset = presets[status];
    modal.dataset.status = status;
    title.textContent = options.title || preset[0];
    icon.textContent = options.icon || preset[1];
    message.textContent = options.message || '';
    modal.hidden = false;
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (status !== 'loading') setTimeout(() => ok.focus(), 0);
  }

  function hideUploadFeedback() {
    modal.hidden = true;
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  ok.addEventListener('click', hideUploadFeedback);
  window.AZUploadFeedback = {show: showUploadFeedback, hide: hideUploadFeedback};

  document.addEventListener('DOMContentLoaded', () => {
    const marker = document.querySelector('[data-az-upload-feedback]');
    if (marker) {
      const markerTitle = marker.querySelector('[data-feedback-title]');
      const markerMessage = marker.querySelector('[data-feedback-message]');
      showUploadFeedback({
        status: marker.dataset.status || 'imported',
        title: markerTitle ? markerTitle.textContent.trim() : '',
        message: markerMessage ? markerMessage.textContent.trim() : ''
      });
    }

    document.querySelectorAll('form').forEach(form => {
      if (!form.querySelector('input[type="file"]')) return;
      form.addEventListener('submit', () => {
        form.querySelectorAll('button[type="submit"],input[type="submit"]').forEach(button => {
          button.disabled = true;
          if (button.tagName === 'BUTTON') button.textContent = 'ЗАГРУЗКА…';
        });
        showUploadFeedback({
          status: 'loading',
          message: 'Проверяем файлы и сохраняем данные. Не закрывайте страницу до появления итогового сообщения.'
        });
      });
    });
  });
})();
</script>
</body>
</html>
