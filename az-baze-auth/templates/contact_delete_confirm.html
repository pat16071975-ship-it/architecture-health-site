{% extends "base.html" %}
{% set title = "Удалить рабочий контакт — AZ-BAZE" %}
{% block content %}
<div class="card narrow">
  <h2 class="section-title">Удалить рабочий контакт</h2>
  <div class="muted">Контакт будет удалён. Это действие не относится к Корзине служебных доступов.</div>
  <div class="spacer"></div>
  <div class="code">{{ row['full_name'] or row['organization'] or 'Контакт без названия' }}</div>
  <div class="spacer"></div>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="row"><button class="btn warn" type="submit">Удалить</button><a class="btn" href="/contacts/">Отмена</a></div>
  </form>
</div>
{% endblock %}
