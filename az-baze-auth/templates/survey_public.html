<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Опрос — Архитектура здоровья</title>
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--line:#d8cdbb;--red:#9a4b48}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6,var(--paper));color:var(--ink);font-family:Arial,sans-serif}body{min-height:100vh}.page{width:min(760px,94vw);margin:0 auto;padding:20px 0 44px}.brand{text-align:center;margin-bottom:18px}.brand small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#657068}.brand h1{margin:7px 0 0;font-size:28px;font-weight:600}.intro{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fffdf8}.period{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--paper2);font-size:13px;font-weight:700}.anonymous{margin-top:12px;padding:11px 12px;border-left:4px solid var(--green);border-radius:8px;background:#edf4ee;font-size:13px;line-height:1.5}.description{margin-top:12px;white-space:pre-line;font-size:13px;line-height:1.55;color:#566158}.section{margin-top:17px}.section-title{margin:0 0 8px;padding:9px 11px;border-radius:9px;background:var(--paper2);font-size:14px}.question{margin:9px 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.progress{font-size:10px;color:#777f78;margin-bottom:7px}.question-text{font-size:16px;line-height:1.45;font-weight:600}.required{color:var(--red)}.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}.scale label{position:relative}.scale input{position:absolute;opacity:0;pointer-events:none}.scale span{display:grid;place-items:center;min-height:48px;padding:8px;border:1px solid #bfc9c0;border-radius:9px;background:#fff;font-size:15px;font-weight:700;cursor:pointer}.scale label:last-child{grid-column:span 6}.scale label:last-child span{min-height:42px;font-size:12px}.scale input:checked+span{background:var(--green);border-color:var(--green);color:#fff}.choice-list{display:grid;gap:8px;margin-top:12px}.choice{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid #d8cdbb;border-radius:9px;background:#fff;font-size:14px;line-height:1.35}.choice input{margin-top:2px;width:18px;height:18px;flex:0 0 18px}.text-answer{width:100%;min-height:120px;margin-top:12px;padding:11px;border:1px solid #cfc5b5;border-radius:9px;background:#fff;font:14px/1.45 Arial,sans-serif;resize:vertical}.submit-wrap{margin-top:18px;padding:12px 0}.submit{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.submit:disabled{opacity:.6}.error{margin:12px 0;padding:11px 12px;border-left:4px solid var(--red);border-radius:8px;background:#faecea;color:#7d3936;font-size:13px}.loading,.thanks{margin-top:60px;padding:28px 18px;border:1px solid var(--line);border-radius:15px;background:#fffdf8;text-align:center}.loading h2,.thanks h2{margin:0;font-size:24px}.loading p,.thanks p{margin:10px 0 0;color:#5f685f;font-size:14px;line-height:1.5}@media(max-width:540px){.page{width:100%;padding:14px 12px 36px}.brand h1{font-size:24px}.question{padding:13px}.question-text{font-size:16px}.scale{grid-template-columns:repeat(3,1fr)}.scale label:last-child{grid-column:span 3}.scale span{min-height:52px}}
</style>
</head>
<body>
<main class="page" id="surveyPage">
  <div class="loading"><h2>Загрузка опроса…</h2><p>Подождите несколько секунд.</p></div>
</main>
<script>
(() => {
  const page=document.getElementById('surveyPage');
  const token=decodeURIComponent(location.hash.slice(1));
  let surveyData=null;

  function esc(value){
    return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function showMessage(title,message,kind=''){
    page.innerHTML='<div class="'+(kind==='thanks'?'thanks':'loading')+'"><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p></div>';
  }
  async function post(formData){
    const response=await fetch('/survey/',{
      method:'POST',
      body:formData,
      credentials:'omit',
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    const payload=await response.json().catch(()=>({}));
    if(!response.ok||!payload.ok)throw new Error(payload.error||'Не удалось выполнить запрос.');
    return payload;
  }
  function renderQuestion(question,index,total){
    const field='q_'+question.id;
    let answer='';
    if(question.type==='scale'){
      answer='<div class="scale">'+['1','2','3','4','5'].map(value=>
        '<label><input type="radio" name="'+field+'" value="'+value+'" '+(question.required?'required':'')+'><span>'+value+'</span></label>'
      ).join('')+
      '<label><input type="radio" name="'+field+'" value="NA" '+(question.required?'required':'')+'><span>Не могу оценить</span></label></div>';
    }else if(question.type==='single'){
      answer='<div class="choice-list">'+question.options.map(option=>
        '<label class="choice"><input type="radio" name="'+field+'" value="'+esc(option.value)+'" '+(question.required?'required':'')+'><span>'+esc(option.label)+'</span></label>'
      ).join('')+'</div>';
    }else if(question.type==='multi'){
      answer='<div class="choice-list">'+question.options.map(option=>
        '<label class="choice"><input type="checkbox" name="'+field+'" value="'+esc(option.value)+'"><span>'+esc(option.label)+'</span></label>'
      ).join('')+'</div>';
    }else{
      answer='<textarea class="text-answer" name="'+field+'" maxlength="'+surveyData.maxTextLength+'" '+(question.required?'required':'')+' placeholder="До '+surveyData.maxTextLength+' символов"></textarea>';
    }
    return '<div class="question" data-question-type="'+esc(question.type)+'" data-required="'+(question.required?'1':'0')+'" data-field="'+field+'">'+
      '<div class="progress">Вопрос '+index+' из '+total+'</div>'+
      '<div class="question-text">'+esc(question.text)+(question.required?' <span class="required">*</span>':'')+'</div>'+
      answer+'</div>';
  }
  function validateRequiredMulti(form){
    for(const card of form.querySelectorAll('[data-question-type="multi"][data-required="1"]')){
      const name=card.dataset.field;
      if(!form.querySelector('input[name="'+CSS.escape(name)+'"]:checked')){
        card.scrollIntoView({behavior:'smooth',block:'center'});
        throw new Error('Ответьте на обязательный вопрос.');
      }
    }
  }
  function renderSurvey(payload){
    surveyData=payload;
    const survey=payload.survey;
    document.title=survey.title+' — Опрос';
    const allQuestions=payload.sections.flatMap(section=>section.questions);
    let counter=0;
    let sectionsHtml='';
    payload.sections.forEach(section=>{
      let questionsHtml='';
      section.questions.forEach(question=>{
        counter+=1;
        questionsHtml+=renderQuestion(question,counter,allQuestions.length);
      });
      sectionsHtml+='<section class="section"><h2 class="section-title">'+esc(section.title)+'</h2>'+questionsHtml+'</section>';
    });
    page.innerHTML=
      '<div class="brand"><small>Архитектура здоровья</small><h1>'+esc(survey.title)+'</h1></div>'+
      '<div class="intro">'+
        (survey.period?'<div class="period">Период: '+esc(survey.period)+'</div>':'')+
        '<div class="anonymous"><strong>Опрос анонимный.</strong><br>Не указывайте в комментариях имена пациентов, медицинские данные, имена сотрудников и подробности, по которым можно определить автора ответа.</div>'+
        (survey.description?'<div class="description">'+esc(survey.description)+'</div>':'')+
      '</div>'+
      '<div class="error" id="surveyError" hidden></div>'+
      '<form id="anonymousSurvey">'+sectionsHtml+
        '<div class="submit-wrap"><button class="submit" id="submitSurvey" type="submit">Отправить ответы</button></div>'+
      '</form>';

    const form=document.getElementById('anonymousSurvey');
    const button=document.getElementById('submitSurvey');
    const errorBox=document.getElementById('surveyError');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      if(!form.reportValidity())return;
      try{
        validateRequiredMulti(form);
      }catch(error){
        errorBox.textContent=error.message;
        errorBox.hidden=false;
        return;
      }
      button.disabled=true;
      button.textContent='Отправляем…';
      errorBox.hidden=true;
      try{
        const body=new FormData(form);
        body.append('action','submit');
        body.append('token',token);
        await post(body);
        showMessage('Спасибо. Ваш ответ принят.','Результаты опроса участникам не показываются.','thanks');
        window.scrollTo({top:0,behavior:'smooth'});
      }catch(error){
        errorBox.textContent=error.message||'Не удалось отправить ответы. Попробуйте ещё раз.';
        errorBox.hidden=false;
        errorBox.scrollIntoView({behavior:'smooth',block:'center'});
        button.disabled=false;
        button.textContent='Отправить ответы';
      }
    });
  }
  async function load(){
    if(!token){
      showMessage('Ссылка недействительна','Откройте полную ссылку, которую вы получили для участия.');
      return;
    }
    try{
      const body=new FormData();
      body.append('action','load');
      body.append('token',token);
      renderSurvey(await post(body));
    }catch(error){
      showMessage('Опрос недоступен',error.message||'Не удалось загрузить опрос.');
    }
  }
  load();
})();
</script>
</body>
</html>
