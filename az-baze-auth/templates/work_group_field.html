{% if group_options is defined %}
{% if expected_group_id is defined %}<input type="hidden" name="expected_group_id" value="{{ expected_group_id }}">{% endif %}
<div class="field">
  <label for="workGroup">Группа{% if group_required %} — обязательно{% endif %}</label>
  <select id="workGroup" name="group_id" {% if group_required %}required{% endif %}>
    <option value="">{{ 'Выберите, куда отнести контакт' if group_required else 'Без группы' }}</option>
    {% for group in group_options %}<option value="{{ group.id }}" {% if values.get('group_id')|string == group.id|string %}selected{% endif %}>{{ group.label }}</option>{% endfor %}
    {% if allow_new_group|default(true) %}<option value="new" {% if values.get('group_id') == 'new' %}selected{% endif %}>+ Своя группа…</option>{% endif %}
  </select>
</div>
{% if allow_new_group|default(true) %}
<div id="newWorkGroup" hidden>
  <div class="field"><label for="newGroupName">Название своей группы</label><input id="newGroupName" name="new_group_name" maxlength="100" value="{{ values.get('new_group_name','') }}"></div>
  <div class="field"><label for="newGroupParent">Внутри группы</label><select id="newGroupParent" name="new_group_parent"><option value="">Основная группа</option>
  {% for group in group_options if group.parent_id is none %}<option value="{{ group.id }}" {% if values.get('new_group_parent')|string == group.id|string %}selected{% endif %}>{{ group.name }}</option>{% endfor %}
  </select></div>
</div>
<script>
(()=>{const select=document.getElementById('workGroup'),box=document.getElementById('newWorkGroup'),name=document.getElementById('newGroupName');function update(){const on=select.value==='new';box.hidden=!on;name.required=on;box.querySelectorAll('input,select').forEach(x=>x.disabled=!on);}select.addEventListener('change',update);update();})();
</script>
{% endif %}
{% endif %}
