<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ — лаборатория набедренной повязки</title>
<style>
:root{--paper:#f7f3ec;--ink:#2d342f;--green:#44634f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6,#f4ede1);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;align-items:center;padding:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.title{font:600 20px/1.1 Georgia,serif;margin-right:8px}
.btn{border:1px solid rgba(68,99,79,.3);background:#fffdf8;border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer}
.btn.active{background:#e9efe9;border-color:#6d876f;color:#294231}
.note{width:100%;text-align:center;font-size:12px;color:#6a716b;margin-top:2px}
.board{position:relative;width:min(92vw,580px);height:min(92vw,580px);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.10)}
.board:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:4;pointer-events:none}
.vit{position:absolute;left:50%;top:54%;width:102%;height:102%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);z-index:2;filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
.cloth{position:absolute;left:50%;top:54.0%;width:26.2%;height:auto;transform:translate(-50%,-50%) rotate(-1deg);transform-origin:50% 38%;z-index:6;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px .55px rgba(84,62,40,.12));transition:opacity .15s}
.cloth.hidden{opacity:0}
.under{fill:#e8ddcc;stroke:#e8ddcc;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.base{fill:#dfd0b8;stroke:#876b4d;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.light{fill:#ebe0cf;stroke:#a48764;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}
.mid{fill:#d5c1a2;stroke:#846647;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.shadow{fill:#c8b08f;opacity:.55}
.fold{fill:none;stroke:#86694a;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
.soft{fill:none;stroke:#ac906d;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
.knot{fill:#cbb596;stroke:#806247;stroke-width:1.15}
@media(max-width:620px){body{padding:10px}.title{width:100%;text-align:center;font-size:17px}.btn{padding:7px 10px;font-size:12px}.board{width:94vw;height:94vw}.board:before{inset:5.8%}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="title">АЗ — набедренная повязка</div>
  <button class="btn" id="off" type="button">Без повязки</button>
  <button class="btn active" id="on" type="button">Черновик</button>
  <div class="note">Реконструкция понравившегося варианта: узкая ткань по тазу, диагональный запах, мягкие складки.</div>
</div>
<div class="board">
  <img class="vit" src="../assets/vitruvian-original.jpg?v=20260827-1" alt="Витрувианский человек Леонардо да Винчи">

  <svg class="cloth" id="cloth" viewBox="0 0 200 150" aria-hidden="true">
    <!-- Сплошная непрозрачная форма под тканью -->
    <path class="under" d="M18 34 C39 29 61 30 82 34 C104 38 124 40 144 36 C160 33 174 29 184 31 C181 46 174 58 164 69 C153 81 140 91 129 101 C119 110 112 121 107 132 C98 123 91 112 86 100 C82 111 80 123 81 134 C70 128 62 117 57 105 C52 91 45 79 36 68 C28 58 21 47 18 34 Z"/>

    <!-- Ткань, обхватывающая таз; верхний край не превращается в юбку -->
    <path class="base" d="M19 34 C40 29 61 30 82 34 C103 38 124 40 144 36 C160 33 174 29 184 31 C178 38 167 43 153 47 C134 52 114 54 94 52 C72 51 50 47 31 42 C25 40 21 37 19 34 Z"/>

    <!-- Задний мягкий слой, видимый только в нижней части -->
    <path class="base" d="M28 43 C46 49 63 57 78 68 C90 77 101 88 109 101 C118 93 129 84 141 76 C157 65 171 52 182 36 C177 53 169 68 158 80 C147 91 135 101 124 112 C117 119 111 126 107 133 C98 124 91 112 86 99 C82 111 80 122 81 133 C72 127 65 118 61 107 C56 92 48 78 38 66 C31 57 27 49 28 43 Z"/>

    <!-- Светлая сложенная кромка по талии -->
    <path class="light" d="M24 35 C44 31 63 32 82 36 C102 40 121 42 140 39 C156 36 170 32 180 33 C170 39 157 43 142 46 C125 49 108 50 91 48 C66 46 44 41 24 35 Z"/>

    <!-- Главный запах: от правого бедра диагонально вниз-влево -->
    <path class="mid" d="M179 35 C171 49 160 61 146 72 C131 84 117 95 105 108 C97 116 91 124 86 133 C80 125 76 116 73 106 C69 91 61 77 49 64 C43 57 37 51 30 46 C49 51 68 59 86 69 C105 80 122 88 137 90 C150 77 165 60 179 35 Z"/>

    <!-- Перехлёст ткани сверху: делает повязку похожей на обёрнутую, а не на юбку -->
    <path class="light" d="M31 45 C52 49 72 56 91 66 C108 75 124 81 139 82 C150 72 162 60 174 44 C164 58 153 70 141 80 C127 91 115 102 105 114 C98 106 91 97 86 87 C76 70 58 56 31 45 Z"/>

    <!-- Небольшой естественный свисающий конец -->
    <path class="base" d="M86 86 C93 96 100 105 109 112 C104 122 99 131 93 139 C88 126 85 108 86 86 Z"/>

    <!-- Мягкая тень под диагональным запахом -->
    <path class="shadow" d="M107 74 C122 81 136 84 148 83 C140 94 129 104 118 112 C111 106 105 99 100 91 C96 98 92 107 89 116 C90 99 89 87 86 78 C93 79 100 73 107 74 Z"/>

    <!-- Узлы именно на бедрах, без круглых 'кнопок' -->
    <path class="knot" d="M15 32 C17 27 23 25 28 28 C32 31 31 36 27 39 C23 42 17 39 15 35 Z"/>
    <path class="knot" d="M177 30 C181 27 187 28 190 32 C192 36 189 40 184 41 C179 41 175 37 177 30 Z"/>

    <!-- Длинные естественные складки -->
    <path class="fold" d="M177 38 C157 55 138 70 119 84 C105 94 94 107 87 124"/>
    <path class="fold" d="M166 42 C148 58 130 71 113 83 C101 92 93 101 88 112"/>
    <path class="fold" d="M151 47 C134 60 118 72 103 82 C94 88 88 96 84 104"/>
    <path class="fold" d="M36 47 C56 53 75 62 91 73 C104 82 116 87 129 89"/>
    <path class="soft" d="M48 55 C64 62 79 72 91 84"/>
    <path class="soft" d="M68 58 C84 66 98 76 110 86"/>
    <path class="soft" d="M91 47 C108 50 124 50 140 46"/>
    <path class="soft" d="M90 91 C88 105 89 119 93 132"/>
  </svg>
</div>
<script>
const cloth=document.getElementById('cloth'),on=document.getElementById('on'),off=document.getElementById('off');
function set(v){cloth.classList.toggle('hidden',!v);on.classList.toggle('active',v);off.classList.toggle('active',!v)}
on.onclick=()=>set(true);off.onclick=()=>set(false);set(true);
</script>
</body>
</html>
