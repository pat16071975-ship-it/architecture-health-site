<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ — лаборатория набедренной повязки</title>
<style>
:root{--paper:#f7f3ec;--ink:#2d342f;--green:#44634f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6,#f4ede1);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;align-items:center;padding:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.title{font:600 20px/1.1 Georgia,serif;margin-right:8px}
.btn{border:1px solid rgba(68,99,79,.3);background:#fffdf8;border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer}
.btn.active{background:#e9efe9;border-color:#6d876f;color:#294231}
.note{width:100%;text-align:center;font-size:12px;color:#6a716b;margin-top:2px}
.board{position:relative;width:min(92vw,580px);height:min(92vw,580px);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.10)}
.board:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:4;pointer-events:none}
.vit{position:absolute;left:50%;top:54%;width:102%;height:102%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);z-index:2;filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
.cloth{position:absolute;left:50%;top:51.8%;width:23.4%;height:auto;transform:translate(-50%,-50%) rotate(-.6deg);transform-origin:50% 34%;z-index:6;pointer-events:none;overflow:visible;transition:opacity .15s}
.cloth.hidden{opacity:0}
/* Палитра ближе к самой ткани/бумаге референса: тёплая охра + коричневая сепия линий. */
.cloth-paper{fill:#e1d5c1;stroke:#e1d5c1;stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round}
.cloth-base{fill:#d8c7aa;stroke:#7b6045;stroke-width:.92;stroke-linecap:round;stroke-linejoin:round}
.cloth-mid{fill:#ceb895;stroke:#74573d;stroke-width:.84;stroke-linecap:round;stroke-linejoin:round}
.cloth-light{fill:#e4d8c4;stroke:#8b6f50;stroke-width:.64;stroke-linecap:round;stroke-linejoin:round}
.cloth-shadow{fill:#b89b75;opacity:.36}
.cloth-line{fill:none;stroke:#765a40;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.cloth-soft{fill:none;stroke:#967655;stroke-width:.56;stroke-linecap:round;stroke-linejoin:round;opacity:.74}
.cloth-knot{fill:#d1bea0;stroke:#72553c;stroke-width:.84;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){body{padding:10px}.title{width:100%;text-align:center;font-size:17px}.btn{padding:7px 10px;font-size:12px}.board{width:94vw;height:94vw}.board:before{inset:5.8%}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="title">АЗ — набедренная повязка</div>
  <button class="btn" id="off" type="button">Без повязки</button>
  <button class="btn active" id="on" type="button">Черновик</button>
  <div class="note">Реконструкция по референсу: чуть выше и крупнее, палитра ткани максимально приближена к сепии рисунка.</div>
</div>
<div class="board">
  <img class="vit" src="../assets/vitruvian-original.jpg?v=20260827-1" alt="Витрувианский человек Леонардо да Винчи">
  <svg class="cloth" id="cloth" viewBox="0 0 180 138" aria-hidden="true">
    <defs>
      <filter id="clothRough" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="11" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale=".45" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <g filter="url(#clothRough)">
      <path class="cloth-paper" d="M27 31 C49 26 69 28 88 32 C108 36 128 35 151 29 C156 29 160 31 160 34 C155 46 146 58 136 68 C125 80 114 91 105 102 C99 109 94 116 90 122 C83 115 77 106 73 96 C68 85 61 75 53 66 C44 55 34 43 27 31 Z"/>

      <path class="cloth-knot" d="M24 28 C28 24 35 24 39 28 C42 31 41 35 38 38 C35 40 31 40 28 38 C25 37 22 34 22 32 C22 30 23 29 24 28 Z"/>
      <path class="cloth-line" d="M27 29 C31 32 35 33 39 31"/>
      <path class="cloth-line" d="M27 34 C31 31 35 29 39 30"/>

      <path class="cloth-knot" d="M146 28 C151 25 157 25 161 28 C164 30 164 34 161 37 C158 39 154 39 150 37 C147 35 145 32 146 28 Z"/>
      <path class="cloth-line" d="M149 29 C153 31 157 32 160 30"/>
      <path class="cloth-soft" d="M149 34 C153 32 157 31 161 32"/>

      <path class="cloth-base" d="M36 31 C53 27 70 29 87 33 C105 37 123 36 146 30 C151 29 155 30 158 32 C149 37 138 40 126 42 C111 44 96 44 81 42 C64 40 48 36 36 31 Z"/>
      <path class="cloth-light" d="M40 31 C55 29 70 31 86 34 C103 37 120 37 140 32 C145 31 149 31 152 32 C144 35 135 38 124 39 C110 41 96 41 82 39 C66 38 52 35 40 31 Z"/>

      <path class="cloth-base" d="M35 36 C49 42 61 50 72 60 C82 70 90 81 96 93 C91 101 87 109 84 117 C77 108 71 98 67 87 C62 74 55 63 46 53 C41 47 37 41 35 36 Z"/>

      <path class="cloth-mid" d="M155 33 C150 45 142 56 132 66 C121 77 110 87 100 98 C95 104 91 111 87 119 C82 112 78 104 75 95 C71 83 64 72 54 62 C48 55 43 49 39 43 C56 47 72 54 87 63 C101 72 114 78 126 80 C137 69 147 54 155 33 Z"/>

      <path class="cloth-light" d="M40 38 C56 42 72 49 87 58 C100 66 112 71 124 73 C134 64 144 52 152 38 C145 51 136 62 126 71 C116 80 106 89 98 99 C93 93 89 87 85 80 C76 64 61 50 40 38 Z"/>

      <path class="cloth-base" d="M76 76 C83 84 90 91 98 97 C95 105 92 113 89 121 C84 113 80 103 78 92 C77 87 76 81 76 76 Z"/>

      <path class="cloth-shadow" d="M98 61 C110 68 121 73 131 74 C125 82 118 90 110 97 C104 91 99 84 95 77 C92 82 89 88 87 94 C87 82 88 72 91 65 C93 62 96 60 98 61 Z"/>

      <path class="cloth-line" d="M151 38 C140 52 128 65 116 76 C105 86 96 97 89 111"/>
      <path class="cloth-line" d="M141 40 C130 53 119 64 108 74 C99 82 92 91 87 101"/>
      <path class="cloth-line" d="M129 41 C119 51 109 60 100 68 C93 74 87 82 83 90"/>
      <path class="cloth-line" d="M42 42 C57 48 71 56 84 65 C95 73 105 78 115 80"/>
      <path class="cloth-soft" d="M53 48 C65 54 76 62 85 71"/>
      <path class="cloth-soft" d="M70 49 C82 55 93 63 103 71"/>
      <path class="cloth-soft" d="M84 82 C83 94 85 105 89 115"/>
    </g>
  </svg>
</div>
<script>
const cloth=document.getElementById('cloth'),on=document.getElementById('on'),off=document.getElementById('off');
function set(v){cloth.classList.toggle('hidden',!v);on.classList.toggle('active',v);off.classList.toggle('active',!v)}
on.onclick=()=>set(true);off.onclick=()=>set(false);set(true);
</script>
</body>
</html>
