<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ — лаборатория набедренной повязки</title>
<style>
:root{--paper:#f7f3ec;--ink:#2d342f;--green:#44634f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6,#f4ede1);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;align-items:center;padding:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.title{font:600 20px/1.1 Georgia,serif;margin-right:8px}
.btn{border:1px solid rgba(68,99,79,.3);background:#fffdf8;border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer}
.btn.active{background:#e9efe9;border-color:#6d876f;color:#294231}
.note{width:100%;text-align:center;font-size:12px;color:#6a716b;margin-top:2px}
.board{position:relative;width:min(92vw,580px);height:min(92vw,580px);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.10)}
.board:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:4;pointer-events:none}
.vit{position:absolute;left:50%;top:54%;width:102%;height:102%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);z-index:2;filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
.cloth{position:absolute;left:50%;top:55.3%;width:29.2%;height:auto;transform:translate(-50%,-50%) rotate(-.7deg);transform-origin:50% 36%;z-index:6;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px .45px rgba(83,59,38,.10));transition:opacity .15s}
.cloth.hidden{opacity:0}
.opaque{fill:#ded0b8;stroke:#ded0b8;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.hip{fill:#cfb992;stroke:#795b3e;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.hip-light{fill:#dfcfb5;stroke:#947250;stroke-width:.75;stroke-linecap:round;stroke-linejoin:round}
.base{fill:#d2bc97;stroke:#795b3e;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
.front{fill:#c6aa80;stroke:#725438;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
.light{fill:#e0d1b8;stroke:#92704e;stroke-width:.75;stroke-linecap:round;stroke-linejoin:round}
.shadow{fill:#ae8e65;opacity:.42}
.fold{fill:none;stroke:#795a3d;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.soft{fill:none;stroke:#9c7b57;stroke-width:.65;stroke-linecap:round;stroke-linejoin:round;opacity:.68}
@media(max-width:620px){body{padding:10px}.title{width:100%;text-align:center;font-size:17px}.btn{padding:7px 10px;font-size:12px}.board{width:94vw;height:94vw}.board:before{inset:5.8%}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="title">АЗ — набедренная повязка</div>
  <button class="btn" id="off" type="button">Без повязки</button>
  <button class="btn active" id="on" type="button">Черновик</button>
  <div class="note">Опора — верхние части бёдер. Цвета — только сепийная гамма рисунка.</div>
</div>
<div class="board">
  <img class="vit" src="../assets/vitruvian-original.jpg?v=20260827-1" alt="Витрувианский человек Леонардо да Винчи">

  <svg class="cloth" id="cloth" viewBox="0 0 220 170" aria-hidden="true">
    <!-- Непрозрачная подложка: тело под тканью не просвечивает -->
    <path class="opaque" d="M48 48 C67 43 85 44 101 49 C116 53 132 53 151 47 C160 45 168 46 174 50 C169 63 160 76 150 88 C138 102 127 114 118 129 C113 138 109 147 106 154 C98 145 92 135 87 123 C82 111 75 101 67 91 C58 79 51 65 48 48 Z"/>

    <!-- ЛЕВОЕ БЕДРО: ткань действительно охватывает верхнюю часть бедра -->
    <path class="hip" d="M52 47 C43 45 34 47 28 52 C21 58 19 66 22 73 C25 81 32 86 40 86 C46 86 51 82 55 76 L50 69 C47 75 43 78 39 78 C34 78 30 75 29 71 C27 66 29 61 33 58 C38 54 44 54 51 56 Z"/>
    <path class="hip-light" d="M50 50 C42 49 35 51 31 55 C27 59 26 64 27 68 C29 72 32 75 37 76 C40 76 43 75 46 72 C42 71 39 69 38 66 C37 62 39 59 42 57 C45 55 48 55 52 57 Z"/>

    <!-- ПРАВОЕ БЕДРО -->
    <path class="hip" d="M168 46 C177 44 186 46 192 51 C199 57 201 65 198 72 C195 80 188 85 180 85 C174 85 169 81 165 75 L170 68 C173 74 177 77 181 77 C186 77 190 74 191 70 C193 65 191 60 187 57 C182 53 176 53 169 55 Z"/>
    <path class="hip-light" d="M170 49 C178 48 185 50 189 54 C193 58 194 63 193 67 C191 71 188 74 183 75 C180 75 177 74 174 71 C178 70 181 68 182 65 C183 61 181 58 178 56 C175 54 172 54 168 56 Z"/>

    <!-- Верхняя полоса соединяет оба бедренных охвата -->
    <path class="base" d="M49 49 C67 44 84 45 101 49 C117 53 133 53 151 48 C158 46 164 47 169 50 C157 56 143 60 128 62 C111 64 94 63 78 60 C66 58 56 54 49 49 Z"/>
    <path class="light" d="M54 50 C69 47 84 48 100 52 C115 55 131 55 146 51 C151 50 156 50 160 51 C151 55 140 57 128 59 C112 61 96 60 81 58 C70 56 61 54 54 50 Z"/>

    <!-- Основная ткань: мягкий диагональный запах от правого бедра к левому -->
    <path class="base" d="M55 57 C72 63 89 73 104 84 C118 94 130 100 142 101 C151 91 159 81 166 70 C170 64 173 58 175 52 C171 70 165 85 156 98 C147 111 136 121 125 132 C117 140 111 148 107 155 C99 146 92 135 88 123 C83 110 76 99 67 88 C60 79 56 68 55 57 Z"/>

    <!-- Верхний запах, как у понравившейся тканевой повязки -->
    <path class="front" d="M61 58 C80 63 98 72 115 82 C128 90 140 94 151 94 C143 103 135 111 126 119 C118 126 111 134 106 142 C100 134 95 125 92 115 C87 100 79 87 68 75 C65 70 62 64 61 58 Z"/>

    <!-- Небольшой мягкий свисающий конец -->
    <path class="light" d="M94 96 C101 104 108 111 116 117 C112 129 108 140 104 150 C98 139 94 120 94 96 Z"/>

    <!-- Тень только внутри складок; цвет взят из коричневой сепии рисунка -->
    <path class="shadow" d="M111 80 C125 88 138 93 150 94 C143 104 135 112 126 120 C119 113 113 105 108 96 C104 103 101 111 99 120 C98 104 99 91 102 84 C105 81 108 79 111 80 Z"/>

    <!-- Складки -->
    <path class="fold" d="M166 58 C151 75 136 89 121 102 C112 110 105 120 100 132"/>
    <path class="fold" d="M154 59 C140 73 126 84 113 95 C104 102 98 111 94 121"/>
    <path class="fold" d="M139 60 C126 71 114 81 103 90 C96 96 91 103 88 111"/>
    <path class="fold" d="M64 62 C81 68 97 77 111 87 C122 95 133 99 143 100"/>
    <path class="soft" d="M76 67 C90 74 102 83 112 93"/>
    <path class="soft" d="M95 62 C108 68 121 76 132 85"/>
    <path class="soft" d="M101 104 C100 118 101 132 104 144"/>
  </svg>
</div>
<script>
const cloth=document.getElementById('cloth'),on=document.getElementById('on'),off=document.getElementById('off');
function set(v){cloth.classList.toggle('hidden',!v);on.classList.toggle('active',v);off.classList.toggle('active',!v)}
on.onclick=()=>set(true);off.onclick=()=>set(false);set(true);
</script>
</body>
</html>
