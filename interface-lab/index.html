<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}
.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}
.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}
.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}
.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}
.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}.frame-shell{height:calc(100vh - 90px);width:1440px;max-width:100%;min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновик не меняет основной сайт</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn active" data-width="1440" type="button">ПК</button>
    <button class="btn" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: орбиты v8</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../?lab=v8" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';

const draftCss=`
@media (min-width:1181px){
  .page{position:relative!important}
  .map-shell{height:790px!important;margin-top:22px!important;overflow:visible!important;position:relative!important}
  .map{position:absolute!important;left:50%!important;top:0!important;width:920px!important;height:720px!important;padding:0!important;display:block!important;transform:translateX(-50%)!important;overflow:visible!important}
  .map .ring{display:none!important}
  .stage{left:460px!important;top:355px!important;width:410px!important;height:410px!important;transform:translate(-50%,-50%)!important;z-index:2!important}
  .stage:before{inset:27px!important}
  .relation-panel{display:none!important}

  .right .specialists-badge,.right .side-menu-badge{display:none!important}

  .az-orbit-svg{position:absolute!important;inset:0!important;width:920px!important;height:720px!important;overflow:visible!important;z-index:3!important;pointer-events:none!important}
  .az-orbit-path{fill:none!important;vector-effect:non-scaling-stroke!important;stroke-linecap:round!important;stroke-linejoin:round!important}
  .az-orbit-path.outer{stroke:rgba(181,150,98,.34)!important;stroke-width:1.2!important}
  .az-orbit-path.inner{stroke:rgba(68,99,79,.24)!important;stroke-width:1.1!important}

  .map .direction.az-orbit-node{position:absolute!important;left:var(--orbit-x)!important;top:var(--orbit-y)!important;width:116px!important;height:92px!important;min-height:92px!important;margin:0!important;padding:8px 7px!important;transform:translate(-50%,-50%)!important;border-radius:53% 47% 51% 49% / 47% 54% 46% 53%!important;color:#30372f!important;font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;font-size:9.6px!important;line-height:1.12!important;font-weight:600!important;text-shadow:none!important;overflow:hidden!important;z-index:8!important;box-shadow:0 7px 18px rgba(71,58,38,.07)!important}
  .map .direction.az-inner-orbit{background:linear-gradient(180deg,rgba(239,246,240,.98),rgba(250,247,241,.98))!important;background-image:linear-gradient(180deg,rgba(239,246,240,.98),rgba(250,247,241,.98))!important;border:1.5px solid rgba(181,150,98,.68)!important}
  .map .direction.az-outer-orbit{background:linear-gradient(180deg,rgba(250,247,241,.99),rgba(245,238,226,.98))!important;background-image:linear-gradient(180deg,rgba(250,247,241,.99),rgba(245,238,226,.98))!important;border:1.5px solid rgba(181,150,98,.48)!important}
  .map .direction.az-orbit-node::before,.map .direction.az-orbit-node::after{content:none!important;display:none!important;background:none!important}

  /* Левая колонка возвращена к прежней геометрии и размеру */
  .az-left-placeholder-menu{position:absolute!important;left:4px!important;top:355px!important;z-index:17!important;width:330px!important;display:grid!important;gap:22px!important;pointer-events:none!important}
  .az-left-placeholder{position:relative!important;width:230px!important;min-height:48px!important;padding:13px 18px!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:10px!important;background:rgba(250,247,241,.96)!important;border:1px solid rgba(181,150,98,.42)!important;box-shadow:0 9px 24px rgba(71,58,38,.08)!important;color:#354039!important;font:600 17px/1.1 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;text-align:center!important}
  .az-left-placeholder:nth-child(1){margin-left:0!important}.az-left-placeholder:nth-child(2){margin-left:34px!important}.az-left-placeholder:nth-child(3){margin-left:68px!important}.az-left-placeholder:nth-child(4){margin-left:102px!important}.az-left-placeholder:nth-child(5){margin-left:136px!important}

  /* Правая колонка — ниже, зеркальной диагональю, 5 пунктов */
  .az-right-draft-menu{position:absolute!important;right:4px!important;top:475px!important;z-index:17!important;width:330px!important;display:grid!important;gap:22px!important;pointer-events:none!important}
  .az-right-draft-item{position:relative!important;justify-self:end!important;width:230px!important;min-height:48px!important;padding:13px 18px!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:10px!important;background:rgba(250,247,241,.96)!important;border:1px solid rgba(181,150,98,.42)!important;box-shadow:0 9px 24px rgba(71,58,38,.08)!important;color:#354039!important;font:600 17px/1.1 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;text-align:center!important}
  .az-right-draft-item:nth-child(1){margin-right:0!important}.az-right-draft-item:nth-child(2){margin-right:34px!important}.az-right-draft-item:nth-child(3){margin-right:68px!important}.az-right-draft-item:nth-child(4){margin-right:102px!important}.az-right-draft-item:nth-child(5){margin-right:136px!important}
}
@media (max-width:1180px){.az-left-placeholder-menu,.az-right-draft-menu,.az-orbit-svg{display:none!important}}
`;

const outerOrder=['ИГГТ','Нутрициология','Гастроэнтерология','Превентивная медицина','Миофункциональная терапия','Детская неврология','Нейропсихология','DIERS диагностика'];
const innerOrder=['Функциональная стоматология','Ортодонтия','Остеопатия','Терапия'];
const outerFractions=[0.02,0.145,0.27,0.395,0.52,0.645,0.77,0.895];
const innerFractions=[0.035,0.285,0.535,0.785];

function normalizedName(el){return el.textContent.replace(/\s+/g,' ').trim()}
function clearDraft(doc){
  doc.getElementById('az-lab-v8-style')?.remove();
  doc.querySelectorAll('.az-orbit-svg').forEach(el=>el.remove());
  doc.querySelector('.az-left-placeholder-menu')?.remove();
  doc.querySelector('.az-right-draft-menu')?.remove();
  doc.querySelectorAll('.map .direction').forEach(el=>{
    el.classList.remove('az-orbit-node','az-inner-orbit','az-outer-orbit');
    el.style.removeProperty('--orbit-x');
    el.style.removeProperty('--orbit-y');
  });
}
function addMenus(doc){
  const page=doc.querySelector('.page');
  if(!page)return;
  const left=doc.createElement('div');
  left.className='az-left-placeholder-menu';
  left.innerHTML='<div class="radial-badge az-left-placeholder">заглушка</div>'.repeat(5);
  page.appendChild(left);
  const right=doc.createElement('div');
  right.className='az-right-draft-menu';
  right.innerHTML='<div class="radial-badge az-right-draft-item">команда</div><div class="radial-badge az-right-draft-item">о клинике</div><div class="radial-badge az-right-draft-item">пациенту</div><div class="radial-badge az-right-draft-item">лаборатория</div><div class="radial-badge az-right-draft-item">контакты</div>';
  page.appendChild(right);
}
function addOrbits(doc){
  const map=doc.querySelector('.map');
  if(!map)return;
  const svg=doc.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','az-orbit-svg');
  svg.setAttribute('viewBox','0 0 920 720');
  svg.setAttribute('aria-hidden','true');
  svg.innerHTML='<path class="az-orbit-path outer" d="M145 390 C120 240 265 105 470 75 C675 45 845 145 865 305 C885 465 745 620 555 665 C360 710 180 590 145 390 Z"/><path class="az-orbit-path inner" d="M280 285 C340 160 500 125 640 180 C760 225 790 360 715 455 C635 560 470 600 350 520 C245 450 230 380 280 285 Z"/>';
  map.prepend(svg);

  const paths={outer:svg.querySelector('.outer'),inner:svg.querySelector('.inner')};
  const buttons=[...doc.querySelectorAll('.map .direction')];
  const byName=new Map(buttons.map(el=>[normalizedName(el),el]));
  const place=(name,path,fraction,kind)=>{
    const el=byName.get(name);if(!el)return;
    const len=path.getTotalLength();
    const pt=path.getPointAtLength(len*fraction);
    el.classList.add('az-orbit-node',kind==='inner'?'az-inner-orbit':'az-outer-orbit');
    el.style.setProperty('--orbit-x',pt.x+'px');
    el.style.setProperty('--orbit-y',pt.y+'px');
  };
  outerOrder.forEach((name,i)=>place(name,paths.outer,outerFractions[i],'outer'));
  innerOrder.forEach((name,i)=>place(name,paths.inner,innerFractions[i],'inner'));
}
function applyDraft(){
  const doc=frame.contentDocument;if(!doc)return;
  clearDraft(doc);
  if(mode!=='draft'){status.textContent='Оригинал сайта';return;}
  const style=doc.createElement('style');style.id='az-lab-v8-style';style.textContent=draftCss;doc.head.appendChild(style);
  if(shell.getBoundingClientRect().width>1180){addMenus(doc);addOrbits(doc);status.textContent='Черновик: ПК — орбиты v8, меню 5+5';}
  else status.textContent='Черновик: мобильная/планшетная версия без орбитального эксперимента';
}
frame.addEventListener('load',applyDraft);
modeButtons.forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;modeButtons.forEach(x=>x.classList.toggle('active',x===btn));applyDraft()}));
widthButtons.forEach(btn=>btn.addEventListener('click',()=>{const w=btn.dataset.width;shell.style.width=w==='100%'?'100%':w+'px';widthButtons.forEach(x=>x.classList.toggle('active',x===btn));setTimeout(applyDraft,220)}));
document.getElementById('reload').addEventListener('click',()=>frame.contentWindow.location.reload());
</script>
</body>
</html>
