<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}
.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}
.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}
.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}
.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}
.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}
.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.frame-shell{height:calc(100vh - 90px);width:1440px;max-width:100%;min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}
.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновик меняет только просмотрщик; основной сайт не изменяется</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn active" data-width="1440" type="button">ПК</button>
    <button class="btn" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: 12 присланных рисунков планет</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../?lab=orbits-20260903-11" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';
let orbitAnimationFrame=0;

const INNER_DURATION=42000;
const OUTER_DURATION=76000;

const innerNames=['Функциональная стоматология','Ортодонтия','Остеопатия','Терапия'];
const outerNames=['ИГГТ','DIERS диагностика','Нейропсихология','Детская неврология','Миофункциональная терапия','Превентивная медицина','Гастроэнтерология','Нутрициология'];
const innerAngles=[180,270,0,90];
const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];

const PLANET_SPRITE="url('/architecture-health-site/assets/lab-planets/reference-sprite.webp?v=20260903-2')";
const planetSpritePositions={
  'ИГГТ':'0px 0px','DIERS диагностика':'-116px 0px','Функциональная стоматология':'-232px 0px','Нейропсихология':'-348px 0px',
  'Детская неврология':'0px -92px','Ортодонтия':'-116px -92px','Миофункциональная терапия':'-232px -92px','Превентивная медицина':'-348px -92px',
  'Остеопатия':'0px -184px','Гастроэнтерология':'-116px -184px','Нутрициология':'-232px -184px','Терапия':'-348px -184px'
};

function norm(value){return String(value||'').toLowerCase().replace(/ё/g,'е').replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim()}
function stopOrbitAnimation(){if(orbitAnimationFrame){cancelAnimationFrame(orbitAnimationFrame);orbitAnimationFrame=0}}
function cleanupDraft(doc){
  stopOrbitAnimation();doc.getElementById('az-lab-orbits')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();
  doc.querySelectorAll('.az-lab-orbit-host').forEach(el=>el.classList.remove('az-lab-orbit-host'));
  doc.querySelectorAll('.az-lab-planet').forEach(el=>{if(el.dataset.azOriginalHtml!==undefined){el.innerHTML=el.dataset.azOriginalHtml;delete el.dataset.azOriginalHtml}if(el.dataset.azOriginalStyle!==undefined){if(el.dataset.azOriginalStyle)el.setAttribute('style',el.dataset.azOriginalStyle);else el.removeAttribute('style');delete el.dataset.azOriginalStyle}el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet')});
}
function pointOnEllipse(cx,cy,rx,ry,tiltDeg,angleDeg){const t=angleDeg*Math.PI/180,a=tiltDeg*Math.PI/180,dx=rx*Math.cos(t),dy=ry*Math.sin(t);return{x:cx+dx*Math.cos(a)-dy*Math.sin(a),y:cy+dx*Math.sin(a)+dy*Math.cos(a)}}
function collectPlanets(doc){
  const byName=new Map();doc.querySelectorAll('.direction').forEach(el=>byName.set(norm(el.innerText||el.textContent),el));
  const prepare=(names,orbitClass)=>names.map(name=>{const el=byName.get(norm(name));if(!el)return null;if(el.dataset.azOriginalStyle===undefined)el.dataset.azOriginalStyle=el.getAttribute('style')||'';if(el.dataset.azOriginalHtml===undefined)el.dataset.azOriginalHtml=el.innerHTML;el.classList.add('az-lab-planet',orbitClass);el.style.setProperty('--az-planet-art',PLANET_SPRITE);el.style.setProperty('--az-planet-pos',planetSpritePositions[name]||'0px 0px');el.innerHTML='<span class="az-lab-planet-art" aria-hidden="true"></span><span class="az-lab-planet-label">'+el.dataset.azOriginalHtml+'</span>';el.style.setProperty('transform','translate(-50%,-50%)','important');return el}).filter(Boolean);
  return{inner:prepare(innerNames,'az-lab-inner-planet'),outer:prepare(outerNames,'az-lab-outer-planet')};
}
function setPlanetPositions(planets,angles,cx,cy,rx,ry,tilt,phase){planets.forEach((el,index)=>{const p=pointOnEllipse(cx,cy,rx,ry,tilt,angles[index]+phase);el.style.setProperty('left',p.x+'px','important');el.style.setProperty('top',p.y+'px','important')})}
function startOrbitAnimation(doc,planets,g){const started=performance.now();const tick=now=>{if(mode!=='draft'||frame.contentDocument!==doc||!doc.documentElement.isConnected){orbitAnimationFrame=0;return}const elapsed=now-started;setPlanetPositions(planets.inner,innerAngles,g.cx,g.cy,g.innerRx,g.innerRy,g.innerTilt,(elapsed/INNER_DURATION)*360);setPlanetPositions(planets.outer,outerAngles,g.cx,g.cy,g.outerRx,g.outerRy,g.outerTilt,(elapsed/OUTER_DURATION)*360);orbitAnimationFrame=requestAnimationFrame(tick)};orbitAnimationFrame=requestAnimationFrame(tick)}
function drawOrbits(){
  if(mode!=='draft')return;const doc=frame.contentDocument;if(!doc)return;cleanupDraft(doc);const stage=doc.querySelector('.stage');if(!stage)return;const host=doc.querySelector('.map')||stage.parentElement;if(!host)return;
  const hostRect=host.getBoundingClientRect(),r=stage.getBoundingClientRect();const g={cx:r.left-hostRect.left+r.width/2,cy:r.top-hostRect.top+r.height/2,innerRx:r.width*.58,innerRy:r.height*.46,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14};
  host.classList.add('az-lab-orbit-host');const style=doc.createElement('style');style.id='az-lab-orbit-style';style.textContent=`
.az-lab-orbit-host{position:relative!important}.az-lab-orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
@media (min-width:1181px){
.az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}
.az-lab-orbit-host .direction{position:absolute!important;width:116px!important;height:92px!important;min-height:92px!important;padding:8px!important;border-radius:53% 47% 51% 49% / 47% 54% 46% 53%!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;font-size:9.6px!important;line-height:1.13!important;font-weight:600!important;letter-spacing:0!important;color:#30372f!important;box-shadow:0 7px 18px rgba(71,58,38,.07)!important;overflow:hidden!important;pointer-events:none!important;z-index:8!important;will-change:left,top!important;isolation:isolate!important}
.az-lab-orbit-host .direction.az-lab-inner-planet{background:linear-gradient(180deg,rgba(239,246,240,.99),rgba(250,247,241,.99))!important;border:1.5px solid rgba(68,99,79,.34)!important}
.az-lab-orbit-host .direction.az-lab-outer-planet{background:linear-gradient(180deg,rgba(250,247,241,.99),rgba(245,238,226,.99))!important;border:1.5px solid rgba(181,150,98,.48)!important}
.az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-art{display:block!important;position:absolute!important;inset:0!important;border-radius:inherit!important;background-image:var(--az-planet-art)!important;background-repeat:no-repeat!important;background-position:var(--az-planet-pos)!important;background-size:464px 276px!important;opacity:.88!important;mix-blend-mode:multiply!important;pointer-events:none!important;z-index:0!important}
.az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-label{position:relative!important;z-index:1!important;display:block!important;max-width:100%!important}
.az-lab-orbit-host .direction.az-lab-planet::before,.az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}
}
@media (min-width:721px) and (max-width:1180px){.az-lab-orbit-host .stage{transform:scale(.568965517)!important;transform-origin:center center!important}}
`;doc.head.appendChild(style);
  const ns='http://www.w3.org/2000/svg',svg=doc.createElementNS(ns,'svg');svg.id='az-lab-orbits';svg.setAttribute('class','az-lab-orbit-svg');svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);svg.setAttribute('preserveAspectRatio','none');
  const inner=doc.createElementNS(ns,'ellipse');inner.setAttribute('cx',g.cx);inner.setAttribute('cy',g.cy);inner.setAttribute('rx',g.innerRx);inner.setAttribute('ry',g.innerRy);inner.setAttribute('fill','none');inner.setAttribute('stroke','#9aab9b');inner.setAttribute('stroke-width','1.15');inner.setAttribute('stroke-opacity','.62');inner.setAttribute('transform',`rotate(${g.innerTilt} ${g.cx} ${g.cy})`);
  const outer=doc.createElementNS(ns,'ellipse');outer.setAttribute('cx',g.cx);outer.setAttribute('cy',g.cy);outer.setAttribute('rx',g.outerRx);outer.setAttribute('ry',g.outerRy);outer.setAttribute('fill','none');outer.setAttribute('stroke','#c9aa75');outer.setAttribute('stroke-width','1.15');outer.setAttribute('stroke-opacity','.58');outer.setAttribute('transform',`rotate(${g.outerTilt} ${g.cx} ${g.cy})`);svg.append(inner,outer);host.prepend(svg);
  if((doc.defaultView?.innerWidth||0)>=1181){const planets=collectPlanets(doc);setPlanetPositions(planets.inner,innerAngles,g.cx,g.cy,g.innerRx,g.innerRy,g.innerTilt,0);setPlanetPositions(planets.outer,outerAngles,g.cx,g.cy,g.outerRx,g.outerRy,g.outerTilt,0);startOrbitAnimation(doc,planets,g)}
}
function reloadFrame(){stopOrbitAnimation();frame.src='../?lab=orbits-20260903-11&t='+Date.now()}
function setMode(next){mode=next;modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));status.textContent=mode==='base'?'Оригинал без изменений':'Черновик: 12 присланных рисунков · 42/76 сек';reloadFrame()}
frame.addEventListener('load',()=>{if(mode==='draft')requestAnimationFrame(()=>requestAnimationFrame(drawOrbits))});modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));widthButtons.forEach(b=>b.addEventListener('click',()=>{widthButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');shell.style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';if(mode==='draft')setTimeout(drawOrbits,220)}));document.getElementById('reload').addEventListener('click',reloadFrame);
</script>
</body>
</html>
