<title>АЗ Interface Lab</title>
<style>

</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновики здесь не меняют главную страницу</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn" data-width="1440" type="button">ПК</button>
    <button class="btn active" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: круговые направления</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>

    svg.setAttribute('aria-hidden','true');
    svg.innerHTML='<path class="az-orbit-path outer" d="M470 58 C600 8 790 22 900 92 C996 154 1000 247 944 322 C895 388 931 473 868 555 C793 651 635 709 507 664 C404 628 356 553 404 486 C447 425 350 379 378 300 C407 220 354 138 470 58 Z"/><path class="az-orbit-path inner" d="M570 108 C696 78 823 124 855 220 C883 305 842 365 806 420 C758 494 770 555 681 604 C593 652 483 605 438 526 C394 449 437 397 423 332 C408 258 444 153 570 108 Z"/>';
    map.prepend(svg);
  }

  const coords={
    'Функциональная стоматология':['570','108','inner'],
    'Ортодонтия':['855','220','inner'],
    'Остеопатия':['681','604','inner'],
    'Терапия':['423','332','inner'],
    'ИГГТ':['470','58','outer'],
    'Нутрициология':['760','58','outer'],
    'Гастроэнтерология':['944','210','outer'],
    'Превентивная медицина':['900','430','outer'],
    'Миофункциональная терапия':['820','600','outer'],
    'Детская неврология':['610','685','outer'],
    'Нейропсихология':['430','610','outer'],
    'DIERS диагностика':['382','205','outer']
  };
  doc.querySelectorAll('.map .direction').forEach(el=>{
    const name=el.textContent.replace(/\s+/g,' ').trim();
    const c=coords[name];
    if(!c)return;
    el.classList.add('az-orbit-node',c[2]==='inner'?'az-inner-orbit':'az-outer-orbit');
    el.style.setProperty('--draft-left',c[0]+'px');
    el.style.setProperty('--draft-top',c[1]+'px');
  });

  const w=shell.getBoundingClientRect().width;
  status.textContent=w<=720?'Черновик: телефон — прежняя мобильная сетка':w<=1180?'Черновик: планшет — статичная композиция':'Черновик: ПК — орбиты v7b, меню 5+5';
}
frame.addEventListener('load',applyDraft);
modeButtons.forEach(btn=>btn.addEventListener('click',()=>{
  mode=btn.dataset.mode;
  modeButtons.forEach(x=>x.classList.toggle('active',x===btn));
  applyDraft();
}));
widthButtons.forEach(btn=>btn.addEventListener('click',()=>{
  const w=btn.dataset.width;
  shell.style.width=w==='100%'?'100%':w+'px';
  widthButtons.forEach(x=>x.classList.toggle('active',x===btn));
  setTimeout(applyDraft,250);
}));
document.getElementById('reload').addEventListener('click',()=>frame.contentWindow.location.reload());
</script>
</body>
</html>
