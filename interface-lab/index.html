<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}
.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}
.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}
.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}
.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}
.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}
.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.frame-shell{height:calc(100vh - 90px);width:1440px;max-width:100%;min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}
.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновик меняет только просмотрщик; основной сайт не изменяется</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn active" data-width="1440" type="button">ПК</button>
    <button class="btn" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: контурная графика внутри планет</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../?lab=orbits-20260903-8" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';
let orbitAnimationFrame=0;

const INNER_DURATION=42000;
const OUTER_DURATION=76000;

const innerNames=[
  'Функциональная стоматология',
  'Ортодонтия',
  'Остеопатия',
  'Терапия'
];
const outerNames=[
  'ИГГТ',
  'DIERS диагностика',
  'Нейропсихология',
  'Детская неврология',
  'Миофункциональная терапия',
  'Превентивная медицина',
  'Гастроэнтерология',
  'Нутрициология'
];
const innerAngles=[180,270,0,90];
const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];


const planetSketches=[
  `<path d="M-7 21 C9 9 21 13 30 22 S47 35 57 25 S70 8 84 11 S104 24 123 12"/><path d="M8 57 C18 45 29 48 35 58 S50 75 64 64 S79 48 91 55 S103 73 120 66"/><path d="M66 11 C60 18 60 26 67 31 S82 30 83 20"/><path d="M22 75 C28 69 38 69 42 76 S37 88 27 88"/>`,
  `<path d="M-8 15 C13 7 27 13 41 8 S68 2 124 11"/><path d="M-6 31 C18 23 30 35 47 27 S77 17 122 24"/><path d="M-5 50 C15 42 31 54 49 47 S81 33 123 42"/><path d="M-7 72 C15 61 31 73 52 65 S88 55 124 65"/><ellipse cx="80" cy="26" rx="12" ry="5"/><ellipse cx="26" cy="60" rx="9" ry="4"/>`,
  `<path d="M-9 26 C10 10 21 8 33 16 S40 35 52 33 S70 16 83 12 S106 14 124 4"/><path d="M4 73 C16 56 31 49 45 56 S56 74 70 67 S84 44 100 46 S113 56 122 51"/><ellipse cx="28" cy="30" rx="12" ry="7"/><ellipse cx="90" cy="67" rx="10" ry="5"/><ellipse cx="58" cy="18" rx="5" ry="3"/>`,
  `<path d="M-8 19 C19 7 44 11 65 6 S98 5 124 13"/><path d="M-6 38 C17 28 42 34 61 27 S91 24 123 32"/><path d="M-6 58 C22 48 39 56 60 49 S96 44 123 50"/><path d="M-8 79 C16 67 39 75 61 69 S98 62 124 71"/><path d="M17 47 C25 42 34 43 40 48"/><path d="M76 62 C84 57 93 58 100 62"/>`,
  `<path d="M-4 10 C15 12 17 26 31 27 S44 12 58 17 S67 36 82 33 S96 16 120 18"/><path d="M-6 57 C10 51 16 39 31 42 S42 63 56 66 S73 54 84 56 S98 74 121 72"/><path d="M14 73 C19 64 27 63 32 71 S31 89 19 91"/><path d="M78 6 C86 15 91 23 88 32"/><ellipse cx="99" cy="47" rx="7" ry="4"/>`,
  `<path d="M-7 17 C15 7 30 20 48 13 S78 6 123 17"/><path d="M-7 30 C17 22 34 35 51 27 S82 19 124 29"/><path d="M-8 46 C17 35 38 49 56 40 S88 33 123 42"/><path d="M-6 63 C18 52 40 67 61 57 S93 49 124 58"/><path d="M-8 80 C15 70 39 81 61 73 S96 66 124 74"/><ellipse cx="22" cy="38" rx="8" ry="3"/><ellipse cx="84" cy="52" rx="11" ry="4"/>`,
  `<path d="M-10 67 C10 55 18 43 32 36 S60 28 70 16 S92 1 122 6"/><path d="M-5 82 C14 70 25 60 42 54 S64 43 76 31 S99 15 123 15"/><path d="M4 22 C16 13 25 15 31 22 S30 36 19 38"/><ellipse cx="76" cy="62" rx="13" ry="6"/><ellipse cx="99" cy="38" rx="6" ry="4"/>`,
  `<path d="M-8 21 C8 18 15 7 28 9 S43 24 56 19 S68 6 82 10 S98 29 123 25"/><path d="M-7 56 C10 48 20 57 32 53 S45 38 58 42 S69 61 83 58 S101 43 123 48"/><path d="M5 78 C17 69 30 74 37 85"/><ellipse cx="48" cy="72" rx="8" ry="5"/><ellipse cx="92" cy="22" rx="10" ry="5"/>`,
  `<path d="M-7 30 C12 12 23 14 36 28 S54 45 69 35 S82 10 99 13 S111 25 124 20"/><path d="M-5 76 C10 64 25 54 40 60 S58 78 72 70 S87 49 103 52 S115 63 123 60"/><path d="M50 6 C45 14 47 21 55 25"/><ellipse cx="24" cy="43" rx="8" ry="5"/><ellipse cx="97" cy="74" rx="11" ry="5"/>`,
  `<path d="M-8 16 C14 7 34 16 54 9 S92 5 124 15"/><path d="M-8 34 C16 25 34 36 55 28 S93 23 123 31"/><path d="M-7 56 C14 45 37 59 57 50 S92 43 123 51"/><path d="M-8 76 C17 65 39 79 62 69 S98 62 124 70"/><ellipse cx="18" cy="53" rx="7" ry="3"/><ellipse cx="68" cy="20" rx="10" ry="4"/><ellipse cx="94" cy="60" rx="9" ry="4"/>`,
  `<path d="M10 -4 C17 9 16 21 9 34 S5 58 15 74 S24 87 27 98"/><path d="M37 -5 C47 10 46 26 39 39 S36 62 44 75 S51 87 54 97"/><path d="M72 -4 C81 11 79 27 73 41 S70 62 80 77 S88 88 90 98"/><path d="M101 -4 C110 10 107 25 103 38 S100 61 111 74"/><path d="M27 46 C35 38 44 39 49 47"/><path d="M78 28 C85 23 92 24 97 29"/>`,
  `<path d="M-7 23 C10 13 24 18 36 11 S59 3 75 12 S94 29 123 18"/><path d="M-8 48 C11 39 25 46 39 39 S61 29 76 37 S96 55 123 45"/><path d="M-7 73 C12 63 30 71 46 62 S70 53 84 60 S103 77 124 68"/><ellipse cx="28" cy="28" rx="9" ry="5"/><ellipse cx="73" cy="71" rx="12" ry="5"/><ellipse cx="99" cy="37" rx="6" ry="3"/>`
];

function planetArt(index){
  const sketch=planetSketches[index%planetSketches.length];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 92"><g fill="none" stroke="#66736b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" opacity=".42">${sketch}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

function norm(value){
  return String(value||'')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[–—-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function stopOrbitAnimation(){
  if(orbitAnimationFrame){
    cancelAnimationFrame(orbitAnimationFrame);
    orbitAnimationFrame=0;
  }
}

function cleanupDraft(doc){
  stopOrbitAnimation();
  doc.getElementById('az-lab-orbits')?.remove();
  doc.getElementById('az-lab-orbit-style')?.remove();
  doc.querySelectorAll('.az-lab-orbit-host').forEach(el=>el.classList.remove('az-lab-orbit-host'));
  doc.querySelectorAll('.az-lab-planet').forEach(el=>{
    if(el.dataset.azOriginalStyle!==undefined){
      if(el.dataset.azOriginalStyle)el.setAttribute('style',el.dataset.azOriginalStyle);
      else el.removeAttribute('style');
      delete el.dataset.azOriginalStyle;
    }
    el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet');
  });
}

function pointOnEllipse(cx,cy,rx,ry,tiltDeg,angleDeg){
  const t=angleDeg*Math.PI/180;
  const a=tiltDeg*Math.PI/180;
  const dx=rx*Math.cos(t);
  const dy=ry*Math.sin(t);
  return {
    x:cx+dx*Math.cos(a)-dy*Math.sin(a),
    y:cy+dx*Math.sin(a)+dy*Math.cos(a)
  };
}

function collectPlanets(doc){
  const byName=new Map();
  doc.querySelectorAll('.direction').forEach(el=>byName.set(norm(el.innerText||el.textContent),el));
  const prepare=(names,orbitClass,offset)=>names.map((name,index)=>{
    const el=byName.get(norm(name));
    if(!el)return null;
    if(el.dataset.azOriginalStyle===undefined)el.dataset.azOriginalStyle=el.getAttribute('style')||'';
    el.classList.add('az-lab-planet',orbitClass);
    el.style.setProperty('--az-planet-art',planetArt(offset+index));
    el.style.setProperty('transform','translate(-50%,-50%)','important');
    return el;
  }).filter(Boolean);
  return {
    inner:prepare(innerNames,'az-lab-inner-planet',0),
    outer:prepare(outerNames,'az-lab-outer-planet',4)
  };
}

function setPlanetPositions(planets,angles,cx,cy,rx,ry,tilt,phase){
  planets.forEach((el,index)=>{
    const p=pointOnEllipse(cx,cy,rx,ry,tilt,angles[index]+phase);
    el.style.setProperty('left',p.x+'px','important');
    el.style.setProperty('top',p.y+'px','important');
  });
}

function startOrbitAnimation(doc,planets,geometry){
  const started=performance.now();
  const tick=now=>{
    if(mode!=='draft'||frame.contentDocument!==doc||!doc.documentElement.isConnected){
      orbitAnimationFrame=0;
      return;
    }
    const elapsed=now-started;
    const innerPhase=(elapsed/INNER_DURATION)*360;
    const outerPhase=(elapsed/OUTER_DURATION)*360;
    setPlanetPositions(planets.inner,innerAngles,geometry.cx,geometry.cy,geometry.innerRx,geometry.innerRy,geometry.innerTilt,innerPhase);
    setPlanetPositions(planets.outer,outerAngles,geometry.cx,geometry.cy,geometry.outerRx,geometry.outerRy,geometry.outerTilt,outerPhase);
    orbitAnimationFrame=requestAnimationFrame(tick);
  };
  orbitAnimationFrame=requestAnimationFrame(tick);
}

function drawOrbits(){
  if(mode!=='draft')return;
  const doc=frame.contentDocument;
  if(!doc)return;
  cleanupDraft(doc);

  const stage=doc.querySelector('.stage');
  if(!stage)return;
  const host=doc.querySelector('.map')||stage.parentElement;
  if(!host)return;

  const hostRect=host.getBoundingClientRect();
  const originalStageRect=stage.getBoundingClientRect();
  const geometry={
    cx:originalStageRect.left-hostRect.left+originalStageRect.width/2,
    cy:originalStageRect.top-hostRect.top+originalStageRect.height/2,
    innerRx:originalStageRect.width*.58,
    innerRy:originalStageRect.height*.46,
    outerRx:originalStageRect.width*.73,
    outerRy:originalStageRect.height*.57,
    innerTilt:18,
    outerTilt:14
  };

  host.classList.add('az-lab-orbit-host');
  const style=doc.createElement('style');
  style.id='az-lab-orbit-style';
  style.textContent=`
    .az-lab-orbit-host{position:relative!important}
    .az-lab-orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
    @media (min-width:1181px){
      .az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}
      .az-lab-orbit-host .direction{
        width:116px!important;
        height:92px!important;
        min-height:92px!important;
        padding:8px 8px!important;
        border-radius:53% 47% 51% 49% / 47% 54% 46% 53%!important;
        display:flex!important;
        align-items:center!important;
        justify-content:center!important;
        text-align:center!important;
        font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;
        font-size:9.6px!important;
        line-height:1.13!important;
        font-weight:600!important;
        letter-spacing:0!important;
        color:#30372f!important;
        box-shadow:0 7px 18px rgba(71,58,38,.07)!important;
        overflow:hidden!important;
        pointer-events:none!important;
        z-index:8!important;
        will-change:left,top!important;
      }
      .az-lab-orbit-host .direction.az-lab-inner-planet{
        background-image:var(--az-planet-art),linear-gradient(180deg,rgba(239,246,240,.99),rgba(250,247,241,.99))!important;
        background-repeat:no-repeat!important;
        background-position:center!important;
        background-size:100% 100%,100% 100%!important;
        border:1.5px solid rgba(68,99,79,.34)!important;
      }
      .az-lab-orbit-host .direction.az-lab-outer-planet{
        background-image:var(--az-planet-art),linear-gradient(180deg,rgba(250,247,241,.99),rgba(245,238,226,.99))!important;
        background-repeat:no-repeat!important;
        background-position:center!important;
        background-size:100% 100%,100% 100%!important;
        border:1.5px solid rgba(181,150,98,.48)!important;
      }
      .az-lab-orbit-host .direction.az-lab-planet::before,
      .az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}
    }
    @media (min-width:721px) and (max-width:1180px){
      .az-lab-orbit-host .stage{transform:scale(.568965517)!important;transform-origin:center center!important}
    }
  `;
  doc.head.appendChild(style);

  const ns='http://www.w3.org/2000/svg';
  const svg=doc.createElementNS(ns,'svg');
  svg.id='az-lab-orbits';
  svg.setAttribute('class','az-lab-orbit-svg');
  svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);
  svg.setAttribute('preserveAspectRatio','none');

  const inner=doc.createElementNS(ns,'ellipse');
  inner.setAttribute('cx',geometry.cx);inner.setAttribute('cy',geometry.cy);inner.setAttribute('rx',geometry.innerRx);inner.setAttribute('ry',geometry.innerRy);
  inner.setAttribute('fill','none');inner.setAttribute('stroke','#9aab9b');inner.setAttribute('stroke-width','1.15');inner.setAttribute('stroke-opacity','.62');
  inner.setAttribute('transform',`rotate(${geometry.innerTilt} ${geometry.cx} ${geometry.cy})`);

  const outer=doc.createElementNS(ns,'ellipse');
  outer.setAttribute('cx',geometry.cx);outer.setAttribute('cy',geometry.cy);outer.setAttribute('rx',geometry.outerRx);outer.setAttribute('ry',geometry.outerRy);
  outer.setAttribute('fill','none');outer.setAttribute('stroke','#c9aa75');outer.setAttribute('stroke-width','1.15');outer.setAttribute('stroke-opacity','.58');
  outer.setAttribute('transform',`rotate(${geometry.outerTilt} ${geometry.cx} ${geometry.cy})`);

  svg.append(inner,outer);
  host.prepend(svg);

  if((doc.defaultView?.innerWidth||0)>=1181){
    const planets=collectPlanets(doc);
    setPlanetPositions(planets.inner,innerAngles,geometry.cx,geometry.cy,geometry.innerRx,geometry.innerRy,geometry.innerTilt,0);
    setPlanetPositions(planets.outer,outerAngles,geometry.cx,geometry.cy,geometry.outerRx,geometry.outerRy,geometry.outerTilt,0);
    startOrbitAnimation(doc,planets,geometry);
  }
}

function reloadFrame(){stopOrbitAnimation();frame.src='../?lab=orbits-20260903-8&t='+Date.now();}
function setMode(next){
  mode=next;
  modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  status.textContent=mode==='base'?'Оригинал без изменений':'Черновик: внутренняя 42 сек · внешняя 76 сек';
  reloadFrame();
}
frame.addEventListener('load',()=>{if(mode==='draft')requestAnimationFrame(()=>requestAnimationFrame(drawOrbits));});
modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
widthButtons.forEach(b=>b.addEventListener('click',()=>{
  widthButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  shell.style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';
  if(mode==='draft')setTimeout(drawOrbits,220);
}));
document.getElementById('reload').addEventListener('click',reloadFrame);
</script>
</body>
</html>
