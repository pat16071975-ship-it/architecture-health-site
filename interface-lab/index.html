<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}.frame-shell{height:calc(100vh - 90px);width:min(100%,1440px);min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновики здесь не меняют главную страницу</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn active" data-width="1440" type="button">ПК</button>
    <button class="btn" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: Montserrat</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';

function clearDraft(doc){
  doc.getElementById('az-lab-draft-style')?.remove();
  doc.querySelectorAll('[data-az-lab-draft]').forEach(el=>el.remove());
}
function getTextWidth(el){
  const range=el.ownerDocument.createRange();
  range.selectNodeContents(el);
  return range.getBoundingClientRect().width;
}
function applyDraft(){
  const doc=frame.contentDocument;
  if(!doc)return;
  clearDraft(doc);
  if(mode!=='draft'){
    status.textContent='Оригинал сайта';
    return;
  }
  const h1=doc.querySelector('.center h1') || [...doc.querySelectorAll('h1')].find(el=>el.textContent.trim()==='Архитектура здоровья');
  if(!h1){status.textContent='Не найден заголовок';return;}
  const style=doc.createElement('style');
  style.id='az-lab-draft-style';
  style.textContent=`
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

    html,body,
    button,input,select,textarea,
    .caption,.clinic-contact,.clinic-phone,.clinic-hours,
    .promo-badge,.promo-copy,.promo-cta,
    .specialists-badge,.side-menu-badge,
    .direction,.relation-panel,.relation-title,.relation-item,
    .attention-eyebrow,.attention-title,.attention-related-label,
    .attention-direction,.attention-counter,.attention-arrow,
    .attention-message-sub,.attention-note,
    .faq-section,.faq-section *,
    details,summary{
      font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif !important;
    }

    .center h1{
      margin-top:7px !important;
      font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif !important;
      font-size:68px !important;
      font-weight:500 !important;
      line-height:1.08 !important;
      letter-spacing:-.035em !important;
    }
    .positioning{display:none !important;}
    .az-system-clinic-label{
      display:block;
      margin:0 auto 4px;
      text-align:right;
      font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif;
      font-size:14px;
      font-weight:600;
      line-height:1.45;
      letter-spacing:.11em;
      text-transform:uppercase;
      color:#526158;
      white-space:nowrap;
    }
    .promo-copy{
      font-size:18px !important;
      font-weight:600 !important;
      line-height:1.5 !important;
      letter-spacing:-.01em !important;
    }
    .promo-cta,.direction,.relation-title,.relation-item,
    .attention-eyebrow,.attention-related-label,.attention-direction,
    .attention-counter,.faq-section summary,details summary{
      font-weight:500 !important;
      line-height:1.45 !important;
    }
    .specialists-badge,.side-menu-badge{
      font-size:15px !important;
      font-weight:600 !important;
      line-height:1.35 !important;
      letter-spacing:.005em !important;
    }
    .direction{
      font-size:12px !important;
      font-weight:600 !important;
      line-height:1.35 !important;
    }
    .attention-title{
      font-size:38px !important;
      font-weight:500 !important;
      line-height:1.25 !important;
      letter-spacing:-.025em !important;
    }

    /* Cormorant остаётся только редким эмоциональным акцентом */
    .attention-question{
      font-family:'Cormorant Garamond',Georgia,serif !important;
    }
    .attention-message-main{
      font-family:'Cormorant Garamond',Georgia,serif !important;
      font-weight:500 !important;
    }

    @media(max-width:720px){
      .center h1{font-size:30px !important;line-height:1.12 !important;letter-spacing:-.025em !important}
      .az-system-clinic-label{font-size:8px;line-height:1.4;letter-spacing:.075em;margin-bottom:2px}
      .promo-copy{font-size:13px !important;line-height:1.45 !important}
      .specialists-badge,.side-menu-badge{font-size:11px !important}
      .direction{font-size:9.5px !important;line-height:1.3 !important}
      .attention-title{font-size:27px !important;line-height:1.3 !important}
    }
  `;
  doc.head.appendChild(style);
  const label=doc.createElement('div');
  label.className='az-system-clinic-label';
  label.setAttribute('data-az-lab-draft','');
  label.textContent='Медицинская клиника системного подхода';
  h1.before(label);
  requestAnimationFrame(()=>{
    const titleWidth=getTextWidth(h1);
    label.style.width=Math.ceil(titleWidth)+'px';
  });
  status.textContent='Черновик: Montserrat + редкий Cormorant';
}
frame.addEventListener('load',applyDraft);
modeButtons.forEach(btn=>btn.addEventListener('click',()=>{
  mode=btn.dataset.mode;
  modeButtons.forEach(x=>x.classList.toggle('active',x===btn));
  applyDraft();
}));
widthButtons.forEach(btn=>btn.addEventListener('click',()=>{
  const w=btn.dataset.width;
  shell.style.width=w==='100%'?'100%':w+'px';
  widthButtons.forEach(x=>x.classList.toggle('active',x===btn));
  setTimeout(applyDraft,250);
}));
document.getElementById('reload').addEventListener('click',()=>frame.contentWindow.location.reload());
</script>
</body>
</html>
