<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8;--green:#44634f;--gold:#b59662}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}.frame-shell{height:calc(100vh - 90px);width:min(100%,1440px);min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
  <header class="toolbar">
    <div class="brand">АЗ Interface Lab</div>
    <div class="note">Черновики здесь не меняют главную страницу</div>
    <div class="group" aria-label="Режим просмотра">
      <button class="btn" data-mode="base" type="button">Оригинал</button>
      <button class="btn active" data-mode="draft" type="button">Черновик</button>
    </div>
    <div class="group" aria-label="Размер экрана">
      <button class="btn active" data-width="1440" type="button">ПК</button>
      <button class="btn" data-width="900" type="button">Планшет</button>
      <button class="btn" data-width="390" type="button">Телефон</button>
      <button class="btn" data-width="100%" type="button">По ширине</button>
    </div>
    <button class="btn" id="reload" type="button">Обновить</button>
    <div class="status" id="status">Черновик: мягкая повязка</div>
  </header>
  <main class="workspace">
    <div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../" title="Предпросмотр Архитектуры здоровья"></iframe></div>
  </main>
</div>
<script>
/*
  АЗ INTERFACE LAB
  Главное правило: index.html не редактируется во время визуального подбора.
  Следующий эксперимент добавляется только в DRAFT_CSS и DRAFT_HTML ниже.
  После утверждения пользователем выбранный вариант переносится в настоящий index.html отдельным commit.
*/
const DRAFT_CSS = `
.az-loincloth-draft{
  position:absolute;
  left:50%;
  top:56.3%;
  width:24.5%;
  height:auto;
  transform:translate(-50%,-50%) rotate(-1.2deg);
  transform-origin:50% 45%;
  z-index:6;
  pointer-events:none;
  overflow:visible;
  filter:drop-shadow(0 1px .55px rgba(92,71,45,.10));
}
.az-loincloth-draft .cloth-under{
  fill:#eadfce;
  stroke:#eadfce;
  stroke-width:6;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.az-loincloth-draft .cloth-base{
  fill:#e2d3bd;
  stroke:#8f7454;
  stroke-width:1.55;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.az-loincloth-draft .cloth-over{
  fill:#d8c5a8;
  stroke:#8c6e4d;
  stroke-width:1.25;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.az-loincloth-draft .cloth-light{
  fill:#e9ddca;
  stroke:#a08562;
  stroke-width:.9;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.az-loincloth-draft .cloth-fold{
  fill:none;
  stroke:#927453;
  stroke-width:1.15;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.92;
}
.az-loincloth-draft .cloth-soft{
  fill:none;
  stroke:#b39975;
  stroke-width:.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.78;
}
.az-loincloth-draft .cloth-knot{
  fill:#d1bea0;
  stroke:#876949;
  stroke-width:1.2;
}
`;
const DRAFT_HTML = `
<svg class="az-loincloth-draft" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
  <!-- полностью непрозрачная подложка под всей тканью -->
  <path class="cloth-under" d="M30 45 C53 34 78 34 102 39 C125 44 147 43 169 37 C188 32 207 34 214 43 C207 52 197 59 186 65 C171 73 157 82 145 94 C136 102 129 110 123 120 C112 112 103 101 96 88 C91 104 88 119 89 133 C76 126 67 115 62 101 C56 84 47 72 36 63 C31 58 29 51 30 45 Z"/>

  <!-- мягкий пояс вокруг бёдер -->
  <path class="cloth-base" d="M30 45 C52 35 78 35 101 40 C124 45 146 44 168 38 C187 33 205 35 214 43 C205 48 194 52 181 55 C158 61 139 64 119 64 C93 64 69 59 49 54 C41 52 34 49 30 45 Z"/>

  <!-- основная драпировка, без острых геометрических панелей -->
  <path class="cloth-base" d="M39 53 C61 58 83 68 101 79 C118 89 132 97 146 100 C158 90 171 80 186 70 C195 64 203 56 210 47 C205 64 196 79 184 91 C172 103 159 112 144 118 C131 112 119 102 109 90 C102 102 97 116 95 132 C84 125 75 115 70 102 C64 85 55 72 43 62 C40 59 38 56 39 53 Z"/>

  <!-- верхний светлый слой ткани -->
  <path class="cloth-light" d="M39 49 C61 42 82 43 103 47 C123 51 144 51 165 45 C180 41 195 41 206 45 C194 50 180 54 164 57 C145 61 126 61 108 59 C84 58 61 54 39 49 Z"/>

  <!-- диагональный запах -->
  <path class="cloth-over" d="M54 56 C77 62 99 72 119 84 C135 94 149 99 163 100 C154 109 144 116 134 120 C122 112 112 102 105 91 C99 101 95 113 94 126 C87 119 81 111 77 101 C72 83 64 68 54 56 Z"/>

  <!-- небольшой естественный свисающий край -->
  <path class="cloth-light" d="M104 88 C112 99 120 108 131 116 C123 122 116 127 108 130 C104 118 102 104 104 88 Z"/>

  <!-- боковые мягкие узлы -->
  <ellipse class="cloth-knot" cx="34" cy="46" rx="7.2" ry="5.2"/>
  <ellipse class="cloth-knot" cx="207" cy="44" rx="7.2" ry="5.2"/>

  <!-- складки следуют движению ткани -->
  <path class="cloth-fold" d="M47 56 C70 63 91 73 108 84 C123 94 136 100 149 103"/>
  <path class="cloth-fold" d="M65 54 C84 60 104 69 122 80 C137 89 151 94 165 95"/>
  <path class="cloth-fold" d="M90 53 C107 58 124 65 140 75 C153 83 165 87 177 87"/>
  <path class="cloth-fold" d="M108 87 C103 99 100 113 100 127"/>
  <path class="cloth-soft" d="M58 65 C72 72 84 82 91 94"/>
  <path class="cloth-soft" d="M82 63 C96 70 109 79 120 90"/>
  <path class="cloth-soft" d="M126 62 C140 69 153 77 164 86"/>
  <path class="cloth-soft" d="M151 57 C165 63 178 69 189 76"/>
</svg>`;

const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';

function clearDraft(doc){
  doc.getElementById('az-lab-draft-style')?.remove();
  doc.querySelectorAll('[data-az-lab-draft]').forEach(el=>el.remove());
}
function applyDraft(){
  const doc=frame.contentDocument;
  if(!doc)return;
  clearDraft(doc);
  if(mode!=='draft'){
    status.textContent='Оригинал сайта';
    return;
  }
  if(!DRAFT_CSS.trim()&&!DRAFT_HTML.trim()){
    status.textContent='Черновик пока не загружен';
    return;
  }
  if(DRAFT_CSS.trim()){
    const style=doc.createElement('style');
    style.id='az-lab-draft-style';
    style.textContent=DRAFT_CSS;
    doc.head.appendChild(style);
  }
  const stage=doc.querySelector('.stage');
  if(stage&&DRAFT_HTML.trim()){
    const holder=doc.createElement('div');
    holder.setAttribute('data-az-lab-draft','');
    holder.style.display='contents';
    holder.innerHTML=DRAFT_HTML;
    stage.appendChild(holder);
  }
  status.textContent='Черновик: мягкая повязка';
}
frame.addEventListener('load',applyDraft);
modeButtons.forEach(btn=>btn.addEventListener('click',()=>{
  mode=btn.dataset.mode;
  modeButtons.forEach(x=>x.classList.toggle('active',x===btn));
  applyDraft();
}));
widthButtons.forEach(btn=>btn.addEventListener('click',()=>{
  const w=btn.dataset.width;
  shell.style.width=w==='100%'?'100%':w+'px';
  widthButtons.forEach(x=>x.classList.toggle('active',x===btn));
}));
document.getElementById('reload').addEventListener('click',()=>frame.contentWindow.location.reload());
</script>
</body>
</html>
