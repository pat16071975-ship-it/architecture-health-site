<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗ Interface Lab</title>
<style>
:root{--bg:#e8e4dc;--panel:#fbf8f2;--ink:#30372f;--line:#c9bda8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.lab{height:100%;display:grid;grid-template-rows:auto 1fr}
.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:9px;min-height:58px;padding:8px 12px;background:rgba(251,248,242,.98);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(58,49,37,.08);flex-wrap:wrap}
.brand{font:700 15px/1.1 Georgia,serif;margin-right:6px}.note{font-size:11px;color:#657066;margin-right:auto}.group{display:flex;gap:5px;align-items:center}
.btn{appearance:none;border:1px solid #c6b99f;background:#fffdf9;color:#394139;border-radius:8px;padding:7px 10px;font:600 11px/1 Inter,Segoe UI,Arial,sans-serif;cursor:pointer}
.btn:hover,.btn:focus-visible{outline:0;border-color:#7f947f}.btn.active{background:#e8efe9;border-color:#6d876f;color:#294231}
.status{padding:7px 10px;border-radius:8px;border:1px solid rgba(181,150,98,.45);background:#f5efe4;font-size:11px;white-space:nowrap}
.workspace{min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.frame-shell{height:calc(100vh - 90px);width:1440px;max-width:100%;min-width:300px;background:white;border:1px solid #bcb4a7;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(58,49,37,.14);transition:width .2s ease}
.frame{display:block;width:100%;height:100%;border:0;background:white}
@media(max-width:700px){.toolbar{gap:6px;padding:7px}.brand{width:100%}.note{display:none}.btn{padding:7px 8px;font-size:10px}.workspace{padding:8px}.frame-shell{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="lab">
<header class="toolbar">
  <div class="brand">АЗ Interface Lab</div>
  <div class="note">Черновик меняет только просмотрщик; основной сайт не изменяется</div>
  <div class="group">
    <button class="btn" data-mode="base" type="button">Оригинал</button>
    <button class="btn active" data-mode="draft" type="button">Черновик</button>
  </div>
  <div class="group">
    <button class="btn active" data-width="1440" type="button">ПК</button>
    <button class="btn" data-width="900" type="button">Планшет</button>
    <button class="btn" data-width="390" type="button">Телефон</button>
    <button class="btn" data-width="100%" type="button">По ширине</button>
  </div>
  <button class="btn" id="reload" type="button">Обновить</button>
  <div class="status" id="status">Черновик: эллипсы + Витрувианский 420 px</div>
</header>
<main class="workspace"><div class="frame-shell" id="shell"><iframe class="frame" id="frame" src="../?lab=orbits-20260903-2" title="Предпросмотр Архитектуры здоровья"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('frame');
const shell=document.getElementById('shell');
const status=document.getElementById('status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
const widthButtons=[...document.querySelectorAll('[data-width]')];
let mode='draft';

function drawOrbits(){
  if(mode!=='draft')return;
  const doc=frame.contentDocument;
  if(!doc)return;
  doc.getElementById('az-lab-orbits')?.remove();
  doc.getElementById('az-lab-orbit-style')?.remove();
  doc.querySelectorAll('.az-lab-orbit-host').forEach(el=>el.classList.remove('az-lab-orbit-host'));

  const stage=doc.querySelector('.stage');
  if(!stage)return;
  const host=doc.querySelector('.map')||stage.parentElement;
  if(!host)return;

  /* Сначала меряем оригинал: линии орбит остаются прежнего размера. */
  const hostRect=host.getBoundingClientRect();
  const originalStageRect=stage.getBoundingClientRect();
  const cx=originalStageRect.left-hostRect.left+originalStageRect.width/2;
  const cy=originalStageRect.top-hostRect.top+originalStageRect.height/2;
  const innerRx=originalStageRect.width*.70;
  const innerRy=originalStageRect.height*.56;
  const outerRx=originalStageRect.width*.88;
  const outerRy=originalStageRect.height*.69;
  const tilt=9;

  host.classList.add('az-lab-orbit-host');
  const style=doc.createElement('style');
  style.id='az-lab-orbit-style';
  style.textContent=`
    .az-lab-orbit-host{position:relative!important}
    .az-lab-orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
    @media (min-width:1181px){
      .az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}
    }
    @media (min-width:721px) and (max-width:1180px){
      .az-lab-orbit-host .stage{transform:scale(.568965517)!important;transform-origin:center center!important}
    }
  `;
  doc.head.appendChild(style);

  const ns='http://www.w3.org/2000/svg';
  const svg=doc.createElementNS(ns,'svg');
  svg.id='az-lab-orbits';
  svg.setAttribute('class','az-lab-orbit-svg');
  svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);
  svg.setAttribute('preserveAspectRatio','none');

  const inner=doc.createElementNS(ns,'ellipse');
  inner.setAttribute('cx',cx);inner.setAttribute('cy',cy);inner.setAttribute('rx',innerRx);inner.setAttribute('ry',innerRy);
  inner.setAttribute('fill','none');inner.setAttribute('stroke','#9aab9b');inner.setAttribute('stroke-width','1.15');inner.setAttribute('stroke-opacity','.62');
  inner.setAttribute('transform',`rotate(${tilt} ${cx} ${cy})`);

  const outer=doc.createElementNS(ns,'ellipse');
  outer.setAttribute('cx',cx);outer.setAttribute('cy',cy);outer.setAttribute('rx',outerRx);outer.setAttribute('ry',outerRy);
  outer.setAttribute('fill','none');outer.setAttribute('stroke','#c9aa75');outer.setAttribute('stroke-width','1.15');outer.setAttribute('stroke-opacity','.58');
  outer.setAttribute('transform',`rotate(${tilt} ${cx} ${cy})`);

  svg.append(inner,outer);
  host.prepend(svg);
}

function reloadFrame(){frame.src='../?lab=orbits-20260903-2&t='+Date.now();}
function setMode(next){
  mode=next;
  modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  status.textContent=mode==='base'?'Оригинал без изменений':'Черновик: эллипсы + Витрувианский 420/330 px';
  reloadFrame();
}
frame.addEventListener('load',()=>{if(mode==='draft')requestAnimationFrame(()=>requestAnimationFrame(drawOrbits));});
modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
widthButtons.forEach(b=>b.addEventListener('click',()=>{
  widthButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  shell.style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';
  if(mode==='draft')setTimeout(drawOrbits,220);
}));
document.getElementById('reload').addEventListener('click',reloadFrame);
</script>
</body>
</html>
