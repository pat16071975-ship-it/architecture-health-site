циенту&lt;/a&gt;&lt;a href=&quot;https://azmednsk.ru/lab&quot;&gt;Лаборатория&lt;/a&gt;&lt;/nav&gt;&lt;div class=&quot;header-contacts&quot;&gt;&lt;a href=&quot;tel:+73832842421&quot;&gt;+7 (383) 284-24-21&lt;/a&gt;&lt;span&gt;Пн-Пт — 08:00—21:00,&lt;br&gt;Сб-Вс — 09:00—21:00&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;button header-book&quot; href=&quot;#booking&quot;&gt;Записаться на приём&lt;/a&gt;&lt;/header&gt;&lt;main&gt;&lt;section class=&quot;container content-section editorial-section&quot;&gt;&lt;h1&gt;Зуботехническая лаборатория Dental Lab&lt;/h1&gt;&lt;p class=&quot;prose&quot;&gt;Dental Lab — зуботехническая лаборатория «Архитектуры здоровья» в Новосибирске. Мы изготавливаем функциональные ортодонтические аппараты и взаимодействуем с врачами на этапах моделирования, изготовления и проверки готовой конструкции.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt; &lt;strong&gt;Лаборатория Dental Lab (&quot;Архитектура здоровья Lab&quot;)&lt;/strong&gt; &lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;
Зуботехническая лаборатория полного цикла, оснащена современным высокоточным оборудованием, что позволяет нам полностью контролировать качество на всех этапах — от моделировки и печати 3D моделей сканов пациента до финишной полировки готового аппарата
&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Наша ключевая специализация — изготовление функциональных ортодонтических аппаратов по международным концепциям, таким как: JFO (Jaw Functional Orthopedics), HBTC-RFA (Human Body Total Care — Regulator Function Aragão). Мы изготавливаем аппараты PiPS (Pista Planas Simple), PiPC (Pista Planas Composta), Pipe, все аппараты группы SN (Wilma Simões Network, 1-24), RFA, Bimler, Bracco и Cervera. Также лаборатория занимается производством Элайнеров (как сопровождение после окончания функционального лечения).&lt;br&gt;&lt;br&gt;Мы работаем с вниманием к деталям, строго в соответствии с международными протоколами и оригинальными авторскими методиками, соблюдая заданные конструктивные особенности и нюансы. &lt;br&gt;&lt;br&gt;Каждый аппарат перед отправкой врачу проходит проверку на соответствие клиническим задачам, и, что на наш взгляд немаловажно - оценивается итоговый комфорт пациента при ношении - проводим оценку готовой работы  начиная с внешнего вида, до удобства снятия, активации, отсутствия неаккуратных краев и других, казалось бы, мелких и даже на первый взгляд незаметных - но очень важных мелочей. Наш девиз - &quot;Сделай так, как сделал бы своим родным и близким&quot;.&lt;br&gt;&lt;br&gt;Мы открыты к новому сотрудничеству и расширению географии работы докторов с нами! На данный момент наши конструкции отправляются и используются в следующих городах: Махачкала, Санкт-Петербург, Москва, Самара, Череповец, Воронеж, Новосибирск. Мы выстраиваем удобное взаимодействие на всех этапах - от обсуждения заказ-наряда до отправки готовой работы. &lt;br&gt;&lt;br&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;az-lab-gallery&quot; class=&quot;container content-section&quot; aria-labelledby=&quot;az-lab-gallery-title&quot;&gt;&lt;h2 id=&quot;az-lab-gallery-title&quot;&gt;Аппараты, которые изготавливает лаборатория&lt;/h2&gt;&lt;ul class=&quot;az-lab-models&quot;&gt;&lt;li&gt;PiPS&lt;/li&gt;&lt;li&gt;PiPC&lt;/li&gt;&lt;li&gt;SN-1&lt;/li&gt;&lt;li&gt;SN-2&lt;/li&gt;&lt;li&gt;SN-3&lt;/li&gt;&lt;li&gt;SN-6&lt;/li&gt;&lt;li&gt;SN-7&lt;/li&gt;&lt;li&gt;SN-20&lt;/li&gt;&lt;li&gt;SN-24&lt;/li&gt;&lt;li&gt;RFA-2&lt;/li&gt;&lt;li&gt;RFA-3&lt;/li&gt;&lt;li&gt;RFA-4&lt;/li&gt;&lt;li&gt;Bimler A&lt;/li&gt;&lt;li&gt;PiPE&lt;/li&gt;&lt;li&gt;Bracco&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;az-lab-gallery-hint&quot;&gt;Нажмите на изображение, чтобы рассмотреть аппарат в полном размере.&lt;/p&gt;&lt;div class=&quot;az-lab-images&quot;&gt;&lt;figure&gt;&lt;a href=&quot;https://azmednsk.ru/assets/627a6678da217a070668.png&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-label=&quot;Открыть изображение аппарата 1 в полном размере&quot;&gt;&lt;img src=&quot;https://azmednsk.ru/assets/627a6678da217a070668.png&quot; alt=&quot;Пример аппарата лаборатории Dental Lab — 1&quot; loading=&quot;lazy&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;figure&gt;&lt;a href=&quot;https://azmednsk.ru/assets/884ae21117bb3fae3c12.png&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-label=&quot;Открыть изображение аппарата 2 в полном размере&quot;&gt;&lt;img src=&quot;https://azmednsk.ru/assets/884ae21117bb3fae3c12.png&quot; alt=&quot;Пример аппарата лаборатории Dental Lab — 2&quot; loading=&quot;lazy&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;figure&gt;&lt;a href=&quot;https://azmednsk.ru/assets/8a49e9c79c7db36e1c55.png&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-label=&quot;Открыть изображение аппарата 3 в полном размере&quot;&gt;&lt;img src=&quot;https://azmednsk.ru/assets/8a49e9c79c7db36e1c55.png&quot; alt=&quot;Пример аппарата лаборатории Dental Lab — 3&quot; loading=&quot;lazy&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;figure&gt;&lt;a href=&quot;https://azmednsk.ru/assets/92986ac92e972699807a.png&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-label=&quot;Открыть изображение аппарата 4 в полном размере&quot;&gt;&lt;i
