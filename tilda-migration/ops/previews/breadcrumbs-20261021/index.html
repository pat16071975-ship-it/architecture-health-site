<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка цепочек навигации</title><style>body{font:16px sans-serif}iframe{display:block;height:780px;border:1px solid #999}label{margin-right:20px}</style><h1>Проверка цепочек навигации</h1><label>Версия <select id="state"><option value="before">До</option><option value="after" selected>После</option></select></label><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>640</option><option>1366</option></select></label><label>Страница <select id="page"><option value="0">uslugi/lechenie-zubov/karies/index.html</option><option value="1">team/besedina-maria/index.html</option><option value="2">lab/index.html</option><option value="3">uslugi/khirurgiya/implantaciya/index.html</option><option value="4">uslugi/prosthetics/koronki/keramicheskie/index.html</option></select></label><p>Тестовая копия. Переходы по ссылкам ведут на действующий сайт.</p><iframe id="frame" title="Тестовая страница"></iframe><script>const frame=document.querySelector('#frame');function update(){frame.style.width=document.querySelector('#width').value+'px';frame.src=document.querySelector('#state').value+'-'+document.querySelector('#page').value+'.html'}document.querySelectorAll('select').forEach(x=>x.onchange=update);update()</script></html>
