or-list&quot;&gt;&lt;article class=&quot;az-service-doctor&quot; aria-labelledby=&quot;az-doctor-lubaeva-alena-name&quot;&gt;&lt;div class=&quot;az-doctor-summary&quot;&gt;&lt;h3 id=&quot;az-doctor-lubaeva-alena-name&quot; class=&quot;az-doctor-name&quot;&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/lubaeva-alena/&quot;&gt;Любаева Алена Юрьевна&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;Врач-терапевт превентивной и антивозрастной медицины, врач-гастроэнтеролог&lt;/p&gt;&lt;p class=&quot;az-doctor-scope&quot;&gt;Консультация терапевта и индивидуальные рекомендации.&lt;/p&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/lubaeva-alena/&quot;&gt;Образование и опыт специалиста&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;az-doctor-booking&quot;&gt;&lt;p class=&quot;az-doctor-price&quot;&gt;Первичный приём терапевта&lt;strong&gt;4 500 ₽&lt;/strong&gt;&lt;/p&gt;&lt;a class=&quot;button&quot; href=&quot;https://booking.medflex.ru/?user=e0c452bf7c5bc897e8b8c0782bcb16cb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-describedby=&quot;az-doctor-lubaeva-alena-hint&quot;&gt;Записаться на приём&lt;/a&gt;&lt;p id=&quot;az-doctor-lubaeva-alena-hint&quot; class=&quot;az-booking-hint&quot;&gt;Откроется список Medflex. Выберите специалиста: Любаева Алена Юрьевна. Если нет доступной записи, позвоните &lt;a class=&quot;az-doctor-profile&quot; href=&quot;tel:+73832842421&quot;&gt;+7 (383) 284-24-21&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;az-service-doctor&quot; aria-labelledby=&quot;az-doctor-pavlova-anna-name&quot;&gt;&lt;div class=&quot;az-doctor-summary&quot;&gt;&lt;h3 id=&quot;az-doctor-pavlova-anna-name&quot; class=&quot;az-doctor-name&quot;&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/pavlova-anna/&quot;&gt;Павлова Алла Викторовна&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;Научный консультант по метаболизму, немедицинский специалист&lt;/p&gt;&lt;p class=&quot;az-doctor-scope&quot;&gt;Анализ питания, биохимических и генетических исследований; рекомендации по питанию и образу жизни.&lt;/p&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/pavlova-anna/&quot;&gt;Образование и опыт специалиста&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;az-doctor-booking&quot;&gt;&lt;p class=&quot;az-doctor-price&quot;&gt;Первичная консультация, 1,5 часа&lt;strong&gt;25 000 ₽&lt;/strong&gt;&lt;/p&gt;&lt;a class=&quot;button&quot; href=&quot;https://booking.medflex.ru/?user=e0c452bf7c5bc897e8b8c0782bcb16cb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-describedby=&quot;az-doctor-pavlova-anna-hint&quot;&gt;Записаться на приём&lt;/a&gt;&lt;p id=&quot;az-doctor-pavlova-anna-hint&quot; class=&quot;az-booking-hint&quot;&gt;Откроется список Medflex. Выберите специалиста: Павлова Алла Викторовна. Если нет доступной записи, позвоните &lt;a class=&quot;az-doctor-profile&quot; href=&quot;tel:+73832842421&quot;&gt;+7 (383) 284-24-21&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;nav class=&quot;container content-section az-service-links&quot; aria-label=&quot;Подробнее об услугах&quot;&gt;&lt;h2&gt;Подробнее об услугах&lt;/h2&gt;&lt;div class=&quot;link-list prose&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/uslugi/iggt-terapiya/&quot; style=&quot;text-decoration:underline&quot;&gt;ИГГТ — интервальная гипокси-гиперокси терапия&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;ul&gt;&lt;li&gt;Комплексная диагностика: сбор подробного анамнеза, определение биологического возраста, анализ образа жизни, привычек, генетических и метаболических особенностей.&lt;/li&gt;&lt;li&gt;Лабораторные и инструментальные исследования: оценка гормонального баланса, дефицитов витаминов и микроэлементов, работы внутренних органов.&lt;/li&gt;&lt;li&gt;Индивидуальная программа: подбор медицинских препаратов, нутрицевтиков, инфузионной терапии, рекомендаций по питанию, физической активности и образу жизни.&lt;/li&gt;&lt;li&gt;Регулярное сопровождение: контроль динамики, коррекция программы, поддержка на пути к здоровью.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;ul&gt;&lt;li&gt;Всем, кто хочет сохранить молодость, энергию и высокое качество жизни.&lt;/li&gt;&lt;li&gt;При хронической усталости, снижении работоспособности, стрессах.&lt;/li&gt;&lt;li&gt;Для профилактики возрастных и хронических заболеваний.&lt;/li&gt;&lt;li&gt;При нарушении сна, памяти, концентрации.&lt;/li&gt;&lt;li&gt;Для восстановления гормонального баланса и улучшения внешнего вида.&lt;/li&gt;&lt;li&gt;Для повышения устойчивости к нагрузкам и укрепления иммунитета.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;ul&gt;&lt;li&gt;Наследственная предрасположенность: Если в семье есть случаи сердечно-сосудистых, онкологических, аутоиммунных заболеваний или диабета.&lt;/li&gt;&lt;li&gt;Хроническая усталость и стресс: Постоянное чувство усталости, апатия, эмоциональное выгорание, проблемы со сном и концентрацией.&lt;/li&gt;&lt;li&gt;Избыточный вес или ожирение: Проблемы с весом, которые не удается решить традиционными методами.&lt;/li&gt;&lt;li&gt;Неправильный образ жизни: Несбалансированное питание, недостаток физической активности, вредные привычки (курение, злоупотребление алкоголем).&lt;/li&gt;&lt;li&gt;Хронические и аутоиммунные заболевания: Хронические проблемы с ЖКТ, кожей, аллергией, а также аутоиммунные состояния, такие как ревматоидный артрит или тиреоидит, частые воспалительные заболевания.&lt;/li&gt;&lt;li&gt;Забота о здоровье: Подойдет для любого человека, который хочет поддержать свое здоровье, продлить молодость и замедлить процессы старения, независимо от возраста.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;ul&gt;&lt;li&gt;Замедление процессов старения на клеточном уровне.&lt;/li&gt;&lt;li&gt;Повышение жизненного тонуса, энергии и работоспособности.&lt;/li&gt;&lt;li&gt;Улучшение памяти, концентрации, эмоционального состояния.&lt;/li&gt;&lt;li&gt;Коррекция гормонального фона и метаболизма.&lt;/li&gt;&lt;li&gt;Снижение рисков развития хронических заболеваний.&lt;/li&gt;&lt;li&gt;Улучшение внешнего вида, состояния кожи, волос.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;layout-2489767221&quot; class=&quot;canvas&quot; aria-label=&quot;rec2489767221&quot;&gt;&lt;div id=&quot;visual-2489767221-1648032592791&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/o_nas&quot; style=&quot;color:inherit&quot;&gt;О клинике&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032793759&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/rassrochka&quot; style=&quot;color:inherit&quot;&gt;Рассрочка&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032794951&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/otziv&quot; style=&quot;color:inherit&quot;&gt;Отзывы&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032612904&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/uslygi/&quot; style=&quot;color:inherit&quot;&gt;Направления&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032796764&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;Стоматология&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032798215&quot; class=&quot;visual visual-
