&lt;section class=&quot;container az-home-reviews&quot;&gt;&lt;div class=&quot;az-reviews-heading&quot;&gt;&lt;h2&gt;Отзывы пациентов&lt;/h2&gt;&lt;a href=&quot;/otziv&quot;&gt;Смотреть все отзывы&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;az-reviews-grid&quot;&gt;&lt;article class=&quot;az-review-card&quot;&gt;&lt;h3&gt;&lt;a href=&quot;http://flamp.ru/user5823971?utm_source=widget&amp;amp;utm_medium=open_profile&amp;amp;utm_campaign=responsive_widget&amp;amp;utm_content=flamp4&quot; style=&quot;color:rgb(32, 128, 196)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Марина Абрамова&lt;/a&gt;&lt;/h3&gt;&lt;div class=&quot;az-review-date&quot;&gt;23.07.2026&lt;/div&gt;&lt;div class=&quot;az-review-text&quot;&gt;Отличная клиника! Пришла сюда по рекомендации и осталась в восторге с подхода к людям. На ресепшн девушки встречают и все показывают. Единственный минус документов много🫠 Доктора профессионалы своего дела однозначно! Все подробно рассказали, отправили к другим специалистам (по необходимости). Смотрят не конкретно на что-то одно, а все и сразу.&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;az-review-card&quot;&gt;&lt;h3&gt;Sergey&lt;/h3&gt;&lt;div class=&quot;az-review-date&quot;&gt;23.08.2025&lt;/div&gt;&lt;div class=&quot;az-review-text&quot;&gt;Хочется порекомендовать мануального терапевта Старостенко Вадима Анатольевича и поблагодарить за профессионализм, после нескольких процедур «протяжки» мышц такое чувство, что тело помолодело на несколько лет.&lt;br&gt;Отдельно хочется отметить вежливость, внимательность и ненавязчивость администраторов клиники.&lt;br&gt;Спасибо за Вашу работу.&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;az-review-card&quot;&gt;&lt;h3&gt;flippownzs&lt;/h3&gt;&lt;div class=&quot;az-review-date&quot;&gt;05.08.2026&lt;/div&gt;&lt;div class=&quot;az-review-text&quot;&gt;Хорошая клиника, прекрасные доктора, вежливые администраторы. При входе в клинику чувствуешь как много внимания уделено интерьеру и комфортному прибыванию в клинике. Очень нравится работа администраторов, был на приемах в разные смены администраторов, застал двух администраторов за все время, Юлия и Азалия, прекрасные девочки, предложат чай кофе&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;layout-2493975791&quot; class=&quot;canvas&quot; aria-label=&quot;rec2493975791&quot;&gt;&lt;div id=&quot;visual-2493975791-1784772628084000001&quot; class=&quot;visual visual-shape&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2493975791-1784772637762000002&quot; class=&quot;visual visual-shape&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2493975791-1784772719665000003&quot; class=&quot;visual visual-html&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;iframe src=&quot;https://yandex.ru/map-widget/v1/?um=constructor%3Aed0ece0799127221abd30fe526c5d1a4d74f139d62f8ec3e46bd7379a125c339&amp;amp;source=constructor&amp;amp;lang=ru_RU&amp;amp;scroll=true&quot; title=&quot;Карта проезда&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2493975791-1784773035902000001&quot; class=&quot;visual visual-form&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;div class=&quot;booking-card&quot;&gt;&lt;h3&gt;Запишитесь на консультацию&lt;/h3&gt;&lt;p&gt;Выберите удобное время онлайн или позвоните в клинику.&lt;/p&gt;&lt;a class=&quot;button&quot; href=&quot;https://booking.medflex.ru/?user=e0c452bf7c5bc897e8b8c0782bcb16cb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Записаться на приём&lt;/a&gt;&lt;a class=&quot;phone&quot; href=&quot;tel:+73832842421&quot;&gt;+7 (383) 284-24-21&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2493975791-1784773654874000001&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;Запишитесь на консультацию&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2
