&lt;h2 id=&quot;az-gastro-doctor-title&quot;&gt;Врач и стоимость приёма&lt;/h2&gt;
&lt;article class=&quot;az-service-doctor&quot; aria-labelledby=&quot;az-gastro-doctor-name&quot;&gt;
&lt;div class=&quot;az-doctor-summary&quot;&gt;&lt;h3 id=&quot;az-gastro-doctor-name&quot;&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/lubaeva-alena/&quot;&gt;Любаева Алена Юрьевна&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;Врач-гастроэнтеролог, терапевт&lt;/p&gt;&lt;a class=&quot;az-doctor-profile&quot; href=&quot;https://azmednsk.ru/team/lubaeva-alena/&quot;&gt;Образование и опыт врача&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;az-doctor-booking&quot;&gt;&lt;p class=&quot;az-doctor-price&quot;&gt;Первичный приём гастроэнтеролога&lt;strong&gt;4 500 ₽&lt;/strong&gt;&lt;/p&gt;&lt;a class=&quot;button&quot; href=&quot;https://booking.medflex.ru/?user=e0c452bf7c5bc897e8b8c0782bcb16cb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; aria-describedby=&quot;az-gastro-booking-hint&quot;&gt;Записаться на приём&lt;/a&gt;&lt;p id=&quot;az-gastro-booking-hint&quot; class=&quot;az-booking-hint&quot;&gt;Откроется онлайн-запись Medflex. Выберите Любаеву Алену Юрьевну.&lt;/p&gt;&lt;/div&gt;
&lt;/article&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Комплексная оценка пищеварения&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Гастроэнтеролог занимается заболеваниями органов пищеварения. На приёме врач выясняет, когда появились жалобы, как они связаны с питанием и какие обследования уже проводились. В «Архитектуре здоровья» эти сведения используют для выбора дальнейшей диагностики и плана помощи.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Какие факторы учитывает гастроэнтеролог&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Изжога, вздутие, тяжесть после еды и изменения стула могут возникать при разных состояниях. Само описание симптома не заменяет диагноз. На консультации важно обсудить частоту жалоб, их длительность и влияние на повседневную жизнь.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Когда нужна консультация&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Дискомфорт или боли в области живота;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Вздутие;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Ощущение тяжести после еды;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Изжога;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Отрыжка;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Тошнота;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Изменения аппетита;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Нарушения стула;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Ощущение неполного или дискомфортного пищеварения;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Повторяющиеся жалобы после приёма пищи;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Подозрение на непереносимость отдельных продуктов;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Необходимость оценки состояния желудочно-кишечного тракта;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Рекомендации других специалистов.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Наличие одного или нескольких симптомов не всегда указывает на конкретное заболевание, но является поводом для консультации и более внимательной оценки состояния.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Кому может быть полезен приём&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Консультация гастроэнтеролога может быть актуальна людям, которые испытывают жалобы со стороны пищеварительной системы или хотят оценить её состояние.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;strong&gt;Тем, кого беспокоят регулярные симптомы&lt;/strong&gt;&lt;br&gt;Если дискомфорт, вздутие, нарушения стула или другие жалобы повторяются, важно не ограничиваться временным устранением симптомов, а разобраться в возможных причинах.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Тем, кто хочет скорректировать питание с учётом состояния здоровья&lt;/strong&gt;&lt;br&gt;Перед существенными изменениями рациона важно понимать индивидуальные особенности организма и состояние пищеварительной системы.&lt;br&gt;&lt;br&gt;При необходимости гастроэнтеролог может работать совместно со специалистом по клинической нутрициологии.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Тем, кто проходит комплексное обследование&lt;/strong&gt;&lt;br&gt;Состояние желудочно-кишечного тракта может учитываться при комплексной оценке организма и формировании индивидуального маршрута восстановления.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Детям&lt;/strong&gt;&lt;br&gt;В детском возрасте работа пищеварительной системы имеет большое значение для роста и развития ребёнка.&lt;br&gt;&lt;br&gt;Консультация проводится с учётом возраста, особенностей питания, развития и индивидуальной истории здоровья.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Как проходит консультация&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;
Каждый пациент приходит со своей историей, жалобами и особенностями. Поэтому мы начинаем с подробной консультации и оценки состояния.&lt;br&gt;&lt;br&gt;Специалист может учитывать:
&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Характер и длительность жалоб;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Особенности питания;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Режим дня;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Уровень физической активности;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Качество сна;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Уровень стресса;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Перенесённые заболевания;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Принимаемые препараты;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Результаты ранее проведённых исследований;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Индивидуальные особенности пациента.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;После этого формируется дальнейший диагностический и лечебный маршрут.&lt;br&gt;&lt;br&gt;Наша задача — сделать его понятным, последовательным и обоснованным.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Врач подробно изучает ваш запрос, жалобы и историю состояния.&lt;br&gt;&lt;br&gt;Важно учитывать не только то, что беспокоит пациента сейчас, но и обстоятельства появления симптомов, образ жизни, питание и другие факторы.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Специалист анализирует имеющиеся результаты исследований и при необходимости назначает дополнительную диагностику.&lt;br&gt;&lt;br&gt;Обследования подбираются индивидуально, исходя из конкретной клинической ситуации.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;На основании консультации и результатов диагностики врач оценивает возможные причины жалоб и факторы, которые могут влиять на состояние пищеварительной системы.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Для пациента составляется понятный план дальнейшей работы.&lt;br&gt;&lt;br&gt;Он может включать лечение, рекомендации по питанию и образу жизни, дополнительную диагностику и консультации других специалистов.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;При необходимости врач наблюдает пациента в динамике и оценивает изменения состояния.&lt;br&gt;&lt;br&gt;План может корректироваться с учётом результатов и индивидуальной реакции организма.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Диагностика и план лечения&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;
Работа с гастроэнтерологом может включать:
&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Первичную консультацию;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Анализ жалоб и истории состояния;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Оценку результатов ранее проведённых исследований;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Назначение необходимой диагностики;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Лечение выявленных состояний и заболеваний;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Рекомендации по питанию и образу жизни;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Наблюдение в динамике;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Взаимодействие с другими специалистами клиники.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Точный план обследования и лечения определяется врачом индивидуально.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Работа с другими специалистами&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;
Состояние желудочно-кишечного тракта может быть связано с питанием, обменом веществ, уровнем физической активности, режимом сна и другими факторами.&lt;br&gt;&lt;br&gt;Поэтому в некоторых случаях для более полной оценки состояния требуется комплексный подход.&lt;br&gt;&lt;br&gt;В зависимости от индивидуальной ситуации гастроэнтеролог может рекомендовать консультацию:
&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Специалиста по клинической нутрициологии;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Специалиста по генетике;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Специалиста превентивной медицины;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Других специалистов клиники.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Такой подход помогает учитывать не только отдельную жалобу, но и факторы, которые могут влиять на здоровье в целом.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Питание и образ жизни&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Питание играет важную роль в поддержании здоровья пищеварительной системы.&lt;br&gt;&lt;br&gt;Однако рекомендации должны учитывать индивидуальные особенности человека, его состояние, образ жизни и медицинские показания.&lt;br&gt;&lt;br&gt;Мы не предлагаем универсальные схемы и одинаковые ограничения для всех пациентов.&lt;br&gt;&lt;br&gt;Рекомендации формируются индивидуально и, при необходимости, совместно с другими специалистами клиники.&lt;br&gt;&lt;br&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Рекомендации и наблюдение&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;После консультации врач объясняет результаты оценки и рекомендует дальнейшие шаги. План может включать обследования, лечение, рекомендации по питанию и наблюдение. Необходимость повторного приёма зависит от состояния пациента и задач лечения.&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Понять индивидуальную ситуацию;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Определить необходимые исследования;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Выявить факторы, которые могут влиять на состояние;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;Сформировать последовательный план дальнейшей работы.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;div class=&quot;prose&quot;&gt;Для нас важно, чтобы пациент понимал, что происходит с его организмом и какие шаги необходимо предпринять.&lt;br&gt;&lt;br&gt;Лечим причину, а не симптомы.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;container content-section&quot;&gt;&lt;h2&gt;Запись к гастроэнтерологу&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;Если вас беспокоят регулярные жалобы со стороны пищеварительной системы или вы хотите комплексно оценить состояние желудочно-кишечного тракта, начните с консультации гастроэнтеролога.&lt;br&gt;Специалист поможет разобраться в вашей ситуации, определить необходимые дальнейшие шаги и сформировать индивидуальный маршрут.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Запишитесь на консультацию&lt;/strong&gt;&lt;br&gt;Оставьте заявку, и мы свяжемся с вами, чтобы подобрать удобное время для посещения клиники.&lt;/div&gt;&lt;div class=&quot;link-list&quot;&gt;&lt;a href=&quot;#az-gastro-doctor&quot;&gt;Записаться на консультацию&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;layout-2489767221&quot; class=&quot;canvas&quot; aria-label=&quot;rec2489767221&quot;&gt;&lt;div id=&quot;visual-2489767221-1648032592791&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/o_nas&quot; style=&quot;color:inherit&quot;&gt;О клинике&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032793759&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/rassrochka&quot; style=&quot;color:inherit&quot;&gt;Рассрочка&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032794951&quot; class=&quot;visual visual-text&quot;&gt;&lt;div class=&quot;visual-inner&quot;&gt;&lt;a href=&quot;https://azmednsk.ru/otziv&quot; style=&quot;color:inherit&quot;&gt;Отзывы&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;visual-2489767221-1648032612904&
