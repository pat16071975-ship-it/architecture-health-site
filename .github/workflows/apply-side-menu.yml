name: Apply side visual menu

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Add visual side badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_marker = ".specialists-badge:hover,.specialists-badge:focus-visible{outline:0;border-color:rgba(68,99,79,.5);background:#fbf8f2;box-shadow:0 11px 28px rgba(71,58,38,.12)}"
          css_add = css_marker + ".side-menu-badge{width:230px;padding:13px 18px;text-align:center;font:600 17px/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;border-radius:10px;cursor:default;pointer-events:none}.side-menu-1{top:306px;right:-140px}.side-menu-2{top:384px;right:-165px}.side-menu-3{top:462px;right:-185px}.side-menu-4{top:540px;right:-195px}"
          if '.side-menu-badge{' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css_add, 1)

          mobile_marker = ".specialists-badge{top:108px;right:-18px;width:132px;padding:9px 10px;font-size:12px;transform:none}"
          if '.side-menu-badge{display:none}' not in s:
              if mobile_marker not in s:
                  raise SystemExit('Mobile marker not found')
              s = s.replace(mobile_marker, mobile_marker + ".side-menu-badge{display:none}", 1)

          team = '<a class="radial-badge specialists-badge" href="specialists/" aria-label="Команда">команда</a>'
          badges = team + '<div class="radial-badge side-menu-badge side-menu-1">о клинике</div><div class="radial-badge side-menu-badge side-menu-2">пациенту</div><div class="radial-badge side-menu-badge side-menu-3">лаборатория</div><div class="radial-badge side-menu-badge side-menu-4">контакты</div>'
          if 'side-menu-1' not in s:
              if team not in s:
                  raise SystemExit('Team badge marker not found')
              s = s.replace(team, badges, 1)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-side-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-side-menu.yml
          git commit -m "Add right-side visual menu badges"
          git push origin HEAD:feature/site-v1
