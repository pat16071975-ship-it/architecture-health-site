name: Split planet reference sprite

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/split-planet-sprite.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Diagnose and split sprite
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat, ImageFile
          import json
          import subprocess
          import traceback

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Path('assets/lab-planets/reference-sprite.webp')
          out = source.parent
          report_path = out / 'reference-sprite-report.txt'
          report = []
          manifest = {}

          file_info = subprocess.run(['file', str(source)], capture_output=True, text=True)
          report.append(file_info.stdout.strip() or file_info.stderr.strip())
          report.append(f'bytes={source.stat().st_size}')

          cells = [
              ('iggt', 'ИГГТ'),
              ('diers', 'DIERS диагностика'),
              ('functional-dentistry', 'Функциональная стоматология'),
              ('neuropsychology', 'Нейропсихология'),
              ('child-neurology', 'Детская неврология'),
              ('orthodontics', 'Ортодонтия'),
              ('myofunctional-therapy', 'Миофункциональная терапия'),
              ('preventive-medicine', 'Превентивная медицина'),
              ('osteopathy', 'Остеопатия'),
              ('gastroenterology', 'Гастроэнтерология'),
              ('nutrition', 'Нутрициология'),
              ('therapy', 'Терапия'),
          ]

          try:
              image = Image.open(source)
              image.load()
              image = image.convert('RGBA')
              report.extend([
                  f'opened={image.width}x{image.height}',
                  f'mode={image.mode}',
                  f'format={getattr(image, "format", None)}',
              ])
              if image.width % 4 or image.height % 3:
                  raise ValueError(f'Sprite cannot be divided into a 4x3 grid: {image.size}')

              cell_w = image.width // 4
              cell_h = image.height // 3
              report.extend(['grid=4x3', f'cell={cell_w}x{cell_h}'])

              for index, (slug, title) in enumerate(cells):
                  col = index % 4
                  row = index // 4
                  crop = image.crop((col * cell_w, row * cell_h, (col + 1) * cell_w, (row + 1) * cell_h))
                  alpha = crop.getchannel('A')
                  bbox = alpha.getbbox()
                  alpha_extrema = alpha.getextrema()
                  rgba_stat = ImageStat.Stat(crop)
                  rendered = crop.resize((232, 184), Image.Resampling.LANCZOS)
                  filename = f'planet-{index + 1:02d}-{slug}.png'
                  rendered.save(out / filename, 'PNG', optimize=True)
                  manifest[title] = f'/architecture-health-site/assets/lab-planets/{filename}?v=20260903-14'
                  report.append(
                      f'{index + 1:02d} {title}: alpha={alpha_extrema}, bbox={bbox}, '
                      f'mean_rgba={[round(v, 2) for v in rgba_stat.mean]}'
                  )
          except Exception:
              report.append('ERROR WHILE DECODING/SPLITTING:')
              report.append(traceback.format_exc())

          (out / 'reference-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          report_path.write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit diagnostics and individual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/lab-planets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract individual planet reference images"
            git push origin HEAD:feature/site-v1
          fi
