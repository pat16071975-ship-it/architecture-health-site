name: Capture left placeholder layout

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/capture-left-placeholders.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Capture live layout
        run: |
          cat > capture-left-placeholders.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1800,height:1100},deviceScaleFactor:1});
            const url='https://pat16071975-ship-it.github.io/architecture-health-site/interface-lab/?v=20260904-12&t='+Date.now();
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForFunction(()=>{const f=document.querySelector('iframe');return f&&f.contentDocument&&f.contentDocument.querySelectorAll('.az-lab-placeholder-badge').length===5;},{timeout:30000});
            await page.waitForTimeout(1200);
            const report=await page.evaluate(()=>{
              const doc=document.querySelector('iframe').contentDocument;
              const stage=doc.querySelector('.stage');
              const sels=['.side-menu-4','.side-menu-3','.side-menu-2','.side-menu-1','.specialists-badge'];
              const sources=sels.map(s=>doc.querySelector(s));
              const targets=[...doc.querySelectorAll('.az-lab-placeholder-badge')].sort((a,b)=>+a.dataset.azPlaceholderIndex-+b.dataset.azPlaceholderIndex);
              const c=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
              const sc=c(stage.getBoundingClientRect());
              return {stageCenter:sc, iframeViewport:{width:doc.defaultView.innerWidth,height:doc.defaultView.innerHeight}, sources:sources.map((e,i)=>{const r=e.getBoundingClientRect(),p=c(r);return{selector:sels[i],text:e.textContent.trim(),x:p.x,y:p.y,w:r.width,h:r.height}}),targets:targets.map(e=>{const r=e.getBoundingClientRect(),p=c(r);return{index:+e.dataset.azPlaceholderIndex,text:e.textContent.trim(),x:p.x,y:p.y,w:r.width,h:r.height,left:r.left,right:r.right,top:r.top,bottom:r.bottom}})};
            });
            fs.writeFileSync('/tmp/left-layout-report.json',JSON.stringify(report,null,2));
            await page.screenshot({path:'/tmp/left-layout.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-left-placeholders.cjs
          cat /tmp/left-layout-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: az-left-placeholder-layout-capture
          path: |
            /tmp/left-layout.png
            /tmp/left-layout-report.json
          retention-days: 3

      - name: Remove temporary capture workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f capture-left-placeholders.cjs
          git rm .github/workflows/capture-left-placeholders.yml
          git commit -m "Remove temporary left placeholder capture workflow"
          git push origin HEAD:feature/site-v1
