name: Patch report import merge

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/patch-report-import-merge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0

      - name: Make backup import merge-only
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_report_import.py
          python3 /tmp/patch_report_import.py

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Make report backup import merge-only"
          git pull --rebase origin feature/site-v1
          git push origin HEAD:feature/site-v1
