name: AZ IDENT immutable source archive
on:
  pull_request:
    paths:
      - 'az-baze-auth/**'
      - 'tools/verify-mis-archive-boundary.py'
      - '.github/workflows/az-mis-source-archive.yml'
permissions:
  contents: read
jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZBAZE_SECRET_KEY: synthetic-source-archive
      AZBAZE_DB: /tmp/az-mis-source-ci.db
      AZBAZE_SITE_ROOT: /tmp/az-mis-source-ci-site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r az-baze-auth/requirements.txt
      - name: Archive integrity, deduplication and rollback
        working-directory: az-baze-auth
        run: python -B -m unittest -v test_mis_source_archive test_mis_archive_routes test_paid_services_periods test_upload_consistency_atomic test_cash_payments test_completed_upload test_services_upload
      - name: Protected imports
        run: python tools/verify-mis-archive-boundary.py ${{ github.event.pull_request.base.sha }}
