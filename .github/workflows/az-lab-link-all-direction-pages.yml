name: AZ Lab link all direction pages
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-link-all-direction-pages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Link ready viewer pages without touching orbit geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')
          new="const detailPaths={'Функциональная стоматология':'/architecture-health-site/interface-lab/functional-dentistry/','Ортодонтия':'/architecture-health-site/interface-lab/orthodontics/','Остеопатия':'/architecture-health-site/interface-lab/osteopathy/','Терапия':'/architecture-health-site/interface-lab/dentistry/','ИГГТ':'/architecture-health-site/interface-lab/iggt/','DIERS диагностика':'/architecture-health-site/interface-lab/diers/','Нейропсихология':'/architecture-health-site/interface-lab/neuropsychology/','Детская неврология':'/architecture-health-site/interface-lab/pediatric-neurology/','Миофункциональная терапия':'/architecture-health-site/interface-lab/myofunctional-therapy/','Превентивная медицина':'/architecture-health-site/interface-lab/preventive-medicine/','Гастроэнтерология':'/architecture-health-site/interface-lab/gastroenterology/','Нутрициология':'/architecture-health-site/interface-lab/nutrition/'};"
          s2,n=re.subn(r"const detailPaths=\{[^;]+\};",new,s,count=1)
          if n!=1:
              raise SystemExit('detailPaths mapping not found exactly once')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q "const INNER_DURATION=63000;" interface-lab/index.html
          grep -q "const OUTER_DURATION=114000;" interface-lab/index.html
          grep -q "innerRx:r.width\*\.55" interface-lab/index.html
          grep -q "outerRx:r.width\*\.73" interface-lab/index.html
          test -f interface-lab/orthodontics/index.html
          test -f interface-lab/osteopathy/index.html
          test -f interface-lab/gastroenterology/index.html
          test -f interface-lab/nutrition/index.html
          test -f interface-lab/iggt/index.html
          test -f interface-lab/diers/index.html
          test -f interface-lab/neuropsychology/index.html
          test -f interface-lab/pediatric-neurology/index.html
          test -f interface-lab/myofunctional-therapy/index.html
          test -f interface-lab/preventive-medicine/index.html
      - name: Commit link map and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/az-lab-link-all-direction-pages.yml
          git add interface-lab/index.html
          git commit -m "Link all ready direction pages in Interface Lab"
          git push origin feature/site-v1