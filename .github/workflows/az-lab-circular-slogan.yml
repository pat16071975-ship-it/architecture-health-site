name: AZ Lab circular Vitruvian slogan
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-circular-slogan.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Add circular slogan without changing orbit geometry
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')

          old="stopOrbitAnimation();doc.getElementById('az-lab-orbits')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();doc.querySelectorAll('.az-lab-placeholder-badge').forEach(el=>el.remove());"
          new="stopOrbitAnimation();doc.getElementById('az-lab-orbits')?.remove();doc.getElementById('az-lab-slogan')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();doc.querySelectorAll('.az-lab-placeholder-badge').forEach(el=>el.remove());"
          if old not in s and "doc.getElementById('az-lab-slogan')?.remove()" not in s:
              raise SystemExit('STOP: cleanup marker not found')
          s=s.replace(old,new,1)

          fn="""function addCircularSlogan(doc,host,stage,hostRect,stageRect){
  const viewportWidth=doc.defaultView?.innerWidth||0;if(viewportWidth<721)return;
  doc.getElementById('az-lab-slogan')?.remove();
  const scale=viewportWidth>=1181?.724137931:.568965517;
  const cx=stageRect.left-hostRect.left+stageRect.width/2,cy=stageRect.top-hostRect.top+stageRect.height/2;
  const radius=Math.min(stageRect.width,stageRect.height)*scale*.535;
  const point=deg=>{const a=deg*Math.PI/180;return{x:cx+radius*Math.cos(a),y:cy+radius*Math.sin(a)}};
  const start=point(200),end=point(340),ns='http://www.w3.org/2000/svg';
  const svg=doc.createElementNS(ns,'svg');svg.id='az-lab-slogan';svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);svg.setAttribute('preserveAspectRatio','none');
  svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:6';
  const defs=doc.createElementNS(ns,'defs'),path=doc.createElementNS(ns,'path');path.id='az-lab-slogan-path';path.setAttribute('d',`M ${start.x} ${start.y} A ${radius} ${radius} 0 0 1 ${end.x} ${end.y}`);path.setAttribute('fill','none');defs.appendChild(path);svg.appendChild(defs);
  const text=doc.createElementNS(ns,'text');text.setAttribute('fill','#52685a');text.setAttribute('font-family','Montserrat, Inter, Segoe UI, Arial, sans-serif');text.setAttribute('font-size',viewportWidth>=1181?'11.8':'10.2');text.setAttribute('font-weight','500');text.setAttribute('letter-spacing','.035em');
  const textPath=doc.createElementNS(ns,'textPath');textPath.setAttribute('href','#az-lab-slogan-path');textPath.setAttribute('startOffset','50%');textPath.setAttribute('text-anchor','middle');textPath.setAttribute('textLength',(radius*2.10).toFixed(1));textPath.setAttribute('lengthAdjust','spacingAndGlyphs');textPath.textContent='Не лечим по отдельности. Понимаем, как всё связано в вашем организме';
  text.appendChild(textPath);svg.appendChild(text);host.appendChild(svg);
}
"""
          marker='function closeDirectionInfo(doc){doc.querySelector(\'.az-lab-direction-info\')?.remove()}'
          if 'function addCircularSlogan(' not in s:
              if marker not in s: raise SystemExit('STOP: insertion marker not found')
              s=s.replace(marker,fn+marker,1)

          old_call='svg.append(inner,outer);host.prepend(svg);'
          new_call='svg.append(inner,outer);host.prepend(svg);addCircularSlogan(doc,host,stage,hostRect,stageRect);'
          if old_call not in s and 'addCircularSlogan(doc,host,stage,hostRect,stageRect);' not in s:
              raise SystemExit('STOP: orbit svg marker not found')
          s=s.replace(old_call,new_call,1)

          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];",
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            '.az-lab-right-badge-shift{transform:translateX(-37.8px)!important}',
            ".az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}",
          ]
          for m in protected:
              if m not in s: raise SystemExit(f'STOP: approved geometry marker missing: {m}')
          if s.count('Не лечим по отдельности. Понимаем, как всё связано в вашем организме')!=1:
              raise SystemExit('STOP: slogan verification failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only change and remove temporary workflow
        run: |
          rm -f .github/workflows/az-lab-circular-slogan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-circular-slogan.yml
          git commit -m 'Add circular slogan around Vitruvian figure'
          git push origin feature/site-v1
