name: AZ management global staff layout

on:
  pull_request:
    paths:
      - 'az-baze-auth/report_storage.py'
      - 'az-baze-auth/test_management_staff_layout.py'
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'reports/management-staff-layout.js'
      - '.github/workflows/az-management-staff-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  management-staff-layout:
    runs-on: ubuntu-latest
    env:
      AZBAZE_SECRET_KEY: management-staff-layout-ci
      AZBAZE_DB: /tmp/az-management-staff-layout-ci.db
      AZBAZE_SITE_ROOT: /tmp/az-management-staff-layout-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt

      - name: Python syntax and unit tests
        run: |
          python -m py_compile az-baze-auth/report_storage.py az-baze-auth/test_management_staff_layout.py
          cd az-baze-auth
          python -m unittest -v test_management_staff_layout.py

      - name: Management and accounting regressions
        working-directory: az-baze-auth
        run: |
          python -m unittest -v \
            test_manual_entry_consistency.py \
            test_report_consistency_preservation.py \
            test_paid_history_reporting.py \
            test_cash_payments.py \
            test_paid_services_storage.py

      - name: JavaScript syntax
        run: |
          node --check reports/management-staff-layout.js
          node --check reports/period-view.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('reports/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/management-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/management-inline.js

      - name: Correct target and global behavior contract
        run: |
          python - <<'PY'
          from pathlib import Path

          storage=Path('az-baze-auth/report_storage.py').read_text(encoding='utf-8')
          index=Path('reports/index.html').read_text(encoding='utf-8')
          period=Path('reports/period-view.js').read_text(encoding='utf-8')
          layout=Path('reports/management-staff-layout.js').read_text(encoding='utf-8')

          assert 'MANAGEMENT_STAFF_LAYOUT_KEY = "az-management-staff-layout-v1"' in storage
          assert '@app.put("/api/reports/management-staff-layout")' in storage
          put_tail=storage.split('@app.put("/api/reports/management-staff-layout")',1)[1]
          assert '@admin_required' in put_tail.split('def management_staff_layout_put',1)[0]

          assert 'management-staff-layout.js?v=20261110-1' in index
          assert "window.azManagementStaffNames('dentists')" in index
          assert "window.azManagementStaffNames('clinicDocs')" in index
          assert "managementStaffNames('dentists').forEach(name=>addDateDoctorMetric" in period
          assert "managementStaffNames('clinicDocs').forEach(name=>addDateDoctorMetric" in period

          assert "const names=type==='dentists'?dentists:type==='clinicDocs'?clinicDocs:[];" in period
          assert 'dentists.forEach(n=>out.dentists[n]=' in index
          assert 'clinicDocs.forEach(n=>out.clinicDocs[n]=' in index

          assert 'Настроить персонал' in layout
          assert 'Сохранить для всех' in layout
          assert 'CAN_EDIT_MANAGEMENT_STAFF_LAYOUT' in layout
          assert 'draggable="true"' in layout

          assert not Path('reports/services-staff-layout.js').exists()
          assert not Path('az-baze-auth/test_service_staff_layout.py').exists()
          assert 'SERVICE_STAFF_LAYOUT_KEY' not in storage

          print('AZ_MANAGEMENT_STAFF_LAYOUT=PASS')
          PY

      - name: Wrong PR196 service files restored exactly
        run: |
          test "$(git hash-object reports/services.html)" = '9783f3b838f3210af4bc2d06f3fe48efe300990e'
          test "$(git hash-object reports/services-base.html)" = '34dafc898536afedb01250bfa3b244beffcbedb0'
          test "$(git hash-object reports/services-enhancements.js)" = 'df2a98ccbb766e6bd486d5715a9e1a7ae8fab5ca'
          test "$(git hash-object reports/services-payroll-manager.js)" = '6b55d5015f1f8745b1f2aff60b366135ceaa4bc7'
          echo 'PR196_WRONG_TARGET_REVERT=PASS'
