name: AZ protected A-B pilot link
on:
  push:
    branches: ['ops/az-knowledge-ab-pilot-*']
    paths:
      - 'az-baze-auth/deploy/knowledge_link_ab_pilot.py'
      - 'az-baze-auth/deploy/test_knowledge_link_ab_pilot.py'
      - '.github/workflows/az-knowledge-ab-pilot.yml'
permissions:
  contents: read
jobs:
  ab-pilot-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and isolated filesystem tests
        working-directory: az-baze-auth/deploy
        run: |
          python -m py_compile knowledge_link_ab_pilot.py test_knowledge_link_ab_pilot.py
          python - <<'PY'
          import unittest
          suite = unittest.TestLoader().loadTestsFromName('test_knowledge_link_ab_pilot')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          print(f'AB_PILOT_TESTS=PASS; TESTS={result.testsRun}; SKIPPED=0')
          PY
