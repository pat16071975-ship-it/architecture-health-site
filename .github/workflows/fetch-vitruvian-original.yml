name: Fetch stable local Vitruvian original

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/fetch-vitruvian-original.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Download Vitruvian original
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a5/Leonardo_da_Vinci-_Vitruvian_Man.JPG" \
            -o assets/vitruvian-original.jpg
          test "$(wc -c < assets/vitruvian-original.jpg)" -gt 100000
          file assets/vitruvian-original.jpg | grep -qi 'JPEG image data'
      - name: Commit local binary asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vitruvian-original.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add stable local Vitruvian original"
          git push origin feature/site-v1
