name: AZ Lab fix close and hide relations
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-lab-fix-close-and-hide-relations.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text()
          old=".az-lab-right-badge-shift{transform:translateX(-37.8px)!important}\n.az-lab-direction-info{"
          new=".az-lab-right-badge-shift{transform:translateX(-37.8px)!important}\n.relation-panel{display:none!important}\n.az-lab-direction-info{"
          assert old in s
          s=s.replace(old,new,1)
          old_close=".az-lab-direction-close{position:absolute!important;right:34px!important;top:34px!important;width:46px!important;height:46px!important;border-radius:50%!important;border:1.5px solid rgba(68,99,79,.65)!important;background:#f7f3ec!important;color:#344b3d!important;font:400 35px/40px Arial,sans-serif!important;text-align:center!important;cursor:pointer!important;z-index:31!important;box-shadow:0 5px 14px rgba(58,49,37,.12)!important;padding:0!important}"
          new_close=".az-lab-direction-close{position:absolute!important;left:50%!important;right:auto!important;top:8px!important;transform:translateX(-50%)!important;width:92px!important;height:92px!important;border-radius:50%!important;border:2px solid rgba(68,99,79,.78)!important;background:#f7f3ec!important;color:#344b3d!important;font:400 68px/84px Arial,sans-serif!important;text-align:center!important;cursor:pointer!important;z-index:31!important;box-shadow:0 7px 18px rgba(58,49,37,.16)!important;padding:0!important}"
          assert old_close in s
          s=s.replace(old_close,new_close,1)
          s=s.replace('orbits-20260904-11','orbits-20260904-12')
          p.write_text(s)
          PY
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add interface-lab/index.html
          git rm .github/workflows/az-lab-fix-close-and-hide-relations.yml
          git commit -m "Enlarge direction close button and hide old relation panels"
          git push origin feature/site-v1