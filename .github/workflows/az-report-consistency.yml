name: AZ report consistency
on:
  pull_request:
    paths:
      - 'az-baze-auth/**'
      - 'reports/**'
      - '.github/workflows/az-report-consistency.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r az-baze-auth/requirements.txt
      - name: Counter, restore, payroll and money preservation regressions
        working-directory: az-baze-auth
        run: >-
          python -m unittest -v
          test_report_consistency test_completed_visit_totals
          test_completed_upload test_upload_consistency_atomic test_upload_reconcile
          test_payroll_registry test_economics_revenue_source
          test_paid_services test_paid_services_periods test_advertising_mis_bridge
      - name: Executable report calculations
        run: node reports/test-report-consistency.cjs
      - name: Syntax
        run: |
          python -m compileall -q az-baze-auth
          node --check reports/forecast-audit-sync.js
          node --check reports/finrez-economics-integrated.js
          node --check reports/services-summary-economics.js
