name: IDENT-006B isolated installation and HTTPS
on:
  push:
    branches: ['test/ident-006b-install-20261126']
    paths: ['.github/workflows/ident-006b-install.yml','integrations/ident-006-receiver/**']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Verify exact source and isolated scope
        run: |
          set -euo pipefail
          source='4cf0f579d319446828ab26169525bca22781ca66'
          tree='3bc26f84647a2ccb1467e09d119caca769a4c027'
          expected='dffec7d352251d5caa44a2cf373b1793348719e0'
          git merge-base --is-ancestor "$source" HEAD
          test "$(git rev-parse "$source^{tree}")" = "$tree"
          test "$(git rev-parse "$source:integrations/ident-006-receiver")" = "$expected"
          test "$(git rev-parse HEAD:integrations/ident-006-receiver)" = "$expected"
          test "$(git ls-tree -r --name-only HEAD | wc -l)" -eq 23
          cd integrations/ident-006-receiver
          echo '1a651a604db3b7c090152a4cd1766b15e6cbc67282c7fecc5e19917bc81da3b7  deploy/INSTALL-MANIFEST.json' | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,pathlib
          manifest=json.loads(pathlib.Path('deploy/INSTALL-MANIFEST.json').read_text())
          assert len(manifest)==13
          for name,digest in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print("MANIFEST=13/13 PASS")
          PY
          echo "EXACT_SOURCE=PASS; SOURCE_HEAD=$source; SOURCE_TREE=$tree"
      - name: Receiver regression and deployment unit tests
        working-directory: integrations/ident-006-receiver
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s deploy/tests -p test_deploy.py -v
          bash -n deploy/tests/lab_install.sh
      - name: Real disposable systemd, Unix socket, Nginx HTTPS and rollback
        working-directory: integrations/ident-006-receiver
        run: bash deploy/tests/lab_install.sh
      - name: Safe local diagnostic on failure
        if: failure()
        run: |
          sudo systemctl status az-ident006b.service az-ident006b.socket --no-pager --lines=15 || true
          sudo journalctl -u az-ident006b.service -n 30 --no-pager || true
          sudo nginx -t || true
          sudo systemctl stop az-ident006b.service az-ident006b.socket || true
