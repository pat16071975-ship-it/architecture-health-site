name: Remove fig leaf
on:
  push:
    branches: [feature/site-v1]
    paths:
      - .github/workflows/remove-fig-leaf.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Remove fig leaf only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* fig-leaf-v1 */'
          css_anchor = '.direction{position:absolute;'
          svg_start = '<svg class="fig-leaf"'
          svg_end = '</svg>'

          if marker not in s:
              raise SystemExit('fig-leaf CSS marker not found')
          a = s.index(marker)
          b = s.index(css_anchor, a)
          s = s[:a] + s[b:]

          if svg_start not in s:
              raise SystemExit('fig-leaf SVG start not found')
          a = s.index(svg_start)
          b = s.index(svg_end, a) + len(svg_end)
          s = s[:a] + s[b:]

          if 'fig-leaf-v1' in s or 'class="fig-leaf"' in s:
              raise SystemExit('fig leaf remnants remain')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove fig leaf from Vitruvian figure"
          git push origin feature/site-v1
