name: AZ-BAZE Report Header UI

on:
  push:
    branches:
      - feature/az-baze-auth
      - fix/report-header-final
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/scripts/az-report-header-browser-check.cjs'
      - '.github/workflows/az-baze-report-sticky.yml'
  pull_request:
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/scripts/az-report-header-browser-check.cjs'
      - '.github/workflows/az-baze-report-sticky.yml'

permissions:
  contents: read

jobs:
  report-header-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript syntax
        run: |
          node --check reports/period-view.js
          node --check .github/scripts/az-report-header-browser-check.cjs

      - name: Final report header source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("reports/period-view.js").read_text(encoding="utf-8")
          nav = Path("az-baze-auth/section_navigation.py").read_text(encoding="utf-8")

          required = [
              "body .toolbar{position:static!important;top:auto!important}",
              ".date-compare-table thead th{position:static!important;top:auto!important;left:auto!important}",
              ".date-compare-sticky-head{",
              "position:fixed;",
              "dateCompareStickyHead",
              "dateStickyThead.innerHTML=head.innerHTML",
              "dateStickyCols.innerHTML=widths.map",
              "dateStickyInner.style.left=(-shell.scrollLeft)+'px'",
              "dateStickyHead.style.top=navBottom+'px'",
              "dateStickyHead.style.left=Math.round(shellRect.left)+'px'",
              "dateStickyHead.style.width=Math.round(shellRect.width)+'px'",
              "window.addEventListener('scroll',queueDateStickyClone",
              "window.addEventListener('resize',queueDateStickyClone",
              "dateCompareShell?.addEventListener('scroll',queueDateStickyClone",
          ]
          for needle in required:
              assert needle in js, needle

          forbidden = [
              "az-date-compare-runtime-pin",
              "az-date-compare-viewport-sticky",
              "--az-month-pin-shift",
              "pinnedHeaderShift",
              "syncDatePinnedHeader",
              "syncDateStickyMode",
              "transform:translateY",
          ]
          for needle in forbidden:
              assert needle not in js, needle

          assert "body .toolbar{top:52px!important}" in nav
          print("FINAL REPORT HEADER SOURCE CONTRACT: OK")
          PY

      - name: Calculation algorithms unchanged
        if: (github.event_name == 'pull_request' && github.head_ref == 'fix/report-header-final') || (github.event_name == 'push' && github.ref_name == 'fix/report-header-final')
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          # Compare calculations against the exact source before PR #6/#7/#8 sticky work.
          BASE = "605818547b24d5fac2453eaa3f40d870193b53ba"

          def git_show(path):
              return subprocess.check_output(
                  ["git", "show", f"{BASE}:{path}"],
                  text=True,
                  encoding="utf-8",
              )

          def extract_function(src, name):
              marker = f"function {name}("
              start = src.find(marker)
              if start < 0:
                  raise AssertionError(f"missing function {name}")
              brace = src.find("{", start)
              if brace < 0:
                  raise AssertionError(f"missing body for {name}")
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ("'", '"', "`"):
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return src[start:i + 1]
                  i += 1
              raise AssertionError(f"unterminated function {name}")

          def exact_line(src, prefix):
              for line in src.splitlines():
                  if line.startswith(prefix):
                      return line
              raise AssertionError(f"missing line {prefix}")

          current_index = Path("reports/index.html").read_text(encoding="utf-8")
          base_index = git_show("reports/index.html")
          current_period = Path("reports/period-view.js").read_text(encoding="utf-8")
          base_period = git_show("reports/period-view.js")

          assert current_index == base_index, "reports/index.html changed since pre-sticky baseline"

          for name in ("daysInMonth", "derive", "aggregate"):
              assert extract_function(current_index, name) == extract_function(base_index, name), name

          for prefix in ("const money=", "const num=", "const pct=", "const count="):
              assert exact_line(current_index, prefix) == exact_line(base_index, prefix), prefix

          period_functions = (
              "mix",
              "heatColor",
              "heatEnabled",
              "heatStyles",
              "getPeriodDefs",
              "periodData",
              "doctorReconciliation",
              "clampDate",
              "compareMonths",
              "rawOrNull",
              "addDateMetric",
          )
          for name in period_functions:
              assert extract_function(current_period, name) == extract_function(base_period, name), name

          print("CALCULATION ALGORITHM CONTRACT: UNCHANGED")
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local report server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/az-report-http.log 2>&1 &
          echo $! >/tmp/az-report-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/reports/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/az-report-http.log
          exit 1

      - name: Chromium checks — one date and monthly compare
        run: node .github/scripts/az-report-header-browser-check.cjs

      - name: Stop local report server
        if: always()
        run: |
          if [ -f /tmp/az-report-http.pid ]; then
            kill "$(cat /tmp/az-report-http.pid)" || true
          fi

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-report-header-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
