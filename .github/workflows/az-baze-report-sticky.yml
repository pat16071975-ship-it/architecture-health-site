name: AZ-BAZE Report Sticky Headers

on:
  push:
    branches:
      - feature/az-baze-auth
      - fix/report-sticky-months-runtime
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/workflows/az-baze-report-sticky.yml'
  pull_request:
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/workflows/az-baze-report-sticky.yml'

permissions:
  contents: read

jobs:
  sticky-header-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check reports/period-view.js

      - name: Runtime pin geometry unit
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('reports/period-view.js','utf8');
          const match=src.match(/function pinnedHeaderShift\([^)]*\)\{[\s\S]*?\n  \}/);
          if(!match) throw new Error('pinnedHeaderShift function not found');
          eval(match[0]);

          const cases=[
            {name:'table below nav',args:[120,1000,50,52],want:0},
            {name:'pin under nav',args:[-100,1000,50,52],want:152},
            {name:'stop at table end',args:[-1200,1000,50,52],want:950},
            {name:'short table safe',args:[0,40,50,52],want:0},
          ];
          for(const t of cases){
            const got=pinnedHeaderShift(...t.args);
            if(got!==t.want) throw new Error(`${t.name}: got ${got}, want ${t.want}`);
          }
          console.log('RUNTIME PIN GEOMETRY: OK');
          NODE

      - name: Management report runtime-pin contract
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("reports/period-view.js").read_text(encoding="utf-8")
          index = Path("reports/index.html").read_text(encoding="utf-8")
          nav = Path("az-baze-auth/section_navigation.py").read_text(encoding="utf-8")

          required = [
              "body.az-date-compare-runtime-pin .toolbar{position:static!important;top:auto!important}",
              "box-shadow:0 0 0 100vmax #f7f3ec,0 1px 0 rgba(181,150,98,.22)",
              "clip-path:inset(0 -100vmax)",
              "body.az-date-compare-runtime-pin .date-compare-table thead th{",
              "position:relative!important;",
              "transform:translateY(var(--az-month-pin-shift,0px))",
              "will-change:transform;",
              "function pinnedHeaderShift(",
              "function syncDatePinnedHeader()",
              "function queueDatePinnedHeader()",
              "document.body.classList.toggle('az-date-compare-runtime-pin',enabled)",
              "nav.getBoundingClientRect().bottom",
              "table.getBoundingClientRect()",
              "table.offsetHeight",
              "head.offsetHeight",
              "table.style.setProperty('--az-month-pin-shift',shift+'px')",
              "table.style.removeProperty('--az-month-pin-shift')",
              "window.addEventListener('scroll',queueDatePinnedHeader",
              "window.addEventListener('resize',queueDatePinnedHeader",
          ]
          for needle in required:
              assert needle in js, needle

          forbidden = [
              "az-date-compare-viewport-sticky",
              "syncDateStickyMode",
          ]
          for needle in forbidden:
              assert needle not in js, needle

          assert '<script src="./period-view.js' in index
          assert ".toolbar{display:flex" in index
          assert "position:sticky;top:0;z-index:10" in index
          assert "body .toolbar{top:52px!important}" in nav

          print("MANAGEMENT REPORT RUNTIME PIN CONTRACT: OK")
          PY
