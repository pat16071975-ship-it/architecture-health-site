name: AZ-BAZE Report Header UI

on:
  push:
    branches:
      - feature/az-baze-auth
      - fix/report-header-final
      - feature/az-cash-fact
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/scripts/az-report-header-browser-check.cjs'
      - '.github/workflows/az-baze-report-sticky.yml'
  pull_request:
    paths:
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'az-baze-auth/section_navigation.py'
      - '.github/scripts/az-report-header-browser-check.cjs'
      - '.github/workflows/az-baze-report-sticky.yml'

permissions:
  contents: read

jobs:
  report-header-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript syntax
        run: |
          node --check reports/period-view.js
          node --check .github/scripts/az-report-header-browser-check.cjs

      - name: Final report header source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("reports/period-view.js").read_text(encoding="utf-8")
          nav = Path("az-baze-auth/section_navigation.py").read_text(encoding="utf-8")

          required = [
              "body .toolbar{position:static!important;top:auto!important}",
              ".date-compare-table thead th{position:static!important;top:auto!important;left:auto!important}",
              ".date-compare-sticky-head{",
              "position:fixed;",
              "dateCompareStickyHead",
              "dateStickyThead.innerHTML=head.innerHTML",
              "dateStickyCols.innerHTML=widths.map",
              "dateStickyInner.style.left=(-shell.scrollLeft)+'px'",
              "dateStickyHead.style.top=navBottom+'px'",
              "dateStickyHead.style.left=Math.round(shellRect.left)+'px'",
              "dateStickyHead.style.width=Math.round(shellRect.width)+'px'",
              "window.addEventListener('scroll',queueDateStickyClone",
              "window.addEventListener('resize',queueDateStickyClone",
              "dateCompareShell?.addEventListener('scroll',queueDateStickyClone",
          ]
          for needle in required:
              assert needle in js, needle

          forbidden = [
              "az-date-compare-runtime-pin",
              "az-date-compare-viewport-sticky",
              "--az-month-pin-shift",
              "pinnedHeaderShift",
              "syncDatePinnedHeader",
              "syncDateStickyMode",
              "transform:translateY",
          ]
          for needle in forbidden:
              assert needle not in js, needle

          assert "body .toolbar{top:52px!important}" in nav
          print("FINAL REPORT HEADER SOURCE CONTRACT: OK")
          PY

      - name: Cash-first calculation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("reports/index.html").read_text(encoding="utf-8")
          period = Path("reports/period-view.js").read_text(encoding="utf-8")

          for needle in (
              "cashDataComplete",
              "cashFact",
              "billedInvoices",
              "cashOOO",
              "cashIP",
              "cashDentistsOOO",
              "cashDentistsIP",
              "cashClinicDocsOOO",
              "cashClinicDocsIP",
              "Выставлено счетов",
              "ДС ООО",
              "ДС ИП",
          ):
              assert needle in index, needle

          for needle in (
              "splitLine",
              "addCashMetric",
              "addDateCashMetric",
              "Выставлено счетов",
              "ДС ООО",
              "ДС ИП",
              "cashDentistsOOO",
              "cashClinicDocsOOO",
          ):
              assert needle in period, needle

          assert "addDateMetric(tbody,'Факт медицина'" not in period
          assert "addDateMetric(tbody,'Факт лаборатория'" not in period
          print("CASH-FIRST CALCULATION CONTRACT: OK")
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local report server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/az-report-http.log 2>&1 &
          echo $! >/tmp/az-report-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/reports/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/az-report-http.log
          exit 1

      - name: Chromium checks — one date and monthly compare
        run: node .github/scripts/az-report-header-browser-check.cjs

      - name: Stop local report server
        if: always()
        run: |
          if [ -f /tmp/az-report-http.pid ]; then
            kill "$(cat /tmp/az-report-http.pid)" || true
          fi

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-report-header-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
