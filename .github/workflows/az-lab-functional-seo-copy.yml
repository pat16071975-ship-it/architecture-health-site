name: AZ Lab functional dentistry approved copy
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-functional-seo-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Replace functional dentistry copy in viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text(encoding='utf-8')

          s=re.sub(r'<title>.*?</title>', '<title>Функциональная стоматология в Новосибирске | Диагностика прикуса и ВНЧС — Архитектура здоровья</title>', s, count=1, flags=re.S)
          s=re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="Консультация по функциональной стоматологии в Новосибирске. Оценка прикуса, ВНЧС, жевательных мышц, дыхания. Понятный маршрут лечения. Клиника «Архитектура здоровья». Запись на приём.">', s, count=1, flags=re.S)
          if '<meta name="robots"' not in s:
              s=s.replace('<meta name="description" content="Консультация по функциональной стоматологии в Новосибирске. Оценка прикуса, ВНЧС, жевательных мышц, дыхания. Понятный маршрут лечения. Клиника «Архитектура здоровья». Запись на приём.">', '<meta name="description" content="Консультация по функциональной стоматологии в Новосибирске. Оценка прикуса, ВНЧС, жевательных мышц, дыхания. Понятный маршрут лечения. Клиника «Архитектура здоровья». Запись на приём.">\n<meta name="robots" content="noindex,nofollow">', 1)

          extra_css='''
/* long-form approved content */
.copy-section{padding:82px 0}.copy-section.alt{background:linear-gradient(180deg,rgba(239,232,219,.68),rgba(247,243,236,.12))}.copy-wrap{width:min(980px,calc(100% - 48px));margin:0 auto}.copy-intro{font-size:17px;line-height:1.82;color:#4e5a52}.copy-intro p{margin:0 0 18px}.copy-title{margin:0 0 28px;font-size:39px;line-height:1.14;font-weight:500;letter-spacing:-.032em;color:#344b3d}.copy-subtitle{margin:42px 0 16px;font-size:27px;line-height:1.22;font-weight:500;letter-spacing:-.02em;color:#3f5547}.copy-text{font-size:15px;line-height:1.82;color:#536058}.copy-text p{margin:0 0 17px}.copy-list{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}.copy-list li{position:relative;padding:13px 16px 13px 42px;border:1px solid rgba(68,99,79,.13);border-radius:16px;background:rgba(251,248,242,.72);font-size:14px;line-height:1.55;color:#4d5951}.copy-list li:before{content:"";position:absolute;left:18px;top:20px;width:7px;height:7px;border-radius:50%;background:#b59662}.copy-accent{margin-top:24px;padding:20px 24px;border-left:2px solid #b59662;background:rgba(239,232,219,.62);font-size:14px;line-height:1.75;color:#4e5a52}.copy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.copy-card{padding:26px 24px;border:1px solid rgba(68,99,79,.14);border-radius:22px;background:rgba(251,248,242,.74);box-shadow:0 12px 32px rgba(65,55,42,.04)}.copy-card h3{margin:0 0 12px;font-size:17px;line-height:1.35;font-weight:600;color:#3f5547}.copy-card p{margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#59645d}.copy-card .copy-list{gap:7px;margin-top:10px}.copy-card .copy-list li{padding:8px 8px 8px 27px;border:0;background:transparent;font-size:12.5px;line-height:1.55}.copy-card .copy-list li:before{left:7px;top:15px;width:6px;height:6px}.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.faq-item{padding:26px 26px 24px;border:1px solid rgba(68,99,79,.14);border-radius:22px;background:rgba(251,248,242,.72)}.faq-item h3{margin:0 0 12px;font-size:16px;line-height:1.4;font-weight:600;color:#3f5547}.faq-item p{margin:0;font-size:13.5px;line-height:1.72;color:#59645d}.faq-item ul{margin:12px 0 0;padding-left:20px;font-size:13px;line-height:1.65;color:#59645d}.contact-lines{margin-top:18px;display:grid;gap:7px;font-size:13px;color:rgba(255,255,255,.82)}.contact-lines strong{color:#fff}.hero .lead.long-lead{font-size:17px;line-height:1.72}.hero .hero-note.long-note{font-size:13.5px;line-height:1.72}.section-spacer{height:1px;background:linear-gradient(90deg,transparent,rgba(181,150,98,.26),transparent);margin:12px 0 0}
@media(max-width:900px){.copy-grid{grid-template-columns:1fr}.faq-grid{grid-template-columns:1fr}.copy-section{padding:66px 0}}
@media(max-width:600px){.copy-wrap{width:min(100% - 28px,980px)}.copy-title{font-size:30px}.copy-subtitle{font-size:23px}.copy-intro{font-size:15px}.copy-text{font-size:14px}.copy-section{padding:54px 0}.copy-card,.faq-item{padding:22px 20px}}
'''
          if '/* long-form approved content */' not in s:
              s=s.replace('</style>', extra_css+'</style>', 1)

          main='''<main>
<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Функциональная стоматология · Новосибирск</div><h1>Функциональная стоматология в Новосибирске</h1><p class="lead long-lead">Функциональная стоматология рассматривает зубочелюстную систему как единое целое. Прикус, положение челюстей, работа височно‑нижнечелюстного сустава (ВНЧС), жевательных мышц, а также дыхание и осанка могут влиять друг на друга. Поэтому иногда недостаточно оценить только состояние отдельных зубов.</p><div class="hero-note long-note">На консультации в клинике «Архитектура здоровья» в Новосибирске специалист оценивает, как именно работают эти структуры у вас, и определяет, какие взаимосвязи значимы в вашем случае. Это помогает построить понятный маршрут: от наблюдения до комплексного лечения с привлечением смежных специалистов.</div><div class="hero-actions"><a class="btn" href="#start">Записаться на консультацию <span>→</span></a><a class="btn secondary" href="#system">Как мы работаем</a></div></div><div class="visual calm-visual"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="calm-photo-shell"><div class="calm-photo"><img src="../../assets/functional-dentistry-calm-approved.webp?v=20260906-5" alt="Функциональная стоматология в Новосибирске — прикус, ВНЧС, мышцы, дыхание и осанка"></div></div><div class="calm-tag calm-tag-joint"><span></span>ВНЧС</div><div class="calm-tag calm-tag-bite"><span></span>Прикус</div><div class="calm-tag calm-tag-muscle"><span></span>Мышцы</div><div class="calm-tag calm-tag-breath"><span></span>Дыхание</div><div class="calm-tag calm-tag-posture"><span></span>Голова, шея и осанка</div></div></div></section>

<section class="copy-section alt"><div class="copy-wrap"><div class="kicker">Когда обратиться</div><h2 class="copy-title">Когда стоит обратиться к специалисту по функциональной стоматологии</h2><div class="copy-text"><p>Если вы в Новосибирске заметили следующие симптомы, их стоит обсудить со специалистом по функциональной стоматологии:</p><ul class="copy-list"><li>щёлкает, хрустит или устаёт челюсть;</li><li>дискомфорт после установки коронок, виниров, брекетов или другого ортодонтического/ортопедического лечения;</li><li>трудно или неудобно жевать, хотя зубы внешне в порядке;</li><li>постоянное напряжение в области челюстей, висков, лица;</li><li>головные боли, напряжение в шее на фоне проблем с прикусом или жеванием.</li></ul><div class="copy-accent">Мы не сводим все симптомы к одной причине. На приёме врач оценивает работу зубочелюстной системы и определяет, какие взаимосвязи действительно значимы именно для вас.</div></div></div></section>

<section class="copy-section"><div class="copy-wrap"><div class="kicker">Подход</div><h2 class="copy-title">Что такое функциональная стоматология</h2><div class="copy-intro"><p>Функциональная стоматология — это подход, при котором внимание уделяется не только форме и внешнему виду зубов, но и тому, как человек жует, двигает челюстью, адаптируется к нагрузке и дышит.</p><p>Здоровая улыбка — часть здоровья всего организма. Поэтому лечение должно учитывать не только форму зубов, но и то, как работает вся система: от прикуса до положения головы и шеи.</p></div></div></section>

<section class="section alt" id="system"><div class="wrap system"><div class="system-visual"><div class="system-orbit o1"></div><div class="system-orbit o2"></div><div class="system-orbit o3"></div><div class="system-core">Зубочелюстная<br>система<small>как единое целое</small></div><div class="node n1">Прикус</div><div class="node n2">ВНЧС и мышцы</div><div class="node n3">Дыхание</div><div class="node n4">Голова, шея и осанка</div></div><div class="system-copy"><div class="kicker">Взаимосвязи</div><h3>Прикус, ВНЧС и жевательные мышцы</h3><p>Прикус, положение челюстей, работа височно‑нижнечелюстного сустава и жевательных мышц могут влиять друг на друга. Нарушения в одной из этих зон часто компенсируются за счёт других, что со временем может приводить к:</p><ul class="copy-list"><li>дискомфорту при жевании;</li><li>ощущению «неправильного» прикуса;</li><li>напряжению и усталости челюстей;</li><li>щелчкам и хрусту в области ВНЧС.</li></ul><div class="accent">На диагностике специалист оценивает именно те связи, которые имеют значение для конкретного пациента, а не пытается объяснить одной причиной всё сразу.</div></div></div></section>

<section class="copy-section"><div class="copy-wrap"><div class="kicker">Смотрим шире</div><h2 class="copy-title">Дыхание, голова, шея и осанка</h2><div class="copy-intro"><p>В отдельных случаях важно учитывать и другие функциональные особенности — например, дыхание, положение головы и шеи, осанку. Эти факторы могут влиять на работу жевательных мышц и ВНЧС, усиливать напряжение в области лица и головы.</p><p>Задача функционального подхода — понять систему: где есть нарушение, что является компенсацией, а что можно оставить под наблюдением.</p></div><div class="section-spacer"></div></div></section>

<section class="copy-section alt"><div class="copy-wrap"><div class="kicker">Принципы работы</div><h2 class="copy-title">Как мы работаем: от консультации до маршрута лечения</h2><div class="copy-grid"><article class="copy-card"><h3>Сначала понимаем причины</h3><p>На первом этапе собираем жалобы, историю лечения и оцениваем функциональные особенности:</p><ul class="copy-list"><li>какие симптомы беспокоят и как давно;</li><li>какое стоматологическое лечение уже проводилось;</li><li>есть ли дискомфорт после протезирования, ортодонтии, установки коронок;</li><li>как вы жуете, есть ли напряжение в челюстях, шее, голове.</li></ul><p>Это позволяет увидеть картину целиком, а не только отдельные зубы.</p></article><article class="copy-card"><h3>Не лечим лишнего</h3><p>В маршрут попадает только то, что действительно влияет на результат. Мы не предлагаем «лечение всего сразу», а выделяем ключевые точки вмешательства:</p><ul class="copy-list"><li>что требует коррекции в первую очередь;</li><li>что можно наблюдать в динамике;</li><li>какие изменения безопасны и целесообразны именно для вас.</li></ul></article><article class="copy-card"><h3>Соединяем специалистов при необходимости</h3><p>Если проблема выходит за рамки одного направления, формируем понятную последовательность дальнейших шагов:</p><ul class="copy-list"><li>при необходимости подключаем ортодонта, ортопеда, терапевта, ЛОРа, остеопата и других специалистов;</li><li>объясняем, зачем нужен каждый этап и как он связан с общей целью;</li><li>помогаем выстроить лечение в логичной очередности, без лишних процедур.</li></ul></article></div></div></section>

<section class="section" id="start"><div class="wrap"><div class="section-head"><div><div class="kicker">Как начинается работа</div><h2>От консультации к понятному маршруту</h2></div><p class="section-copy">Вы получаете понятный маршрут, а не просто список процедур.</p></div><div class="route"><article class="route-card"><div class="step">01</div><h3>Консультация</h3><p>Консультация по функциональной стоматологии в Новосибирске в клинике «Архитектура здоровья» — это первый шаг к пониманию причин ваших симптомов.</p><ul class="copy-list"><li>жалобы и привычные ощущения;</li><li>прошлое стоматологическое лечение;</li><li>ожидания от терапии и возможные ограничения.</li></ul></article><article class="route-card"><div class="step">02</div><h3>Функциональная оценка</h3><p>Специалист оценивает:</p><ul class="copy-list"><li>прикус и положение челюстей;</li><li>работу ВНЧС и жевательных мышц;</li><li>при необходимости — связанные функциональные факторы: дыхание, положение головы и шеи, осанку.</li></ul><p>При необходимости могут быть рекомендованы дополнительные исследования (снимки, фотопротокол, функциональные тесты).</p></article><article class="route-card"><div class="step">03</div><h3>Маршрут</h3><p>На основе оценки составляем индивидуальный план дальнейших шагов:</p><ul class="copy-list"><li>наблюдение и контроль в динамике;</li><li>уточняющая диагностика;</li><li>лечение с привлечением смежных специалистов.</li></ul><p>Вы получаете понятный маршрут, а не просто список процедур.</p></article></div></div></section>

<section class="copy-section alt"><div class="copy-wrap"><div class="kicker">FAQ</div><h2 class="copy-title">Вопросы и ответы</h2><div class="faq-grid"><article class="faq-item"><h3>Что такое функциональная стоматология?</h3><p>Функциональная стоматология — это подход, при котором зубочелюстная система рассматривается как единое целое. Внимание уделяется не только зубам, но и прикусу, работе ВНЧС, жевательных мышц, дыханию и осанке.</p></article><article class="faq-item"><h3>Чем такой подход отличается от обычного лечения зубов?</h3><p>Обычное лечение часто фокусируется на отдельных зубах: кариес, пломбы, коронки, виниры. Функциональный подход дополнительно оценивает, как эти изменения повлияют на работу всей системы: прикус, суставы, мышцы, комфорт при жевании и в покое.</p></article><article class="faq-item"><h3>Когда нужна консультация по функциональной стоматологии?</h3><p>Консультация имеет смысл, если:</p><ul><li>есть дискомфорт после протезирования, установки коронок, брекетов;</li><li>щёлкает или болит челюстной сустав;</li><li>трудно жевать, хотя зубы внешне в порядке;</li><li>есть постоянное напряжение в области лица, челюстей, головы, шеи.</li></ul></article><article class="faq-item"><h3>Как проходит диагностика нарушений прикуса и работы челюстей?</h3><p>Диагностика включает сбор жалоб, осмотр, оценку прикуса, положения челюстей, работы ВНЧС и жевательных мышц. При необходимости врач рекомендует дополнительные исследования и функциональные тесты.</p></article><article class="faq-item"><h3>Сколько длится консультация?</h3><p>Длительность приёма зависит от сложности случая. Обычно на первичную консультацию и функциональную оценку отводится достаточное время, чтобы спокойно обсудить жалобы, провести осмотр и сформировать предварительный план.</p></article><article class="faq-item"><h3>Нужно ли брать с собой снимки и результаты предыдущего лечения?</h3><p>Да, это поможет врачу быстрее понять историю вашего лечения. Если у вас есть снимки, заключения, ортодонтические или ортопедические конструкции — возьмите их с собой или сообщите, где они хранятся.</p></article></div></div></section>

<section class="cta"><div class="wrap"><div class="cta-box"><div><h2>Записаться на консультацию</h2><p>Если вас беспокоит прикус, напряжение мышц, работа челюсти или дискомфорт после лечения, начните с консультации в клинике «Архитектура здоровья» в Новосибирске. Мы поможем оценить ситуацию и сформировать понятный дальнейший маршрут.</p><div class="contact-lines"><div><strong>Запись на консультацию по функциональной стоматологии</strong></div><div>Телефон: [укажите телефон]</div><div>Мессенджеры: [укажите, если есть]</div></div></div><div class="cta-action"><a class="btn" href="#">Записаться на консультацию <span>→</span></a></div></div></div></section>
</main>'''

          start=s.find('<main>')
          end=s.find('</main>')
          if start<0 or end<0 or end<start:
              raise SystemExit('main section not found')
          end += len('</main>')
          s=s[:start]+main+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'Функциональная стоматология в Новосибирске | Диагностика прикуса и ВНЧС — Архитектура здоровья' interface-lab/functional-dentistry/index.html
          grep -Fq 'Когда стоит обратиться к специалисту по функциональной стоматологии' interface-lab/functional-dentistry/index.html
          grep -Fq 'Вопросы и ответы' interface-lab/functional-dentistry/index.html
          grep -Fq 'functional-dentistry-calm-approved.webp' interface-lab/functional-dentistry/index.html
