name: Enhance promo contrast

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Enhance promo only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = ".promo-badge{position:absolute;top:126px;left:50%;width:max-content;max-width:920px;margin:0;padding:13px 30px 11px;text-align:center;transform:translateX(-50%);border:1px solid rgba(181,150,98,.56);border-radius:16px;background:linear-gradient(180deg,rgba(239,246,240,.98),rgba(250,247,241,.98));box-shadow:0 10px 28px rgba(71,58,38,.09);color:#34443a}.promo-copy{font:500 18px/1.25 'Cormorant Garamond',Georgia,serif;letter-spacing:-.005em;white-space:nowrap}.promo-copy strong{font-weight:700;color:#8f6f3f}.promo-cta{display:block;width:max-content;margin:7px auto 0;padding:6px 16px 0;border-top:1px solid rgba(181,150,98,.38);font:700 10px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}"
          new = ".promo-badge{position:absolute;top:126px;left:50%;width:max-content;max-width:920px;margin:0;padding:13px 30px 11px;text-align:center;transform:translateX(-50%);border:2px solid rgba(181,150,98,.72);border-radius:16px;background:linear-gradient(180deg,rgba(239,246,240,.98),rgba(250,247,241,.98));box-shadow:0 12px 30px rgba(71,58,38,.15);color:#26362d}.promo-copy{font:600 20px/1.22 'Cormorant Garamond',Georgia,serif;letter-spacing:-.005em;white-space:nowrap}.promo-copy strong{font-weight:800;color:#76572f}.promo-cta{display:block;width:max-content;margin:7px auto 0;padding:6px 16px 0;border-top:1px solid rgba(181,150,98,.50);font:750 11px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#355640}"
          if old not in s:
              raise SystemExit('promo style marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('.promo-copy{font-size:14px;white-space:normal}.promo-cta{font-size:9px}', '.promo-copy{font-size:15px;white-space:normal}.promo-cta{font-size:10px}', 1)

          # Guard approved geometry and promo position.
          for marker in [
              '.promo-badge{position:absolute;top:126px;left:50%;',
              '.map{position:absolute;left:50%;top:-88px;width:1120px;height:920px;',
              '.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;'
          ]:
              if marker not in s:
                  raise SystemExit('geometry guard failed: ' + marker)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/enhance-promo-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/enhance-promo-contrast.yml
          git commit -m "Increase promo contrast and emphasis"
          git push origin HEAD:feature/site-v1
