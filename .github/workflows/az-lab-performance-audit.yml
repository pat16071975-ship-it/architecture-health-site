name: AZ Lab performance audit improvements
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-performance-audit.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Optimize Interface Lab
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/az_optimize.py
          BASE=656328b56f9bab393dff63fc1cfd3b77383c8776
          git merge-base --is-ancestor "$BASE" HEAD
          rm -f .github/workflows/az-lab-performance-audit.yml .github/scripts/az_optimize.py
          changed=$(git diff --name-only "$BASE")
          echo "$changed"
          if echo "$changed" | grep -Ev '^(interface-lab/|assets/fonts/|assets/direction-hero/)' | grep -q .; then
            echo 'STOP: files outside Interface Lab optimization scope changed' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab assets/fonts assets/direction-hero .github/workflows/az-lab-performance-audit.yml .github/scripts/az_optimize.py
          git commit -m 'Optimize Interface Lab motion, fonts and images'
          git push origin feature/site-v1
