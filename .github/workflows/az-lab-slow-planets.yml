name: AZ Lab slow planet rotation

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-slow-planets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Slow both planet orbits by 1.5x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('interface-lab/index.html')
          text = path.read_text(encoding='utf-8')

          expected = {
              'const INNER_DURATION=42000;': 1,
              'const OUTER_DURATION=76000;': 1,
              'orbits-20260904-4': 2,
              '· 42/76 сек': 1,
          }
          for fragment, count in expected.items():
              actual = text.count(fragment)
              if actual != count:
                  raise SystemExit(f'Expected {count} occurrence(s) of {fragment!r}, found {actual}')

          text = text.replace('const INNER_DURATION=42000;', 'const INNER_DURATION=63000;')
          text = text.replace('const OUTER_DURATION=76000;', 'const OUTER_DURATION=114000;')
          text = text.replace('orbits-20260904-4', 'orbits-20260904-5')
          text = text.replace('· 42/76 сек', '· 63/114 сек')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('interface-lab/index.html').read_text(encoding='utf-8')
          required = [
              'const INNER_DURATION=63000;',
              'const OUTER_DURATION=114000;',
              'orbits-20260904-5',
              '· 63/114 сек',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing marker: ' + marker)
          if 'const INNER_DURATION=42000;' in text or 'const OUTER_DURATION=76000;' in text:
              raise SystemExit('Old orbit duration remains')

          match = re.search(r'<script>([\s\S]*)</script>', text)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/az-interface-lab.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/az-interface-lab.js

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/az-lab-slow-planets.yml
          git add interface-lab/index.html
          git commit -m "Slow planet rotation by 1.5x"
          git push origin HEAD:feature/site-v1
