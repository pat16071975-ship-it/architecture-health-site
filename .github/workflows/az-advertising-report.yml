name: AZ advertising report
on:
  push:
    branches: ['feature/az-advertising-report-v1-20261026', 'feature/az-advertising-mis-bridge-20261027']
    paths:
      - 'az-baze-auth/advertising_report.py'
      - 'az-baze-auth/metrika_auto.py'
      - 'az-baze-auth/advertising_mis_bridge.py'
      - 'az-baze-auth/paid_services_upload.py'
      - 'az-baze-auth/daily_upload.py'
      - 'az-baze-auth/completed_upload.py'
      - 'az-baze-auth/report_storage.py'
      - 'az-baze-auth/test_advertising_report.py'
      - 'az-baze-auth/test_advertising_mis_bridge.py'
      - 'reports/advertising.html'
      - 'reports/advertising.js'
      - 'reports/menu.html'
      - 'az-baze-auth/templates/uploads.html'
      - 'az-baze-auth/templates/advertising_costs_fragment.html'
      - 'az-baze-auth/templates/base.html'
      - '.github/workflows/az-advertising-report.yml'
  pull_request:
    paths:
      - 'az-baze-auth/advertising_report.py'
      - 'az-baze-auth/metrika_auto.py'
      - 'az-baze-auth/advertising_mis_bridge.py'
      - 'az-baze-auth/paid_services_upload.py'
      - 'az-baze-auth/daily_upload.py'
      - 'az-baze-auth/completed_upload.py'
      - 'az-baze-auth/report_storage.py'
      - 'az-baze-auth/test_advertising_report.py'
      - 'az-baze-auth/test_advertising_mis_bridge.py'
      - 'reports/advertising.html'
      - 'reports/advertising.js'
      - 'reports/menu.html'
      - 'az-baze-auth/templates/uploads.html'
      - 'az-baze-auth/templates/advertising_costs_fragment.html'
      - 'az-baze-auth/templates/base.html'
      - '.github/workflows/az-advertising-report.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt
      - name: Python syntax and report tests
        working-directory: az-baze-auth
        run: |
          python -m py_compile advertising_report.py metrika_auto.py advertising_mis_bridge.py paid_services_upload.py daily_upload.py completed_upload.py report_storage.py
          python -m unittest -v test_advertising_report.py
          python -m unittest -v test_advertising_mis_bridge.py
          python -m unittest -v test_paid_services.py test_paid_services_periods.py test_completed_upload.py test_upload_consistency_atomic.py test_upload_reconcile.py
      - name: JavaScript syntax
        run: node --check reports/advertising.js
      - name: Approved scope contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('reports/advertising.html').read_text(encoding='utf-8')+'\n'+Path('reports/advertising.js').read_text(encoding='utf-8')
          required=[
              'Рекламный отчёт','Главное за период','Расходы на рекламу','Клики по рекламе',
              'Посещения сайта','Целевые лиды','Состоявшиеся первичные приёмы',
              'Выручка первичных приёмов','Выручка новых пациентов за 30 дней',
              'Работа клиники за период','Динамика','Источники',
              'Не хватает данных CRM для построения отчёта',
              'Стоимость рекламного первичного','ROAS первичных',
          ]
          forbidden=[
              'Устройства','Глубина просмотра','Отказы','Первично записались',
              'Потратили и получили','id="crmNote"','crm-note','id="providerRevenueRows"',
          ]
          assert all(x in text for x in required)
          assert all(x not in text for x in forbidden)
          js=Path('reports/advertising.js').read_text(encoding='utf-8')
          assert 'function renderSources()' in js
          assert "const expandable=campaigns.length>0;" in js
          assert "report-cost-editor" not in js
          assert "data-cost-save" not in js
          assert "data-cost-field" not in js
          assert "/api/reports/advertising/costs" not in js
          assert "contractors_payment" in js
          assert "total_spend" in js
          assert "sourceKey==='yandex_ads'||sourceKey==='instagram'" not in js
          assert 'spend_provenance' in js
          assert 'Стоимость клика не считается, пока охват расходов и кликов не совпадает.' in js
          html=Path('reports/advertising.html').read_text(encoding='utf-8')
          assert 'value="primary_paid">Выручка первичных</option>' in html
          assert 'value="actual_received_total">Фактически получено денег</option>' in html
          assert '<option value="spend">Расходы</option>' not in html
          menu=Path('reports/menu.html').read_text(encoding='utf-8')
          assert '/reports/advertising/' in menu

          uploads=Path('az-baze-auth/templates/uploads.html').read_text(encoding='utf-8')
          assert '5. Яндекс Метрика' in uploads
          assert 'name="metrika_zip"' in uploads
          assert 'Загрузить данные Яндекс Метрики' in uploads
          assert '/api/reports/advertising/metrika/sync' in uploads
          # Protected legacy upload template stays byte-for-byte outside the
          # advertising feature; the new UI is isolated in its own fragment.
          fragment=Path('az-baze-auth/templates/advertising_costs_fragment.html').read_text(encoding='utf-8')
          assert '6. Расходы на рекламу' in fragment
          assert 'Оплата рекламы' in fragment
          assert 'Подрядчики' in fragment
          assert 'Всего расходов на рекламу' in fragment
          assert '/api/reports/advertising/costs' in fragment
          daily=Path('az-baze-auth/daily_upload.py').read_text(encoding='utf-8')
          assert 'advertising_costs_fragment.html' in daily
          assert 'if "upload_services" in perms:' in daily

          source=Path('az-baze-auth/report_storage.py').read_text(encoding='utf-8')
          assert 'advertising_report.register_advertising_report(app)' in source
          assert '"az-advertising-costs-v1"' in source
          print('ADVERTISING_REPORT_SCOPE=PASS')
          PY
