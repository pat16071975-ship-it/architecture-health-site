name: AZ Lab fix close and dentistry
on:
  workflow_dispatch:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-lab-fix-close-and-dentistry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Patch Interface Lab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text()
          old=".az-lab-direction-close{position:absolute!important;left:auto!important;right:28px!important;top:22px!important;transform:none!important;width:92px!important;height:92px!important;border-radius:50%!important;border:2px solid rgba(68,99,79,.78)!important;background:#f7f3ec!important;color:#344b3d!important;font:400 68px/84px Arial,sans-serif!important;text-align:center!important;cursor:pointer!important;z-index:31!important;box-shadow:0 7px 18px rgba(58,49,37,.16)!important;padding:0!important}"
          new=".az-lab-direction-close{position:absolute!important;left:50%!important;right:auto!important;top:12px!important;transform:translateX(-50%)!important;width:58px!important;height:58px!important;border-radius:50%!important;border:2px solid rgba(68,99,79,.78)!important;background:#f7f3ec!important;color:#344b3d!important;font:400 42px/52px Arial,sans-serif!important;text-align:center!important;cursor:pointer!important;z-index:31!important;box-shadow:0 6px 15px rgba(58,49,37,.14)!important;padding:0!important}"
          if old not in s: raise SystemExit('close CSS marker not found')
          s=s.replace(old,new,1)
          old2="    const el=byName.get(norm(name));\n    if(!el)return null;"
          new2="    const el=byName.get(norm(name))||(name==='Терапия'?byName.get(norm('Стоматология')):null);\n    if(!el)return null;"
          if old2 not in s: raise SystemExit('planet lookup marker not found')
          s=s.replace(old2,new2,1)
          s=s.replace("src=\"../?lab=orbits-20260904-13\"","src=\"../?lab=orbits-20260904-14\"",1)
          s=s.replace("frame.src='../?lab=orbits-20260904-13&t='+Date.now()","frame.src='../?lab=orbits-20260904-14&t='+Date.now()",1)
          p.write_text(s)
          PY
          node --check <(python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('interface-lab/index.html').read_text()
          print(re.search(r'<script>([\s\S]*?)</script>',s).group(1))
          PY
          ) || true
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-lab-fix-close-and-dentistry.yml
          git add interface-lab/index.html
          git commit -m 'Center direction close button and restore dentistry info'
          git push origin feature/site-v1
