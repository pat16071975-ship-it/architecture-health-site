name: AZ Lab dentistry direction summaries
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-dentistry-info.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Add central dentistry descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old="  'Терапия':{title:'Стоматология',items:['после лечения зубов красиво, но неудобно жевать','коронки или протезы ощущаются непривычно','зубы снова меняют положение','требуется сложное восстановление нескольких зубов'],summary:'Важно не только восстановить отдельный зуб, но и понять, как в целом должны работать зубы и челюсти.'},"
          new="""  'Стоматология терапия':{title:'Стоматология терапия',items:['беспокоит зубная боль или повышенная чувствительность','появился кариес или нужно заменить старую пломбу','зуб откололся или разрушился и его нужно восстановить','нужно проверить состояние зубов и понять, какое лечение требуется'],summary:'Терапевтическая стоматология помогает диагностировать и лечить заболевания зубов, сохраняя собственные ткани зуба там, где это возможно.'},
  'Стоматология ортопедия':{title:'Стоматология ортопедия',items:['зуб сильно разрушен и обычной пломбы уже недостаточно','отсутствует один или несколько зубов','коронка, вкладка или протез стали неудобны','нужно восстановить жевание, форму и эстетику зубного ряда'],summary:'Стоматолог-ортопед восстанавливает разрушенные и отсутствующие зубы с учётом прикуса и работы всей зубочелюстной системы.'},
  'Стоматология хирургия':{title:'Стоматология хирургия',items:['нужно оценить, можно ли сохранить проблемный зуб','беспокоит зуб мудрости','есть воспаление или болезненность в области зуба и десны','планируется хирургический этап стоматологического лечения'],summary:'Стоматолог-хирург оценивает состояние зубов и окружающих тканей и определяет необходимость и объём хирургического лечения.'},"""
          if old not in s:
              raise SystemExit('STOP: old therapy description not found')
          s=s.replace(old,new,1)
          old_path="'Терапия':'/architecture-health-site/interface-lab/dentistry/'"
          new_path="'Стоматология терапия':'/architecture-health-site/interface-lab/dentistry/'"
          if old_path not in s:
              raise SystemExit('STOP: therapy detail path not found')
          s=s.replace(old_path,new_path,1)
          protected=[
            "const INNER_DURATION=63000;",
            "const OUTER_DURATION=114000;",
            "const innerNames=['Функциональная стоматология','Ортодонтия','Стоматология ортопедия','Стоматология хирургия','Стоматология терапия'];",
            "const outerNames=['ИГГТ','DIERS диагностика','Нейропсихология','Детская неврология','Миофункциональная терапия','Превентивная медицина','Гастроэнтерология','Нутрициология','Остеопатия'];",
            "const innerAngles=[180,252,324,36,108];",
            "const outerAngles=[160,200,240,280,320,0,40,80,120];",
            "innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14",
            "font-size',viewportWidth>=1181?'15':'12'",
            "dur','5.8s",
            "textPath.textContent='Не лечим по отдельности. Понимаем, как всё связано в вашем организме'",
          ]
          for marker in protected:
              if marker not in s:
                  raise SystemExit('STOP: protected marker missing: '+marker)
          for marker in ["'Стоматология терапия':{title:'Стоматология терапия'","'Стоматология ортопедия':{title:'Стоматология ортопедия'","'Стоматология хирургия':{title:'Стоматология хирургия'","'Стоматология терапия':'/architecture-health-site/interface-lab/dentistry/'"]:
              if marker not in s:
                  raise SystemExit('STOP: new marker missing: '+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only summaries
        run: |
          rm -f .github/workflows/az-lab-dentistry-info.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-dentistry-info.yml
          git commit -m 'Add dentistry summaries to Interface Lab center'
          git push origin feature/site-v1