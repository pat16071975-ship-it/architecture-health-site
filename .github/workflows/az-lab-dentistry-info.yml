name: AZ Lab dentistry info
on:
  push:
    branches: ["feature/site-v1"]
    paths:
      - ".github/workflows/az-lab-dentistry-info.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Patch Interface Lab
        run: python3 .github/scripts/az_lab_dentistry_info.py
      - name: Commit viewer-only summaries
        run: |
          rm -f .github/workflows/az-lab-dentistry-info.yml .github/scripts/az_lab_dentistry_info.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html .github/workflows/az-lab-dentistry-info.yml .github/scripts/az_lab_dentistry_info.py
          git commit -m "Add dentistry summaries to Interface Lab center"
          git push origin feature/site-v1
