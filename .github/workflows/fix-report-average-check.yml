name: Fix report average check

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/fix-report-average-check.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0

      - name: Update average check formulas
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_avg_check.py
          python3 /tmp/fix_avg_check.py

      - name: Commit formula correction and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use primary visits for medical average checks"
          git pull --rebase origin feature/site-v1
          git push origin HEAD:feature/site-v1
