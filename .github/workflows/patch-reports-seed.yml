name: Patch reports historical seed loader
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/patch-reports-seed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Insert encrypted historical seed loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reports/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./seed-data.js?v=20260826-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Load confirmed historical report data"
            git push origin HEAD:feature/site-v1
          fi
