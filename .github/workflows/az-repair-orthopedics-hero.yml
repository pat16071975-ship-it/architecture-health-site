name: AZ repair orthopedics hero

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-repair-orthopedics-hero.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Decode and verify current full-resolution hero
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('assets/direction-hero/dentistry-orthopedics-consultation.webp')
          im = Image.open(src)
          im.load()
          print('SOURCE', im.format, im.size, src.stat().st_size)
          if im.size[0] < 1000 or im.size[1] < 1200:
              raise SystemExit(f'Image unexpectedly small: {im.size}')
          out = Path('assets/direction-hero/dentistry-orthopedics-consultation-full.png')
          im.convert('RGB').save(out, 'PNG', optimize=False)
          check = Image.open(out)
          check.load()
          print('OUTPUT', check.format, check.size, out.stat().st_size)
          if check.size != im.size:
              raise SystemExit('Output dimensions changed')
          PY
      - name: Point page to verified PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('interface-lab/dentistry-orthopedics/index.html')
          s = p.read_text(encoding='utf-8')
          old = '../../assets/direction-hero/dentistry-orthopedics-consultation.webp?v=20260914-3'
          if old not in s:
              old = '../../assets/direction-hero/dentistry-orthopedics-consultation.webp?v=20260914-2'
          if old not in s:
              raise SystemExit('Expected orthopedics hero reference not found')
          s = s.replace(old, '../../assets/direction-hero/dentistry-orthopedics-consultation-full.png?v=20260914-5')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit verified PNG and page reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/direction-hero/dentistry-orthopedics-consultation-full.png interface-lab/dentistry-orthopedics/index.html
          git commit -m 'Publish verified full-resolution orthopedics hero PNG'
          git push origin HEAD:feature/site-v1
