name: AZ repair orthopedics hero

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-repair-orthopedics-hero.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Record corrected chunk diagnostics
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          lines=[]
          for p in sorted(Path('.tmp-ortho-fix').glob('fix*.b64')):
              data=p.read_bytes()
              lines.append(f'{p.name} {len(data)} {hashlib.sha256(data).hexdigest()}')
          Path('.tmp-ortho-fix/diagnostics.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-ortho-fix/diagnostics.txt
          git commit -m 'Record corrected orthopedics chunk diagnostics'
          git push origin HEAD:feature/site-v1
