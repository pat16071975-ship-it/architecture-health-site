name: AZ repair orthopedics hero

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-repair-orthopedics-hero.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Decode staged approved hero and verify binary
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image

          parts = sorted(Path('.tmp-ortho-q75').glob('part*.b64'))
          print('PARTS', [p.name for p in parts])
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 chunks, got {len(parts)}')
          b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = base64.b64decode(b64, validate=True)
          out = Path('assets/direction-hero/dentistry-orthopedics-consultation.webp')
          out.write_bytes(raw)
          im = Image.open(out)
          im.load()
          print('VERIFIED', im.format, im.size, out.stat().st_size)
          if im.format != 'WEBP':
              raise SystemExit(f'Unexpected format: {im.format}')
          if im.size != (600, 750):
              raise SystemExit(f'Unexpected dimensions: {im.size}')
          if out.stat().st_size < 25000:
              raise SystemExit(f'Unexpectedly small file: {out.stat().st_size}')
          PY
      - name: Update page cache-buster and actual dimensions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('interface-lab/dentistry-orthopedics/index.html')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(
              r'(\.\./\.\./assets/direction-hero/dentistry-orthopedics-consultation\.webp)\?v=[^"\']+',
              r'\1?v=20260914-7',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Hero reference replacement count={n}')
          s2 = re.sub(
              r'(<img src="\.\./\.\./assets/direction-hero/dentistry-orthopedics-consultation\.webp\?v=20260914-7"[^>]*?)width="\d+" height="\d+"',
              r'\1width="600" height="750"',
              s2,
              count=1,
          )
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit verified image and page reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/direction-hero/dentistry-orthopedics-consultation.webp interface-lab/dentistry-orthopedics/index.html
          git commit -m 'Publish verified orthopedics hero image'
          git push origin HEAD:feature/site-v1
