name: AZ localize calm dentistry photo
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-localize-calm-dentistry-photo.yml']
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Download photo locally and patch page
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 4 --retry-delay 2 --max-time 90 \
            'https://images.unsplash.com/photo-1778517436057-4ed5f9fe95bd?auto=format&fit=crop&fm=jpg&q=86&w=1600' \
            -o assets/functional-dentistry-calm-hero.jpg
          test -s assets/functional-dentistry-calm-hero.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text()
          old='https://images.unsplash.com/photo-1778517436057-4ed5f9fe95bd?auto=format&fit=crop&fm=jpg&q=86&w=1600'
          new='../../assets/functional-dentistry-calm-hero.jpg'
          if old not in s:
              raise SystemExit('external image URL not found in detail page')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-localize-calm-dentistry-photo.yml
          git add assets/functional-dentistry-calm-hero.jpg interface-lab/functional-dentistry/index.html
          git commit -m 'Store calm dentistry hero image locally'
          git push origin feature/site-v1
