name: AZ fix functional dentistry absolute route
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-fix-functional-absolute-route.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Patch only detail link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text()
          old='href="functional-dentistry/" target="_top"'
          new='href="/architecture-health-site/interface-lab/functional-dentistry/" target="_top"'
          if old not in s:
              raise SystemExit('expected relative detail link not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit exact link fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/az-fix-functional-absolute-route.yml
          git add interface-lab/index.html
          git commit -m "Fix functional dentistry absolute route"
          git push origin feature/site-v1
