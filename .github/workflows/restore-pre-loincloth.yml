name: Restore pre-loincloth site
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/restore-pre-loincloth.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Restore exact pre-loincloth index
        shell: bash
        run: |
          git cat-file blob 8c3f272552f50df55390a6652d600897a652fd1c > index.html
          rm -f assets/loincloth-*
          rm -f .github/workflows/restore-pre-loincloth.yml
          if grep -qi 'loincloth' index.html; then
            echo 'ERROR: loincloth remains in index.html'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore site before loincloth experiments'
          git push origin HEAD:feature/site-v1
