name: AZ-BAZE Contacts

on:
  push:
    branches: [feature/az-baze-auth]
    paths:
      - 'az-baze-auth/contact_excel_import.py'
      - 'az-baze-auth/access_contacts_ext.py'
      - 'az-baze-auth/templates/contact_import.html'
      - 'az-baze-auth/templates/contacts.html'
      - 'az-baze-auth/test_contact_excel_import.py'
      - 'az-baze-auth/deploy/deploy-contact-excel-upload.sh'
      - 'az-baze-auth/deploy/deploy-contact-import-backup-fix.sh'
      - 'az-baze-auth/deploy/deploy-contacts-visual-emphasis.sh'
      - 'az-baze-auth/deploy/deploy-contacts-full-comment.sh'
      - '.github/workflows/az-baze-contacts.yml'
  workflow_dispatch:

jobs:
  contacts-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        run: python -m py_compile az-baze-auth/contact_excel_import.py az-baze-auth/access_contacts_ext.py az-baze-auth/test_contact_excel_import.py
      - name: Contacts import tests
        run: cd az-baze-auth && python -m unittest -v test_contact_excel_import.py
      - name: Deploy script syntax
        run: bash -n az-baze-auth/deploy/deploy-contact-excel-upload.sh az-baze-auth/deploy/deploy-contact-import-backup-fix.sh az-baze-auth/deploy/deploy-contacts-visual-emphasis.sh az-baze-auth/deploy/deploy-contacts-full-comment.sh
