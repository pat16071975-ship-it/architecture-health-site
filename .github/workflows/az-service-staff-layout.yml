name: AZ global service staff layout

on:
  pull_request:
    paths:
      - 'az-baze-auth/report_storage.py'
      - 'az-baze-auth/test_service_staff_layout.py'
      - 'reports/services.html'
      - 'reports/services-base.html'
      - 'reports/services-staff-layout.js'
      - 'reports/services-enhancements.js'
      - 'reports/services-payroll-manager.js'
      - '.github/workflows/az-service-staff-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staff-layout:
    runs-on: ubuntu-latest
    env:
      AZBAZE_SECRET_KEY: service-staff-layout-ci
      AZBAZE_DB: /tmp/az-service-staff-layout-ci.db
      AZBAZE_SITE_ROOT: /tmp/az-service-staff-layout-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt

      - name: Python syntax and layout tests
        run: |
          python -m py_compile az-baze-auth/report_storage.py az-baze-auth/test_service_staff_layout.py
          cd az-baze-auth
          python -m unittest -v test_service_staff_layout.py

      - name: JavaScript syntax
        run: |
          node --check reports/services-staff-layout.js
          node --check reports/services-enhancements.js
          node --check reports/services-payroll-manager.js

      - name: Global layout source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          storage=Path('az-baze-auth/report_storage.py').read_text(encoding='utf-8')
          page=Path('reports/services.html').read_text(encoding='utf-8')
          base=Path('reports/services-base.html').read_text(encoding='utf-8')
          layout=Path('reports/services-staff-layout.js').read_text(encoding='utf-8')

          assert 'SERVICE_STAFF_LAYOUT_KEY = "az-service-staff-layout-v1"' in storage
          assert 'BOOTSTRAP_BLOB_KEYS = set(REPORT_BLOB_KEYS) | {SERVICE_STAFF_LAYOUT_KEY}' in storage
          assert '@app.get("/api/reports/services-staff-layout")' in storage
          assert '@app.put("/api/reports/services-staff-layout")' in storage
          put_tail=storage.split('@app.put("/api/reports/services-staff-layout")',1)[1]
          assert '@admin_required' in put_tail.split('def services_staff_layout_put',1)[0]
          assert 'services-staff-layout.js?v=20261110-1' in page
          assert 'staffDoctorNames' in base
          assert 'Скрытие не удаляет данные и не меняет итоги.' in layout
          assert 'Сохранить для всех' in layout
          assert 'az-staff-layout-hidden' in layout
          print('AZ_SERVICE_STAFF_LAYOUT=PASS')
          PY
