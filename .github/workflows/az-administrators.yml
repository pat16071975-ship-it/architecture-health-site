name: AZ administrators standalone preview
on:
  pull_request:
    paths:
      - 'az-baze-auth/administrators.py'
      - 'az-baze-auth/templates/administrators.html'
      - 'az-baze-auth/test_administrators.py'
      - 'az-baze-auth/server.py'
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/section_navigation.py'
      - 'az-baze-auth/menu_order.py'
      - 'az-baze-auth/templates/user_form.html'
      - 'az-baze-auth/templates/admin.html'
      - '.github/workflows/az-administrators.yml'
permissions:
  contents: read
jobs:
  standalone-administrators:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r az-baze-auth/requirements.txt
      - name: Syntax and module tests
        working-directory: az-baze-auth
        run: |
          python -B -m py_compile administrators.py test_administrators.py server.py
          python -B -m unittest -v test_administrators
          python -B -m unittest -v test_menu_order test_section_navigation test_accounting_section
      - name: Scope guard
        run: |
          ! git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '^(reports/|az-baze-auth/(finrez|payroll_registry|report_accounting|advertising_report)\.py)'
