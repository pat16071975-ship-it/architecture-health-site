name: AZ administrators standalone preview
on:
  pull_request:
    paths:
      - 'az-baze-auth/administrators.py'
      - 'az-baze-auth/templates/administrators.html'
      - 'az-baze-auth/test_administrators.py'
      - 'az-baze-auth/browser_administrators.py'
      - 'az-baze-auth/server.py'
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/section_navigation.py'
      - 'az-baze-auth/menu_order.py'
      - 'az-baze-auth/templates/user_form.html'
      - 'az-baze-auth/templates/admin.html'
      - '.github/workflows/az-administrators.yml'
permissions:
  contents: read
jobs:
  standalone-administrators:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Scope guard (fail closed; negative control)
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "$BASE"
          [[ "$(git rev-parse HEAD)" == "$HEAD" ]]
          if bash az-baze-auth/verify_administrators_scope.sh \
              0000000000000000000000000000000000000000 "$HEAD" > /dev/null 2>&1; then
            echo "SCOPE_GUARD=FAIL; negative missing-base control passed unexpectedly" >&2
            exit 1
          fi
          bash az-baze-auth/verify_administrators_scope.sh "$BASE" "$HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r az-baze-auth/requirements.txt playwright==1.55.0
      - name: Syntax and module tests
        working-directory: az-baze-auth
        run: |
          python -B -m py_compile administrators.py test_administrators.py server.py
          python -B -m unittest -v test_administrators
          python -B -m unittest -v test_menu_order test_section_navigation test_accounting_section
      - name: Desktop and mobile browser smoke
        working-directory: az-baze-auth
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$CHROMIUM_PATH"
          python -B browser_administrators.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: administrators-desktop-mobile-preview
          path: az-baze-auth/administrators-browser-artifacts/
          if-no-files-found: ignore
