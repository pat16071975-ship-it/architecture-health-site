name: Temporary verify gastro image

on:
  push:
    branches:
      - tmp-gastro-image-verify
    paths:
      - .github/workflows/tmp-verify-gastro.yml
      - tmp/gastro-test.webp

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-gastro-image-verify
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Verify image
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('tmp/gastro-test.webp')
          raw=p.read_bytes()
          im=Image.open(p); im.load()
          pixel=hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()
          out=(f'bytes={len(raw)}\nraw_sha256={hashlib.sha256(raw).hexdigest()}\n'
               f'format={im.format}\nsize={im.size[0]}x{im.size[1]}\npixel_sha256={pixel}\n')
          print(out)
          Path('tmp/gastro-diagnostics.txt').write_text(out,encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/gastro-diagnostics.txt
          git commit -m 'Record gastro image transfer diagnostics'
          git push origin HEAD:tmp-gastro-image-verify
