name: AZ Lab fix all directions as planets

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-fix-all-planets.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('interface-lab/index.html')
          s = p.read_text(encoding='utf-8')
          old = "doc.querySelectorAll('.direction').forEach(el=>byName.set(norm(el.textContent),el));"
          new = "doc.querySelectorAll('.direction').forEach(el=>byName.set(norm(el.innerText||el.textContent),el));"
          if old not in s:
              raise SystemExit('Expected direction mapping line not found')
          s = s.replace(old, new, 1)
          old2 = ".az-lab-orbit-host .direction.az-lab-planet{"
          new2 = ".az-lab-orbit-host .direction{"
          if old2 not in s:
              raise SystemExit('Expected planet style selector not found')
          s = s.replace(old2, new2, 1)
          s = s.replace("orbits-20260903-4", "orbits-20260903-5")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify all 12 direction labels and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('interface-lab/index.html').read_text(encoding='utf-8')
          required = [
            'Функциональная стоматология','Ортодонтия','Остеопатия','Терапия',
            'ИГГТ','DIERS диагностика','Нейропсихология','Детская неврология',
            'Миофункциональная терапия','Превентивная медицина','Гастроэнтерология','Нутрициология'
          ]
          for name in required:
              if name not in s:
                  raise SystemExit(f'Missing direction: {name}')
          if "norm(el.innerText||el.textContent)" not in s:
              raise SystemExit('innerText mapping patch missing')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('interface-lab/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/az-lab.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/az-lab.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Make all orbit directions planets in Interface Lab"
          git push origin HEAD:feature/site-v1
