name: Fix visible planet drawings in AZ Interface Lab

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/fix-visible-planet-drawings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0

      - name: Rebuild 12 valid transparent planet images and patch viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, lzma, re, struct, zlib

          WIDTH, HEIGHT = 464, 276
          CELL_W, CELL_H = 116, 92
          PACKED = r'''
          
          '''

          compressed = base64.b64decode(''.join(PACKED.split()))
          packed = lzma.decompress(compressed)
          if len(packed) != (WIDTH * HEIGHT) // 4:
              raise SystemExit(f'Unexpected packed alpha size: {len(packed)}')

          levels = []
          for byte in packed:
              levels.extend(((byte >> 6) & 3, (byte >> 4) & 3, (byte >> 2) & 3, byte & 3))
          levels = levels[:WIDTH * HEIGHT]
          alpha_lut = (0, 96, 190, 255)
          line_rgb = (54, 72, 62)

          def png_chunk(kind: bytes, data: bytes) -> bytes:
              crc = binascii.crc32(kind + data) & 0xffffffff
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', crc)

          def encode_png(values):
              raw_rows = []
              index = 0
              for _ in range(CELL_H):
                  row = bytearray([0])
                  for _ in range(CELL_W):
                      alpha = alpha_lut[values[index]]
                      index += 1
                      row.extend((*line_rgb, alpha))
                  raw_rows.append(bytes(row))
              raw = b''.join(raw_rows)
              return (
                  b'\x89PNG\r\n\x1a\n'
                  + png_chunk(b'IHDR', struct.pack('>IIBBBBB', CELL_W, CELL_H, 8, 6, 0, 0, 0))
                  + png_chunk(b'IDAT', zlib.compress(raw, 9))
                  + png_chunk(b'IEND', b'')
              )

          files = [
              ('planet-01-iggt.png', 'ИГГТ'),
              ('planet-02-diers.png', 'DIERS диагностика'),
              ('planet-03-functional-dentistry.png', 'Функциональная стоматология'),
              ('planet-04-neuropsychology.png', 'Нейропсихология'),
              ('planet-05-pediatric-neurology.png', 'Детская неврология'),
              ('planet-06-orthodontics.png', 'Ортодонтия'),
              ('planet-07-myofunctional.png', 'Миофункциональная терапия'),
              ('planet-08-preventive.png', 'Превентивная медицина'),
              ('planet-09-osteopathy.png', 'Остеопатия'),
              ('planet-10-gastroenterology.png', 'Гастроэнтерология'),
              ('planet-11-nutrition.png', 'Нутрициология'),
              ('planet-12-therapy.png', 'Терапия'),
          ]

          target = Path('assets/lab-planets')
          target.mkdir(parents=True, exist_ok=True)
          art_map = {}
          for index, (filename, title) in enumerate(files):
              row, col = divmod(index, 4)
              tile = []
              for y in range(CELL_H):
                  start = (row * CELL_H + y) * WIDTH + col * CELL_W
                  tile.extend(levels[start:start + CELL_W])
              visible = sum(1 for value in tile if value)
              if visible < 250:
                  raise SystemExit(f'Not enough visible drawing pixels in {filename}: {visible}')
              output = target / filename
              output.write_bytes(encode_png(tile))
              art_map[title] = f'/architecture-health-site/assets/lab-planets/{filename}?v=20260904-1'

          page = Path('interface-lab/index.html')
          html = page.read_text(encoding='utf-8')

          start = html.find('const PLANET_SPRITE=')
          end = html.find('function norm(value){', start)
          if start < 0 or end < 0:
              raise SystemExit('Current sprite constants were not found')

          mapping_lines = ['const PLANET_ARTS={']
          for _, title in files:
              mapping_lines.append(f"  {title!r}:{art_map[title]!r},")
          mapping_lines.append('};\n\n')
          html = html[:start] + '\n'.join(mapping_lines) + html[end:]

          collect_pattern = re.compile(r'function collectPlanets\(doc\)\{[\s\S]*?\n\}\nfunction setPlanetPositions')
          collect_replacement = '''function collectPlanets(doc){
            const byName=new Map();
            doc.querySelectorAll('.direction').forEach(el=>byName.set(norm(el.innerText||el.textContent),el));
            const prepare=(names,orbitClass)=>names.map(name=>{
              const el=byName.get(norm(name));
              if(!el)return null;
              if(el.dataset.azOriginalStyle===undefined)el.dataset.azOriginalStyle=el.getAttribute('style')||'';
              if(el.dataset.azOriginalHtml===undefined)el.dataset.azOriginalHtml=el.innerHTML;
              el.classList.add('az-lab-planet',orbitClass);
              const artUrl=PLANET_ARTS[name]||'';
              el.innerHTML='<span class="az-lab-planet-art" aria-hidden="true"><img class="az-lab-planet-art-img" src="'+artUrl+'" alt=""></span><span class="az-lab-planet-label">'+el.dataset.azOriginalHtml+'</span>';
              el.style.setProperty('transform','translate(-50%,-50%)','important');
              return el;
            }).filter(Boolean);
            return{inner:prepare(innerNames,'az-lab-inner-planet'),outer:prepare(outerNames,'az-lab-outer-planet')};
          }
          function setPlanetPositions'''
          html, count = collect_pattern.subn(collect_replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'collectPlanets replacement count: {count}')

          art_css_pattern = re.compile(r'\.az-lab-orbit-host \.direction\.az-lab-planet \.az-lab-planet-art-img\{[^}]*\}')
          art_css = ".az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-art-img{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:fill!important;opacity:1!important;filter:none!important;mix-blend-mode:normal!important;pointer-events:none!important;z-index:3!important}"
          html, count = art_css_pattern.subn(art_css, html, count=1)
          if count != 1:
              raise SystemExit(f'planet art CSS replacement count: {count}')

          html = html.replace('orbits-20260903-12', 'orbits-20260904-1')
          html = html.replace('рисунки отдельным верхним DOM-слоем', '12 рисунков внутри движущихся планет')
          html = html.replace("const PLANET_SPRITE", "const REMOVED_PLANET_SPRITE") if "const PLANET_SPRITE" in html else html
          if 'reference-sprite.webp' in html or 'planetSpriteOffsets' in html:
              raise SystemExit('Broken sprite integration still remains in viewer')
          for url in art_map.values():
              if url not in html:
                  raise SystemExit(f'Missing planet asset URL in viewer: {url}')

          page.write_text(html, encoding='utf-8')

          # Verify all 12 generated files are real 116x92 RGBA PNGs with visible alpha.
          for filename, _ in files:
              data = (target / filename).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature: {filename}')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (CELL_W, CELL_H):
                  raise SystemExit(f'Wrong PNG dimensions for {filename}: {(width, height)}')

          # Remove the known corrupted sprite and its failed split report.
          for old in ('reference-sprite.webp', 'reference-sprite-report.txt', 'reference-manifest.json'):
              path = target / old
              if path.exists():
                  path.unlink()

          # Self-delete temporary workflow from the resulting commit.
          Path('.github/workflows/fix-visible-planet-drawings.yml').unlink()
          PY

      - name: Validate viewer JavaScript and generated assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('interface-lab/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>([\s\S]*)</script>', html)
          if not match:
              raise SystemExit('Viewer script not found')
          Path('/tmp/az-interface-lab.js').write_text(match.group(1), encoding='utf-8')
          assets = sorted(Path('assets/lab-planets').glob('planet-*.png'))
          if len(assets) != 12:
              raise SystemExit(f'Expected 12 planet PNGs, found {len(assets)}')
          print('Generated assets:', len(assets))
          for asset in assets:
              print(asset.name, asset.stat().st_size)
          PY
          node --check /tmp/az-interface-lab.js
          file assets/lab-planets/planet-*.png

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render visible reference drawings inside Interface Lab planets"
          git push origin HEAD:feature/site-v1 || (git pull --rebase origin feature/site-v1 && git push origin HEAD:feature/site-v1)
