name: AZ Lab approved geometry overlay fix
on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-overlay-from-approved-baseline.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - run: python3 tools/fix_overlay.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add interface-lab/index.html
          git rm -f .github/workflows/az-lab-overlay-from-approved-baseline.yml .github/workflows/az-lab-isolate-overlay-from-orbits.yml tools/fix_overlay.py
          git commit -m "Keep direction overlay independent from planet orbits"
          git push origin feature/site-v1
