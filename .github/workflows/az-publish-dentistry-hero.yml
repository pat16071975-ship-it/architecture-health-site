name: AZ publish dentistry hero

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-publish-dentistry-hero.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Rebuild and verify approved dentistry hero
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          from PIL import Image
          specs=[
            ('part00.b64','ef0e447c010536eb6a34534ff54abc51ad0c217837d0677502c74c61b07c2441'),
            ('part01.b64','2879389a6bdee412b35d7a722dbf08aed3cc2fb7cf1d4c309b5a787b29bfd04c'),
            ('part02_0.b64','51ed2f965105951374fa73c57c448ccc4d8420db0e4afb440bb72987a5a6a79f'),
            ('part02_1.b64','d36873139f7ec9b735796e352c398237f284507eb361e5c45554c8e114110a7f'),
            ('part02_2.b64','7571798ec69079d3a2791f6a88505632824f80f1f534c519f10a7f24e788c557'),
            ('part02_3.b64','f983e7e2dec29900377ce2b7932173187678c0530f42e912bf0d5f2902658d8c'),
            ('part03.b64','909430f787a0c46d0779b293102a9f81f65b67475b202a0e16d5970526d36bea'),
            ('part04.b64','724c11b732b0685f236f7209347cf079e091954291142356e18d78e7a9030ed5'),
            ('part05.b64','737ef0885474e0a2761c13d07e9a992dd1b513a6fd671ef82e16feec70c93906'),
            ('part06.b64','665ccf019fae86a6014a5db4caa3081d2fc7fc5aa5d625b50d04d355e511d536'),
            ('part07.b64','f684c37aec5eefc0bd508d0e034569590aed290d267718c1544c7be13dd7f13c'),
          ]
          parts=[]
          for name, exp in specs:
              p=Path('.tmp-dentistry-upload')/name
              s=p.read_text(encoding='utf-8').strip()
              got=hashlib.sha256(s.encode()).hexdigest()
              print(name, len(s), got)
              if got != exp:
                  raise SystemExit(f'Chunk mismatch {name}: {got}')
              parts.append(s)
          joined=''.join(parts).encode('ascii')
          print('BASE64',len(joined),hashlib.sha256(joined).hexdigest())
          if len(joined) != 86012:
              raise SystemExit(f'Unexpected base64 length {len(joined)}')
          raw=base64.b64decode(joined,validate=True)
          got=hashlib.sha256(raw).hexdigest()
          print('RAW',len(raw),got)
          if len(raw)!=64508 or got!='24872434315cfef38dac76c3b9c86f5756fac0ffb5e8db8b5a19e82152bd1c57':
              raise SystemExit('Decoded binary mismatch')
          out=Path('assets/direction-hero/dentistry-patient-approved.webp')
          out.write_bytes(raw)
          im=Image.open(out); im.load()
          print('IMAGE',im.format,im.size,out.stat().st_size)
          if im.format!='WEBP' or im.size!=(700,875):
              raise SystemExit(f'Invalid image: {im.format} {im.size}')
          PY
      - name: Put approved image into dentistry viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('interface-lab/dentistry/index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<div class="photo-shell"><div class="photo fit"><img src="../../assets/functional-dentistry-calm-approved\.webp\?v=20260907-1"[^>]*></div></div>'
          repl='<div class="photo-shell"><div class="photo dentistry-photo"><img src="../../assets/direction-hero/dentistry-patient-approved.webp?v=20260914-1" alt="Довольный пациент стоматологии в клинике Архитектура здоровья" width="700" height="875" decoding="async" loading="eager" fetchpriority="high"></div></div>'
          s2,n=re.subn(pattern,repl,s,count=1)
          if n!=1:
              raise SystemExit(f'Hero replacement count={n}')
          css='.photo.dentistry-photo img{width:100%;height:100%;object-fit:cover;object-position:center 38%;filter:none;transform:none;padding:0}\n'
          if css not in s2:
              s2=s2.replace('</style>',css+'</style>',1)
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit verified dentistry hero and clean staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/direction-hero/dentistry-patient-approved.webp interface-lab/dentistry/index.html
          git rm -r .tmp-dentistry-upload
          git rm .github/workflows/az-publish-dentistry-hero.yml
          git commit -m 'Publish verified dentistry patient hero'
          git push origin HEAD:feature/site-v1
