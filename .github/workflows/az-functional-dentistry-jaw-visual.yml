name: AZ functional dentistry jaw visual
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-functional-dentistry-jaw-visual.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Replace hero anatomy with refined jaw fragment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text()
          css_new=r'''.visual{position:relative;min-height:520px}.jaw-shell{position:absolute;inset:8px -10px 8px 24px}.jaw-field{position:absolute;inset:32px 24px 30px 54px;border-radius:48% 52% 46% 54%/50% 44% 56% 50%;background:radial-gradient(circle at 48% 48%,rgba(255,255,255,.84),rgba(239,232,219,.62) 62%,rgba(239,232,219,.30) 100%);box-shadow:0 22px 58px rgba(65,55,42,.08);overflow:hidden}.jaw-svg{width:100%;height:100%;display:block}.jaw-svg .face{fill:none;stroke:#44634f;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;opacity:.68}.jaw-svg .jaw{fill:none;stroke:#44634f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.jaw-svg .gold{fill:none;stroke:#b59662;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.68}.jaw-svg .soft{fill:none;stroke:#7b8f78;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.42}.jaw-svg .muscle{fill:rgba(181,150,98,.11);stroke:#b59662;stroke-width:1.1;opacity:.68}.jaw-svg .air{fill:none;stroke:#44634f;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:3 5;opacity:.42}.jaw-svg .tooth{fill:rgba(251,248,242,.9);stroke:#44634f;stroke-width:.9;opacity:.86}.jaw-svg .joint{fill:#f7f3ec;stroke:#44634f;stroke-width:1.8}.jaw-svg .halo{fill:none;stroke:#b59662;stroke-width:1;opacity:.16}.ring{position:absolute;border:1px solid rgba(68,99,79,.14);border-radius:50%;pointer-events:none}.r1{width:438px;height:316px;left:8px;top:18px;transform:rotate(11deg)}.r2{width:365px;height:462px;right:0;bottom:0;border-color:rgba(181,150,98,.22);transform:rotate(-16deg)}.r3{width:242px;height:184px;left:150px;bottom:26px;border-color:rgba(68,99,79,.09);transform:rotate(20deg)}.visual-tag{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;padding:9px 13px;background:rgba(251,248,242,.95);border:1px solid rgba(68,99,79,.14);border-radius:999px;box-shadow:0 8px 20px rgba(65,55,42,.055);font-size:10.5px;font-weight:600;color:#4b5c51;white-space:nowrap}.visual-tag:after{content:"";position:absolute;height:1px;background:rgba(68,99,79,.20)}.tag-joint{left:10px;top:148px}.tag-joint:after{width:66px;left:100%;top:50%;transform:rotate(7deg);transform-origin:left center}.tag-bite{right:0;top:226px}.tag-bite:after{width:62px;right:100%;top:50%;transform:rotate(-7deg);transform-origin:right center}.tag-muscle{left:30px;bottom:82px}.tag-muscle:after{width:72px;left:100%;top:50%;transform:rotate(-13deg);transform-origin:left center}.tag-breath{right:18px;bottom:90px}.tag-breath:after{width:68px;right:100%;top:50%;transform:rotate(12deg);transform-origin:right center}.tag-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}.tag-bite .tag-dot,.tag-muscle .tag-dot{background:var(--gold)}'''
          s,n=re.subn(r'\.visual\{position:relative;min-height:520px\}.*?\.tag-bite \.tag-dot,\.tag-posture \.tag-dot\{background:var\(--gold\)\}',css_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'CSS visual replacement count={n}')
          visual_new=r'''<div class="visual"><div class="jaw-shell"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="jaw-field" aria-label="Деликатная схема челюстной зоны"><svg class="jaw-svg" viewBox="0 0 520 500" role="img" aria-label="Функциональная схема нижней трети лица и челюсти"><path class="face" d="M318 98c22 18 34 42 32 67-2 20-12 35-27 48-8 7-11 16-8 25 4 10 15 18 22 27 6 8 4 17-4 22-8 6-20 6-29 8-9 2-13 7-10 13 5 9 2 16-8 20 7 6 6 13-1 19-8 6-21 6-33 7-21 2-34 11-40 30-6 18-5 38-3 56"/><path class="soft" d="M310 138c-11 8-18 19-20 31-2 14 4 27 15 37"/><path class="jaw" d="M178 252c28 22 68 32 108 24 26-5 49-18 66-39"/><path class="gold" d="M188 276c18 26 46 40 79 39 31-1 57-14 74-39"/><path class="soft" d="M205 248c26 9 58 10 84 2 17-5 31-13 43-24"/><circle class="joint" cx="177" cy="248" r="10"/><circle class="halo" cx="177" cy="248" r="30"/><path class="muscle" d="M190 142c20 15 31 38 31 66 0 24-7 44-20 59-9-17-13-36-12-57 1-23 2-45 1-68z"/><path class="muscle" d="M220 168c17 19 25 41 23 66-2 20-9 37-22 50-8-17-10-36-7-54 3-20 5-40 6-62z"/><path class="air" d="M320 150c-14 13-19 28-16 44 3 16 13 27 22 40 8 11 12 24 11 38"/><path class="air" d="M333 171c-8 9-11 19-9 30"/><g><path class="tooth" d="M228 255c4-5 10-5 13 1l-1 16c-1 5-4 8-6 8-2 0-4-3-5-8z"/><path class="tooth" d="M245 256c4-5 10-5 13 1l-1 16c-1 5-4 8-6 8-2 0-4-3-5-8z"/><path class="tooth" d="M262 255c4-5 10-5 13 1l-1 16c-1 5-4 8-6 8-2 0-4-3-5-8z"/><path class="tooth" d="M279 253c4-5 10-5 13 1l-1 16c-1 5-4 8-6 8-2 0-4-3-5-8z"/></g><path class="gold" d="M197 291c18 10 39 15 62 14 27-1 50-8 69-23" opacity=".42"/><path class="soft" d="M162 186c-7 35-5 69 8 102" opacity=".32"/></svg></div><span class="visual-tag tag-joint"><span class="tag-dot"></span>ВНЧС</span><span class="visual-tag tag-bite"><span class="tag-dot"></span>Прикус</span><span class="visual-tag tag-muscle"><span class="tag-dot"></span>Мышцы</span><span class="visual-tag tag-breath"><span class="tag-dot"></span>Дыхание</span></div></div>'''
          pattern=r'<div class="visual"><div class="anatomy-shell">.*?</div></div>(?=</div></section>)'
          s,n=re.subn(pattern,visual_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'HTML visual replacement count={n}')
          s=s.replace('.anatomy-shell{inset:4px -4px 8px 6px}.anatomy-field{inset:22px 12px 24px 24px}', '.jaw-shell{inset:4px -4px 8px 6px}.jaw-field{inset:24px 12px 24px 28px}')
          s=s.replace('.visual-tag{font-size:8.5px;padding:7px 9px}.tag-joint{left:-2px;top:95px}.tag-bite{right:-4px;top:185px}.tag-breath{right:4px;bottom:58px}.tag-posture{left:2px;bottom:42px}', '.visual-tag{font-size:8.5px;padding:7px 9px}.tag-joint{left:2px;top:112px}.tag-bite{right:-2px;top:188px}.tag-muscle{left:4px;bottom:54px}.tag-breath{right:4px;bottom:60px}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-functional-dentistry-jaw-visual.yml
          git add interface-lab/functional-dentistry/index.html
          git commit -m 'Replace anatomy hero with refined jaw fragment'
          git push origin feature/site-v1
