name: AZ fix surgery hero photo
on:
  push:
    branches: ["feature/site-v1"]
    paths:
      - ".github/workflows/az-fix-surgery-photo.yml"
permissions:
  contents: write
jobs:
  fix-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Rebuild approved surgery photo
        run: |
          cat .github/tmp/surgery-photo.part1 .github/tmp/surgery-photo.part2 .github/tmp/surgery-photo.part3 .github/tmp/surgery-photo.part4 | base64 -d > assets/direction-hero/dentistry-surgery-consultation.webp
          test "$(wc -c < assets/direction-hero/dentistry-surgery-consultation.webp)" -eq 16426
          echo "471a53bf76495a77b4bf3f12e50ceadd4c9d77e7a923ce339d423c67e8df8a54  assets/direction-hero/dentistry-surgery-consultation.webp" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/direction-hero/dentistry-surgery-consultation.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          h=Path('interface-lab/dentistry-surgery/index.html')
          s=h.read_text(encoding='utf-8').replace('dentistry-surgery-consultation.webp?v=20260914-3','dentistry-surgery-consultation.webp?v=20260914-4')
          h.write_text(s, encoding='utf-8')
          PY
      - name: Commit verified photo
        run: |
          rm -f .github/tmp/surgery-photo.part1 .github/tmp/surgery-photo.part2 .github/tmp/surgery-photo.part3 .github/tmp/surgery-photo.part4 .github/workflows/az-fix-surgery-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/direction-hero/dentistry-surgery-consultation.webp interface-lab/dentistry-surgery/index.html .github/tmp .github/workflows/az-fix-surgery-photo.yml
          git commit -m "Repair approved surgery hero photo asset"
          git push origin feature/site-v1
