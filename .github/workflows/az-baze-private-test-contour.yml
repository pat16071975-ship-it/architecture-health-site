name: AZ-BAZE Private Test Contour

on:
  push:
    branches:
      - feature/az-private-test-contour
    paths:
      - "az-baze-auth/requirements.txt"
      - "az-baze-auth/test_server.py"
      - "az-baze-auth/tools/prepare_private_test_contour.py"
      - "az-baze-auth/test_private_test_contour.py"
      - "az-baze-auth/deploy/PRIVATE-TEST-CONTOUR.md"
      - ".github/workflows/az-baze-private-test-contour.yml"
  pull_request:
    paths:
      - "az-baze-auth/requirements.txt"
      - "az-baze-auth/test_server.py"
      - "az-baze-auth/tools/prepare_private_test_contour.py"
      - "az-baze-auth/test_private_test_contour.py"
      - "az-baze-auth/deploy/PRIVATE-TEST-CONTOUR.md"
      - ".github/workflows/az-baze-private-test-contour.yml"

permissions:
  contents: read

jobs:
  private-test-contour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dependencies
        run: pip install -r az-baze-auth/requirements.txt

      - name: Runtime import smoke
        working-directory: az-baze-auth
        env:
          AZBAZE_SECRET_KEY: ci-private-test-secret
          AZBAZE_DB: /tmp/az-baze-private-test-import.db
          AZBAZE_SITE_ROOT: /tmp/az-baze-private-test-site
          AZBAZE_CREDENTIALS_KEY: /tmp/az-baze-private-test-credentials.key
          AZ_FINREZ_DATA_PATH: /tmp/az-baze-private-test-finrez.enc
          AZ_FINREZ_KEY_PATH: /tmp/az-baze-private-test-finrez.key
        run: |
          mkdir -p /tmp/az-baze-private-test-site
          python - <<'PY'
          import server
          print("SERVER IMPORT: OK")
          PY

      - name: Python syntax
        run: >
          python -m py_compile
          az-baze-auth/test_server.py
          az-baze-auth/tools/prepare_private_test_contour.py
          az-baze-auth/test_private_test_contour.py

      - name: Private contour isolation tests
        working-directory: az-baze-auth
        run: python -m unittest -v test_private_test_contour.py

      - name: Foundation regression
        working-directory: az-baze-auth
        run: python -m unittest -v test_structure_foundation.py

      - name: Clinic timezone regression
        working-directory: az-baze-auth
        run: python -m unittest -v test_clinic_timezone_settings.py
