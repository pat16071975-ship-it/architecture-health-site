name: Force insert side visual menu

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Force insert badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'aria-label="Команда">команда</a>'
          extra = '<div class="radial-badge side-menu-badge side-menu-1">о клинике</div><div class="radial-badge side-menu-badge side-menu-2">пациенту</div><div class="radial-badge side-menu-badge side-menu-3">лаборатория</div><div class="radial-badge side-menu-badge side-menu-4">контакты</div>'
          if 'о клинике</div>' not in s:
              if marker not in s:
                  raise SystemExit('team marker not found')
              s = s.replace(marker, marker + extra, 1)
          if 'о клинике</div>' not in s or 'контакты</div>' not in s:
              raise SystemExit('badges were not inserted')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/force-insert-side-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/force-insert-side-menu.yml
          git commit -m "Add visual clinic navigation badges"
          git push origin HEAD:feature/site-v1
