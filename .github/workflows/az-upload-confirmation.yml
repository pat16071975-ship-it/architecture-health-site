name: AZ upload confirmation
on:
  pull_request:
    paths:
      - 'az-baze-auth/templates/uploads.html'
      - 'tests/test_upload_confirmation.py'
      - 'tests/verify-paid-upload-periods.cjs'
      - '.github/workflows/az-upload-confirmation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Existing upload request contracts
        run: node tests/verify-paid-upload-periods.cjs
      - name: Persistent confirmation, errors, files, periods and mobile layout
        run: python tests/test_upload_confirmation.py
