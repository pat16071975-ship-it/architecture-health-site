name: AZ Lab Vitruvian slogan effect
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-slogan-effect.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Enlarge slogan, raise above planets, add moving highlight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old="""function addVitruvianRingText(doc,host,stageRect,hostRect){
  const viewportWidth=doc.defaultView?.innerWidth||0;if(viewportWidth<721)return;
  doc.getElementById('az-lab-vitruvian-ring-text')?.remove();
  const scale=viewportWidth>=1181?.724137931:.568965517;
  const cx=stageRect.left-hostRect.left+stageRect.width/2,cy=stageRect.top-hostRect.top+stageRect.height/2;
  const radius=Math.min(stageRect.width,stageRect.height)*scale*.5+(viewportWidth>=1181?18:14);
  const point=deg=>{const a=deg*Math.PI/180;return{x:cx+radius*Math.cos(a),y:cy+radius*Math.sin(a)}};
  const start=point(180),end=point(360),ns='http://www.w3.org/2000/svg';
  const svg=doc.createElementNS(ns,'svg');svg.id='az-lab-vitruvian-ring-text';svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible';
  const defs=doc.createElementNS(ns,'defs'),path=doc.createElementNS(ns,'path');path.id='az-lab-vitruvian-ring-path';path.setAttribute('d',`M ${start.x} ${start.y} A ${radius} ${radius} 0 0 1 ${end.x} ${end.y}`);path.setAttribute('fill','none');defs.appendChild(path);svg.appendChild(defs);
  const text=doc.createElementNS(ns,'text');text.setAttribute('fill','#526158');text.setAttribute('font-family','Montserrat,Inter,Segoe UI,Arial,sans-serif');text.setAttribute('font-size',viewportWidth>=1181?'13':'11');text.setAttribute('font-weight','500');text.setAttribute('letter-spacing',viewportWidth>=1181?'1.05':'.8');text.setAttribute('opacity','.94');
  const textPath=doc.createElementNS(ns,'textPath');textPath.setAttribute('href','#az-lab-vitruvian-ring-path');textPath.setAttribute('startOffset','50%');textPath.setAttribute('text-anchor','middle');textPath.textContent='Не лечим по отдельности. Понимаем, как всё связано в вашем организме';text.appendChild(textPath);svg.appendChild(text);host.appendChild(svg);
}
"""
          new="""function addVitruvianRingText(doc,host,stageRect,hostRect){
  const viewportWidth=doc.defaultView?.innerWidth||0;if(viewportWidth<721)return;
  doc.getElementById('az-lab-vitruvian-ring-text')?.remove();
  const scale=viewportWidth>=1181?.724137931:.568965517;
  const cx=stageRect.left-hostRect.left+stageRect.width/2,cy=stageRect.top-hostRect.top+stageRect.height/2;
  const radius=Math.min(stageRect.width,stageRect.height)*scale*.5+(viewportWidth>=1181?18:14);
  const point=deg=>{const a=deg*Math.PI/180;return{x:cx+radius*Math.cos(a),y:cy+radius*Math.sin(a)}};
  const start=point(180),end=point(360),ns='http://www.w3.org/2000/svg';
  const svg=doc.createElementNS(ns,'svg');svg.id='az-lab-vitruvian-ring-text';svg.setAttribute('viewBox',`0 0 ${Math.max(1,hostRect.width)} ${Math.max(1,hostRect.height)}`);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:14;pointer-events:none;overflow:visible';
  const defs=doc.createElementNS(ns,'defs'),path=doc.createElementNS(ns,'path');path.id='az-lab-vitruvian-ring-path';path.setAttribute('d',`M ${start.x} ${start.y} A ${radius} ${radius} 0 0 1 ${end.x} ${end.y}`);path.setAttribute('fill','none');defs.appendChild(path);
  const gradient=doc.createElementNS(ns,'linearGradient');gradient.id='az-lab-slogan-gradient';gradient.setAttribute('gradientUnits','userSpaceOnUse');gradient.setAttribute('y1','0');gradient.setAttribute('y2','0');gradient.setAttribute('x1',String(cx-radius*3));gradient.setAttribute('x2',String(cx-radius));
  [['0%','#526158'],['38%','#526158'],['50%','#b59662'],['62%','#526158'],['100%','#526158']].forEach(([offset,color])=>{const stop=doc.createElementNS(ns,'stop');stop.setAttribute('offset',offset);stop.setAttribute('stop-color',color);gradient.appendChild(stop)});
  if(!(doc.defaultView?.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    const ax1=doc.createElementNS(ns,'animate');ax1.setAttribute('attributeName','x1');ax1.setAttribute('values',`${cx-radius*3};${cx+radius}`);ax1.setAttribute('dur','5.8s');ax1.setAttribute('repeatCount','indefinite');gradient.appendChild(ax1);
    const ax2=doc.createElementNS(ns,'animate');ax2.setAttribute('attributeName','x2');ax2.setAttribute('values',`${cx-radius};${cx+radius*3}`);ax2.setAttribute('dur','5.8s');ax2.setAttribute('repeatCount','indefinite');gradient.appendChild(ax2);
  }
  defs.appendChild(gradient);svg.appendChild(defs);
  const text=doc.createElementNS(ns,'text');text.setAttribute('fill','url(#az-lab-slogan-gradient)');text.setAttribute('stroke','#f7f3ec');text.setAttribute('stroke-width',viewportWidth>=1181?'2.8':'2.2');text.setAttribute('paint-order','stroke fill');text.setAttribute('font-family','Montserrat,Inter,Segoe UI,Arial,sans-serif');text.setAttribute('font-size',viewportWidth>=1181?'15':'12');text.setAttribute('font-weight','600');text.setAttribute('letter-spacing',viewportWidth>=1181?'1.08':'.82');text.setAttribute('opacity','.98');text.style.filter='drop-shadow(0 1px 2px rgba(58,49,37,.16))';
  const textPath=doc.createElementNS(ns,'textPath');textPath.setAttribute('href','#az-lab-vitruvian-ring-path');textPath.setAttribute('startOffset','50%');textPath.setAttribute('text-anchor','middle');textPath.textContent='Не лечим по отдельности. Понимаем, как всё связано в вашем организме';text.appendChild(textPath);svg.appendChild(text);host.appendChild(svg);
}
"""
          if old not in s:
              raise SystemExit('STOP: current slogan function not found')
          s=s.replace(old,new,1)
          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];",
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            '.az-lab-right-badge-shift{transform:translateX(-37.8px)!important}',
            ".az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}",
          ]
          for marker in protected:
              if marker not in s:
                  raise SystemExit(f'STOP: approved geometry marker missing: {marker}')
          if "z-index:14" not in s or "font-size',viewportWidth>=1181?'15':'12'" not in s or "az-lab-slogan-gradient" not in s:
              raise SystemExit('STOP: slogan emphasis verification failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html
          git commit -m 'Emphasize Vitruvian slogan with moving highlight'
          git push origin feature/site-v1
