name: IDENT-004 TLS isolated Windows x64 build
on:
  push:
    branches: ['build/ident-004-tls-win-x64-7ffc6517']
    paths: ['.github/workflows/ident-004-tls-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Verify audited source and isolate build inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '7ffc65174a408a75afc237247045008e7bab51dd'
          $tree = 'dcefe1bcedf36ce59192581eff48e46e997e2399'
          git merge-base --is-ancestor $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_ANCESTRY' }
          if ((git rev-parse "$source^{tree}") -cne $tree -or $LASTEXITCODE -ne 0) { throw 'AUDITED_TREE' }
          if ((git rev-parse HEAD:integrations) -cne (git rev-parse "$($source):integrations")) { throw 'SOURCE_TREE_CHANGED' }
          $work = Join-Path $env:RUNNER_TEMP 'ident-audited-source'
          New-Item -ItemType Directory -Path $work -ErrorAction Stop | Out-Null
          # Read each audited Git blob as binary; do not use working-tree checkout,
          # git archive filters or PowerShell text redirection for source bytes.
          $entries = @(git ls-tree -r --full-tree $source -- integrations/ident-004/)
          if ($LASTEXITCODE -ne 0 -or $entries.Count -ne 18) { throw 'AUDITED_BLOB_COUNT' }
          $gitPath = (Get-Command git.exe -CommandType Application).Source
          foreach ($entry in $entries) {
            if ($entry -cnotmatch '^100644 blob ([0-9a-f]{40})\tintegrations/ident-004/([A-Za-z0-9_./-]+)$') { throw 'AUDITED_BLOB_ENTRY' }
            $blobSha = $Matches[1]; $relative = $Matches[2]
            if ($relative.StartsWith('/') -or ($relative.Split('/') -contains '..')) { throw 'AUDITED_BLOB_PATH' }
            $dest = Join-Path (Join-Path $work 'integrations/ident-004') $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
            $psi = [Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $gitPath
            $psi.WorkingDirectory = (Get-Location).Path
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.ArgumentList.Add('cat-file'); $psi.ArgumentList.Add('blob'); $psi.ArgumentList.Add($blobSha)
            $proc = [Diagnostics.Process]::Start($psi)
            try {
              $output = [IO.File]::Open($dest,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              try { $proc.StandardOutput.BaseStream.CopyTo($output) } finally { $output.Dispose() }
              if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw 'BLOB_READ_TIMEOUT' }
              if ($proc.ExitCode -ne 0) { throw 'BLOB_READ_FAILED' }
            } finally { $proc.Dispose() }
            $actualBlob = git hash-object --no-filters -- $dest
            if ($LASTEXITCODE -ne 0 -or $actualBlob -cne $blobSha) { throw "GIT_BLOB_MISMATCH: $relative" }
          }
          $root = Join-Path $work 'integrations/ident-004'
          $expected = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS')) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9_./-]+)$') { throw 'MANIFEST_FORMAT' }
            $hash = $Matches[1]; $name = $Matches[2]
            if ($name.StartsWith('/') -or ($name.Split('/') -contains '..') -or $expected.ContainsKey($name)) { throw 'MANIFEST_PATH' }
            $file = Join-Path $root $name
            $observed = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($observed -cne $hash) { throw "SOURCE_SHA256: $name expected=$hash observed=$observed" }
            $expected[$name] = $true
          }
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/') })
          if ($expected.Count -ne 17 -or $actual.Count -ne 18 -or @($actual | Where-Object { $_ -ne 'SHA256SUMS' -and -not $expected.ContainsKey($_) }).Count -ne 0) { throw 'SOURCE_FILE_COUNT' }
          $evidence = Join-Path $env:RUNNER_TEMP 'ident-build-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          "IDENT_ROOT=$root" >> $env:GITHUB_ENV
          "IDENT_WORK=$work" >> $env:GITHUB_ENV
          "IDENT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'ident-isolated-nuget')" >> $env:GITHUB_ENV
          "DOTNET_CLI_HOME=$(Join-Path $env:RUNNER_TEMP 'ident-dotnet-home')" >> $env:GITHUB_ENV
          "SOURCE_HEAD=$source" >> $env:GITHUB_ENV
          "SOURCE_TREE=$tree" >> $env:GITHUB_ENV
          Write-Host 'EXACT_SOURCE=PASS; SOURCE_SHA256=17/17; SOURCE_FILES=18'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Restore exact dependency, audit and verify locked restore
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:IDENT_WORK
          $sdk = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -cnotmatch '^10\.0\.\d+$') { throw 'SDK_VERSION' }
          @{sdk=@{version=$sdk;rollForward='disable';allowPrerelease=$false}} | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'global.json' -Encoding utf8NoBOM
          Copy-Item -LiteralPath 'global.json' -Destination $env:IDENT_EVIDENCE
          dotnet --info | Set-Content -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'dotnet-info.txt') -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'SDK_INFO' }
          $project = Join-Path $env:IDENT_ROOT 'sql-client/IdentSqlReader.csproj'
          $config = Join-Path $env:IDENT_ROOT 'sql-client/NuGet.Config'
          $lock = Join-Path $env:IDENT_ROOT 'sql-client/packages.lock.json'
          $common = @($project,'--runtime','win-x64','--configfile',$config,'--no-http-cache','-p:Configuration=Release','-p:SelfContained=true','-p:NuGetAudit=true','-p:NuGetAuditMode=all','-p:TreatWarningsAsErrors=true')
          dotnet restore @common --use-lock-file
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_OR_AUDIT_FAILED' }
          if (-not (Test-Path -LiteralPath $lock -PathType Leaf)) { throw 'LOCK_MISSING' }
          $lockSha = (Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash
          $locked = Get-Content -LiteralPath $lock -Raw | ConvertFrom-Json -AsHashtable
          $resolved = @($locked.dependencies.Values | ForEach-Object { $_.GetEnumerator() } | Where-Object { $_.Key -eq 'Microsoft.Data.SqlClient' } | ForEach-Object { $_.Value.resolved })
          if ($resolved.Count -lt 1 -or @($resolved | Where-Object { $_ -cne '7.1.2' }).Count -ne 0) { throw 'SQLCLIENT_VERSION' }
          dotnet restore @common --locked-mode --force
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash -cne $lockSha) { throw 'LOCKED_RESTORE_FAILED' }
          Copy-Item -LiteralPath $lock -Destination $env:IDENT_EVIDENCE
          $all = dotnet package list --project $project --include-transitive --no-restore --format json
          if ($LASTEXITCODE -ne 0) { throw 'PACKAGE_LIST_FAILED' }
          $allText = $all -join [Environment]::NewLine
          $allData = $allText | ConvertFrom-Json -AsHashtable
          if (-not $allData.projects) { throw 'PACKAGE_LIST_EMPTY' }
          $allText | Set-Content -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'dependencies.json') -Encoding utf8NoBOM
          $audit = dotnet package list --project $project --include-transitive --vulnerable --no-restore --format json --config $config
          if ($LASTEXITCODE -ne 0) { throw 'VULNERABILITY_AUDIT_FAILED' }
          $auditText = $audit -join [Environment]::NewLine
          $auditData = $auditText | ConvertFrom-Json -AsHashtable
          if (-not $auditData.projects) { throw 'VULNERABILITY_REPORT_EMPTY' }
          $vulnerable = @($auditData.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_ -and $_.vulnerabilities })
          $auditText | Set-Content -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'vulnerabilities.json') -Encoding utf8NoBOM
          if ($vulnerable.Count -ne 0) { throw 'VULNERABLE_DEPENDENCIES' }
          "SDK_VERSION=$sdk" >> $env:GITHUB_ENV
          Write-Host "LOCKED_RESTORE=PASS; SQLCLIENT=7.1.2; NUGET_AUDIT=PASS; VULNERABLE_PACKAGES=0; SDK=$sdk"
      - name: Compile and publish standalone win-x64
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:IDENT_WORK
          $project = Join-Path $env:IDENT_ROOT 'sql-client/IdentSqlReader.csproj'
          $out = Join-Path $env:RUNNER_TEMP 'ident-win-x64-publish'
          $lock = Join-Path $env:IDENT_ROOT 'sql-client/packages.lock.json'
          dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -p:TreatWarningsAsErrors=true -o $out
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISH_FAILED' }
          if ((Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'packages.lock.json') -Algorithm SHA256).Hash) { throw 'LOCK_CHANGED_AFTER_PUBLISH' }
          $files = @(Get-ChildItem -LiteralPath $out -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'IdentSqlReader.exe' -or $files[0].Directory.FullName -ne $out) { throw ('SINGLE_FILE_GATE: ' + ($files.Name -join ',')) }
          $exe = $files[0]
          $stream = [IO.File]::OpenRead($exe.FullName)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'PE_MZ' }
            $stream.Position = 0x3c
            $pe = $reader.ReadUInt32()
            $stream.Position = $pe
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'PE_X64' }
          } finally { $stream.Dispose() }
          "IDENT_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "PUBLISH=PASS; SINGLE_FILE=YES; PE_X64=PASS; BYTES=$($exe.Length)"
      - name: Windows synthetic ACL test and offline executable smoke
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:IDENT_ROOT 'tests/test_outbox_guard.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACL_TEST_FAILED' }
          $cache = Join-Path $env:RUNNER_TEMP 'ident-smoke-cache'
          New-Item -ItemType Directory -Path $cache | Out-Null
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $cache
          $stdout = Join-Path $env:IDENT_EVIDENCE 'smoke.stdout.txt'
          $stderr = Join-Path $env:IDENT_EVIDENCE 'smoke.stderr.txt'
          $p = Start-Process -FilePath $env:IDENT_EXE -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'SMOKE_TIMEOUT' }
          if ($p.ExitCode -ne 1 -or (Get-Item -LiteralPath $stdout).Length -ne 0 -or (Get-Content -LiteralPath $stderr -Raw).Trim() -cne 'PINNED_SQL=STOP; REASON=CONFIG_REQUIRED') { throw 'SMOKE_FAILED' }
          Write-Host 'WINDOWS_ACL=PASS; EXE_OFFLINE_SMOKE=PASS; SQL_CONNECTION=NONE'
      - name: Package candidate and provenance
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath $env:IDENT_EXE -Destination $env:IDENT_EVIDENCE
          Copy-Item -LiteralPath (Join-Path $env:IDENT_ROOT 'SHA256SUMS') -Destination (Join-Path $env:IDENT_EVIDENCE 'SOURCE-SHA256SUMS')
          $exe = Get-Item -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'IdentSqlReader.exe')
          $sha = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lockSha = (Get-FileHash -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'packages.lock.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          $m = [ordered]@{
            source_head=$env:SOURCE_HEAD; source_tree=$env:SOURCE_TREE; build_commit=$env:GITHUB_SHA
            github_run_id=$env:GITHUB_RUN_ID; github_run_attempt=$env:GITHUB_RUN_ATTEMPT
            sdk=$env:SDK_VERSION; runtime_identifier='win-x64'; sqlclient='7.1.2'; self_contained=$true
            executable_sha256=$sha; executable_bytes=$exe.Length; lock_sha256=$lockSha
            dependency_audit='PASS'; locked_restore='PASS'; windows_acl='PASS'; offline_smoke='PASS'
            real_sql_handshake='NOT_RUN'; clinic_install='NO'; production='UNCHANGED'
          }
          $m | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'build-manifest.json') -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $env:IDENT_EVIDENCE -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -LiteralPath (Join-Path $env:IDENT_EVIDENCE 'SHA256SUMS') -Encoding utf8NoBOM
          Write-Host "BUILD=PASS; EXE_SHA256=$sha; BYTES=$($exe.Length); LOCK_SHA256=$lockSha; SOURCE=$env:SOURCE_HEAD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IDENT-004-TLS-win-x64-7ffc6517
          path: ${{ env.IDENT_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
