name: AZ historical completed visits backfill

on:
  pull_request:
    paths:
      - 'az-baze-auth/historical_completed_backfill.py'
      - 'az-baze-auth/templates/completed_history_upload.html'
      - 'az-baze-auth/test_historical_completed_backfill.py'
      - 'az-baze-auth/server.py'
      - '.github/workflows/az-historical-completed-backfill.yml'
  workflow_dispatch:

jobs:
  historical-completed-backfill:
    runs-on: ubuntu-latest
    env:
      AZBAZE_SECRET_KEY: historical-completed-ci-only
      AZBAZE_DB: /tmp/az-baze-historical-completed-ci.db
      AZBAZE_SITE_ROOT: /tmp/az-baze-historical-completed-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install flask werkzeug openpyxl

      - name: Python syntax
        run: |
          python -m py_compile             az-baze-auth/historical_completed_backfill.py             az-baze-auth/server.py             az-baze-auth/test_historical_completed_backfill.py

      - name: Historical completed migration tests
        working-directory: az-baze-auth
        run: python -m unittest -v test_historical_completed_backfill.py

      - name: Preserve paired clinical upload contract
        run: |
          ! grep -F 'completed_upload.register_completed_upload(app)' az-baze-auth/server.py
          grep -F 'historical_completed_backfill.register(app)' az-baze-auth/server.py
          grep -F 'data-az-upload-form' az-baze-auth/templates/uploads.html
          grep -F '/api/uploads/clinical/preview' az-baze-auth/templates/uploads.html
          grep -F '/api/uploads/clinical/commit' az-baze-auth/templates/uploads.html
          grep -F 'data-az-completed-history-form' az-baze-auth/templates/uploads.html
          grep -F '/api/uploads/completed-history/preview' az-baze-auth/templates/uploads.html
          grep -F '/api/uploads/completed-history/commit' az-baze-auth/templates/uploads.html
          echo 'HISTORICAL_COMPLETED_SCOPE=PASS'
