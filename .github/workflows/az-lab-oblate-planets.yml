name: AZ Lab refine oblate planets

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-oblate-planets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Refine planet shape colour and artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('interface-lab/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('Черновик: 12 рисунков внутри движущихся планет', 'Черновик: лёгкое уплощение · графика по всей поверхности', 1)
          text = text.replace('orbits-20260904-1', 'orbits-20260904-2')
          text = text.replace('?v=20260904-1', '?v=20260904-2')

          old_markup = "    el.innerHTML='<span class=\"az-lab-planet-art\" aria-hidden=\"true\"><img class=\"az-lab-planet-art-img\" src=\"'+artUrl+'\" alt=\"\"></span><span class=\"az-lab-planet-label\">'+el.dataset.azOriginalHtml+'</span>';\n"
          new_markup = "    el.innerHTML='<span class=\"az-lab-planet-art\" aria-hidden=\"true\"></span><span class=\"az-lab-planet-label\">'+el.dataset.azOriginalHtml+'</span>';\n    const art=el.querySelector('.az-lab-planet-art');\n    if(art)art.style.setProperty('--az-planet-mask','url(\"'+artUrl+'\")');\n"
          if old_markup not in text:
              raise SystemExit('Planet foreground markup was not found')
          text = text.replace(old_markup, new_markup, 1)

          start_marker = '.az-lab-orbit-host .direction{'
          end_marker = '.az-lab-orbit-host .direction.az-lab-planet::before,.az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Planet CSS block was not found')
          end += len(end_marker)

          css = [
              ".az-lab-orbit-host .direction{position:absolute!important;width:108px!important;height:102px!important;min-height:102px!important;padding:8px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;font-size:9.4px!important;line-height:1.12!important;font-weight:600!important;letter-spacing:0!important;color:#30372f!important;box-shadow:0 7px 18px rgba(71,58,38,.07)!important;overflow:hidden!important;pointer-events:none!important;z-index:8!important;will-change:left,top!important;isolation:isolate!important}",
              ".az-lab-orbit-host .direction.az-lab-inner-planet{--az-planet-art-color:#44634f;background:radial-gradient(circle at 31% 27%,rgba(255,255,255,.78) 0,rgba(255,255,255,.22) 35%,rgba(255,255,255,0) 58%),linear-gradient(145deg,rgba(239,246,240,.99),rgba(250,247,241,.99) 64%,rgba(232,240,234,.98))!important;border:1.5px solid rgba(68,99,79,.50)!important}",
              ".az-lab-orbit-host .direction.az-lab-outer-planet{--az-planet-art-color:#b59662;background:radial-gradient(circle at 31% 27%,rgba(255,255,255,.76) 0,rgba(255,255,255,.20) 35%,rgba(255,255,255,0) 58%),linear-gradient(145deg,rgba(250,247,241,.99),rgba(245,238,226,.99) 64%,rgba(239,229,211,.98))!important;border:1.5px solid rgba(181,150,98,.62)!important}",
              ".az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-art{display:block!important;position:absolute!important;inset:0!important;border-radius:inherit!important;overflow:hidden!important;pointer-events:none!important;z-index:3!important;background-color:var(--az-planet-art-color)!important;opacity:.48!important;-webkit-mask-image:var(--az-planet-mask)!important;mask-image:var(--az-planet-mask)!important;-webkit-mask-repeat:no-repeat!important;mask-repeat:no-repeat!important;-webkit-mask-position:center!important;mask-position:center!important;-webkit-mask-size:136% 111%!important;mask-size:136% 111%!important;mix-blend-mode:normal!important}",
              ".az-lab-orbit-host .direction.az-lab-outer-planet .az-lab-planet-art{opacity:.52!important}",
              ".az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-label{position:relative!important;z-index:4!important;display:block!important;max-width:100%!important;text-shadow:0 0 3px rgba(250,247,241,.98),0 0 8px rgba(250,247,241,.82)!important}",
              ".az-lab-orbit-host .direction.az-lab-planet::before,.az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}",
              ""
          ]
          text = text[:start] + '\n'.join(css) + text[end:]

          old_status = "status.textContent=mode==='base'?'Оригинал без изменений':'Черновик: 12 рисунков внутри движущихся планет · 42/76 сек'"
          new_status = "status.textContent=mode==='base'?'Оригинал без изменений':'Черновик: лёгкое уплощение · графика по всей поверхности · 42/76 сек'"
          if old_status not in text:
              raise SystemExit('Runtime status text was not found')
          text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Interface Lab patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('interface-lab/index.html').read_text(encoding='utf-8')
          required = [
              'width:108px!important;height:102px!important',
              'border-radius:50%!important',
              '--az-planet-art-color:#44634f',
              '--az-planet-art-color:#b59662',
              '-webkit-mask-image:var(--az-planet-mask)!important',
              '-webkit-mask-size:136% 111%!important',
              'orbits-20260904-2',
              'лёгкое уплощение · графика по всей поверхности'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing marker: ' + marker)
          if 'az-lab-planet-art-img' in text:
              raise SystemExit('Old nested image layer is still present')
          if 'height:92px!important' in text:
              raise SystemExit('Old strongly flattened planet height is still present')

          match = re.search(r'<script>([\s\S]*)</script>', text)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/az-interface-lab.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/az-interface-lab.js

      - name: Commit refinement and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/az-lab-oblate-planets.yml
          git add interface-lab/index.html
          git commit -m "Refine planets as lightly oblate full-surface illustrations"
          git push origin HEAD:feature/site-v1
