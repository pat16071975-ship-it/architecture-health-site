name: AZ two-view paid economics
on:
  push:
    branches: [fix/az-two-view-paid-economics-20261029]
    paths:
      - '.github/workflows/az-two-view-paid-economics.yml'
      - 'tools/finish-paid-two-views.py'
      - 'tests/verify-paid-asof.cjs'
      - 'az-baze-auth/test_paid_exact_asof.py'
      - 'az-baze-auth/browser_paid_two_views.py'
  pull_request:
    paths:
      - 'reports/**'
      - 'az-baze-auth/**'
      - 'tests/verify-paid-asof.cjs'
      - 'tools/finish-paid-two-views.py'
      - '.github/workflows/az-two-view-paid-economics.yml'
permissions:
  contents: write
concurrency:
  group: az-two-view-paid-source-only
  cancel-in-progress: false
jobs:
  isolated-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AZBAZE_SECRET_KEY: synthetic-two-view-paid-test-only
      AZBAZE_DB: /tmp/az-two-view-paid-ci.db
      AZBAZE_SITE_ROOT: /tmp/az-two-view-paid-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Direct source branch; no repository rewriter
        run: |
          git diff --check
          echo 'DIRECT_SOURCE_BRANCH=PASS'
      - name: Exact two-view and cost regressions
        run: |
          set -o pipefail
          node --check reports/period-view.js
          node --check reports/management-mobile-layout.js
          node --check reports/services-primary-patient-cost.js
          node tests/verify-paid-asof.cjs | tee /tmp/az-two-view-paid-js.log
          node tests/verify-paid-history.cjs
          node tests/verify-paid-periods.cjs
          node tests/verify-paid-upload-periods.cjs
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r az-baze-auth/requirements.txt
          python -m pip install playwright==1.55.0
      - name: Real SQLite API and accounting regressions
        working-directory: az-baze-auth
        run: |
          set -o pipefail
          python -m unittest -v test_paid_exact_asof.py test_paid_period_confirmation.py test_paid_history_reporting.py test_paid_cash_timeline.py test_cash_payments.py test_upload_integrity.py test_upload_reconcile.py test_paid_services.py test_paid_services_storage.py test_paid_services_periods.py test_paid_period_report.py test_economics_revenue_source.py test_completed_upload.py test_pr71_approved_restoration.py test_manual_entry_consistency.py test_report_consistency_preservation.py 2>&1 | tee /tmp/az-two-view-paid-python.log
      - name: Complete management page, desktop and phone, synthetic read-only data
        working-directory: az-baze-auth
        run: |
          set -o pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python browser_paid_two_views.py | tee /tmp/az-two-view-paid-browser.log
      - name: Protect imports money sources and advertising
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }} -- az-baze-auth/paid_period_confirmation.py az-baze-auth/paid_services.py az-baze-auth/paid_services_upload.py az-baze-auth/advertising_report.py az-baze-auth/daily_upload.py az-baze-auth/templates/uploads.html reports/advertising.html reports/advertising.js reports/dashboard.html reports/forecast.html reports/finrez.html
          python - <<'PY'
          from pathlib import Path
          cash=Path('az-baze-auth/cash_payments.py').read_text(encoding='utf-8')
          assert 'PAYER_EVIDENCE_KEYS' in cash
          assert 'movement <= 0' in cash
          assert 'LEGAL_BY_KKM' in cash
          print('CASH_PAYER_SCOPE=PASS; MONEY_RULE_UNCHANGED=YES')
          PY
          echo 'PROTECTED_SOURCE_BOUNDARY=PASS; LIVE_ACCESS=NONE'
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/az-two-view-paid-evidence
          cp /tmp/az-two-view-paid-*.log /tmp/az-two-view-paid-evidence/ 2>/dev/null || true
          git diff > /tmp/az-two-view-paid-evidence/changes.patch
          tar --exclude='__pycache__' -czf /tmp/az-two-view-paid-evidence/source.tgz reports/index.html reports/period-view.js reports/management-mobile-layout.js reports/mobile-date-fix.css reports/services-primary-patient-cost.js reports/services.html az-baze-auth/*.py az-baze-auth/requirements.txt az-baze-auth/templates/uploads.html tests/verify-paid*.cjs tests/verify-two-view-paid.cjs tools/finish-paid-two-views.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: az-two-view-paid-evidence
          path: /tmp/az-two-view-paid-evidence/
      - name: Record only tested source on the dedicated branch
        if: github.event_name == 'push'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import subprocess
          allowed={'az-baze-auth/report_storage.py','reports/index.html','reports/period-view.js','reports/management-mobile-layout.js','tests/verify-paid-periods.cjs','az-baze-auth/test_manual_entry_consistency.py','az-baze-auth/test_paid_history_reporting.py','az-baze-auth/test_report_consistency_preservation.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed,changed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('TESTED_SOURCE_SCOPE=PASS; FILES='+str(len(changed)))
          PY
          test "$(git ls-remote origin refs/heads/fix/az-two-view-paid-economics-20261029 | cut -f1)" = "$EXPECTED_HEAD"
          if git diff --cached --quiet; then echo 'SOURCE_ALREADY_RECORDED=YES'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain exact payer dates and complete two-view period economics'
          git push origin HEAD:refs/heads/fix/az-two-view-paid-economics-20261029
          echo "TESTED_SOURCE_SHA=$(git rev-parse HEAD)"
