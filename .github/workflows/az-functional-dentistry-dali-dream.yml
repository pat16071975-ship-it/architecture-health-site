name: AZ functional dentistry Dali Dream visual
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-functional-dentistry-dali-dream.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Replace only hero artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text()

          # Restore original hero visual structure if needed, then replace only its artwork styling/source.
          s,n=re.subn(
              r"\.photo img\{[^}]*\}",
              ".photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 48%;filter:grayscale(.18) sepia(.30) saturate(.58) contrast(.90) brightness(1.08);opacity:.94;transform:scale(1.035)}",
              s,count=1
          )
          if n!=1: raise SystemExit(f'photo img CSS replacement count={n}')

          s,n=re.subn(
              r"\.photo:after\{[^}]*\}",
              ".photo:after{content:\"\";position:absolute;inset:0;background:linear-gradient(135deg,rgba(68,99,79,.16),rgba(247,243,236,.04) 44%,rgba(181,150,98,.20));mix-blend-mode:soft-light;pointer-events:none}",
              s,count=1
          )
          if n!=1: raise SystemExit(f'photo overlay CSS replacement count={n}')

          # Add restrained artwork credit styling once.
          if '.art-credit{' not in s:
              s=s.replace('.photo:after{content:', '.art-credit{position:absolute;left:72px;bottom:40px;z-index:3;padding:6px 9px;border-radius:999px;background:rgba(247,243,236,.82);border:1px solid rgba(68,99,79,.12);font-size:9px;letter-spacing:.04em;color:#59655d;backdrop-filter:blur(3px)}.photo:after{content:',1)

          dali='https://uploads3.wikiart.org/images/salvador-dali/the-dream.jpg!Large.jpg'
          # Replace the first image in hero photo only.
          s,n=re.subn(r'(<div class="photo"><img src=")[^"]+("[^>]*>)', r'\1'+dali+r'\2', s, count=1)
          if n!=1: raise SystemExit(f'hero image source replacement count={n}')

          # Add credit inside visual if missing.
          if 'Сальвадор Дали · «Сон», 1931' not in s:
              s=s.replace('</div><span class="visual-tag tag-1">', '</div><div class="art-credit">Сальвадор Дали · «Сон», 1931</div><span class="visual-tag tag-1">',1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-functional-dentistry-dali-dream.yml
          git add interface-lab/functional-dentistry/index.html
          git commit -m 'Use Dali Dream in functional dentistry hero'
          git push origin feature/site-v1
