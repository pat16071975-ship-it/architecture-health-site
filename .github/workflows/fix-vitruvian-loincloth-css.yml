name: Fix Vitruvian loincloth CSS

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Fix CSS terminator only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = '%3C/svg%3E")}".vit-img'
          good = '%3C/svg%3E")}.vit-img'
          if bad not in s:
              raise SystemExit('bad terminator not found')
          s = s.replace(bad, good, 1)
          if '.stage:after{' not in s or good not in s:
              raise SystemExit('loincloth css guard failed')
          # Geometry remains untouched.
          for guard in [
              '.map{position:absolute;left:50%;top:-60px;width:1120px;height:920px;',
              '.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;',
              '.vit-img{position:absolute;left:50%;top:54%;width:102%;height:102%;',
              'style="left:560px;top:117px"',
              'const CX=560,CY=440;'
          ]:
              if guard not in s:
                  raise SystemExit('geometry guard failed: ' + guard)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-vitruvian-loincloth-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-vitruvian-loincloth-css.yml
          git commit -m "Fix Vitruvian loincloth CSS terminator"
          git push origin HEAD:feature/site-v1
