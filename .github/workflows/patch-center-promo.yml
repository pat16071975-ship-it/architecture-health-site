name: Patch centered promo

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Center promo badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".promo-badge{top:228px;left:-66px;width:390px;padding:14px 18px 13px;text-align:left;transform:none}.promo-copy{font:500 16px/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:-.005em}.promo-copy span{display:block;white-space:nowrap;max-width:100%}.promo-cta{display:inline-block;margin-top:8px;padding-top:7px;border-top:1px solid rgba(181,150,98,.45);font:650 10px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}"
          new_css = ".promo-badge{position:relative;top:auto;left:auto;width:max-content;max-width:920px;margin:18px auto 0;padding:13px 30px 11px;text-align:center;transform:none;border:1px solid rgba(181,150,98,.56);border-radius:16px;background:linear-gradient(180deg,rgba(239,246,240,.98),rgba(250,247,241,.98));box-shadow:0 10px 28px rgba(71,58,38,.09);color:#34443a}.promo-copy{font:500 18px/1.25 'Cormorant Garamond',Georgia,serif;letter-spacing:-.005em;white-space:nowrap}.promo-copy strong{font-weight:700;color:#8f6f3f}.promo-cta{display:block;width:max-content;margin:7px auto 0;padding:6px 16px 0;border-top:1px solid rgba(181,150,98,.38);font:700 10px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}"
          if old_css not in s:
              raise SystemExit('desktop promo css not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = ".promo-badge{top:108px;left:-16px;width:272px;padding:10px 12px;transform:none}.promo-copy{font-size:13px}.promo-copy span{white-space:normal}.promo-cta{font-size:8px}"
          new_mobile = ".promo-badge{position:relative;top:auto;left:auto;width:calc(100% - 24px);max-width:560px;margin:12px auto 0;padding:10px 14px;transform:none}.promo-copy{font-size:14px;white-space:normal}.promo-cta{font-size:9px}"
          if old_mobile not in s:
              raise SystemExit('mobile promo css not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_left = '<div class="left"><img class="logo" src="assets/logo-site.webp" alt="Архитектура здоровья"><div class="radial-badge promo-badge"><div class="promo-copy"><span>Для улыбки не нужны импланты -</span><span>правильная улыбка от 5000р у детей и взрослых</span></div><div class="promo-cta">запишись</div></div></div>'
          new_left = '<div class="left"><img class="logo" src="assets/logo-site.webp" alt="Архитектура здоровья"></div>'
          if old_left not in s:
              raise SystemExit('old left promo html not found')
          s = s.replace(old_left, new_left, 1)

          marker = '</header><section>'
          promo = '</header><div class="radial-badge promo-badge"><div class="promo-copy">Для улыбки не нужны импланты - правильная улыбка от <strong>5000р</strong> у детей и взрослых</div><div class="promo-cta">запишись</div></div><section>'
          if marker not in s:
              raise SystemExit('header marker not found')
          s = s.replace(marker, promo, 1)

          checks = [
              'Для улыбки не нужны импланты - правильная улыбка от <strong>5000р</strong> у детей и взрослых',
              'position:relative;top:auto;left:auto;width:max-content',
              'border-radius:16px',
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit('verification failed: ' + check)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-center-promo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-center-promo.yml
          git commit -m "Center and restyle promo badge"
          git push origin HEAD:feature/site-v1
