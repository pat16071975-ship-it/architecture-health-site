name: AZ medical supplies incoming documents

on:
  pull_request:
    paths:
      - 'az-baze-auth/medical_supplies_documents.py'
      - 'az-baze-auth/test_medical_supplies_documents.py'
      - 'az-baze-auth/browser_medical_supplies_documents.py'
      - 'az-baze-auth/medical_supplies.py'
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/templates/medical_supplies_documents.html'
      - 'az-baze-auth/templates/medical_supplies.html'
      - 'az-baze-auth/templates/medical_supplies_daily.html'
      - 'az-baze-auth/templates/medical_supplies_stock.html'
      - '.github/workflows/az-medical-incoming-documents.yml'
permissions:
  contents: read
jobs:
  document-inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Runtime dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt
      - name: Python syntax, backend and existing Med supplies regression
        working-directory: az-baze-auth
        run: |
          python -B -m py_compile medical_supplies_documents.py medical_supplies.py app.py test_medical_supplies_documents.py browser_medical_supplies_documents.py
          python -B -m unittest -v test_medical_supplies_documents
          python -B -m unittest test_medical_supplies test_medical_supplies_import test_medical_supplies_daily test_accounting_section test_section_navigation
          python -B -m unittest test_nn_foundation
      - name: HTML template parser
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env=Environment()
          names=[
            "medical_supplies_documents.html",
            "medical_supplies.html",
            "medical_supplies_daily.html",
            "medical_supplies_stock.html",
          ]
          for name in names:
            env.parse((Path("az-baze-auth/templates") / name).read_text(encoding="utf-8"))
          print("MED_INCOMING_TEMPLATE_SYNTAX=PASS")
          PY
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser: desktop and mobile
        working-directory: az-baze-auth
        run: python -B browser_medical_supplies_documents.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incoming-documents-browser
          path: az-baze-auth/med-browser-artifacts
