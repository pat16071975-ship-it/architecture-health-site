name: AZ functional dentistry original surreal hero
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-functional-dentistry-original-surreal.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Create original surreal visual and patch detail page only
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          # Original surreal composition inspired by the general idea of suspended sleep,
          # not a reproduction of any existing artwork.
          W,H=1400,1000
          img=Image.new('RGB',(W,H),'#F7F3EC')
          d=ImageDraw.Draw(img)
          for bbox,outline,width in [
              ((90,70,1310,930),'#E6DDCE',5),
              ((210,140,1190,875),'#D8D9CF',3),
              ((315,215,1090,810),'#E8DDC6',3),
          ]:
              d.ellipse(bbox,outline=outline,width=width)
          pts=[(205,425),(240,355),(315,305),(405,274),(515,260),(625,280),(710,322),(785,360),(860,380),(950,374),(1038,350),(1125,326),(1204,332),(1248,358),(1260,395),(1240,430),(1190,458),(1122,475),(1034,489),(950,506),(870,535),(790,580),(720,624),(650,656),(575,670),(500,660),(430,630),(370,590),(320,540),(270,488)]
          d.polygon(pts,fill='#E4D2B3')
          d.line(pts+[pts[0]],fill='#8A806E',width=5)
          # sleeping face cues
          d.arc((335,345,520,435),190,345,fill='#56695D',width=5)
          d.arc((585,365,760,450),185,350,fill='#56695D',width=5)
          d.line((675,430,720,460,675,485),fill='#7A6E60',width=4)
          d.arc((645,470,760,530),205,335,fill='#8D7658',width=4)
          # inner dream field
          d.ellipse((790,300,1160,610),fill='#EFE8DB',outline='#B59662',width=4)
          d.ellipse((825,335,1125,575),fill='#F5F0E7',outline='#C8B892',width=2)
          d.line((850,470,1100,470),fill='#82917F',width=3)
          d.arc((890,365,1060,520),200,340,fill='#44634F',width=5)
          for x,h in [(930,85),(995,105),(1055,75)]:
              d.line((x,470,x,470-h),fill='#756C5D',width=4)
              d.ellipse((x-18,470-h-22,x+18,470-h+10),fill='#D8C29B',outline='#B59662',width=2)
          # delicate supporting lines
          for (x1,y1),(x2,y2) in [((330,590),(300,900)),((520,650),(540,930)),((725,615),(760,900)),((940,505),(980,875)),((1110,460),(1180,820))]:
              d.line((x1,y1,x2,y2),fill='#8C7A5C',width=4)
              d.ellipse((x2-10,y2-4,x2+10,y2+4),fill='#B59662')
          # functional-system echoes
          d.arc((250,430,670,720),5,120,fill='#44634F',width=4)
          d.arc((390,500,790,760),205,325,fill='#B59662',width=4)
          d.arc((555,400,900,760),220,315,fill='#7B8F78',width=3)
          Path('assets').mkdir(exist_ok=True)
          img.save('assets/functional-dentistry-surreal-sleep.png')

          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="visual"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="photo-shell"><div class="photo"><img src="https://optim.tildacdn.com/tild3864-3837-4037-a134-343937613762/-/resize/820x/-/format/webp/DSCF0409JPG.webp" alt="Функциональная стоматология"></div></div><div class="visual-tag tag-1"><span class="tag-dot"></span>ВНЧС и мышцы</div><div class="visual-tag tag-2"><span class="tag-dot"></span>Прикус и дыхание</div></div>'
          new='<div class="visual dream-visual"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="dream-shell"><img src="../../assets/functional-dentistry-surreal-sleep.png" alt="Оригинальная сюрреалистическая композиция о взаимосвязи функций"></div><div class="visual-tag dream-tag dream-vnchs"><span class="tag-dot"></span>ВНЧС</div><div class="visual-tag dream-tag dream-bite"><span class="tag-dot"></span>Прикус</div><div class="visual-tag dream-tag dream-muscle"><span class="tag-dot"></span>Мышцы</div><div class="visual-tag dream-tag dream-breath"><span class="tag-dot"></span>Дыхание</div><div class="visual-tag dream-tag dream-posture"><span class="tag-dot"></span>Голова, шея и осанка</div></div>'
          if old not in s:
              raise SystemExit('expected original hero visual not found')
          s=s.replace(old,new,1)
          css='''\n/* Original surreal hero visual — isolated to this detail page */\n.dream-visual{min-height:520px!important}\n.dream-shell{position:absolute;inset:18px 8px 18px 36px;border-radius:48% 52% 46% 54%/46% 44% 56% 54%;overflow:hidden;background:#efe8db;box-shadow:0 24px 60px rgba(65,55,42,.10)}\n.dream-shell:after{content:"";position:absolute;inset:0;background:rgba(239,232,219,.12);pointer-events:none}\n.dream-shell img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.62) contrast(.92) sepia(.12) brightness(1.035)}\n.dream-tag{z-index:6!important;font-size:10.5px!important;padding:9px 13px!important;white-space:nowrap}\n.dream-tag:after{content:"";position:absolute;height:1px;background:rgba(68,99,79,.24)}\n.dream-vnchs{left:-5px;top:118px}.dream-vnchs:after{width:72px;left:100%;top:50%;transform:rotate(8deg);transform-origin:left center}\n.dream-bite{right:-5px;top:210px}.dream-bite:after{width:70px;right:100%;top:50%;transform:rotate(-8deg);transform-origin:right center}\n.dream-muscle{left:18px;bottom:92px}.dream-muscle:after{width:78px;left:100%;top:50%;transform:rotate(-13deg);transform-origin:left center}\n.dream-breath{right:14px;bottom:88px}.dream-breath:after{width:76px;right:100%;top:50%;transform:rotate(12deg);transform-origin:right center}\n.dream-posture{left:38%;bottom:12px;transform:translateX(-50%)}.dream-posture:after{width:56px;left:56%;bottom:100%;transform:rotate(-72deg);transform-origin:left center}\n.dream-bite .tag-dot,.dream-muscle .tag-dot,.dream-posture .tag-dot{background:var(--gold)}\n@media(max-width:600px){.dream-shell{inset:12px 4px 18px 20px}.dream-tag{font-size:8.5px!important;padding:7px 9px!important}.dream-vnchs{top:92px}.dream-bite{top:165px}.dream-muscle{left:6px;bottom:62px}.dream-breath{right:2px;bottom:66px}.dream-posture{left:42%;bottom:7px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-functional-dentistry-original-surreal.yml
          git add interface-lab/functional-dentistry/index.html assets/functional-dentistry-surreal-sleep.png
          git commit -m 'Add original surreal sleep visual to functional dentistry'
          git push origin feature/site-v1