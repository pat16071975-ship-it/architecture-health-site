name: AZ-BAZE cash receipts fact

on:
  push:
    branches:
      - feature/az-cash-receipts-fact
    paths:
      - "az-baze-auth/requirements.txt"
      - "az-baze-auth/cash_payments.py"
      - "az-baze-auth/paid_services.py"
      - "az-baze-auth/paid_services_upload.py"
      - "az-baze-auth/test_paid_services.py"
      - "az-baze-auth/test_paid_services_storage.py"
      - "az-baze-auth/test_economics_revenue_source.py"
      - "az-baze-auth/cash_upload.py"
      - "az-baze-auth/report_storage.py"
      - "az-baze-auth/ident_import.py"
      - "az-baze-auth/fixtures/cash_reference_2026_anonymized.tsv"
      - "az-baze-auth/daily_upload.py"
      - "az-baze-auth/daily_upload_core.py"
      - "az-baze-auth/upload_reconcile.py"
      - "az-baze-auth/attention.py"
      - "az-baze-auth/finrez.py"
      - "az-baze-auth/economics_control.py"
      - "az-baze-auth/server.py"
      - "az-baze-auth/templates/uploads.html"
      - "az-baze-auth/templates/attention.html"
      - "az-baze-auth/test_cash_payments.py"
      - "az-baze-auth/test_upload_reconcile.py"
      - "reports/index.html"
      - "reports/period-view.js"
      - "reports/management-mobile-layout.js"
      - "reports/dashboard.html"
      - "reports/forecast.html"
      - "reports/finrez.html"
      - ".github/workflows/az-baze-cash-fact.yml"
  pull_request:
    paths:
      - "az-baze-auth/requirements.txt"
      - "az-baze-auth/cash_payments.py"
      - "az-baze-auth/paid_services.py"
      - "az-baze-auth/paid_services_upload.py"
      - "az-baze-auth/test_paid_services.py"
      - "az-baze-auth/test_paid_services_storage.py"
      - "az-baze-auth/test_economics_revenue_source.py"
      - "az-baze-auth/cash_upload.py"
      - "az-baze-auth/report_storage.py"
      - "az-baze-auth/ident_import.py"
      - "az-baze-auth/fixtures/cash_reference_2026_anonymized.tsv"
      - "az-baze-auth/daily_upload.py"
      - "az-baze-auth/daily_upload_core.py"
      - "az-baze-auth/upload_reconcile.py"
      - "az-baze-auth/attention.py"
      - "az-baze-auth/finrez.py"
      - "az-baze-auth/economics_control.py"
      - "az-baze-auth/server.py"
      - "az-baze-auth/templates/uploads.html"
      - "az-baze-auth/templates/attention.html"
      - "az-baze-auth/test_cash_payments.py"
      - "az-baze-auth/test_upload_reconcile.py"
      - "reports/index.html"
      - "reports/period-view.js"
      - "reports/management-mobile-layout.js"
      - "reports/dashboard.html"
      - "reports/forecast.html"
      - "reports/finrez.html"
      - ".github/workflows/az-baze-cash-fact.yml"

jobs:
  cash-fact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt

      - name: Cash accounting and reconciliation tests
        env:
          AZBAZE_SECRET_KEY: test-secret
          AZBAZE_DB: /tmp/az-upload-reconcile-ci.db
          AZBAZE_SITE_ROOT: /tmp/az-upload-reconcile-site
        working-directory: az-baze-auth
        run: python -m unittest -v test_cash_payments.py test_upload_integrity.py test_upload_reconcile.py test_paid_services.py test_paid_services_storage.py test_economics_revenue_source.py

      - name: Python syntax
        run: python -m py_compile az-baze-auth/cash_payments.py az-baze-auth/paid_services.py az-baze-auth/paid_services_upload.py az-baze-auth/cash_upload.py az-baze-auth/daily_upload.py az-baze-auth/daily_upload_core.py az-baze-auth/upload_reconcile.py az-baze-auth/attention.py az-baze-auth/report_storage.py az-baze-auth/ident_import.py az-baze-auth/finrez.py az-baze-auth/economics_control.py az-baze-auth/server.py

      - name: JavaScript syntax
        run: |
          node --check reports/period-view.js
          node --check reports/management-mobile-layout.js

      - name: Cash write-path guards
        env:
          AZBAZE_SECRET_KEY: test-secret
          AZBAZE_DB: /tmp/az-cash-ci.db
          AZBAZE_SITE_ROOT: /tmp/az-cash-site
        working-directory: az-baze-auth
        run: |
          python - <<'PY'
          import json
          import sqlite3

          import cash_payments
          import report_storage

          existing = {
              "date": "2026-08-31",
              "plan": 1,
              "cashTotal": 7796465,
              "cashOOO": 3617945,
              "cashIP": 4178520,
              "cashUnallocated": 100,
              "factMedicine": 200,
              "factLab": 300,
              "dentists": {"Doctor": 200},
              "_cash_rule": "positive-receipts-only-v1",
          }
          incoming = {"date": "2026-08-31", "plan": 999, "leadsDent": 12}
          merged = report_storage._preserve_cash_state(existing, incoming)
          assert merged["plan"] == 999
          assert merged["leadsDent"] == 12
          assert merged["cashTotal"] == 7796465
          assert merged["cashOOO"] == 3617945
          assert merged["cashIP"] == 4178520
          assert merged["factMedicine"] == 200
          assert merged["factLab"] == 300
          assert merged["dentists"] == {"Doctor": 200}

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute("CREATE TABLE report_data(date TEXT PRIMARY KEY,payload TEXT,updated_by INTEGER,updated_at TEXT)")
          cash_payments.init_schema(conn)
          day = {
              **cash_payments._blank_day(),
              "cashOOO": 1000,
              "cashTotal": 1000,
              "cashUnallocated": 1000,
          }
          cash_payments.replace_range(conn, {"2026-08-31": day}, "cash.xlsx", "sha", 1, "now")
          conn.execute(
              "INSERT INTO report_data(date,payload,updated_by,updated_at) VALUES(?,?,?,?)",
              ("2026-08-31", json.dumps({"date":"2026-08-31","plan":5000}), 1, "old"),
          )
          changed = report_storage._reapply_cash_after_restore(conn, 1, "now")
          restored = json.loads(conn.execute(
              "SELECT payload FROM report_data WHERE date='2026-08-31'"
          ).fetchone()[0])
          assert changed == 1
          assert restored["cashTotal"] == 1000
          assert restored["cashUnallocated"] == 1000
          assert restored["plan"] == 5000
          print("CASH WRITE-PATH GUARDS: OK")
          PY

      - name: Source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          uploads = Path("az-baze-auth/templates/uploads.html").read_text(encoding="utf-8")
          paid_upload = Path("az-baze-auth/paid_services_upload.py").read_text(encoding="utf-8")
          daily = Path("az-baze-auth/daily_upload.py").read_text(encoding="utf-8")
          server = Path("az-baze-auth/server.py").read_text(encoding="utf-8")
          management = Path("reports/index.html").read_text(encoding="utf-8")
          period = Path("reports/period-view.js").read_text(encoding="utf-8")
          dashboard = Path("reports/dashboard.html").read_text(encoding="utf-8")
          forecast = Path("reports/forecast.html").read_text(encoding="utf-8")
          finrez = Path("reports/finrez.html").read_text(encoding="utf-8")
          cash = Path("az-baze-auth/cash_payments.py").read_text(encoding="utf-8")
          economics = Path("az-baze-auth/economics_control.py").read_text(encoding="utf-8")

          storage = Path("az-baze-auth/report_storage.py").read_text(encoding="utf-8")
          ident = Path("az-baze-auth/ident_import.py").read_text(encoding="utf-8")
          fixture = Path("az-baze-auth/fixtures/cash_reference_2026_anonymized.tsv").read_text(encoding="utf-8")

          assert 'action="/uploads/cash"' in uploads
          assert "/api/uploads/clinical/preview" in uploads
          assert "/api/uploads/cash/preview" in uploads
          assert "/api/uploads/paid-services/preview" in uploads
          assert "data-az-paid-upload-form" in uploads
          assert "Новый отчёт МИС «Выручка по направлениям»" in uploads
          assert "register_paid_services_upload(app)" in server
          assert "paid_services.parse_bytes" in paid_upload
          assert "paid_services.store_snapshot" in paid_upload
          assert "paid_services.parse_bytes" not in daily
          assert "paid_services.store_snapshot" not in daily
          assert "paid_services.overlay_stored_month" in daily
          assert "Сохранить старые" in uploads and "Загрузить новые" in uploads
          assert "Выберите направление" in uploads
          assert "0531380019042729" in uploads and "0463880019042725" in uploads
          assert "movement <= 0" in cash
          assert "provider_text = re.split(" in cash
          assert "if short and short in provider_text:" in cash
          assert "if short and short in operation:" not in cash

          # Owner-approved split-source semantics:
          # clinic Fact/legal entity stay cash-only; doctor/direction amounts use
          # MIS «Оплачено» and are not reconciled to the same-period cash Fact.
          assert "cashTotal" in management and "Выставлено счетов" in management
          assert "ДС ООО" in management and "ДС ИП" in management
          assert "Нераспределённые ДС" not in management
          assert "paidDataComplete===true" in management
          assert "r.paidDentists||{}" in management
          assert "r.paidClinicDocs||{}" in management
          assert "Оплачено стоматологии" in management
          assert "Оплачено отделению структуры" in management

          assert "ДС ООО" in period and "ДС ИП" in period
          assert "Нераспределённые ДС" not in period
          assert "Оплачено стоматологии" in period
          assert "Оплачено по врачам" in period
          assert "dentistsLegal" not in period
          assert "clinicDocsLegal" not in period

          assert "r?.cashTotal" in dashboard
          assert "Нераспределённые ДС" not in dashboard
          assert "paidDentists" in dashboard and "paidClinicDocs" in dashboard
          assert "План месяца:" in dashboard
          assert "data.flatMap(x=>[x.plan,x.factTotal])" in dashboard

          assert "r.cashTotal" in forecast
          assert "Нераспределённые ДС" not in forecast
          assert "r.paidDataComplete===true?num(r.paidLab):num(r.factLab)" in forecast

          assert "r.cashTotal" in finrez
          assert "Оплачено по направлениям" in finrez
          assert "Прочая / не распределённая сумма" not in finrez
          assert "_parse_revenue_source" in economics
          assert '"revenue": revenue' in economics
          assert "_preserve_cash_state" in storage
          assert "PAID_PRESERVED_KEYS" in storage
          assert "_reapply_cash_after_restore" in storage
          assert "_reapply_paid_after_restore" in storage
          assert "cash_payments.overlay_record_map" in ident
          assert "59891795" not in fixture  # totals are produced by parsing, not hard-coded as a total
          print("CASH FACT SOURCE CONTRACT: OK")
          PY
