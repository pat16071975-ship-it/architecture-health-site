name: AZ Lab add IGGT and neuropsychology descriptions
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-add-iggt-neuropsychology-descriptions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Add missing central descriptions and verify all direction links
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')

          iggt="  'ИГГТ':{title:'ИГГТ',items:['восстановление после перенесённых заболеваний и длительных нагрузок','снизилась переносимость физических нагрузок и появилась выраженная утомляемость','ИГГТ рассматривается как дополнительный метод только по решению врача','нужен индивидуальный восстановительный план с оценкой показаний и противопоказаний'],summary:'ИГГТ — контролируемое чередование дыхательных смесей с пониженным и повышенным содержанием кислорода. Метод рассматривается после консультации врача и не заменяет лечение заболеваний.'},\n"
          neuro="  'Нейропсихология':{title:'Нейропсихология',items:['ребёнку трудно удерживать внимание и следовать инструкции','есть трудности с памятью, чтением, письмом или счётом','сложно адаптироваться к школьной нагрузке','заметны импульсивность, отвлекаемость, быстрая утомляемость или трудности координации'],summary:'Нейропсихолог оценивает внимание, память, речь, движение, обучение и поведение ребёнка и при необходимости формирует программу коррекционных занятий в составе общего маршрута.'},\n"

          if "  'ИГГТ':{title:'ИГГТ'" not in s:
              marker="  'DIERS диагностика':{"
              if marker not in s:
                  raise SystemExit('STOP: DIERS marker not found')
              s=s.replace(marker,iggt+marker,1)

          if "  'Нейропсихология':{title:'Нейропсихология'" not in s:
              marker="  'Детская неврология':{"
              if marker not in s:
                  raise SystemExit('STOP: pediatric neurology marker not found')
              s=s.replace(marker,neuro+marker,1)

          expected={
            'Функциональная стоматология':'functional-dentistry',
            'Ортодонтия':'orthodontics',
            'Остеопатия':'osteopathy',
            'Терапия':'dentistry',
            'ИГГТ':'iggt',
            'DIERS диагностика':'diers',
            'Нейропсихология':'neuropsychology',
            'Детская неврология':'pediatric-neurology',
            'Миофункциональная терапия':'myofunctional-therapy',
            'Превентивная медицина':'preventive-medicine',
            'Гастроэнтерология':'gastroenterology',
            'Нутрициология':'nutrition',
          }
          for name,slug in expected.items():
              pair=f"'{name}':'/architecture-health-site/interface-lab/{slug}/'"
              if pair not in s:
                  raise SystemExit(f'STOP: missing/incorrect detailPath for {name}')
              target=Path('interface-lab')/slug/'index.html'
              if not target.exists():
                  raise SystemExit(f'STOP: target page missing: {target}')

          # Orbit geometry protection: these approved markers must remain unchanged.
          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];",
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14'
          ]
          for marker in protected:
              if marker not in s:
                  raise SystemExit(f'STOP: approved orbit marker missing: {marker}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only change and remove temporary workflow
        run: |
          rm -f .github/workflows/az-lab-add-iggt-neuropsychology-descriptions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-add-iggt-neuropsychology-descriptions.yml
          git commit -m 'Add IGGT and neuropsychology central descriptions'
          git push origin feature/site-v1
