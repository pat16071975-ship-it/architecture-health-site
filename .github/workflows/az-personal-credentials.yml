name: AZ personal credentials
on:
  pull_request:
    paths:
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/personal_credentials.py'
      - 'az-baze-auth/credentials_store.py'
      - 'az-baze-auth/access_contacts_ext.py'
      - 'az-baze-auth/templates/credential*.html'
      - 'az-baze-auth/templates/access_contacts.html'
      - 'az-baze-auth/templates/user_form.html'
      - 'az-baze-auth/templates/nn_home.html'
      - 'az-baze-auth/section_navigation.py'
      - 'az-baze-auth/test_personal_credentials.py'
      - '.github/workflows/az-personal-credentials.yml'
jobs:
  personal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r az-baze-auth/requirements.txt
      - working-directory: az-baze-auth
        run: |
          python -B -m unittest test_personal_credentials test_contact_excel_import test_accounting_section test_section_navigation
          python -B -m unittest test_nn_foundation
