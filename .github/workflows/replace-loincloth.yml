name: Apply reference-style loincloth
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/replace-loincloth.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Replace loincloth with reference-derived asset
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,re,pathlib
          b64=''
          pathlib.Path('assets/loincloth-reference.webp').write_bytes(base64.b64decode(b64))
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          repl=".stage:after{content:'';position:absolute;left:50%;top:56.5%;width:31%;height:20%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;background:url('assets/loincloth-reference.webp') center/contain no-repeat;filter:sepia(.08) saturate(.82) contrast(.96) brightness(1.03);mix-blend-mode:multiply}.vit-img"
          s2,n=re.subn(r"\.stage:after\{.*?\}\.vit-img",repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one stage:after replacement, got {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/replace-loincloth.yml
          git add index.html assets/loincloth-reference.webp
          git commit -m 'fix: match loincloth to supplied reference'
          git push origin HEAD:feature/site-v1
