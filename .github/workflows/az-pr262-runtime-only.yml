name: AZ PR262 archive runtime-only deployment
on:
  pull_request:
    paths:
      - 'az-baze-auth/deploy/controlled-pr262-runtime-only.py'
      - 'az-baze-auth/deploy/test_controlled_pr262_runtime.py'
      - '.github/workflows/az-pr262-runtime-only.yml'
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify runtime-only scope and synthetic guarded release
        run: |
          python -B -m py_compile az-baze-auth/deploy/controlled-pr262-runtime-only.py az-baze-auth/deploy/test_controlled_pr262_runtime.py
          python -B -m unittest discover -v -s az-baze-auth/deploy -p 'test_controlled_pr262_runtime.py'
          python - <<'PY'
          import subprocess
          expected={'.github/workflows/az-pr262-runtime-only.yml','az-baze-auth/deploy/controlled-pr262-runtime-only.py','az-baze-auth/deploy/test_controlled_pr262_runtime.py'}
          actual=set(subprocess.check_output(['git','diff','--name-only','93a8ee21866dd6abc3c70c323f76adc75e077508','HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          print('DEPLOY_PACKAGE_SCOPE=PASS; HISTORICAL_BUNDLE_NOT_REQUIRED; SYNTHETIC_ONLY')
          PY
