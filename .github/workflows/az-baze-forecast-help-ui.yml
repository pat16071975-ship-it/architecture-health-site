name: AZ-BAZE Forecast Period Base UI

on:
  push:
    branches:
      - feature/az-forecast-period-base
      - feature/az-baze-auth
    paths:
      - 'reports/forecast.html'
      - '.github/scripts/az-forecast-help-opaque-check.cjs'
      - '.github/workflows/az-baze-forecast-help-ui.yml'
  pull_request:
    paths:
      - 'reports/forecast.html'
      - '.github/scripts/az-forecast-help-opaque-check.cjs'
      - '.github/workflows/az-baze-forecast-help-ui.yml'

permissions:
  contents: read

jobs:
  forecast-management-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forecast base model preserved
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          BASE = "dd08ce6bd20a11a94c0d6429e565fdd72f2360fc"

          def git_show(path):
              return subprocess.check_output(
                  ["git","show",f"{BASE}:{path}"],
                  text=True,
                  encoding="utf-8",
              )

          def extract_function(src,name):
              marker=f"function {name}("
              start=src.find(marker)
              if start<0:
                  raise AssertionError("missing "+name)
              brace=src.find("{",start)
              depth=0
              quote=None
              escaped=False
              i=brace
              while i<len(src):
                  ch=src[i]
                  if quote is not None:
                      if escaped:
                          escaped=False
                      elif ch=="\\":
                          escaped=True
                      elif ch==quote:
                          quote=None
                  else:
                      if ch in ("'",'"',chr(96)):
                          quote=ch
                      elif ch=="{":
                          depth+=1
                      elif ch=="}":
                          depth-=1
                          if depth==0:
                              return src[start:i+1]
                  i+=1
              raise AssertionError("unterminated "+name)

          current=Path("reports/forecast.html").read_text(encoding="utf-8")
          base=git_show("reports/forecast.html")
          for name in ("stat","adir","recsum","fotRate","segments","segRev","baseline","curve","clinicBase"):
              assert extract_function(current,name)==extract_function(base,name), name
          print("FORECAST BASE MODEL PRESERVED: OK")
          PY

      - name: Forecast period-base source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("reports/forecast.html").read_text(encoding="utf-8")
          required=[
              '1. База прогноза',
              'Период для расчёта базы',
              '3 полных месяца',
              '6 полных месяцев',
              '12 полных месяцев',
              'Свой период',
              'Средние показатели одного месяца за выбранный период',
              'не включён в базу прогноза',
              '2. Что хотим изменить',
              '3. Что получим',
              '4. Управленческий вывод',
              'Консервативный',
              'Базовый',
              'Активный',
              'Доп. прибыль за горизонт',
              'Выручка в месяц к концу горизонта',
              'Факт клиники и «Оплачено» по направлениям',
              'кассовые поступления',
              'зачёт оплат по услугам',
              'id="baseReconcile"',
              'id="advancedSettings"',
              'Точные настройки',
              'id="forecastMethod"',
              'Повторные на 1 первичного считаются как все повторные периода / все первичные периода',
              'periodBaseline',
              'clinicPeriodBase',
              'FULL_MONTHS=ALL_MONTHS.filter(fullMonth)',
              'PARTIAL_MONTH=latest&&!fullMonth(latest)?latest:null',
              'endRevenue:base.rev+last.rev',
              'endProfit:base.profit+last.profit',
          ]
          for needle in required:
              assert needle in html, needle
          forbidden=[
              '<div class="bar">',
              '1. Текущая точка',
              '<label>Базовый месяц</label>',
              'Новая выручка = текущая выручка базового месяца + суммарная дополнительная выручка за весь выбранный горизонт'
          ]
          for needle in forbidden:
              assert needle not in html, needle
          print("FORECAST PERIOD BASE SOURCE CONTRACT: OK")
          PY

      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("reports/forecast.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>([\s\S]*?)</script>",html)
          assert scripts
          Path("/tmp/forecast-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/forecast-inline.js
          node --check .github/scripts/az-forecast-help-opaque-check.cjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/az-forecast-http.log 2>&1 &
          echo $! >/tmp/az-forecast-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/reports/forecast.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/az-forecast-http.log
          exit 1

      - name: Chromium forecast period-base checks
        run: node .github/scripts/az-forecast-help-opaque-check.cjs

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/az-forecast-http.pid ]; then kill "$(cat /tmp/az-forecast-http.pid)" || true; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-forecast-period-base-ui-screenshots
          path: artifacts/forecast-period-base-*.png
          if-no-files-found: warn
          retention-days: 7
