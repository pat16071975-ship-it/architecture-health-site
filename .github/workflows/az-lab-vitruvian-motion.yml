name: AZ Lab Vitruvian motion
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-vitruvian-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Patch Interface Lab
        run: python3 .github/scripts/az_vitruvian_motion.py
      - name: Commit viewer-only motion
        run: |
          rm -f .github/workflows/az-lab-vitruvian-motion.yml .github/scripts/az_vitruvian_motion.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-vitruvian-motion.yml .github/scripts/az_vitruvian_motion.py
          git commit -m 'Animate Vitruvian figure in Interface Lab'
          git push origin feature/site-v1
