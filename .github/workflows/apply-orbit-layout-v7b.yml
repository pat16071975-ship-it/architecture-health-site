name: Apply orbit layout v7b

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-orbit-layout-v7b.yml
      - tools/patch_orbit_layout_v7b.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: python tools/patch_orbit_layout_v7b.py
      - name: Validate Interface Lab JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('interface-lab/index.html').read_text(encoding='utf-8'); Path('/tmp/interface-lab.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/interface-lab.js
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Rebuild asymmetric orbit scene with mirrored five-item menus"
          git rm -f .github/workflows/apply-orbit-layout-v7.yml tools/patch_orbit_layout_v7.py .github/workflows/apply-orbit-layout-v7b.yml tools/patch_orbit_layout_v7b.py
          git commit -m "Remove one-off orbit layout patch files"
          git push origin feature/site-v1
