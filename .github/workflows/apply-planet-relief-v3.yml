name: Apply strong planet relief v3

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-planet-relief-v3.yml
      - tools/patch_planet_relief_v3.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: python3 tools/patch_planet_relief_v3.py
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/apply-planet-relief-v3.yml tools/patch_planet_relief_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen planet relief in Interface Lab"
          git push origin feature/site-v1
