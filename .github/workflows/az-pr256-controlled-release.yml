name: AZ PR256 incoming documents controlled deployment package
on:
  pull_request:
    paths:
      - 'az-baze-auth/deploy/controlled-pr256-incoming-documents.py'
      - 'az-baze-auth/deploy/test_controlled_pr256_release.py'
      - '.github/workflows/az-pr256-controlled-release.yml'
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test immutable installer, additive SQLite migration, safe rollback
        run: |
          python3 -B -m py_compile az-baze-auth/deploy/controlled-pr256-incoming-documents.py
          python3 -B -m py_compile az-baze-auth/deploy/test_controlled_pr256_release.py
          python3 -B -m unittest discover -v -s az-baze-auth/deploy -p 'test_controlled_pr256_release.py'
