name: AZ Lab fix direction links
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-fix-direction-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Map each ready direction to its own viewer page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')
          needle="  panel.querySelector('.az-lab-direction-close').addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();closeDirectionInfo(doc)});"
          insert="  const detailPaths={'Функциональная стоматология':'/architecture-health-site/interface-lab/functional-dentistry/','Ортодонтия':'/architecture-health-site/interface-lab/orthodontics/','Остеопатия':'/architecture-health-site/interface-lab/osteopathy/','Терапия':'/architecture-health-site/interface-lab/dentistry/'};\n  const more=panel.querySelector('.az-lab-direction-more'),detailPath=detailPaths[name];\n  if(detailPath){more.setAttribute('href',detailPath)}else{more.removeAttribute('href');more.setAttribute('aria-disabled','true');}"
          if needle not in s:
              raise SystemExit('Close-button marker not found')
          if "const detailPaths={'Функциональная стоматология'" not in s:
              s=s.replace(needle,insert+'\n'+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f interface-lab/functional-dentistry/index.html
          test -f interface-lab/orthodontics/index.html
          test -f interface-lab/dentistry/index.html
          test -f interface-lab/osteopathy/index.html
          grep -q "interface-lab/orthodontics/" interface-lab/index.html
          grep -q "interface-lab/dentistry/" interface-lab/index.html
          grep -q "interface-lab/osteopathy/" interface-lab/index.html
      - name: Commit viewer link fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Fix direction detail links in Interface Lab"
          git push origin feature/site-v1