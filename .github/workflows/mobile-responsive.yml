name: Mobile responsive layout

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Adapt main and specialists pages for mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- Main page ----------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          desktop_guards = [
              '.promo-badge{position:absolute;top:154px;',
              '.map{position:absolute;left:50%;top:-60px;width:1120px;height:920px;',
              '.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;',
              'style="left:560px;top:117px"',
              'style="left:941px;top:440px"',
              'style="left:560px;top:763px"'
          ]
          for marker in desktop_guards:
              if marker not in s:
                  raise SystemExit('desktop geometry guard failed before patch: ' + marker)

          mobile_css = r'''
          /* mobile-responsive-v1 */
          .mobile-tools{display:none}
          @media(max-width:720px){
            .page{width:100%;max-width:100vw;padding:10px 12px 30px}
            .top{grid-template-columns:64px minmax(0,1fr) 64px;gap:8px;align-items:start}
            .left,.right{min-width:0}
            .logo{width:64px;height:64px}
            .founder{width:60px;height:60px;border-radius:8px}
            .caption{margin-top:4px;font-size:7.5px;line-height:1.2}
            .center{min-width:0;padding-top:1px}
            h1{margin-top:2px;font-size:29px;line-height:.98;letter-spacing:0}
            .positioning{max-width:220px;margin:6px auto 0;font-size:11.5px;line-height:1.15;letter-spacing:0}
            .rule{width:92px;margin-top:7px}
            .clinic-contact,.specialists-badge,.side-menu-badge{display:none}

            .promo-badge{top:111px;width:calc(100% - 32px);max-width:520px;padding:9px 12px 8px;border-radius:13px}
            .promo-copy{font-size:14px;line-height:1.16;white-space:normal}
            .promo-cta{margin-top:5px;padding-top:5px;font-size:9.5px}

            .mobile-tools{display:block;margin:105px auto 16px;max-width:520px;text-align:center}
            .mobile-contact{padding:12px 14px 11px;border:1px solid rgba(181,150,98,.34);border-radius:13px;background:rgba(250,247,241,.82);box-shadow:0 7px 20px rgba(71,58,38,.05)}
            .mobile-phone{font:600 18px/1.1 'Cormorant Garamond',Georgia,serif;white-space:nowrap}
            .mobile-phone a{color:#355640;text-decoration:none}
            .mobile-hours{margin-top:5px;color:#626b63;font:500 10.5px/1.35 Inter,Segoe UI,Arial,sans-serif}
            .mobile-nav{display:flex;gap:8px;margin-top:10px;padding:1px 1px 4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
            .mobile-nav::-webkit-scrollbar{display:none}
            .mobile-nav a,.mobile-nav span{flex:0 0 auto;min-width:108px;padding:9px 13px;border:1px solid rgba(181,150,98,.38);border-radius:10px;background:rgba(250,247,241,.94);color:#354039;font:600 13px/1.05 'Cormorant Garamond',Georgia,serif;text-align:center;box-shadow:0 5px 14px rgba(71,58,38,.04)}
            .mobile-nav a{cursor:pointer}

            .map-shell{height:auto;min-height:0;position:relative}
            .map{position:relative;left:auto;top:auto;width:100%;height:auto;transform:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:8px;padding:calc(min(88vw,360px) + 36px) 0 8px}
            .ring{display:none}
            .stage{left:50%;top:0;width:min(88vw,360px);height:min(88vw,360px);transform:translateX(-50%);box-shadow:0 14px 36px rgba(76,58,34,.08)}
            .stage:before{inset:20px}
            .direction{position:relative!important;left:auto!important;top:auto!important;transform:none!important;width:100%;height:auto;min-height:50px;margin:0;padding:7px 6px;font-size:10px;line-height:1.15;border-radius:10px}
            .relation-panel{display:none}

            .attention-section{min-height:0;margin-top:14px;padding:50px 10px 52px}
            .attention-eyebrow{font-size:9px;margin-bottom:12px}
            .attention-title{font-size:29px;line-height:1.12;margin-bottom:28px}
            .attention-stage{min-height:0}
            .attention-copy{padding:4px 0 8px}
            .attention-question{min-height:150px}
            .attention-question.mode-a{font-size:36px;line-height:1.02}
            .attention-question.mode-b{font-size:34px;line-height:1.05}
            .attention-question.mode-c{font-size:28px;line-height:1.05}
            .attention-links{min-height:0;margin-top:18px}
            .attention-directions{gap:7px}
            .attention-direction{font-size:10.5px;padding:7px 10px}
            .attention-controls{margin-top:22px}
            .attention-message{margin-top:24px;padding-top:18px}
            .attention-message-main{font-size:24px;line-height:1.18}
            .attention-message-sub{font-size:12px;line-height:1.45}

            .faq-section{margin-top:14px;padding:50px 4px 58px}
            .faq-title{font-size:29px;line-height:1.1}
            .faq-intro{font-size:12.5px;line-height:1.5}
            .faq-grid{margin-top:28px;grid-template-columns:1fr;gap:9px}
            .faq-item{border-radius:12px}
            .faq-item summary{padding:15px 44px 15px 16px;font-size:16px;line-height:1.18}
            .faq-item summary:after{right:15px}
            .faq-answer{padding:13px 16px 17px;font-size:12.5px;line-height:1.55}
          }
          @media(max-width:360px){
            .page{padding-left:9px;padding-right:9px}
            .top{grid-template-columns:58px minmax(0,1fr) 58px;gap:6px}
            .logo{width:58px;height:58px}
            .founder{width:54px;height:54px}
            h1{font-size:27px}
            .positioning{font-size:10.5px}
            .promo-badge{width:calc(100% - 22px);top:106px}
            .promo-copy{font-size:13.2px}
            .mobile-tools{margin-top:103px}
            .map{gap:6px;padding-top:calc(min(89vw,340px) + 32px)}
            .stage{width:min(89vw,340px);height:min(89vw,340px)}
            .direction{min-height:48px;font-size:9.4px;padding:6px 4px}
            .attention-question.mode-a{font-size:33px}
            .attention-question.mode-b{font-size:31px}
            .attention-question.mode-c{font-size:26px}
          }
          '''
          if 'mobile-responsive-v1' not in s:
              if '</style>' not in s:
                  raise SystemExit('style end not found')
              s = s.replace('</style>', mobile_css + '</style>', 1)

          mobile_html = '''<div class="mobile-tools" aria-label="Контакты и навигация"><div class="mobile-contact"><div class="mobile-phone"><a href="tel:+73832496411">+ 7</a><a href="tel:+73832846011">&nbsp;(383) 284-24-21</a></div><div class="mobile-hours">Пн-Пт — 08:00—21:00 · Сб-Вс — 09:00−21:00</div></div><nav class="mobile-nav" aria-label="Разделы сайта"><a href="specialists/">команда</a><span>о клинике</span><span>пациенту</span><span>лаборатория</span><span>контакты</span></nav></div>'''
          if 'class="mobile-tools"' not in s:
              marker = '<div class="radial-badge promo-badge"><div class="promo-copy">Для улыбки не нужны импланты - правильная улыбка от <strong>5000р</strong> у детей и взрослых</div><div class="promo-cta">запишись</div></div>'
              if marker not in s:
                  raise SystemExit('promo html marker not found')
              s = s.replace(marker, marker + mobile_html, 1)

          # Desktop geometry must remain exactly as before.
          for marker in desktop_guards:
              if marker not in s:
                  raise SystemExit('desktop geometry guard failed after patch: ' + marker)

          p.write_text(s, encoding='utf-8')

          # ---------- Specialists page ----------
          sp = Path('specialists/index.html')
          ss = sp.read_text(encoding='utf-8')
          specialists_css = r'''
          /* mobile-specialists-v1 */
          @media(max-width:640px){
            .page{width:100%;max-width:100vw;padding:14px 12px 48px}
            .top{grid-template-columns:60px minmax(0,1fr);gap:10px;align-items:start;padding-bottom:18px}
            .logo{width:58px;height:58px}
            .brand{min-width:0;text-align:left}
            .eyebrow{font-size:8px;letter-spacing:.16em;margin-bottom:5px}
            h1{font-size:36px;line-height:.96}
            .subtitle{margin-top:9px;font-size:11.5px;line-height:1.4}
            .back{grid-column:1/-1;justify-self:stretch;margin-top:2px;padding:10px 14px;text-align:center;border-radius:10px}
            .intro{padding:34px 2px 24px}
            .intro h2{font-size:32px;line-height:1.04}
            .intro p{font-size:12.5px;line-height:1.5}
            .grid{grid-template-columns:1fr;gap:14px}
            .card{min-height:0;border-radius:14px}
            .portrait-wrap{height:min(104vw,380px)}
            .info{padding:18px 17px 20px}
            .name{font-size:26px}
            .role{min-height:0;font-size:12.5px}
            .source{right:10px;top:10px;border-radius:7px}
            .note{margin-top:30px;padding:18px 4px 0;font-size:10.5px}
          }
          @media(max-width:360px){
            h1{font-size:33px}
            .portrait-wrap{height:330px}
          }
          '''
          if 'mobile-specialists-v1' not in ss:
              if '</style>' not in ss:
                  raise SystemExit('specialists style end not found')
              ss = ss.replace('</style>', specialists_css + '</style>', 1)
          sp.write_text(ss, encoding='utf-8')
          PY

          rm -f .github/workflows/mobile-responsive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html specialists/index.html .github/workflows/mobile-responsive.yml
          git commit -m "Improve mobile layout for site pages"
          git push origin HEAD:feature/site-v1
