name: Apply richer planet direction preview
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/apply-planet-surface-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab planet surfaces
        shell: python
        run: |
          from pathlib import Path
          p = Path('interface-lab/index.html')
          s = p.read_text(encoding='utf-8')
          marker = "\n`;\n\nfunction clearDraft(doc)"
          if marker not in s:
              raise SystemExit('draft CSS end marker not found')
          css = r'''

/* planet-surface-v2 — объёмные разные планеты в исходной палитре */
@media (min-width:1181px){
  .direction{
    width:116px!important;height:104px!important;min-height:104px!important;padding:12px 10px!important;
    border-radius:50% 50% 48% 52% / 52% 50% 50% 48%!important;
    isolation:isolate!important;overflow:hidden!important;
    background-color:rgba(250,247,241,.98)!important;
    background-image:
      radial-gradient(circle at 25% 28%,rgba(255,255,255,.38) 0 3%,transparent 18%),
      radial-gradient(ellipse at 35% 38%,rgba(181,150,98,.13) 0 22%,transparent 31%),
      radial-gradient(ellipse at 68% 63%,rgba(68,99,79,.10) 0 20%,transparent 29%),
      radial-gradient(circle at 70% 25%,transparent 0 5%,rgba(181,150,98,.20) 5.5% 7%,rgba(255,255,255,.22) 7.5% 9%,transparent 10%),
      radial-gradient(circle at 33% 67%,transparent 0 4%,rgba(68,99,79,.16) 4.5% 6.5%,rgba(255,255,255,.18) 7% 8%,transparent 9%),
      radial-gradient(circle at 56% 48%,transparent 0 2.5%,rgba(181,150,98,.17) 3% 4.5%,transparent 5.5%),
      radial-gradient(ellipse at 42% 34%,transparent 0 46%,rgba(71,58,38,.045) 62%,rgba(71,58,38,.16) 86%,rgba(71,58,38,.25) 100%),
      linear-gradient(145deg,rgba(255,255,255,.18),transparent 42%,rgba(68,99,79,.045))!important;
    background-blend-mode:normal!important;
    border:1px solid rgba(68,99,79,.28)!important;
    box-shadow:inset 12px 9px 18px rgba(255,255,255,.30),inset -18px -14px 26px rgba(71,58,38,.16),0 9px 22px rgba(71,58,38,.08)!important;
    font-size:10.5px!important;line-height:1.13!important;text-shadow:0 1px 0 rgba(255,255,255,.72)!important;
  }
  .direction:nth-of-type(4n+1){
    border-radius:51% 49% 52% 48% / 49% 53% 47% 51%!important;
    background-image:
      radial-gradient(circle at 30% 26%,rgba(255,255,255,.34) 0 4%,transparent 18%),
      radial-gradient(ellipse at 29% 56%,rgba(68,99,79,.11) 0 19%,transparent 27%),
      radial-gradient(ellipse at 70% 48%,rgba(181,150,98,.16) 0 25%,transparent 34%),
      radial-gradient(circle at 73% 25%,transparent 0 5%,rgba(68,99,79,.18) 5.5% 7%,rgba(255,255,255,.19) 7.5% 9%,transparent 10%),
      radial-gradient(circle at 46% 72%,transparent 0 3%,rgba(181,150,98,.20) 3.5% 5.5%,transparent 7%),
      radial-gradient(circle at 21% 38%,transparent 0 2.5%,rgba(181,150,98,.16) 3% 4.5%,transparent 5.5%),
      radial-gradient(ellipse at 39% 34%,transparent 0 45%,rgba(71,58,38,.05) 62%,rgba(71,58,38,.17) 86%,rgba(71,58,38,.26) 100%),
      linear-gradient(150deg,rgba(255,255,255,.16),transparent 45%,rgba(181,150,98,.045))!important;
  }
  .direction:nth-of-type(4n+2){
    border-radius:49% 51% 47% 53% / 53% 48% 52% 47%!important;
    background-image:
      radial-gradient(circle at 23% 30%,rgba(255,255,255,.35) 0 3%,transparent 16%),
      radial-gradient(ellipse at 55% 28%,rgba(181,150,98,.15) 0 24%,transparent 32%),
      radial-gradient(ellipse at 37% 72%,rgba(68,99,79,.11) 0 23%,transparent 31%),
      radial-gradient(circle at 72% 65%,transparent 0 6%,rgba(181,150,98,.21) 6.5% 8%,rgba(255,255,255,.20) 8.5% 10%,transparent 11%),
      radial-gradient(circle at 30% 50%,transparent 0 4%,rgba(68,99,79,.17) 4.5% 6%,transparent 7%),
      radial-gradient(circle at 62% 42%,transparent 0 2%,rgba(181,150,98,.18) 2.5% 4%,transparent 5%),
      radial-gradient(ellipse at 38% 34%,transparent 0 46%,rgba(71,58,38,.05) 63%,rgba(71,58,38,.18) 87%,rgba(71,58,38,.27) 100%),
      linear-gradient(138deg,rgba(255,255,255,.18),transparent 44%,rgba(68,99,79,.05))!important;
  }
  .direction:nth-of-type(4n+3){
    border-radius:53% 47% 50% 50% / 48% 52% 49% 51%!important;
    background-image:
      radial-gradient(circle at 32% 25%,rgba(255,255,255,.38) 0 3.5%,transparent 17%),
      radial-gradient(ellipse at 69% 34%,rgba(68,99,79,.12) 0 22%,transparent 30%),
      radial-gradient(ellipse at 38% 62%,rgba(181,150,98,.15) 0 26%,transparent 34%),
      radial-gradient(circle at 26% 70%,transparent 0 5%,rgba(181,150,98,.22) 5.5% 7.5%,rgba(255,255,255,.19) 8% 9.5%,transparent 10.5%),
      radial-gradient(circle at 73% 57%,transparent 0 3.5%,rgba(68,99,79,.18) 4% 5.5%,transparent 7%),
      radial-gradient(circle at 50% 39%,transparent 0 2.5%,rgba(181,150,98,.18) 3% 4.2%,transparent 5.5%),
      radial-gradient(ellipse at 40% 34%,transparent 0 46%,rgba(71,58,38,.045) 63%,rgba(71,58,38,.17) 87%,rgba(71,58,38,.26) 100%),
      linear-gradient(150deg,rgba(255,255,255,.19),transparent 45%,rgba(181,150,98,.045))!important;
  }
  .direction:nth-of-type(4n){
    border-radius:48% 52% 53% 47% / 51% 47% 53% 49%!important;
    background-image:
      radial-gradient(circle at 27% 26%,rgba(255,255,255,.36) 0 3%,transparent 17%),
      radial-gradient(ellipse at 31% 42%,rgba(181,150,98,.14) 0 20%,transparent 28%),
      radial-gradient(ellipse at 68% 67%,rgba(68,99,79,.115) 0 25%,transparent 33%),
      radial-gradient(circle at 68% 24%,transparent 0 4.5%,rgba(68,99,79,.18) 5% 6.5%,rgba(255,255,255,.18) 7% 8.5%,transparent 10%),
      radial-gradient(circle at 42% 73%,transparent 0 5%,rgba(181,150,98,.21) 5.5% 7.5%,transparent 9%),
      radial-gradient(circle at 56% 50%,transparent 0 2%,rgba(181,150,98,.17) 2.5% 4%,transparent 5%),
      radial-gradient(ellipse at 39% 34%,transparent 0 45%,rgba(71,58,38,.05) 62%,rgba(71,58,38,.18) 86%,rgba(71,58,38,.27) 100%),
      linear-gradient(142deg,rgba(255,255,255,.18),transparent 43%,rgba(68,99,79,.045))!important;
  }
}

@media (min-width:721px) and (max-width:1180px){
  .direction{
    width:100px!important;height:88px!important;min-height:88px!important;padding:9px 7px!important;
    border-radius:50% 50% 48% 52% / 52% 50% 50% 48%!important;
    isolation:isolate!important;overflow:hidden!important;
    background-color:rgba(250,247,241,.98)!important;
    background-image:
      radial-gradient(circle at 25% 28%,rgba(255,255,255,.36) 0 3%,transparent 18%),
      radial-gradient(ellipse at 35% 38%,rgba(181,150,98,.13) 0 22%,transparent 31%),
      radial-gradient(ellipse at 68% 63%,rgba(68,99,79,.10) 0 20%,transparent 29%),
      radial-gradient(circle at 70% 25%,transparent 0 5%,rgba(181,150,98,.20) 5.5% 7%,rgba(255,255,255,.20) 7.5% 9%,transparent 10%),
      radial-gradient(circle at 33% 67%,transparent 0 4%,rgba(68,99,79,.16) 4.5% 6.5%,transparent 8%),
      radial-gradient(ellipse at 42% 34%,transparent 0 46%,rgba(71,58,38,.045) 62%,rgba(71,58,38,.16) 86%,rgba(71,58,38,.25) 100%),
      linear-gradient(145deg,rgba(255,255,255,.18),transparent 42%,rgba(68,99,79,.045))!important;
    border:1px solid rgba(68,99,79,.28)!important;
    box-shadow:inset 9px 7px 14px rgba(255,255,255,.28),inset -14px -11px 21px rgba(71,58,38,.15),0 7px 18px rgba(71,58,38,.07)!important;
    font-size:8.8px!important;line-height:1.1!important;text-shadow:0 1px 0 rgba(255,255,255,.72)!important;
  }
  .direction:nth-of-type(4n+1){background-position:0 0,-7px 3px,5px -2px,4px 2px,-2px -1px,0 0,0 0!important;border-radius:51% 49% 52% 48% / 49% 53% 47% 51%!important}
  .direction:nth-of-type(4n+2){background-position:2px -2px,4px 1px,-5px 3px,-2px 1px,3px -2px,0 0,0 0!important;border-radius:49% 51% 47% 53% / 53% 48% 52% 47%!important}
  .direction:nth-of-type(4n+3){background-position:-2px 1px,6px -3px,-4px 2px,2px -2px,-3px 2px,0 0,0 0!important;border-radius:53% 47% 50% 50% / 48% 52% 49% 51%!important}
  .direction:nth-of-type(4n){background-position:3px 0,-4px -2px,5px 2px,-3px 1px,2px -3px,0 0,0 0!important;border-radius:48% 52% 53% 47% / 51% 47% 53% 49%!important}
}
'''
          s = s.replace(marker, css + marker, 1)
          s = s.replace("'Черновик: планшет — планеты-направления с кратерами':'Черновик: ПК — планеты-направления с кратерами'", "'Черновик: планшет — планеты v2':'Черновик: ПК — планеты v2'", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Make direction badges look like varied planets"
          git rm .github/workflows/apply-planet-surface-v2.yml
          git commit -m "Remove one-off planet surface workflow"
          git push origin feature/site-v1
