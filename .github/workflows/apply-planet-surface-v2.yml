name: Apply planet surface v2
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/apply-planet-surface-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('interface-lab/index.html')
          s = p.read_text(encoding='utf-8')
          css = Path('.github/planet-surface-v2.css').read_text(encoding='utf-8')
          marker = "\n`;\n\nfunction clearDraft(doc)"
          if marker not in s:
              raise SystemExit('draft CSS end marker not found')
          if 'planet-surface-v2' in s:
              raise SystemExit('planet-surface-v2 already present')
          s = s.replace(marker, css + marker, 1)
          s = s.replace("'Черновик: планшет — планеты-направления с кратерами':'Черновик: ПК — планеты-направления с кратерами'", "'Черновик: планшет — планеты v2':'Черновик: ПК — планеты v2'", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Make direction badges look like varied planets"
          git rm .github/workflows/apply-planet-surface-v2.yml .github/planet-surface-v2.css
          git commit -m "Remove one-off planet surface files"
          git push origin feature/site-v1
