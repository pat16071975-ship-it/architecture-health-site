name: AZ financial model
on:
  pull_request:
    paths:
      - 'az-baze-auth/financial_model*'
      - 'az-baze-auth/test_financial_model.py'
      - 'az-baze-auth/templates/financial_model.html'
      - 'az-baze-auth/app.py'
      - 'reports/menu.html'
      - 'tests/*financial_model*'
      - 'tests/verify-financial-model.cjs'
      - '.github/workflows/az-financial-model.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r az-baze-auth/requirements.txt
      - working-directory: az-baze-auth
        run: |
          python -B -m unittest test_financial_model test_attention test_section_navigation test_ztl test_medical_supplies
          python -B -m unittest test_nn_foundation
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/verify-financial-model.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-model-browser
          path: /tmp/finmodel-browser
