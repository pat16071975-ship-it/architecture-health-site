name: AZ functional dentistry anatomy visual
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-functional-dentistry-anatomy-visual.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Replace hero visual only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('interface-lab/functional-dentistry/index.html')
          s=p.read_text()
          css_new=r'''.visual{position:relative;min-height:520px}.anatomy-shell{position:absolute;inset:6px -8px 8px 22px}.anatomy-field{position:absolute;inset:28px 20px 28px 38px;border-radius:46% 54% 49% 51%/44% 46% 54% 56%;background:radial-gradient(circle at 54% 42%,rgba(255,255,255,.72),rgba(239,232,219,.72) 55%,rgba(239,232,219,.46) 100%);box-shadow:var(--shadow);overflow:hidden}.anatomy-svg{width:100%;height:100%;display:block}.anatomy-svg .outline{fill:none;stroke:#44634f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.72}.anatomy-svg .soft{fill:none;stroke:#7b8f78;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}.anatomy-svg .gold{fill:none;stroke:#b59662;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.74}.anatomy-svg .muscle{fill:rgba(181,150,98,.15);stroke:#b59662;stroke-width:1.15;opacity:.9}.anatomy-svg .airway{fill:rgba(68,99,79,.09);stroke:#44634f;stroke-width:1.2;opacity:.78}.anatomy-svg .joint{fill:#f7f3ec;stroke:#44634f;stroke-width:1.8}.anatomy-svg .tooth{fill:#fbf8f2;stroke:#44634f;stroke-width:1}.anatomy-svg .posture{fill:none;stroke:#b59662;stroke-width:1.4;stroke-dasharray:5 6;opacity:.62}.ring{position:absolute;border:1px solid rgba(68,99,79,.18);border-radius:50%;pointer-events:none}.r1{width:455px;height:330px;left:-6px;top:6px;transform:rotate(14deg)}.r2{width:390px;height:485px;right:-10px;bottom:-4px;border-color:rgba(181,150,98,.28);transform:rotate(-17deg)}.r3{width:285px;height:215px;left:124px;bottom:14px;border-color:rgba(68,99,79,.12);transform:rotate(24deg)}.visual-tag{position:absolute;z-index:4;display:flex;align-items:center;gap:9px;padding:9px 13px;background:rgba(251,248,242,.96);border:1px solid rgba(68,99,79,.17);border-radius:999px;box-shadow:0 10px 24px rgba(65,55,42,.07);font-size:10.5px;font-weight:600;color:#4b5c51;white-space:nowrap}.visual-tag:after{content:"";position:absolute;height:1px;background:rgba(68,99,79,.24);transform-origin:left center}.tag-joint{left:-4px;top:122px}.tag-joint:after{width:78px;left:100%;top:50%;transform:rotate(10deg)}.tag-bite{right:-10px;top:230px}.tag-bite:after{width:68px;right:100%;top:50%;transform-origin:right center;transform:rotate(-8deg)}.tag-breath{right:20px;bottom:75px}.tag-breath:after{width:72px;right:100%;top:50%;transform-origin:right center;transform:rotate(18deg)}.tag-posture{left:8px;bottom:54px}.tag-posture:after{width:74px;left:100%;top:50%;transform:rotate(-16deg)}.tag-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}.tag-bite .tag-dot,.tag-posture .tag-dot{background:var(--gold)}'''
          s,n=re.subn(r'\.visual\{position:relative;min-height:500px\}.*?\.tag-2 \.tag-dot\{background:var\(--gold\)\}',css_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'CSS visual block replacement count={n}')
          visual_new=r'''<div class="visual"><div class="anatomy-shell"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="anatomy-field" aria-label="Схема взаимосвязи прикуса, ВНЧС, мышц, дыхания и осанки"><svg class="anatomy-svg" viewBox="0 0 520 500" role="img" aria-label="Функциональная схема головы и зубочелюстной системы"><path class="outline" d="M337 70c-52-25-116-18-157 18-35 31-50 79-43 125 4 29 18 50 37 69 17 17 27 37 29 65 2 25-4 51-13 78"/><path class="outline" d="M337 70c28 17 45 45 45 78 0 24-8 43-22 58-9 10-10 24-2 34 8 10 20 19 18 31-2 11-15 14-25 17-7 2-9 8-6 14 6 10 3 17-7 22 8 8 7 17-1 24-8 6-20 6-31 7-18 2-30 10-36 27-7 18-7 39-5 57"/><path class="outline" d="M211 267c27 13 61 17 90 7 18-6 33-17 45-30"/><path class="soft" d="M224 248c23 8 51 9 74 2 14-4 27-11 37-20"/><path class="gold" d="M225 271c12 19 32 30 56 31 24 0 44-10 58-29"/><circle class="joint" cx="209" cy="251" r="10"/><path class="muscle" d="M216 118c19 11 31 33 33 61 2 25-5 48-21 64-10-18-14-39-12-62 1-23 1-43 0-63z"/><path class="muscle" d="M245 153c18 18 26 42 24 70-2 24-11 43-26 57-8-20-10-41-6-62 4-21 7-43 8-65z"/><path class="airway" d="M322 139c-20 11-31 31-32 55-2 25 9 46 25 61 10 9 16 20 17 35 1 15-5 28-13 41 17-9 28-26 28-47 0-22-10-39-24-54-12-13-17-29-14-47 3-18 8-32 13-44z"/><path class="soft" d="M295 239c20-1 40 4 57 15"/><g><path class="tooth" d="M257 254c4-6 10-6 14 0l-2 18c-1 5-4 8-5 8s-4-3-5-8z"/><path class="tooth" d="M274 255c4-6 10-6 14 0l-1 17c-1 5-4 8-6 8-2 0-4-3-5-8z"/><path class="tooth" d="M291 254c4-5 10-5 13 1l-1 16c-1 5-4 8-6 8-2 0-4-3-5-8z"/></g><path class="posture" d="M198 76c-24 45-27 94-11 145 7 22 12 44 13 68 2 47-5 92-25 134"/><path class="posture" d="M168 92c-18 45-18 91-2 136"/><circle cx="209" cy="251" r="22" fill="none" stroke="#44634f" stroke-width="1" opacity=".18"/><circle cx="281" cy="268" r="34" fill="none" stroke="#b59662" stroke-width="1" opacity=".18"/></svg></div><span class="visual-tag tag-joint"><span class="tag-dot"></span>ВНЧС и мышцы</span><span class="visual-tag tag-bite"><span class="tag-dot"></span>Прикус</span><span class="visual-tag tag-breath"><span class="tag-dot"></span>Дыхание</span><span class="visual-tag tag-posture"><span class="tag-dot"></span>Голова, шея и осанка</span></div></div>'''
          pattern=r'(<section class="hero">.*?<div class="visual">).*?(</div></div></section>\n<section class="section alt">)'
          m=re.search(pattern,s,flags=re.S)
          if not m: raise SystemExit('Hero visual region not found')
          replacement=m.group(1).rsplit('<div class="visual">',1)[0]+visual_new+m.group(2)
          s=s[:m.start()]+replacement+s[m.end():]
          # mobile overrides for new visual
          s=s.replace('.photo-shell{inset:10px 8px 20px 26px}', '.anatomy-shell{inset:4px -4px 8px 6px}.anatomy-field{inset:22px 12px 24px 24px}')
          s=s.replace('.visual-tag{font-size:9px}', '.visual-tag{font-size:8.5px;padding:7px 9px}.tag-joint{left:-2px;top:95px}.tag-bite{right:-4px;top:185px}.tag-breath{right:4px;bottom:58px}.tag-posture{left:2px;bottom:42px}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/az-functional-dentistry-anatomy-visual.yml
          git add interface-lab/functional-dentistry/index.html
          git commit -m 'Refine functional dentistry hero with anatomy visual'
          git push origin feature/site-v1
