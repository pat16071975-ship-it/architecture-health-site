name: AZ upload confirmation and doctor grouping
on:
  push:
    branches-ignore: ['ops/**']
    paths:
      - 'az-baze-auth/templates/uploads.html'
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'tests/test_ui_feedback_20261028.py'
      - 'tests/verify-paid-upload-periods.cjs'
      - '.github/workflows/az-ui-feedback.yml'
  pull_request:
    paths:
      - 'az-baze-auth/templates/uploads.html'
      - 'reports/index.html'
      - 'reports/period-view.js'
      - 'tests/test_ui_feedback_20261028.py'
      - 'tests/verify-paid-upload-periods.cjs'
      - '.github/workflows/az-ui-feedback.yml'
permissions:
  contents: read
jobs:
  ui-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Syntax and retained payment/period contracts
        run: |
          node --check reports/period-view.js
          node tests/verify-paid-periods.cjs
          node tests/verify-paid-upload-periods.cjs
      - name: Actual client script and synthetic browser cases
        run: python tests/test_ui_feedback_20261028.py
