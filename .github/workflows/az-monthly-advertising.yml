name: AZ monthly advertising
on:
  pull_request:
    paths:
      - 'az-baze-auth/advertising_monthly_costs.py'
      - 'az-baze-auth/advertising_report.py'
      - 'az-baze-auth/templates/advertising_costs_fragment.html'
      - 'az-baze-auth/test_advertising_monthly*.py'
      - 'tests/test_monthly_advertising_ui.py'
      - '.github/workflows/az-monthly-advertising.yml'
permissions:
  contents: read
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r az-baze-auth/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Monthly calculation, SQLite transactions and Flask security
        working-directory: az-baze-auth
        run: |
          python -m unittest -v test_advertising_monthly_routes.py
          python -m unittest -v test_advertising_monthly_costs.py
      - name: Monthly expense form desktop and mobile
        run: python tests/test_monthly_advertising_ui.py
