name: AZ ZTL orders and granular permissions
on:
  pull_request:
    paths:
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/ztl.py'
      - 'az-baze-auth/ztl_control.py'
      - 'az-baze-auth/ztl_labor.py'
      - 'az-baze-auth/test_ztl_labor.py'
      - 'az-baze-auth/browser_ztl_labor.py'
      - 'az-baze-auth/templates/ztl_*.html'
      - 'az-baze-auth/test_ztl_control.py'
      - 'az-baze-auth/browser_ztl_control.py'
      - 'az-baze-auth/medical_supplies.py'
      - 'az-baze-auth/templates/ztl.html'
      - 'az-baze-auth/templates/medical_supplies.html'
      - 'az-baze-auth/test_ztl.py'
      - '.github/workflows/az-ztl-ledger.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r az-baze-auth/requirements.txt playwright==1.55.0
      - working-directory: az-baze-auth
        run: |
          python -B -m unittest test_ztl test_ztl_control test_ztl_labor test_medical_supplies test_accounting_section test_section_navigation
          python -B -m unittest test_nn_foundation
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$CHROMIUM_PATH"
          python -B browser_ztl_control.py
          python -B browser_ztl_labor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ztl-control-browser
          path: az-baze-auth/ztl-browser-artifacts/
          if-no-files-found: ignore
