name: AZ ZTL orders and granular permissions
on:
  pull_request:
    paths:
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/ztl.py'
      - 'az-baze-auth/medical_supplies.py'
      - 'az-baze-auth/templates/ztl.html'
      - 'az-baze-auth/templates/medical_supplies.html'
      - 'az-baze-auth/test_ztl.py'
      - '.github/workflows/az-ztl-ledger.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r az-baze-auth/requirements.txt
      - working-directory: az-baze-auth
        run: |
          python -B -m unittest test_ztl test_medical_supplies test_accounting_section test_section_navigation
          python -B -m unittest test_nn_foundation
