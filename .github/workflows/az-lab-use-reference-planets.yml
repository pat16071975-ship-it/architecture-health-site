name: AZ Lab use exact reference planets

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-use-reference-planets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Apply exact reference sprite in Interface Lab
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('interface-lab/index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('const planetSketches=[')
          end = s.find('function norm(value){', start)
          if start < 0 or end < 0:
              raise SystemExit('Old generated planet-art block not found')

          replacement = r'''const PLANET_SPRITE="url('assets/lab-planets/reference-sprite.webp?v=20260903-1')";
          const planetSpritePositions={
            'ИГГТ':'0px 0px',
            'DIERS диагностика':'-116px 0px',
            'Функциональная стоматология':'-232px 0px',
            'Нейропсихология':'-348px 0px',
            'Детская неврология':'0px -92px',
            'Ортодонтия':'-116px -92px',
            'Миофункциональная терапия':'-232px -92px',
            'Превентивная медицина':'-348px -92px',
            'Остеопатия':'0px -184px',
            'Гастроэнтерология':'-116px -184px',
            'Нутрициология':'-232px -184px',
            'Терапия':'-348px -184px'
          };

          '''
          s = s[:start] + replacement + s[end:]

          old = "const prepare=(names,orbitClass,offset)=>names.map((name,index)=>{"
          new = "const prepare=(names,orbitClass)=>names.map((name,index)=>{"
          if old not in s:
              raise SystemExit('prepare signature not found')
          s = s.replace(old, new, 1)

          old = "    el.style.setProperty('--az-planet-art',planetArt(offset+index));"
          new = "    el.style.setProperty('--az-planet-art',PLANET_SPRITE);\n    el.style.setProperty('--az-planet-pos',planetSpritePositions[name]||'0px 0px');"
          if old not in s:
              raise SystemExit('old generated art assignment not found')
          s = s.replace(old, new, 1)

          old = "    inner:prepare(innerNames,'az-lab-inner-planet',0),\n    outer:prepare(outerNames,'az-lab-outer-planet',4)"
          new = "    inner:prepare(innerNames,'az-lab-inner-planet'),\n    outer:prepare(outerNames,'az-lab-outer-planet')"
          if old not in s:
              raise SystemExit('prepare calls not found')
          s = s.replace(old, new, 1)

          old = "background-position:center!important;\n        background-size:100% 100%,100% 100%!important;"
          new = "background-position:var(--az-planet-pos),center!important;\n        background-size:464px 276px,100% 100%!important;"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 background blocks, found {count}')
          s = s.replace(old, new)

          s = s.replace('Черновик: контурная графика внутри планет','Черновик: планеты из присланных образцов')
          s = s.replace('orbits-20260903-8','orbits-20260903-9')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact reference sprite integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('interface-lab/index.html').read_text(encoding='utf-8')
          checks = [
            "assets/lab-planets/reference-sprite.webp?v=20260903-1",
            "planetSpritePositions",
            "background-size:464px 276px,100% 100%",
            "orbits-20260903-9"
          ]
          for item in checks:
              if item not in s:
                  raise SystemExit('Missing: '+item)
          if 'const planetSketches=[' in s or 'function planetArt(index)' in s:
              raise SystemExit('Old generated art still present')
          m = re.search(r'<script>([\s\S]*)</script>', s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/az-lab.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/az-lab.js

      - name: Commit viewer change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Use exact supplied planet references in Interface Lab"
          git push origin HEAD:feature/site-v1
