name: Apply clean orbit v9

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-orbit-v9.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Restore approved pre-orbit Interface Lab baseline
        run: git show 93057cb2875726036654d07a1998d9a635d6a099:interface-lab/index.html > interface-lab/index.html
      - name: Apply clean desktop orbit layout
        run: python tools/patch_orbit_v9.py
      - name: Validate Interface Lab JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('interface-lab/index.html').read_text(encoding='utf-8'); Path('/tmp/interface-lab.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/interface-lab.js
      - name: Commit result and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Rebuild orbit preview with clean ellipses and fixed menus"
          git rm .github/workflows/apply-orbit-v9.yml tools/patch_orbit_v9.py
          git commit -m "Remove one-off orbit v9 patch files"
          git push origin feature/site-v1
