name: AZ exact reconciliation blobs
on:
  push:
    branches: ['fix/az-report-upload-consistency-20261021']
    paths: ['.github/workflows/az-consistency-reconcile-blobs.yml']
permissions:
  contents: write
jobs:
  reconcile-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8720cd235430212b2c904c906b1d6979ef16d6a1
          persist-credentials: false
      - name: Build and verify exact local-reviewed bytes; store blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,urllib.request
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          p=Path('az-baze-auth/templates/uploads.html')
          raw=p.read_bytes()
          assert blob(raw)=='be36446bbeaa82fc9c27769a8cabb24978ec0d36'
          text=raw.decode()
          changes=[
              ("<td>{{ row['data_date'] or '—' }}</td>","<td>{{ row['data_date'] or '—' }}{% if row['period_label'] %}<br><span class=\"muted\">{{ row['period_label'] }}</span>{% endif %}</td>"),
              ("<td class=\"state-{{ row['status'] }}\">{% if row['status']=='imported' %}","<td class=\"state-{{ row['status'] }}\">{% if row['status_text'] %}{{ row['status_text'] }}{% elif row['status']=='imported' %}"),
              ("<td>{{ row['completed_filename'] or '' }}","<td>{% if row['source_label'] %}<span class=\"muted\">{{ row['source_label'] }}</span><br>{% endif %}{{ row['completed_filename'] or '' }}"),
          ]
          for old,new in changes:
              assert text.count(old)==1
              text=text.replace(old,new)
          template=text.encode()
          assert blob(template)=='fc7913c0ab812c6709a778aa706d969e438d3c93'
          text=Path('tests/verify-paid-periods.cjs').read_text()
          assert text.count('20261012-paid-periods-1')==1
          period_test=text.replace('20261012-paid-periods-1','20261021-save-entry-1').encode()
          assert blob(period_test)=='368030715c0b4f73764bd6fbf7fd23b7e71620f8'
          for name,content in [('uploads.html',template),('verify-paid-periods.cjs',period_test)]:
              data=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/pat16071975-ship-it/architecture-health-site/git/blobs',data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==blob(content)
              print(name+' BLOB='+result['sha'])
          print('REVIEWED_SOURCE_BLOBS=PASS; REF_UPDATES=NONE; LIVE_ACCESS=NONE; DEPLOY=NONE')
          PY
