name: AZ Lab planet line-art preview

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-planet-sketches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: |
          echo '' | base64 -d > /tmp/az-planet-patch.py
          python3 /tmp/az-planet-patch.py
      - name: Verify preview script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('interface-lab/index.html').read_text(encoding='utf-8')
          assert 'const planetSketches=[' in s
          assert "el.style.setProperty('--az-planet-art',planetArt(offset+index));" in s
          assert 'background-image:var(--az-planet-art)' in s
          assert 'orbits-20260903-8' in s
          m=re.search(r'<script>([\s\S]*)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/az-lab.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/az-lab.js
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Add line-art planet details in Interface Lab"
          git push origin HEAD:feature/site-v1
