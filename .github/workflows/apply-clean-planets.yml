name: Apply clean planet fill

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-clean-planets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Remove all planet texture from Interface Lab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('interface-lab/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* planet-clean-v4 — чистая заливка без пятен и рельефа */'
          if marker not in s:
              css = base64.b64decode('').decode('utf-8')
              needle = '\n\n`;\n\nfunction clearDraft'
              if needle not in s:
                  raise SystemExit('responsiveDraft end marker not found')
              s = s.replace(needle, css + needle, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Remove all texture from flattened direction badges"
          git rm .github/workflows/apply-clean-planets.yml
          git commit -m "Remove one-off clean planet workflow"
          git push origin feature/site-v1
