name: AZ Lab direction info v2
on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-direction-info-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - run: python3 tools/az_lab_direction_info_v2.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add interface-lab/index.html
          git rm .github/workflows/az-lab-direction-info-v2.yml tools/az_lab_direction_info_v2.py
          git commit -m "Add isolated direction info overlay to Interface Lab"
          git push origin feature/site-v1
