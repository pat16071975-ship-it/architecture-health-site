name: AZ Lab direction info in center

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-direction-info.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: |
          echo '    ...TRUNCATED_FOR_BREVITY...'
          echo "$B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check /tmp/lab.js
          grep -q "const DIRECTION_INFO" interface-lab/index.html
          grep -q "showDirectionInfo" interface-lab/index.html
          grep -q "az-lab-direction-info" interface-lab/index.html
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/az-lab-direction-info.yml
          git add interface-lab/index.html
          git commit -m "Add direction info panels to Interface Lab"
          git push origin HEAD:feature/site-v1
