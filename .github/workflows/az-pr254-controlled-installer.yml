name: AZ PR254 controlled installer source-only validation
on:
  pull_request:
    paths:
      - 'az-baze-auth/deploy/controlled-pr254-instagram.py'
      - 'az-baze-auth/deploy/test_controlled_pr254_release.py'
      - '.github/workflows/az-pr254-controlled-installer.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install template parser
        run: python3 -m pip install 'jinja2==3.1.6'
      - name: Immutable source, preflight guards, backups, rollback, and SQLite fixtures
        run: |
          python3 -B -m py_compile az-baze-auth/deploy/controlled-pr254-instagram.py
          python3 -B -m py_compile az-baze-auth/deploy/test_controlled_pr254_release.py
          python3 -B -m unittest discover -v -s az-baze-auth/deploy -p test_controlled_pr254_release.py
