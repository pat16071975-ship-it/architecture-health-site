name: AZ apply approved calm dentistry visual

on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-apply-approved-calm-visual.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Apply exact approved visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('interface-lab/functional-dentistry/index.html')
          s = p.read_text(encoding='utf-8')
          old = '../../assets/functional-dentistry-calm-hero.jpg'
          new = '../../assets/functional-dentistry-calm-approved.webp?v=20260906-5'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old image reference, found {s.count(old)}')
          s = s.replace(old, new, 1)
          marker = '/* approved-calm-visual-v1 */'
          if marker not in s:
              css = '''\n/* approved-calm-visual-v1 */\n.calm-visual .ring,.calm-visual .calm-tag{display:none!important}\n.calm-photo-shell{inset:0!important;z-index:2!important}\n.calm-photo{inset:0!important;border-radius:0!important;overflow:visible!important;background:transparent!important;box-shadow:none!important}\n.calm-photo img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;filter:none!important;transform:none!important}\n.calm-photo:after{display:none!important}\n'''
              if '</style>' not in s:
                  raise SystemExit('style closing tag not found')
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '../../assets/functional-dentistry-calm-approved.webp?v=20260906-5' interface-lab/functional-dentistry/index.html
          grep -Fq 'approved-calm-visual-v1' interface-lab/functional-dentistry/index.html
          git rm .github/workflows/az-apply-approved-calm-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/functional-dentistry/index.html
          git commit -m 'Use exact approved calm dentistry visual'
          git push origin HEAD:feature/site-v1
