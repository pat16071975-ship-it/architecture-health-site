name: Apply Da Vinci loincloth v2
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/apply-loincloth-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Apply loincloth asset and CSS
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          root = pathlib.Path('.')
          data = ' '
          asset = root / 'assets' / 'loincloth-da-vinci.webp'
          asset.write_bytes(base64.b64decode(data))
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          new = ".stage:after{content:'';position:absolute;left:50%;top:54.8%;width:22.5%;height:22%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;background:url('assets/loincloth-da-vinci.webp') center/contain no-repeat;filter:sepia(.06) saturate(.78) contrast(.92) brightness(1.05);mix-blend-mode:normal;opacity:1}"
          s2, n = re.subn(r"\.stage:after\{[^}]*\}", new, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one .stage:after rule, found {n}')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/loincloth-da-vinci.webp
          git commit -m "Refine opaque Da Vinci-style loincloth"
          git push origin HEAD:feature/site-v1
