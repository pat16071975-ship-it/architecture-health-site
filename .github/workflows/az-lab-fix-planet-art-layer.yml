name: AZ Lab fix planet art layer

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-fix-planet-art-layer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Put supplied planet art above fill and below text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')

          old="doc.querySelectorAll('.az-lab-planet').forEach(el=>{if(el.dataset.azOriginalStyle!==undefined){if(el.dataset.azOriginalStyle)el.setAttribute('style',el.dataset.azOriginalStyle);else el.removeAttribute('style');delete el.dataset.azOriginalStyle}el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet')});"
          new="doc.querySelectorAll('.az-lab-planet').forEach(el=>{if(el.dataset.azOriginalHtml!==undefined){el.innerHTML=el.dataset.azOriginalHtml;delete el.dataset.azOriginalHtml}if(el.dataset.azOriginalStyle!==undefined){if(el.dataset.azOriginalStyle)el.setAttribute('style',el.dataset.azOriginalStyle);else el.removeAttribute('style');delete el.dataset.azOriginalStyle}el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet')});"
          if old not in s: raise SystemExit('cleanup marker not found')
          s=s.replace(old,new,1)

          old="if(el.dataset.azOriginalStyle===undefined)el.dataset.azOriginalStyle=el.getAttribute('style')||'';el.classList.add('az-lab-planet',orbitClass);el.style.setProperty('--az-planet-art',PLANET_SPRITE);el.style.setProperty('--az-planet-pos',planetSpritePositions[name]||'0px 0px');el.style.setProperty('transform','translate(-50%,-50%)','important');return el"
          new="if(el.dataset.azOriginalStyle===undefined)el.dataset.azOriginalStyle=el.getAttribute('style')||'';if(el.dataset.azOriginalHtml===undefined)el.dataset.azOriginalHtml=el.innerHTML;el.classList.add('az-lab-planet',orbitClass);el.style.setProperty('--az-planet-art',PLANET_SPRITE);el.style.setProperty('--az-planet-pos',planetSpritePositions[name]||'0px 0px');el.innerHTML='<span class=\"az-lab-planet-art\" aria-hidden=\"true\"></span><span class=\"az-lab-planet-label\">'+el.dataset.azOriginalHtml+'</span>';el.style.setProperty('transform','translate(-50%,-50%)','important');return el"
          if old not in s: raise SystemExit('prepare marker not found')
          s=s.replace(old,new,1)

          old=".az-lab-orbit-host .direction.az-lab-planet::before{content:''!important;display:block!important;position:absolute!important;inset:0!important;border-radius:inherit!important;background-image:var(--az-planet-art)!important;background-repeat:no-repeat!important;background-position:var(--az-planet-pos)!important;background-size:464px 276px!important;opacity:.72!important;mix-blend-mode:multiply!important;pointer-events:none!important;z-index:-1!important}\n.az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}"
          new=".az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-art{display:block!important;position:absolute!important;inset:0!important;border-radius:inherit!important;background-image:var(--az-planet-art)!important;background-repeat:no-repeat!important;background-position:var(--az-planet-pos)!important;background-size:464px 276px!important;opacity:.88!important;mix-blend-mode:multiply!important;pointer-events:none!important;z-index:0!important}\n.az-lab-orbit-host .direction.az-lab-planet .az-lab-planet-label{position:relative!important;z-index:1!important;display:block!important;max-width:100%!important}\n.az-lab-orbit-host .direction.az-lab-planet::before,.az-lab-orbit-host .direction.az-lab-planet::after{content:none!important;display:none!important}"
          if old not in s: raise SystemExit('art css marker not found')
          s=s.replace(old,new,1)

          s=s.replace('orbits-20260903-10','orbits-20260903-11')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'az-lab-planet-art' interface-lab/index.html
          grep -q 'z-index:0!important' interface-lab/index.html
          grep -q 'az-lab-planet-label' interface-lab/index.html
          grep -q 'orbits-20260903-11' interface-lab/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Show supplied planet artwork above fill in Interface Lab"
          git push origin HEAD:feature/site-v1
