name: AZ medical supplies foundation
on:
  pull_request:
    paths:
      - 'az-baze-auth/app.py'
      - 'az-baze-auth/medical_supplies*.py'
      - 'az-baze-auth/test_medical_supplies*.py'
      - 'az-baze-auth/browser_medical_supplies*.py'
      - 'az-baze-auth/templates/medical_supplies*.html'
      - 'az-baze-auth/templates/medical_supplies.html'
      - 'az-baze-auth/test_medical_supplies.py'
      - 'az-baze-auth/test_accounting_section.py'
      - '.github/workflows/az-medical-supplies.yml'
permissions:
  contents: read
jobs:
  supplies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r az-baze-auth/requirements.txt
      - working-directory: az-baze-auth
        run: |
          python -B -m unittest test_medical_supplies test_medical_supplies_import test_medical_supplies_daily test_accounting_section test_section_navigation
          python -B -m unittest test_nn_foundation
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - working-directory: az-baze-auth
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -B browser_medical_supplies_import.py
          python -B browser_medical_supplies_daily.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medical-supplies-import-browser
          path: az-baze-auth/med-browser-artifacts
