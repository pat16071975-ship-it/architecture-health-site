name: Add SEO FAQ block

on:
  push:
    branches:
      - feature/site-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Add third FAQ section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          faq_css = r'''.faq-section{position:relative;margin:26px auto 0;padding:92px 68px 100px;border-top:1px solid rgba(181,150,98,.28);background:linear-gradient(180deg,rgba(247,243,236,.42),rgba(252,250,246,.76))}.faq-kicker{margin:0 0 16px;text-align:center;font-size:11px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#8d7b5c}.faq-title{max-width:900px;margin:0 auto;text-align:center;font:500 44px/1.08 'Cormorant Garamond',Georgia,serif;color:#343a35}.faq-intro{max-width:820px;margin:18px auto 0;text-align:center;font:500 14px/1.55 Inter,Segoe UI,Arial,sans-serif;color:#667067}.faq-grid{max-width:1080px;margin:46px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-items:start}.faq-item{border:1px solid rgba(68,99,79,.18);border-radius:14px;background:rgba(252,249,243,.78);box-shadow:0 8px 22px rgba(71,58,38,.05);overflow:hidden}.faq-item summary{position:relative;list-style:none;cursor:pointer;padding:19px 54px 19px 22px;font:600 17px/1.25 'Cormorant Garamond',Georgia,serif;color:#344039}.faq-item summary::-webkit-details-marker{display:none}.faq-item summary:after{content:'+';position:absolute;right:20px;top:50%;transform:translateY(-50%);font:400 23px/1 'Cormorant Garamond',Georgia,serif;color:#8c744c}.faq-item[open] summary:after{content:'−'}.faq-item[open] summary{border-bottom:1px solid rgba(181,150,98,.22)}.faq-answer{padding:16px 22px 20px;font:400 13px/1.62 Inter,Segoe UI,Arial,sans-serif;color:#515b53}.faq-answer p{margin:0}.faq-answer strong{font-weight:650;color:#36473b}@media(max-width:900px){.faq-section{padding:72px 34px 78px}.faq-title{font-size:36px}.faq-grid{grid-template-columns:1fr;margin-top:34px}}@media(max-width:720px){.faq-section{margin-top:18px;padding:58px 18px 64px}.faq-title{font-size:30px}.faq-intro{font-size:13px}.faq-grid{gap:10px}.faq-item summary{padding:16px 46px 16px 17px;font-size:16px}.faq-item summary:after{right:16px}.faq-answer{padding:14px 17px 18px;font-size:12.5px}}'''

          faq_html = r'''<section class="faq-section" id="faq" aria-labelledby="faq-title"><p class="faq-kicker">Вопрос — ответ</p><h2 class="faq-title" id="faq-title">Частые вопросы о здоровье и работе специалистов</h2><p class="faq-intro">Коротко отвечаем на вопросы о функциональной стоматологии, ортодонтии, миофункциональной терапии, диагностике осанки, превентивной медицине и совместной работе врачей разных направлений.</p><div class="faq-grid"><details class="faq-item"><summary>Что значит «здоровье не делят по кабинетам»?</summary><div class="faq-answer"><p>Это означает, что одна жалоба не всегда рассматривается только в рамках одной специальности. Если симптомы могут быть связаны с прикусом, мышцами, дыханием, осанкой, пищеварением или общим состоянием, специалисты сопоставляют данные между собой и при необходимости работают совместно.</p></div></details><details class="faq-item"><summary>К какому врачу обратиться, если непонятно, откуда проблема?</summary><div class="faq-answer"><p>Не всегда пациенту нужно заранее точно выбирать специальность. На первичной консультации врач оценивает основную жалобу, историю симптомов и при необходимости рекомендует консультацию другого специалиста или дополнительную диагностику. Это особенно важно, когда жалобы повторяются или затрагивают несколько систем.</p></div></details><details class="faq-item"><summary>Что такое функциональная стоматология и чем она отличается от обычной стоматологии?</summary><div class="faq-answer"><p><strong>Функциональная стоматология</strong> оценивает не только состояние зубов, но и то, как работают прикус, височно-нижнечелюстные суставы и жевательные мышцы. Такой подход может быть важен при дискомфорте во время жевания, щелчках в челюсти, привычном сжатии зубов и некоторых видах мышечного напряжения. Причину симптомов определяет врач после осмотра.</p></div></details><details class="faq-item"><summary>Когда стоит обратиться к ортодонту?</summary><div class="faq-answer"><p>Консультация ортодонта нужна не только при заметной неровности зубов. Поводом могут быть изменение прикуса, смещение зубов после предыдущего лечения, сложности с жеванием или вопросы развития зубочелюстной системы у ребёнка. План лечения составляется после диагностики.</p></div></details><details class="faq-item"><summary>Зачем нужна миофункциональная терапия?</summary><div class="faq-answer"><p><strong>Миофункциональная терапия</strong> работает с функциями языка, губ и мышц лица, а также с привычками дыхания и глотания. Она может входить в общий план ортодонтического или функционального лечения, если врач видит, что особенности мышечной функции влияют на зубочелюстную систему.</p></div></details><details class="faq-item"><summary>Для чего используют DIERS-диагностику?</summary><div class="faq-answer"><p><strong>DIERS-диагностика</strong> применяется для компьютерной оценки осанки и пространственного положения спины и таза. Она помогает врачу получить дополнительные объективные данные для оценки опорно-двигательной системы, но сама по себе не является диагнозом и не заменяет другие исследования, если они показаны.</p></div></details><details class="faq-item"><summary>Что такое превентивная медицина?</summary><div class="faq-answer"><p><strong>Превентивная медицина</strong> направлена на оценку факторов риска, образа жизни и показателей здоровья до того, как они превращаются в выраженную проблему. Задача врача — не «лечить анализы», а сопоставлять результаты обследований с состоянием человека и определять, что действительно требует внимания.</p></div></details><details class="faq-item"><summary>Когда обращаться к гастроэнтерологу, а когда к нутрициологу?</summary><div class="faq-answer"><p>При боли, регулярной тяжести, вздутии, нарушениях стула и других устойчивых симптомах со стороны желудочно-кишечного тракта обычно требуется медицинская оценка гастроэнтеролога. Нутрициолог может дополнять работу врача вопросами рациона и пищевых привычек. При наличии симптомов питание не должно заменять диагностику.</p></div></details><details class="faq-item"><summary>Почему головная боль, напряжение шеи и состояние прикуса иногда оценивают вместе?</summary><div class="faq-answer"><p>Такие симптомы могут существовать одновременно и быть связаны с разными причинами. Поэтому врач может оценивать работу жевательных мышц, ВНЧС, шеи, осанку и другие факторы в общей клинической картине. Сам факт сочетания симптомов не означает, что один из них обязательно вызвал другой.</p></div></details><details class="faq-item"><summary>Работает ли клиника с детьми и взрослыми?</summary><div class="faq-answer"><p>На сайте представлены направления для <strong>детей и взрослых</strong>: стоматология и ортодонтия, миофункциональная терапия, детская неврология, нейропсихология и другие специальности. Конкретный специалист и объём обследования подбираются с учётом возраста и задачи пациента.</p></div></details></div></section>'''

          if 'class="faq-section"' not in s:
              if '</style>' not in s or '</main>' not in s:
                  raise SystemExit('required markers not found')
              s = s.replace('</style>', faq_css + '</style>', 1)
              s = s.replace('</main>', faq_html + '</main>', 1)

          # Guard the first two blocks: FAQ must be appended only after them.
          required = [
              'class="attention-section"',
              'Клиника, где здоровье не делят по кабинетам',
              '.map{position:absolute;left:50%;top:-60px;',
              '.stage{position:absolute;left:270px;top:150px;width:580px;height:580px;'
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('guard failed: ' + marker)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/add-seo-faq.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-seo-faq.yml
          git commit -m "Add SEO-oriented FAQ section to homepage"
          git push origin HEAD:feature/site-v1
