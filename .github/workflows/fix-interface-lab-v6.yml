name: Fix Interface Lab v6

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/fix-interface-lab-v6.yml
      - tools/fix_interface_lab_v6.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Repair Interface Lab script
        run: python tools/fix_interface_lab_v6.py
      - name: Validate Interface Lab JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('interface-lab/index.html').read_text(encoding='utf-8'); Path('/tmp/interface-lab.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/interface-lab.js
      - name: Commit repair and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Repair Interface Lab v6 script and draft cleanup"
          git rm .github/workflows/fix-interface-lab-v6.yml tools/fix_interface_lab_v6.py
          git commit -m "Remove one-off Interface Lab repair files"
          git push origin feature/site-v1
