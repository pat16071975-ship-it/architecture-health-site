name: Apply asymmetric static orbit layout v6

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-orbit-layout-v6.yml
      - tools/patch_orbit_layout_v6.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: python tools/patch_orbit_layout_v6.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Refine asymmetric static orbits and add left placeholders"
          git rm .github/workflows/apply-orbit-layout-v6.yml tools/patch_orbit_layout_v6.py
          git commit -m "Remove one-off orbit layout v6 patch files"
          git push origin feature/site-v1
