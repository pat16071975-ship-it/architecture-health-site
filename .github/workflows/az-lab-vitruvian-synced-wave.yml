name: AZ Lab Vitruvian synced gold wave
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-vitruvian-synced-wave.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Add synchronized vertical gold wave
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')

          old_cleanup="doc.getElementById('az-lab-vitruvian-ring-text')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();"
          new_cleanup="doc.getElementById('az-lab-vitruvian-ring-text')?.remove();doc.querySelectorAll('.az-lab-vitruvian-wave-img').forEach(el=>el.remove());doc.getElementById('az-lab-orbit-style')?.remove();"
          if old_cleanup not in s:
              raise SystemExit('STOP: cleanup marker not found')
          s=s.replace(old_cleanup,new_cleanup,1)

          marker="function addVitruvianRingText(doc,host,stageRect,hostRect){"
          fn="""function addVitruvianGoldWave(doc){
  const stage=doc.querySelector('.stage'),source=stage?.querySelector('.vit-img'),viewportWidth=doc.defaultView?.innerWidth||0;
  if(!stage||!source||viewportWidth<721||stage.querySelector('.az-lab-vitruvian-wave-img'))return;
  const wave=source.cloneNode(false);wave.removeAttribute('id');wave.classList.add('az-lab-vitruvian-wave-img');wave.setAttribute('aria-hidden','true');wave.setAttribute('draggable','false');stage.appendChild(wave);
}
"""
          if marker not in s:
              raise SystemExit('STOP: ring function marker not found')
          s=s.replace(marker,fn+marker,1)

          old_grad="gradient.setAttribute('gradientUnits','userSpaceOnUse');gradient.setAttribute('y1','0');gradient.setAttribute('y2','0');gradient.setAttribute('x1',String(cx-radius*3));gradient.setAttribute('x2',String(cx-radius));"
          new_grad="gradient.setAttribute('gradientUnits','userSpaceOnUse');gradient.setAttribute('x1','0');gradient.setAttribute('x2','0');gradient.setAttribute('y1',String(cy-radius*1.6));gradient.setAttribute('y2',String(cy-radius*.8));"
          if old_grad not in s:
              raise SystemExit('STOP: current slogan gradient marker not found')
          s=s.replace(old_grad,new_grad,1)

          old_anim="""    const ax1=doc.createElementNS(ns,'animate');ax1.setAttribute('attributeName','x1');ax1.setAttribute('values',`${cx-radius*3};${cx+radius}`);ax1.setAttribute('dur','5.8s');ax1.setAttribute('repeatCount','indefinite');gradient.appendChild(ax1);
    const ax2=doc.createElementNS(ns,'animate');ax2.setAttribute('attributeName','x2');ax2.setAttribute('values',`${cx-radius};${cx+radius*3}`);ax2.setAttribute('dur','5.8s');ax2.setAttribute('repeatCount','indefinite');gradient.appendChild(ax2);"""
          new_anim="""    const ay1=doc.createElementNS(ns,'animate');ay1.setAttribute('attributeName','y1');ay1.setAttribute('values',`${cy-radius*1.6};${cy+radius*.8}`);ay1.setAttribute('dur','5.8s');ay1.setAttribute('repeatCount','indefinite');gradient.appendChild(ay1);
    const ay2=doc.createElementNS(ns,'animate');ay2.setAttribute('attributeName','y2');ay2.setAttribute('values',`${cy-radius*.8};${cy+radius*1.6}`);ay2.setAttribute('dur','5.8s');ay2.setAttribute('repeatCount','indefinite');gradient.appendChild(ay2);"""
          if old_anim not in s:
              raise SystemExit('STOP: current slogan animation marker not found')
          s=s.replace(old_anim,new_anim,1)

          old_call="  addVitruvianRingText(doc,host,r,hostRect);\n  host.classList.add('az-lab-orbit-host');"
          new_call="  addVitruvianRingText(doc,host,r,hostRect);\n  addVitruvianGoldWave(doc);\n  host.classList.add('az-lab-orbit-host');"
          if old_call not in s:
              raise SystemExit('STOP: draw call marker not found')
          s=s.replace(old_call,new_call,1)

          old_motion="@media (prefers-reduced-motion:reduce){.az-lab-orbit-host .direction{will-change:auto!important}}"
          new_motion=""".az-lab-vitruvian-wave-img{pointer-events:none!important;z-index:3!important;opacity:.24!important;filter:sepia(.86) saturate(2.25) hue-rotate(350deg) brightness(1.05) contrast(1.08)!important;mix-blend-mode:multiply!important;clip-path:inset(-5% 0 85% 0)!important;animation:azLabVitruvianGoldWave 5.8s linear infinite!important;will-change:clip-path,opacity!important}
@keyframes azLabVitruvianGoldWave{0%{clip-path:inset(-5% 0 85% 0);opacity:0}8%{opacity:.18}28%{opacity:.27}72%{opacity:.27}92%{opacity:.18}100%{clip-path:inset(85% 0 -5% 0);opacity:0}}
@media (prefers-reduced-motion:reduce){.az-lab-orbit-host .direction{will-change:auto!important}.az-lab-vitruvian-wave-img{animation:none!important;opacity:0!important;will-change:auto!important}}"""
          if old_motion not in s:
              raise SystemExit('STOP: reduced-motion marker not found')
          s=s.replace(old_motion,new_motion,1)

          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];",
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            '.az-lab-right-badge-shift{transform:translateX(-37.8px)!important}',
            ".az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}",
            "font-size',viewportWidth>=1181?'15':'12'",
            "z-index:14;pointer-events:none;overflow:visible",
          ]
          for x in protected:
              if x not in s:
                  raise SystemExit(f'STOP: protected marker missing: {x}')
          for x in ['addVitruvianGoldWave(doc);','azLabVitruvianGoldWave','attributeName\',\'y1','attributeName\',\'y2']:
              if x not in s:
                  raise SystemExit(f'STOP: synchronized wave marker missing: {x}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only change and remove temporary workflow
        run: |
          rm -f .github/workflows/az-lab-vitruvian-synced-wave.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-vitruvian-synced-wave.yml
          git commit -m 'Synchronize vertical gold wave across slogan and Vitruvian figure'
          git push origin feature/site-v1
