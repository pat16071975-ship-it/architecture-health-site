name: AZ Lab refresh landscape planets
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-refresh-landscape-planets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Refresh landscape planet asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old1="planet-13-dentistry-orthopedics.svg?v=20260910-1"
          old2="planet-14-dentistry-surgery.svg?v=20260910-1"
          if old1 not in s or old2 not in s:
              raise SystemExit('STOP: expected planet asset refs not found')
          s=s.replace(old1,"planet-13-dentistry-orthopedics.svg?v=20260910-2",1)
          s=s.replace(old2,"planet-14-dentistry-surgery.svg?v=20260910-2",1)
          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerNames=['Функциональная стоматология','Ортодонтия','Стоматология ортопедия','Стоматология хирургия','Стоматология терапия'];",
            "const outerNames=['ИГГТ','DIERS диагностика','Нейропсихология','Детская неврология','Миофункциональная терапия','Превентивная медицина','Гастроэнтерология','Нутрициология','Остеопатия'];",
            'const innerAngles=[180,252,324,36,108];',
            'const outerAngles=[160,200,240,280,320,0,40,80,120];',
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            '.az-lab-right-badge-shift{transform:translateX(-37.8px)!important}',
            ".az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}",
            "textPath.textContent='Не лечим по отдельности. Понимаем, как всё связано в вашем организме'"
          ]
          for item in protected:
              if item not in s:
                  raise SystemExit('STOP: protected marker missing: '+item)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refresh and remove temporary workflow
        run: |
          rm -f .github/workflows/az-lab-refresh-landscape-planets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-refresh-landscape-planets.yml
          git commit -m 'Refresh dentistry landscape planet artwork'
          git push origin feature/site-v1
