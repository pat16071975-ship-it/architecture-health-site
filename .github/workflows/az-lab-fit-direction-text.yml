name: AZ Lab fit direction text
on:
  push:
    branches: [feature/site-v1]
    paths: ['.github/workflows/az-lab-fit-direction-text.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Fit direction text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text()
          reps={
          ".az-lab-direction-info-inner{width:82%!important;max-height:88%!important;text-align:left!important;padding:34px 16px 20px!important}":".az-lab-direction-info-inner{width:84%!important;max-height:92%!important;text-align:left!important;padding:34px 14px 16px!important}",
          ".az-lab-direction-info h2{margin:0 0 14px!important;text-align:center!important;font:600 30px/1.08 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;color:#344b3d!important;letter-spacing:-.02em!important}":".az-lab-direction-info h2{margin:0 0 10px!important;text-align:center!important;font:600 25px/1.05 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;color:#344b3d!important;letter-spacing:-.02em!important}",
          ".az-lab-direction-lead{margin:0 0 8px!important;font-size:15px!important;line-height:1.35!important;font-weight:600!important;color:#5b655e!important}":".az-lab-direction-lead{margin:0 0 6px!important;font-size:13px!important;line-height:1.28!important;font-weight:600!important;color:#5b655e!important}",
          ".az-lab-direction-info ul{margin:0 0 12px 18px!important;padding:0!important;font-size:14px!important;line-height:1.4!important}":".az-lab-direction-info ul{margin:0 0 8px 17px!important;padding:0!important;font-size:12.5px!important;line-height:1.3!important}",
          ".az-lab-direction-info li{margin:0 0 5px!important;padding-left:2px!important}":".az-lab-direction-info li{margin:0 0 3px!important;padding-left:2px!important}",
          ".az-lab-direction-summary{margin:10px 0 12px!important;padding-top:10px!important;border-top:1px solid rgba(181,150,98,.32)!important;text-align:center!important;font-size:14px!important;line-height:1.4!important;color:#465149!important}":".az-lab-direction-summary{margin:7px 0 8px!important;padding-top:7px!important;border-top:1px solid rgba(181,150,98,.32)!important;text-align:center!important;font-size:12.5px!important;line-height:1.3!important;color:#465149!important}",
          ".az-lab-direction-more{display:block!important;margin:0 auto!important;padding:5px 12px!important;border:0!important;border-bottom:1px solid rgba(68,99,79,.55)!important;background:transparent!important;color:#44634f!important;font:600 13px/1.2 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;cursor:pointer!important}":".az-lab-direction-more{display:block!important;margin:0 auto!important;padding:4px 10px!important;border:0!important;border-bottom:1px solid rgba(68,99,79,.55)!important;background:transparent!important;color:#44634f!important;font:600 11.5px/1.15 'Montserrat',Inter,Segoe UI,Arial,sans-serif!important;cursor:pointer!important}",
          "orbits-20260904-14":"orbits-20260904-15"
          }
          for a,b in reps.items():
              if a not in s:
                  raise SystemExit('missing expected fragment: '+a[:70])
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html
          git rm .github/workflows/az-lab-fit-direction-text.yml
          git commit -m 'Fit direction descriptions inside central circle'
          git push origin HEAD:feature/site-v1