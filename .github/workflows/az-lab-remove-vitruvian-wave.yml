name: AZ Lab remove Vitruvian figure wave
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-remove-vitruvian-wave.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Remove wave from Vitruvian figure only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace("doc.getElementById('az-lab-vitruvian-ring-text')?.remove();doc.querySelectorAll('.az-lab-vitruvian-wave-img').forEach(el=>el.remove());doc.getElementById('az-lab-orbit-style')?.remove();","doc.getElementById('az-lab-vitruvian-ring-text')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();",1)

          fn="""function addVitruvianGoldWave(doc){
  const stage=doc.querySelector('.stage'),source=stage?.querySelector('.vit-img'),viewportWidth=doc.defaultView?.innerWidth||0;
  if(!stage||!source||viewportWidth<721||stage.querySelector('.az-lab-vitruvian-wave-img'))return;
  const wave=source.cloneNode(false);wave.removeAttribute('id');wave.classList.add('az-lab-vitruvian-wave-img');wave.setAttribute('aria-hidden','true');wave.setAttribute('draggable','false');stage.appendChild(wave);
}
"""
          if fn not in s: raise SystemExit('STOP: Vitruvian wave function not found')
          s=s.replace(fn,'',1)

          call="  addVitruvianGoldWave(doc);\n"
          if call not in s: raise SystemExit('STOP: Vitruvian wave call not found')
          s=s.replace(call,'',1)

          css=""".az-lab-vitruvian-wave-img{pointer-events:none!important;z-index:3!important;opacity:.24!important;filter:sepia(.86) saturate(2.25) hue-rotate(350deg) brightness(1.05) contrast(1.08)!important;mix-blend-mode:multiply!important;clip-path:inset(-5% 0 85% 0)!important;animation:azLabVitruvianGoldWave 5.8s linear infinite!important;will-change:clip-path,opacity!important}
@keyframes azLabVitruvianGoldWave{0%{clip-path:inset(-5% 0 85% 0);opacity:0}8%{opacity:.18}28%{opacity:.27}72%{opacity:.27}92%{opacity:.18}100%{clip-path:inset(85% 0 -5% 0);opacity:0}}
@media (prefers-reduced-motion:reduce){.az-lab-orbit-host .direction{will-change:auto!important}.az-lab-vitruvian-wave-img{animation:none!important;opacity:0!important;will-change:auto!important}}"""
          replacement="@media (prefers-reduced-motion:reduce){.az-lab-orbit-host .direction{will-change:auto!important}}"
          if css not in s: raise SystemExit('STOP: Vitruvian wave CSS not found')
          s=s.replace(css,replacement,1)

          protected=[
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];",
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            '.az-lab-right-badge-shift{transform:translateX(-37.8px)!important}',
            ".az-lab-orbit-host .stage{transform:scale(.724137931)!important;transform-origin:center center!important}",
            "attributeName','y1'",
            "attributeName','y2'",
            "dur','5.8s'",
          ]
          for m in protected:
              if m not in s: raise SystemExit(f'STOP: protected marker missing: {m}')
          for forbidden in ['addVitruvianGoldWave','az-lab-vitruvian-wave-img','azLabVitruvianGoldWave']:
              if forbidden in s: raise SystemExit(f'STOP: figure wave marker still present: {forbidden}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit viewer-only removal and remove temporary workflow
        run: |
          rm -f .github/workflows/az-lab-remove-vitruvian-wave.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html .github/workflows/az-lab-remove-vitruvian-wave.yml
          git commit -m 'Remove gold wave from Vitruvian figure only'
          git push origin feature/site-v1
