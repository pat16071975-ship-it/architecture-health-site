name: AZ Metrika one-click delivery
on:
  push:
    branches: [ops/az-metrika-one-click-production-20261031]
    paths:
      - 'az-baze-auth/deploy/metrika-one-click-production-20261031.sh'
      - 'az-baze-auth/deploy/configure-yandex-metrika-credential-20261031.sh'
      - '.github/workflows/az-metrika-one-click-delivery.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR180 production and credential packages
        run: |
          set -Eeuo pipefail
          deploy='az-baze-auth/deploy/metrika-one-click-production-20261031.sh'
          cred='az-baze-auth/deploy/configure-yandex-metrika-credential-20261031.sh'
          bash -n "$deploy"
          bash -n "$cred"
          test "$(git hash-object "$deploy")" = '444087df832eba9e100c596abff4d1ca96a9c604'
          test "$(git hash-object "$cred")" = '7847e68ea849da4d3b488419035e392f384394f3'
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          target='91356c4fd597fbcfd3e5af76f57ff18fe82c5c56'
          base='4f5553834e15d37554c13d4218d6932045becdd4'

          expected_target={
              'az-baze-auth/advertising_report.py':'d9def18c1a227e388586ddde55f24d1f3ce57e79',
              'az-baze-auth/metrika_auto.py':'9967320615c4f9bd6ebdf5062545da3d8a7b3d6c',
              'az-baze-auth/templates/uploads.html':'1effc5ae1b123816bde3ff792efaa2e649a6a90d',
              'reports/advertising.js':'58c7b1ccc84ca0d0848adf5e81440d7233a1d4d8',
          }
          expected_base={
              'az-baze-auth/advertising_report.py':'7deb8d73fdb633c4644e7b0b6924de4b87bcbff7',
              'az-baze-auth/templates/uploads.html':'c36b7393a90f72626425e92fac8b56b54c335cf6',
              'reports/advertising.js':'58c7b1ccc84ca0d0848adf5e81440d7233a1d4d8',
          }

          def git_blob(ref,path):
              raw=subprocess.check_output(['git','show',f'{ref}:{path}'])
              return subprocess.check_output(['git','hash-object','--stdin'],input=raw).decode().strip()

          for path,sha in expected_target.items():
              assert git_blob(target,path)==sha,(path,'target')
          for path,sha in expected_base.items():
              assert git_blob(base,path)==sha,(path,'base')
          missing=subprocess.run(
              ['git','cat-file','-e',f'{base}:az-baze-auth/metrika_auto.py'],
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL
          )
          assert missing.returncode!=0

          deploy=Path('az-baze-auth/deploy/metrika-one-click-production-20261031.sh').read_text()
          assert "TARGET_COMMIT='91356c4fd597fbcfd3e5af76f57ff18fe82c5c56'" in deploy
          assert "CONFIRM_TOKEN='METRIKA-ONE-CLICK-PRODUCTION-91356C4F'" in deploy
          assert 'METRIKA_ONE_CLICK_PRODUCTION_DEPLOY=PASS' in deploy
          assert 'CHANGED_RUNTIME_FILES=3; DB_SCHEMA_CHANGED=NO; SECRET_CHANGES=NONE' in deploy
          assert 'ENV_FILE_UNCHANGED_POST_START=PASS' in deploy
          assert 'ENV_FILE_FINGERPRINT_CAPTURED=PASS' in deploy
          assert 'LIVE_MUTATION_STARTED=YES; ROLLBACK_ARMED=YES' in deploy
          assert 'ROLLBACK_DISARMED=YES' in deploy
          assert 'fail(){ echo "STOP: $*" >&2; on_error 1; }' in deploy
          assert 'if [[ "$MUTATION_STARTED" == \'1\' && -n "$BACKUP" ]]; then' in deploy
          install_block=deploy.split('install_targets(){',1)[1].split('}',1)[0]
          assert install_block.index('MUTATION_STARTED=1') < install_block.index('atomic_install_one')
          assert 'ROLLBACK_FILES=PASS' in deploy
          assert 'MANUAL_RECOVERY_REQUIRED=YES' in deploy

          cred=Path('az-baze-auth/deploy/configure-yandex-metrika-credential-20261031.sh').read_text()
          assert "KEY='AZBAZE_YANDEX_METRIKA_TOKEN'" in cred
          assert "CONFIRM_TOKEN='METRIKA-CREDENTIAL-91356C4F'" in cred
          assert 'IFS= read -r -s CANDIDATE </dev/tty' in cred
          assert 'fail(){ echo "STOP: $*" >&2; on_error 1; }' in cred
          assert 'required_scopes={"metrika:read"}' in cred
          assert 'if set(scopes)!=required_scopes:' in cred
          assert 'OAUTH_APP_DATA_ACCESS_SECTION_NOT_PROVEN' in cred
          assert 'OAUTH_APP_SCOPE_ENTRIES_NOT_PROVEN' in cred
          assert 'OAUTH_APP_SCOPE_ENTRY_UNPROVEN' in cred
          assert 'OAUTH_APP_BARE_PERMISSION_GROUP_UNPROVEN' in cred
          assert 'OAUTH_APP_SCOPE_SET=METRIKA_READ_ONLY_PASS' in cred
          assert 'required_counter_fields={"id","permission","status","time_zone_name"}' in cred
          assert 'COUNTER_PROOF_FIELDS_MISSING' in cred
          assert 'REQUIRED_GOAL_PROOF_FIELDS_MISSING' in cred
          assert 'REQUIRED_GOAL_ID_INVALID' in cred
          assert 'required_report_fields={"sampled","sample_share","total_rows_rounded","data"}' in cred
          assert 'REPORT_PROOF_FIELDS_MISSING' in cred
          assert 'CREDENTIAL_READONLY_PROBE=PASS' in cred
          apply_block=cred.split('  --apply)',1)[1]
          assert apply_block.index('ENV_WRITTEN=1') < apply_block.index('write_env "$CANDIDATE"')
          assert 'CREDENTIAL_ROLLBACK=PASS' in cred
          assert 'SECRET_PRINTED=NO; SECRET_ARGV=NO' in cred
          assert 'oauth_token=' not in cred
          assert 'set -x' not in cred
          assert 'echo "$CANDIDATE"' not in cred

          import html.parser,re
          class DataAccessParser(html.parser.HTMLParser):
              SECTION_LABELS={'доступ к данным','data access','access permissions','permissions','права доступа'}
              ENTRY_TAGS={'li','option','dd'}
              HEADING_TAGS={'h1','h2','h3','h4','h5','h6','legend','dt','label'}
              def __init__(self):
                  super().__init__(); self.skip=0; self.heading_tag=None; self.heading_parts=[]
                  self.section_active=False; self.section_found=0
                  self.entry_tag=None; self.entry_depth=0; self.entry_parts=[]; self.entries=[]; self.section_parts=[]
              @staticmethod
              def norm(value): return ' '.join(str(value or '').split()).strip().lower()
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  if tag in {'script','style'}:
                      self.skip+=1; return
                  if self.skip: return
                  if tag in self.HEADING_TAGS:
                      if self.section_active and self.heading_tag is None: self.section_active=False
                      self.heading_tag=tag; self.heading_parts=[]; return
                  if self.section_active:
                      for name,value in attrs:
                          if name.lower() in {'value','title','aria-label','data-scope'} and value:
                              self.section_parts.append(str(value))
                  if self.section_active and self.entry_tag is None and tag in self.ENTRY_TAGS:
                      self.entry_tag=tag; self.entry_depth=1; self.entry_parts=[]
                      for name,value in attrs:
                          if name.lower() in {'value','title','aria-label','data-scope'} and value:
                              self.entry_parts.append(str(value))
                      return
                  if self.entry_tag is not None:
                      self.entry_depth+=1
                      for name,value in attrs:
                          if name.lower() in {'value','title','aria-label','data-scope'} and value:
                              self.entry_parts.append(str(value))
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if tag in {'script','style'} and self.skip:
                      self.skip-=1; return
                  if self.skip: return
                  if self.heading_tag==tag:
                      label=self.norm(' '.join(self.heading_parts))
                      if label in self.SECTION_LABELS:
                          self.section_found+=1; self.section_active=True
                      self.heading_tag=None; self.heading_parts=[]; return
                  if self.entry_tag is not None:
                      self.entry_depth-=1
                      if self.entry_depth==0:
                          entry=' '.join(self.entry_parts).strip()
                          if entry: self.entries.append(entry)
                          self.entry_tag=None; self.entry_parts=[]
              def handle_data(self,data):
                  if self.skip: return
                  if self.heading_tag is not None:
                      self.heading_parts.append(data)
                  else:
                      if self.section_active: self.section_parts.append(data)
                      if self.entry_tag is not None: self.entry_parts.append(data)

          pattern=r'(?<![A-Za-z0-9_.-])([a-z][a-z0-9_.-]*:(?:[a-z][a-z0-9_.-]*|\\*))(?![A-Za-z0-9_.*-])'
          bare_pattern=r'(?<![a-z0-9_.-])(direct|passport|login|tracker|webmaster|cloud_api|market)(?![a-z0-9_.-])'
          def prove(raw):
              p=DataAccessParser(); p.feed(raw)
              if p.section_found!=1 or not p.entries: return False
              section_evidence='\n'.join(p.section_parts).lower()
              section_residual=re.sub(pattern,' ',section_evidence)
              if re.findall(bare_pattern,section_residual): return False
              scopes=[]
              for entry in p.entries:
                  lowered=entry.lower()
                  if 'example' in lowered or 'пример' in lowered: return False
                  found=re.findall(pattern,entry)
                  if len(found)!=1: return False
                  residual=re.sub(pattern,' ',lowered)
                  if re.findall(bare_pattern,residual): return False
                  scopes.append(found[0])
              return set(scopes)=={'metrika:read'}

          good_ru='<h2>Доступ к данным</h2><ul><li>Получение статистики (metrika:read)</li></ul><h2>Почта</h2>'
          good_en='<h2>Data access</h2><ul><li data-scope="metrika:read">Get statistics</li></ul><h2>Contact</h2>'
          assert prove(good_ru)
          assert prove(good_en)
          assert prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>metrika:read</li></ul>')
          assert not prove('<p>Example: metrika:read</p>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>direct:api</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>direct:*</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>passport:business</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>direct</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li><li>passport</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>metrika:read</li></ul><div>direct</div><h2>Почта</h2>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>Пример: metrika:read</li></ul>')
          assert not prove('<h2>Доступ к данным</h2><ul><li>Без scope</li></ul>')
          assert not prove('<style>.x{content:"metrika:read"}</style><p>Nothing authoritative</p>')

          def valid_goal_id(raw):
              if isinstance(raw,bool): return False
              try: value=int(str(raw).strip())
              except (TypeError,ValueError): return False
              return value>0
          assert valid_goal_id(674318079)
          assert valid_goal_id('674318079')
          assert not valid_goal_id('')
          assert not valid_goal_id(0)
          assert not valid_goal_id('0')
          assert not valid_goal_id(None)
          assert not valid_goal_id(False)
          print('AUTHORITATIVE_SCOPE_AND_GOAL_ID_NEGATIVE_CASES=PASS')

          print('AZ_METRIKA_ONE_CLICK_DELIVERY_CONTRACT=PASS')
          PY

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/fail-flow.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          marker="$1"
          MUTATION_STARTED=1
          BACKUP='present'
          rollback_files(){ printf 'ROLLBACK\n' >>"$marker"; return 0; }
          on_error(){ local code="$1"; trap - ERR; if [[ "$MUTATION_STARTED" == '1' && -n "$BACKUP" ]]; then rollback_files; fi; exit "$code"; }
          fail(){ echo "STOP: $*" >&2; on_error 1; }
          fail 'synthetic postcheck'
          SH
          set +e
          bash "$tmp/fail-flow.sh" "$tmp/marker" >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          test "$(cat "$tmp/marker")" = 'ROLLBACK'
          echo 'EXPLICIT_FAIL_ROLLBACK_FLOW=PASS'

          cat >"$tmp/credential-fail-flow.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          marker="$1"
          ENV_WRITTEN=1
          BACKUP='present'
          CANDIDATE='secret-never-printed'
          rollback_env(){ printf 'CREDENTIAL_ROLLBACK\n' >>"$marker"; return 0; }
          on_error(){ local code="$1"; trap - ERR; if [[ "$ENV_WRITTEN" == '1' && -n "$BACKUP" ]]; then rollback_env; fi; CANDIDATE=''; unset CANDIDATE || true; exit "$code"; }
          fail(){ echo "STOP: $*" >&2; on_error 1; }
          fail 'synthetic postwrite health failure'
          SH
          set +e
          bash "$tmp/credential-fail-flow.sh" "$tmp/credential-marker" >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          test "$(cat "$tmp/credential-marker")" = 'CREDENTIAL_ROLLBACK'
          echo 'CREDENTIAL_EXPLICIT_FAIL_ROLLBACK_FLOW=PASS'

          python3 - <<'PY'
          def counter_ok(c):
              required={'id','permission','status','time_zone_name'}
              return (
                  isinstance(c,dict) and required.issubset(c)
                  and str(c['id'])=='113776005'
                  and str(c['permission'])=='own'
                  and str(c['status'])=='Active'
                  and str(c['time_zone_name'])=='Asia/Novosibirsk'
              )
          assert counter_ok({'id':113776005,'permission':'own','status':'Active','time_zone_name':'Asia/Novosibirsk'})
          assert not counter_ok({'id':113776005,'permission':'own','time_zone_name':'Asia/Novosibirsk'})
          assert not counter_ok({'id':113776005,'permission':'own','status':'Active'})

          def report_ok(r):
              required={'sampled','sample_share','total_rows_rounded','data'}
              if not isinstance(r,dict) or not required.issubset(r): return False
              try: share=float(r['sample_share'])
              except (TypeError,ValueError): return False
              return r['sampled'] is False and share==1.0 and r['total_rows_rounded'] is False and isinstance(r['data'],list)
          assert report_ok({'sampled':False,'sample_share':1.0,'total_rows_rounded':False,'data':[]})
          assert not report_ok({'sample_share':1.0,'total_rows_rounded':False,'data':[]})
          assert not report_ok({'sampled':False,'total_rows_rounded':False,'data':[]})
          assert not report_ok({'sampled':False,'sample_share':1.0,'data':[]})
          print('FAIL_CLOSED_API_PROOF_FIELDS=PASS')
          PY
