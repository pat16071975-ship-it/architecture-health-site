name: AZ paid history source preparation
on:
  push:
    branches: [fix/az-paid-patient-history-20261029]
    paths:
      - '.github/paid-history-pack-*.b64'
      - '.github/paid-history-source-build.py'
      - '.github/workflows/az-paid-history-source-build.yml'
permissions:
  contents: write
concurrency:
  group: az-paid-history-source-only
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZBAZE_SECRET_KEY: isolated-history-test-only
      AZBAZE_DB: /tmp/az-paid-history-build/auth.db
      AZBAZE_SITE_ROOT: /tmp/az-paid-history-build-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source bundle and baseline guards
        run: python .github/paid-history-source-build.py
      - name: Install test dependencies
        run: python -m pip install -r az-baze-auth/requirements.txt
      - name: Real SQLite and existing accounting regressions
        working-directory: az-baze-auth
        run: python -m unittest -v test_paid_period_confirmation.py test_paid_history_reporting.py test_cash_payments.py test_upload_integrity.py test_upload_reconcile.py test_paid_services.py test_paid_services_storage.py test_paid_services_periods.py test_paid_period_report.py test_economics_revenue_source.py test_completed_upload.py test_pr71_approved_restoration.py
      - name: Actual report selectors and upload regressions
        run: |
          node --check reports/period-view.js
          node tests/verify-paid-history.cjs
          node tests/verify-paid-periods.cjs
          node tests/verify-paid-upload-periods.cjs
          python -m py_compile az-baze-auth/paid_period_confirmation.py az-baze-auth/report_storage.py tools/paid-history-confirmation-plan.py
      - name: Preserve source evidence for review
        if: always()
        run: |
          mkdir -p /tmp/az-paid-history-evidence
          tar --exclude='__pycache__' -czf /tmp/az-paid-history-evidence/source.tgz az-baze-auth/*.py az-baze-auth/requirements.txt reports/index.html reports/period-view.js reports/mobile-date-fix.css tests/verify-paid*.cjs tools/paid-history-confirmation-plan.py .github/workflows/az-paid-history.yml
          git diff > /tmp/az-paid-history-evidence/prepared.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-history-source-evidence
          path: /tmp/az-paid-history-evidence/
      - name: Commit only tested source delta to the dedicated branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='2a0301e28d01a7ebaeae81e1e96b9ce4362930b7'
          allowed={
              'az-baze-auth/report_storage.py','reports/index.html','reports/period-view.js',
              'az-baze-auth/paid_period_confirmation.py','az-baze-auth/test_paid_period_confirmation.py',
              'az-baze-auth/test_paid_history_reporting.py','az-baze-auth/PAID-HISTORY-REPORTING.md',
              'tests/verify-paid-history.cjs','tools/paid-history-confirmation-plan.py',
              '.github/workflows/az-paid-history.yml'}
          temporary=[f'.github/paid-history-pack-{i}.b64' for i in range(1,5)]+[
              '.github/paid-history-source-build.py','.github/workflows/az-paid-history-source-build.yml',
              'tools/prepare-paid-history.py']
          for name in temporary:
              Path(name).unlink()
          subprocess.run(['git','add','-A','--',*sorted(allowed),*temporary],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())
          if changed!=allowed:
              raise RuntimeError('FINAL_SOURCE_SCOPE_MISMATCH: '+repr(changed))
          print('FINAL_SOURCE_SCOPE=PASS; FILES=10; LIVE_ACCESS=NONE')
          PY
          actual="$(git ls-remote origin refs/heads/fix/az-paid-patient-history-20261029 | cut -f1)"
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore confirmed monthly paid-patient reporting without altering source data'
          git push origin HEAD:refs/heads/fix/az-paid-patient-history-20261029
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
