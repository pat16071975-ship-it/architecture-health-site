name: Patch reports period comparison
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/patch-reports-period-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Load period comparison UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reports/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./period-view.js?v=20260826-1"></script>'
          hide='<style id="period-compare-hide">#quarterWrap,#halfWrap{display:none!important}</style>'
          if hide not in s:
              s=s.replace('</head>',hide+'\n</head>')
          if tag not in s:
              anchor='<script src="./seed-data.js?v=20260826-1"></script>'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n'+tag)
              else:
                  s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show quarters and half-years side by side"
            git push origin HEAD:feature/site-v1
          fi
