name: AZ PR262 guarded MIS archive deployment package
on:
  pull_request:
    paths:
      - 'az-baze-auth/deploy/controlled-pr262-mis-archive.py'
      - 'az-baze-auth/deploy/test_controlled_pr262_release.py'
      - '.github/workflows/az-pr262-controlled-release.yml'
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install openpyxl
      - name: Test exact source and synthetic guarded archive
        run: |
          python -B -m py_compile az-baze-auth/deploy/controlled-pr262-mis-archive.py az-baze-auth/deploy/test_controlled_pr262_release.py
          python -B -m unittest discover -v -s az-baze-auth/deploy -p 'test_controlled_pr262_release.py'
          python - <<'PY'
          import subprocess
          expected={'.github/workflows/az-pr262-controlled-release.yml','az-baze-auth/deploy/controlled-pr262-mis-archive.py','az-baze-auth/deploy/test_controlled_pr262_release.py'}
          actual=set(subprocess.check_output(['git','diff','--name-only','559a297ec013997497d9ef125326bc695f3be53e','HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          print('DEPLOY_PACKAGE_SCOPE=PASS; SYNTHETIC_ONLY')
          PY
