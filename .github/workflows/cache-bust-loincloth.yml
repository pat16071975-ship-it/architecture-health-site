name: Cache bust approved loincloth
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/cache-bust-loincloth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Version approved loincloth URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/loincloth-da-vinci-v3.svg"'
          new = 'assets/loincloth-da-vinci-v3.svg?v=20260824-1"'
          if new not in s:
              if old not in s:
                  raise SystemExit('loincloth src not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Force refresh approved loincloth asset'
          git push origin HEAD:feature/site-v1
