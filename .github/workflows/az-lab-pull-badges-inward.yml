name: AZ Lab pull radial badges inward

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-pull-badges-inward.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Pull all radial badges 30 percent toward the system
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('interface-lab/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('orbits-20260904-7', 'orbits-20260904-8'),
              ('Черновик: 5 плашек-заглушек слева</div>', 'Черновик: плашки на 30% ближе к системе</div>'),
              ('Черновик: 5 плашек-заглушек слева · 63/114 сек', 'Черновик: плашки на 30% ближе к системе · 63/114 сек'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Missing expected fragment: ' + old)
              text = text.replace(old, new)

          cleanup_old = "  stopOrbitAnimation();doc.getElementById('az-lab-orbits')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();doc.querySelectorAll('.az-lab-placeholder-badge').forEach(el=>el.remove());\n"
          cleanup_new = "  stopOrbitAnimation();doc.getElementById('az-lab-orbits')?.remove();doc.getElementById('az-lab-orbit-style')?.remove();doc.querySelectorAll('.az-lab-placeholder-badge').forEach(el=>el.remove());doc.querySelectorAll('.az-lab-radial-shift').forEach(el=>{el.classList.remove('az-lab-radial-shift');el.style.removeProperty('--az-badge-shift-x');el.style.removeProperty('--az-badge-shift-y')});\n"
          if cleanup_old not in text:
              raise SystemExit('Cleanup insertion point not found')
          text = text.replace(cleanup_old, cleanup_new, 1)

          function_anchor = "function addPlaceholderBadges(doc){\n"
          pull_lines = [
              "function pullBadgesTowardCenter(doc,fraction=.30){",
              "  const stage=doc.querySelector('.stage');",
              "  const sources=['.specialists-badge','.side-menu-1','.side-menu-2','.side-menu-3','.side-menu-4'].map(selector=>doc.querySelector(selector)).filter(Boolean);",
              "  if(!stage||sources.length!==5)return;",
              "  const stageRect=stage.getBoundingClientRect(),cx=stageRect.left+stageRect.width/2,cy=stageRect.top+stageRect.height/2;",
              "  sources.forEach(el=>{",
              "    const r=el.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/2;",
              "    el.style.setProperty('--az-badge-shift-x',((cx-sx)*fraction)+'px');",
              "    el.style.setProperty('--az-badge-shift-y',((cy-sy)*fraction)+'px');",
              "    el.classList.add('az-lab-radial-shift');",
              "  });",
              "}",
          ]
          pull_function = '\n'.join(pull_lines) + '\n'
          if function_anchor not in text:
              raise SystemExit('Function insertion point not found')
          text = text.replace(function_anchor, pull_function + function_anchor, 1)

          css_anchor = ".az-lab-orbit-host{position:relative!important}.az-lab-orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}\n"
          css_new = css_anchor + ".az-lab-radial-shift{transform:translate(var(--az-badge-shift-x),var(--az-badge-shift-y))!important}\n"
          if css_anchor not in text:
              raise SystemExit('CSS insertion point not found')
          text = text.replace(css_anchor, css_new, 1)

          call_old = "`;doc.head.appendChild(style);addPlaceholderBadges(doc);\n"
          call_new = "`;doc.head.appendChild(style);pullBadgesTowardCenter(doc,.30);addPlaceholderBadges(doc);\n"
          if call_old not in text:
              raise SystemExit('Render call insertion point not found')
          text = text.replace(call_old, call_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('interface-lab/index.html').read_text(encoding='utf-8')
          required = [
              "function pullBadgesTowardCenter(doc,fraction=.30)",
              "pullBadgesTowardCenter(doc,.30);addPlaceholderBadges(doc)",
              ".az-lab-radial-shift{transform:translate(var(--az-badge-shift-x),var(--az-badge-shift-y))!important}",
              "removeProperty('--az-badge-shift-x')",
              "orbits-20260904-8",
              "плашки на 30% ближе к системе",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing marker: ' + marker)

          match = re.search(r'<script>([\s\S]*)</script>', text)
          if not match:
              raise SystemExit('Script block not found')
          Path('verify-source.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check verify-source.js
          rm verify-source.js
          git diff --check

      - name: Commit Interface Lab change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Pull radial badges 30 percent toward central system"
          git push origin HEAD:feature/site-v1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify live geometry and capture screenshot
        run: |
          cat > verify-badge-inward-shift.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport: {width: 1800, height: 1100}, deviceScaleFactor: 1});
            const baseUrl = 'https://pat16071975-ship-it.github.io/architecture-health-site/interface-lab/';
            let deployed = false;

            for (let attempt = 0; attempt < 42; attempt += 1) {
              await page.goto(`${baseUrl}?v=20260904-12&t=${Date.now()}`, {waitUntil: 'domcontentloaded', timeout: 120000});
              const html = await page.content();
              if (html.includes('orbits-20260904-8') && html.includes('плашки на 30% ближе к системе')) {
                deployed = true;
                break;
              }
              await page.waitForTimeout(5000);
            }
            if (!deployed) throw new Error('Updated Interface Lab was not deployed in time');

            await page.waitForFunction(() => {
              const frame = document.querySelector('iframe');
              const doc = frame && frame.contentDocument;
              return doc && doc.querySelectorAll('.az-lab-placeholder-badge').length === 5 && doc.querySelectorAll('.az-lab-radial-shift').length === 5;
            }, {timeout: 30000});
            await page.waitForTimeout(1200);

            const report = await page.evaluate(() => {
              const doc = document.querySelector('iframe').contentDocument;
              const stage = doc.querySelector('.stage');
              const rightSelectors = ['.specialists-badge','.side-menu-1','.side-menu-2','.side-menu-3','.side-menu-4'];
              const mirrorSelectors = ['.side-menu-4','.side-menu-3','.side-menu-2','.side-menu-1','.specialists-badge'];
              const center = rect => ({x: rect.left + rect.width / 2, y: rect.top + rect.height / 2});
              const stageCenter = center(stage.getBoundingClientRect());

              const right = rightSelectors.map(selector => {
                const el = doc.querySelector(selector);
                const shifted = center(el.getBoundingClientRect());
                el.classList.remove('az-lab-radial-shift');
                const original = center(el.getBoundingClientRect());
                el.classList.add('az-lab-radial-shift');
                const shiftedDistance = Math.hypot(shifted.x-stageCenter.x, shifted.y-stageCenter.y);
                const originalDistance = Math.hypot(original.x-stageCenter.x, original.y-stageCenter.y);
                return {
                  selector,
                  text: el.textContent.trim(),
                  originalDistance,
                  shiftedDistance,
                  ratio: shiftedDistance/originalDistance,
                  shiftX: getComputedStyle(el).getPropertyValue('--az-badge-shift-x').trim(),
                  shiftY: getComputedStyle(el).getPropertyValue('--az-badge-shift-y').trim(),
                };
              });

              const sources = mirrorSelectors.map(selector => doc.querySelector(selector));
              const placeholders = [...doc.querySelectorAll('.az-lab-placeholder-badge')]
                .sort((a,b) => Number(a.dataset.azPlaceholderIndex)-Number(b.dataset.azPlaceholderIndex))
                .map((target,index) => {
                  const tr = target.getBoundingClientRect();
                  const sr = sources[index].getBoundingClientRect();
                  const tc = center(tr), sc = center(sr);
                  return {
                    index: Number(target.dataset.azPlaceholderIndex),
                    text: target.textContent.trim(),
                    width: tr.width,
                    height: tr.height,
                    sourceWidth: sr.width,
                    sourceHeight: sr.height,
                    midpointErrorX: Math.abs((tc.x+sc.x)/2-stageCenter.x),
                    midpointErrorY: Math.abs((tc.y+sc.y)/2-stageCenter.y),
                  };
                });

              return {
                rightTexts: right.map(item => item.text),
                right,
                placeholders,
                planetCount: doc.querySelectorAll('.az-lab-planet').length,
                status: document.querySelector('#status')?.textContent,
              };
            });

            const expectedRight = ['команда','о клинике','пациенту','лаборатория','контакты'];
            if (JSON.stringify(report.rightTexts) !== JSON.stringify(expectedRight)) throw new Error(`Right badges changed: ${JSON.stringify(report.rightTexts)}`);
            if (report.right.length !== 5 || report.placeholders.length !== 5) throw new Error('Expected five badges on each side');
            if (report.planetCount !== 12) throw new Error(`Expected 12 planets, got ${report.planetCount}`);
            for (const item of report.right) {
              if (Math.abs(item.ratio - 0.70) > 0.015) throw new Error(`Unexpected inward ratio for ${item.selector}: ${item.ratio}`);
            }
            for (const item of report.placeholders) {
              if (item.text !== 'заглушка') throw new Error(`Wrong placeholder text at ${item.index}`);
              if (Math.abs(item.width-item.sourceWidth) > 0.7 || Math.abs(item.height-item.sourceHeight) > 0.7) throw new Error(`Size mismatch at ${item.index}`);
              if (item.midpointErrorX > 1.2 || item.midpointErrorY > 1.2) throw new Error(`Mirror mismatch at ${item.index}`);
            }

            fs.writeFileSync('/tmp/badge-inward-report.json', JSON.stringify(report, null, 2));
            await page.screenshot({path: '/tmp/az-interface-lab-badges-inward.png', fullPage: true});
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node verify-badge-inward-shift.cjs
          cat /tmp/badge-inward-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: az-interface-lab-badges-inward-check
          path: |
            /tmp/az-interface-lab-badges-inward.png
            /tmp/badge-inward-report.json
          if-no-files-found: ignore
          retention-days: 3
