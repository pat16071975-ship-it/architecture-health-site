name: Enable secure report auto-import

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/enable-secure-report-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0

      - name: Connect secure import script
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/enable_secure_import.py
          python3 /tmp/enable_secure_import.py

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enable secure report auto-import"
          git pull --rebase origin feature/site-v1
          git push origin HEAD:feature/site-v1
