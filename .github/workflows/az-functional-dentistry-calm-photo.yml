name: AZ Calm Dentistry Visual
on:
  push:
    branches:
      - feature/site-v1
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch functional dentistry detail page
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/az-functional-dentistry-calm-photo.yml
          git add interface-lab/functional-dentistry/index.html
          git commit -m "Add calm functional dentistry portrait visual"
          git push origin feature/site-v1
