name: AZ PR248 guarded delivery
on:
  push:
    branches: ['ops/az-pr248-guarded-deploy-20261121']
  workflow_dispatch:
jobs:
  verify-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s ops -p test_pr248_deploy.py
      - run: sha256sum ops/apply_pr248_guarded.py
