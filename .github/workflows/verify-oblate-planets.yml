name: Verify oblate planet rendering

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/verify-oblate-planets.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1

      - name: Install Playwright Chromium
        run: |
          npm --version
          npx --yes playwright@1.55.0 install chromium

      - name: Verify live Interface Lab and capture screenshot
        run: |
          cat > /tmp/verify-oblate.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1518, height: 900}, deviceScaleFactor: 1});
          const url = 'https://pat16071975-ship-it.github.io/architecture-health-site/interface-lab/?v=20260904-3';
          await page.goto(url, {waitUntil: 'networkidle', timeout: 120000});
          await page.waitForFunction(() => {
            const frame = document.querySelector('iframe');
            return frame && frame.contentDocument && frame.contentDocument.querySelectorAll('.az-lab-planet').length === 12;
          }, {timeout: 30000});
          await page.waitForTimeout(1200);

          const report = await page.evaluate(() => {
            const doc = document.querySelector('iframe').contentDocument;
            const planets = [...doc.querySelectorAll('.az-lab-planet')];
            return planets.map((planet) => {
              const art = planet.querySelector('.az-lab-planet-art');
              const ps = getComputedStyle(planet);
              const as = getComputedStyle(art);
              return {
                label: planet.textContent.trim().replace(/\s+/g, ' '),
                width: ps.width,
                height: ps.height,
                radius: ps.borderRadius,
                border: ps.borderColor,
                artColor: as.backgroundColor,
                opacity: as.opacity,
                mask: as.webkitMaskImage || as.maskImage,
                maskSize: as.webkitMaskSize || as.maskSize
              };
            });
          });

          if (report.length !== 12) throw new Error(`Expected 12 planets, got ${report.length}`);
          for (const item of report) {
            if (item.width !== '108px' || item.height !== '102px') throw new Error(`Wrong planet size for ${item.label}: ${item.width} x ${item.height}`);
            if (!item.mask || item.mask === 'none') throw new Error(`Missing artwork mask for ${item.label}`);
            if (!item.maskSize.includes('136%') || !item.maskSize.includes('111%')) throw new Error(`Wrong mask size for ${item.label}: ${item.maskSize}`);
          }

          fs.writeFileSync('/tmp/oblate-planets-report.json', JSON.stringify(report, null, 2));
          await page.screenshot({path: '/tmp/az-interface-lab-oblate-planets.png', fullPage: false});
          await browser.close();
          JS
          npx --yes -p playwright@1.55.0 node /tmp/verify-oblate.mjs
          cat /tmp/oblate-planets-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: az-interface-lab-oblate-planets-check
          path: |
            /tmp/az-interface-lab-oblate-planets.png
            /tmp/oblate-planets-report.json
          retention-days: 3

      - name: Remove temporary verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-oblate-planets.yml
          git commit -m "Remove temporary oblate planet verification workflow"
          git push origin HEAD:feature/site-v1
