name: AZ Lab dentistry orbit composition
on:
  push:
    branches: [feature/site-v1]
    paths:
      - '.github/workflows/az-lab-orbit-dentistry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
          fetch-depth: 0
      - name: Patch Interface Lab orbit composition
        run: python3 .github/scripts/az_orbit_dentistry_v2.py
      - name: Verify generated planet assets
        run: |
          test -f assets/lab-planets/planet-13-dentistry-orthopedics.svg
          test -f assets/lab-planets/planet-14-dentistry-surgery.svg
          grep -F "const innerNames=['Функциональная стоматология','Ортодонтия','Стоматология ортопедия','Стоматология хирургия','Стоматология терапия'];" interface-lab/index.html
          grep -F "const outerNames=['ИГГТ','DIERS диагностика','Нейропсихология','Детская неврология','Миофункциональная терапия','Превентивная медицина','Гастроэнтерология','Нутрициология','Остеопатия'];" interface-lab/index.html
          grep -F "const INNER_DURATION=63000;" interface-lab/index.html
          grep -F "const OUTER_DURATION=114000;" interface-lab/index.html
          grep -F "innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14" interface-lab/index.html
      - name: Commit viewer-only orbit change
        run: |
          rm -f .github/workflows/az-lab-orbit-dentistry.yml .github/scripts/az_orbit_dentistry_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interface-lab/index.html assets/lab-planets/planet-13-dentistry-orthopedics.svg assets/lab-planets/planet-14-dentistry-surgery.svg .github/workflows/az-lab-orbit-dentistry.yml .github/scripts/az_orbit_dentistry_v2.py
          git commit -m 'Rebalance dentistry directions across Interface Lab orbits'
          git push origin feature/site-v1
