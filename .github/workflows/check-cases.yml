name: Verify case gallery interactions
on: [push]
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - name: Prepare original media and site interactions
        run: |
          cat tilda-migration/delivery/cases-gallery/data-*.part > /tmp/original.zip
          echo 'df01b3a7ea5f8bbd4ac7fe6d8e706f88da24765eae67df8466765ddb7602f64e  /tmp/original.zip' | sha256sum -c -
          unzip -q /tmp/original.zip 'data/assets/*' -d /tmp/azsrc
          curl -fsSL --retry 2 --max-time 30 https://azmednsk.ru/site.js?v=az-logo-20261115-v1 -o /tmp/azsitejs
      - run: python tilda-migration/tests/check_cases_viewer_browser.py
