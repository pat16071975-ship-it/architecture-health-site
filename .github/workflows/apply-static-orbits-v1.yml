name: Apply static two-orbit Interface Lab layout

on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/apply-static-orbits-v1.yml
      - tools/patch_static_orbits_v1.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Patch Interface Lab
        run: python tools/patch_static_orbits_v1.py
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface-lab/index.html
          git commit -m "Add two static irregular orbits to Interface Lab"
          git rm .github/workflows/apply-static-orbits-v1.yml tools/patch_static_orbits_v1.py
          git commit -m "Remove one-off static orbit patch files"
          git push origin feature/site-v1
