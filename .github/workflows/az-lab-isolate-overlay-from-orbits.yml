name: AZ Lab isolate overlay from orbits
on:
  push:
    branches:
      - feature/site-v1
    paths:
      - .github/workflows/az-lab-isolate-overlay-from-orbits.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-v1
      - name: Isolate description overlay from orbit geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('interface-lab/index.html')
          s=p.read_text()
          old="""function closeDirectionInfo(doc){doc.querySelector('.az-lab-direction-info')?.remove()}
function showDirectionInfo(doc,name){
  const info=DIRECTION_INFO[name];if(!info)return;
  const stage=doc.querySelector('.stage');if(!stage)return;
  closeDirectionInfo(doc);
  const panel=doc.createElement('section');panel.className='az-lab-direction-info';panel.setAttribute('aria-live','polite');
  panel.innerHTML='<button class=\"az-lab-direction-close\" type=\"button\" aria-label=\"Закрыть описание\">×</button><div class=\"az-lab-direction-info-inner\"><h2>'+info.title+'</h2><p class=\"az-lab-direction-lead\">Стоит обратить внимание, если:</p><ul>'+info.items.map(item=>'<li>'+item+'</li>').join('')+'</ul><p class=\"az-lab-direction-summary\">'+info.summary+'</p><button class=\"az-lab-direction-more\" type=\"button\">Узнать подробнее</button></div>';
  panel.querySelector('.az-lab-direction-close').addEventListener('click',event=>{event.stopPropagation();closeDirectionInfo(doc)});
  stage.appendChild(panel);
}
function enableDirectionInfo(doc,planets){planets.forEach(el=>{const name=el.dataset.azDirectionName;el.onclick=event=>{event.preventDefault();event.stopPropagation();if(DIRECTION_INFO[name])showDirectionInfo(doc,name)}})}
"""
          new="""function closeDirectionInfo(doc){doc.querySelector('.az-lab-direction-info')?.remove()}
function showDirectionInfo(doc,name){
  const info=DIRECTION_INFO[name];if(!info)return;
  const stage=doc.querySelector('.stage'),host=doc.querySelector('.map')||stage?.parentElement;if(!stage||!host)return;
  closeDirectionInfo(doc);
  const hostRect=host.getBoundingClientRect(),stageRect=stage.getBoundingClientRect();
  const panel=doc.createElement('section');panel.className='az-lab-direction-info';panel.setAttribute('aria-live','polite');
  panel.style.setProperty('left',(stageRect.left-hostRect.left)+'px','important');
  panel.style.setProperty('top',(stageRect.top-hostRect.top)+'px','important');
  panel.style.setProperty('width',stageRect.width+'px','important');
  panel.style.setProperty('height',stageRect.height+'px','important');
  panel.innerHTML='<button class=\"az-lab-direction-close\" type=\"button\" aria-label=\"Закрыть описание\">×</button><div class=\"az-lab-direction-info-inner\"><h2>'+info.title+'</h2><p class=\"az-lab-direction-lead\">Стоит обратить внимание, если:</p><ul>'+info.items.map(item=>'<li>'+item+'</li>').join('')+'</ul><p class=\"az-lab-direction-summary\">'+info.summary+'</p><button class=\"az-lab-direction-more\" type=\"button\">Узнать подробнее</button></div>';
  panel.querySelector('.az-lab-direction-close').addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();closeDirectionInfo(doc)});
  host.appendChild(panel);
}
function enableDirectionInfo(doc,planets){planets.forEach(el=>{const name=el.dataset.azDirectionName;const handler=event=>{event.preventDefault();event.stopImmediatePropagation();if(DIRECTION_INFO[name])showDirectionInfo(doc,name)};el._azDirectionHandler=handler;el.addEventListener('click',handler,true)})}
"""
          assert old in s, 'old info functions not found'
          s=s.replace(old,new,1)
          old_cleanup="el.onclick=null;delete el.dataset.azDirectionName;el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet')"
          new_cleanup="if(el._azDirectionHandler){el.removeEventListener('click',el._azDirectionHandler,true);delete el._azDirectionHandler}delete el.dataset.azDirectionName;el.classList.remove('az-lab-planet','az-lab-inner-planet','az-lab-outer-planet')"
          assert old_cleanup in s, 'cleanup marker not found'
          s=s.replace(old_cleanup,new_cleanup,1)
          old_css=".az-lab-direction-info{position:absolute!important;inset:0!important;border-radius:50%!important;"
          new_css=".az-lab-direction-info{position:absolute!important;border-radius:50%!important;"
          assert old_css in s, 'overlay css marker not found'
          s=s.replace(old_css,new_css,1)
          s=s.replace('../?lab=orbits-20260904-12','../?lab=orbits-20260904-13')
          # Hard guards: approved orbit geometry must stay untouched.
          for marker in [
            'const INNER_DURATION=63000;',
            'const OUTER_DURATION=114000;',
            'innerRx:r.width*.55,innerRy:r.height*.44,outerRx:r.width*.73,outerRy:r.height*.57,innerTilt:18,outerTilt:14',
            "const innerAngles=[180,270,0,90];",
            "const outerAngles=[157.5,202.5,247.5,292.5,337.5,22.5,67.5,112.5];"
          ]:
            assert marker in s, marker
          p.write_text(s)
          PY
      - run: git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add interface-lab/index.html
          git rm .github/workflows/az-lab-isolate-overlay-from-orbits.yml
          git commit -m "Isolate direction overlay from orbit layout"
          git push origin feature/site-v1
