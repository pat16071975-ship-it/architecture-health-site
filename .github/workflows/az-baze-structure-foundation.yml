name: AZ-BAZE Structure Foundation

on:
  push:
    branches:
      - feature/az-structure-foundation
      - feature/az-structure-controlled-apply
    paths:
      - "az-baze-auth/db_migrations.py"
      - "az-baze-auth/migrations/**"
      - "az-baze-auth/structure_seed.py"
      - "az-baze-auth/test_structure_foundation.py"
      - "az-baze-auth/tools/controlled_structure_foundation_apply.py"
      - "az-baze-auth/tools/controlled_structure_foundation_handoff.py"
      - "az-baze-auth/test_controlled_structure_foundation_apply.py"
      - "az-baze-auth/deploy/CONTROLLED-STRUCTURE-FOUNDATION.md"
      - ".github/workflows/az-baze-structure-foundation.yml"
  pull_request:
    paths:
      - "az-baze-auth/db_migrations.py"
      - "az-baze-auth/migrations/**"
      - "az-baze-auth/structure_seed.py"
      - "az-baze-auth/test_structure_foundation.py"
      - "az-baze-auth/tools/controlled_structure_foundation_apply.py"
      - "az-baze-auth/tools/controlled_structure_foundation_handoff.py"
      - "az-baze-auth/test_controlled_structure_foundation_apply.py"
      - "az-baze-auth/deploy/CONTROLLED-STRUCTURE-FOUNDATION.md"
      - ".github/workflows/az-baze-structure-foundation.yml"

permissions:
  contents: read

jobs:
  structure-foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >
          python -m py_compile
          az-baze-auth/db_migrations.py
          az-baze-auth/migrations/v20260920_001_structure_foundation.py
          az-baze-auth/structure_seed.py
          az-baze-auth/test_structure_foundation.py
          az-baze-auth/tools/controlled_structure_foundation_apply.py
          az-baze-auth/tools/controlled_structure_foundation_handoff.py
          az-baze-auth/test_controlled_structure_foundation_apply.py

      - name: Structure foundation tests
        working-directory: az-baze-auth
        run: python -m unittest -v test_structure_foundation.py

      - name: Controlled apply tests
        working-directory: az-baze-auth
        run: python -m unittest -v test_controlled_structure_foundation_apply.py
