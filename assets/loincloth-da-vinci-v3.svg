<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" role="img" aria-label="">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e7d4"/>
      <stop offset="0.5" stop-color="#e8dcc5"/>
      <stop offset="1" stop-color="#deceb2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" values="0 0 0 0 .43 0 0 0 0 .34 0 0 0 0 .23 0 0 0 .10 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <!-- opaque wrap: this fill physically hides the anatomy underneath -->
    <path d="M36 36 C56 24 78 27 102 34 C126 42 150 31 184 39 C182 58 176 78 169 102 C164 116 157 124 149 127 C136 125 124 117 112 108 C100 99 91 98 80 107 C69 117 59 121 51 114 C44 108 43 95 43 82 C42 65 39 49 36 36 Z" fill="url(#paper)" stroke="#755b3c" stroke-width="2.05"/>
