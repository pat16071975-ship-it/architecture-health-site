    <path d="M28 37 C23 37 22 41 26 43 C30 45 34 43 35 40 C34 38 32 37 28 37 Z" fill="none" stroke="#755b3c" stroke-width="1.2"/>
    <path d="M22 45 C16 58 18 73 25 92 C29 103 35 111 43 116 C42 102 44 88 51 75 C42 66 36 55 34 45 Z" fill="#ddcbaa" stroke="#755b3c" stroke-width="1.5"/>
    <!-- top wrapped band -->
    <path d="M38 38 C63 30 83 34 104 40 C126 46 151 37 182 41" fill="none" stroke="#866947" stroke-width="2.1" opacity=".92"/>
    <path d="M43 45 C64 39 84 43 105 49 C128 55 149 47 178 48" fill="none" stroke="#9c8060" stroke-width="1.45" opacity=".78"/>
    <!-- diagonal drape and folds, Leonardo-like linework -->
    <path d="M38 43 C58 54 78 68 98 84 C113 96 130 108 151 121" fill="none" stroke="#765a3a" stroke-width="1.65" opacity=".88"/>
    <path d="M44 50 C64 58 82 69 98 80 C116 93 133 102 161 108" fill="none" stroke="#8b6d4a" stroke-width="1.25" opacity=".78"/>
    <path d="M55 46 C69 61 78 77 82 97 C84 105 83 111 79 117" fill="none" stroke="#755b3c" stroke-width="1.3" opacity=".76"/>
    <path d="M83 43 C91 57 97 72 99 88 C100 96 99 103 96 109" fill="none" stroke="#a28765" stroke-width="1.15" opacity=".65"/>
    <path d="M112 45 C107 61 108 77 114 92 C119 103 125 111 132 117" fill="none" stroke="#785c3d" stroke-width="1.3" opacity=".72"/>
    <path d="M141 42 C136 60 137 79 144 98 C148 109 154 116 161 120" fill="none" stroke="#886a48" stroke-width="1.25" opacity=".72"/>
    <path d="M164 42 C169 57 171 70 169 84 C168 94 165 103 161 110" fill="none" stroke="#74583a" stroke-width="1.2" opacity=".68"/>
    <!-- soft highlights in the paper wash -->
    <path d="M53 48 C75 55 94 66 111 79 C127 91 143 99 162 102" fill="none" stroke="#f6eddc" stroke-width="3" opacity=".64"/>
    <path d="M72 39 C86 44 97 49 108 55" fill="none" stroke="#f8efdf" stroke-width="2.2" opacity=".62"/>
  </g>
</svg>