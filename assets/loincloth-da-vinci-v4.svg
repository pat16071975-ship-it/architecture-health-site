<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 170">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e7d5"/>
      <stop offset="0.48" stop-color="#e8dcc5"/>
      <stop offset="1" stop-color="#dfcfb3"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88b63" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7f6546" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- Opaque parchment-toned body of the cloth: underlying anatomy cannot show through. -->
  <path d="M43 51 C63 45 85 47 106 51 C132 56 155 51 181 57 C173 71 168 88 160 105 C154 119 147 131 136 140 C119 133 102 121 87 114 C75 108 65 106 56 100 C52 90 50 79 49 70 C47 62 45 56 43 51 Z" fill="url(#paper)" stroke="#816a4d" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- soft old-ink wash, kept subtle and opaque over the paper base -->
  <path d="M50 61 C77 71 108 76 160 63 C152 82 146 103 136 128 C119 118 103 107 84 100 C67 94 57 82 50 61 Z" fill="url(#wash)"/>
  <!-- knot at the left hip -->
  <path d="M42 51 C35 51 31 55 33 61 C35 67 42 68 48 64 C54 60 53 54 48 52 C46 51 44 51 42 51 Z" fill="#e4d5bb" stroke="#80694b" stroke-width="1.15"/>
  <path d="M39 58 C44 57 48 59 51 63" fill="none" stroke="#8b7353" stroke-width="1" stroke-linecap="round"/>
  <path d="M43 65 C39 79 40 95 46 110 C50 120 55 128 62 133 C60 119 62 106 69 94 C58 83 51 73 48 64 Z" fill="#e0d0b4" stroke="#80694b" stroke-width="1.05" stroke-linejoin="round"/>
  <!-- Leonardo-like fold construction lines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 57 C73 66 103 70 154 60" stroke="#7c6548" stroke-width="1.25" opacity="0.92"/>
    <path d="M54 65 C82 77 112 80 169 66" stroke="#907654" stroke-width="0.9" opacity="0.82"/>
    <path d="M62 75 C84 84 107 88 152 79" stroke="#9b815d" stroke-width="0.82" opacity="0.70"/>
    <path d="M72 82 C91 92 109 104 133 119" stroke="#765f43" stroke-width="0.95" opacity="0.78"/>
    <path d="M84 73 C100 91 111 112 112 128" stroke="#9b815d" stroke-width="0.8" opacity="0.66"/>
    <path d="M113 67 C110 85 115 106 126 129" stroke="#8c7251" stroke-width="0.85" opacity="0.70"/>
    <path d="M145 61 C139 79 139 96 145 112" stroke="#786145" stroke-width="0.9" opacity="0.72"/>
    <path d="M162 60 C158 77 156 93 157 105" stroke="#9a805d" stroke-width="0.8" opacity="0.67"/>
    <path d="M58 95 C80 102 103 115 136 135" stroke="#7f6749" stroke-width="0.9" opacity="0.70"/>
    <path d="M53 72 C61 89 64 103 62 121" stroke="#a08764" stroke-width="0.72" opacity="0.64"/>
  </g>
  <!-- restrained highlights like faded paper wash -->
  <g fill="none" stroke="#f6efe2" stroke-linecap="round" opacity="0.72">
    <path d="M70 67 C92 76 119 77 148 69" stroke-width="1.8"/>
    <path d="M96 82 C106 95 114 109 118 122" stroke-width="1.5"/>
