<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Врачу — База знаний</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260908-1">
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--green-soft:#edf2ed;--line:#d8cdbb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6 0,var(--paper) 65%,var(--paper2) 100%);color:var(--ink);font-family:'Montserrat',Arial,sans-serif}
.shell{width:min(1060px,94vw);margin:0 auto;padding:34px 0 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;border:1px solid rgba(68,99,79,.34);border-radius:9px;background:#fff;color:#334039;text-decoration:none;font:600 12px Montserrat,Arial,sans-serif}
.brand{text-align:center;margin-bottom:28px}
.brand-kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#607067;font-weight:600}
.brand h1{margin:8px 0 0;font-size:36px;font-weight:500;letter-spacing:-.03em}
.card{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 46px rgba(69,55,35,.09);padding:30px}
.head{text-align:center;max-width:740px;margin:0 auto 26px}
.head h2{margin:0;font-size:28px;font-weight:500;letter-spacing:-.025em}
.head p{margin:10px 0 0;color:#6c746d;font-size:13px;line-height:1.55}
.list{display:grid;gap:12px}
.item{display:block;padding:20px 22px;border:1px solid #d8cdbb;border-radius:14px;background:#fff;color:#334039;text-decoration:none;font-size:18px;font-weight:600}
.item:hover,.item:focus-visible{border-color:rgba(68,99,79,.58);background:var(--green-soft);outline:none}
@media(max-width:700px){.shell{padding-top:20px}.brand h1{font-size:29px}.card{padding:20px}.head h2{font-size:23px}.item{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><a class="back" href="/knowledge/">← База знаний</a></div>
  <div class="brand"><div class="brand-kicker">Медицинская клиника системного подхода</div><h1>Архитектура здоровья</h1></div>
  <main class="card">
    <div class="head">
      <h2>Врачу</h2>
      <p>Учебные материалы для врачей.</p>
    </div>
    <div class="list">
      <a class="item" href="/knowledge-library/?path=%D0%9E%D0%B1%D1%89%D0%B0%D1%8F%20%D0%BC%D0%B5%D0%B4%D0%B8%D1%86%D0%B8%D0%BD%D0%B0">Общая медицина</a>
      <a class="item" href="/knowledge-library/?path=%D0%9F%D0%BE%D0%B4%D0%BA%D0%B0%D1%81%D1%82%D1%8B%20%D0%B8%20%D0%B2%D1%8B%D1%81%D1%82%D1%83%D0%BF%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%97%D1%83%D0%B1%D0%B0%D0%B5%D1%87%D0%B2%20%D0%A0.%D0%9D">Подкасты и выступления Зубачева Р.Н</a>
      <a class="item" href="/knowledge-library/?path=%D0%A1%D1%82%D0%BE%D0%BC%D0%B0%D1%82%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%20%D0%B8%20%D0%BC%D0%B8%D0%BE%D1%82%D0%B5%D1%80%D0%B0%D0%BF%D0%B8%D1%8F">Стоматология и миотерапия</a>
    </div>
  </main>
</div>
</body>
</html>
