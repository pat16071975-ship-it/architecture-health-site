<head>

<title>Аналитика услуг — Архитектура здоровья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--paper:#f7f3ec;--soft:#fffdf8;--ink:#2d342f;--green:#44634f;--green2:#dfe9e2;--gold:#b59662;--gold2:#efe5d2;--blue:#dfe9f2;--orange:#f1dfc9;--line:#d8cdbb;--red:#9a4b48;--muted:#6d746c;--focus:#f8f1e3}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fcfaf6,var(--paper));color:var(--ink);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.hidden{display:none!important}a{color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,94vw);background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(69,55,35,.10)}.brand{font:600 34px/1.05 'Cormorant Garamond',serif;text-align:center}.sub{margin:8px 0 24px;text-align:center;color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:600;color:#60685f}.field input,.field select{width:100%;padding:10px 12px;border:1px solid #cfc5b5;border-radius:10px;background:#fff;font:500 14px Inter}.field select:disabled{background:#f4f1ea;color:#7f857d;cursor:not-allowed}.btn{appearance:none;border:1px solid rgba(68,99,79,.34);background:#fff;color:#334039;border-radius:10px;padding:10px 14px;font:600 13px Inter;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.active{background:var(--green2);border-color:#9eb6a5}.error{min-height:18px;color:var(--red);font-size:12px;margin-top:8px}
.app{width:min(1680px,98vw);margin:0 auto;padding:18px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.title{font:600 38px/1 'Cormorant Garamond',serif}.muted{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;align-items:end;padding:12px;border:1px solid var(--line);background:rgba(255,253,248,.82);border-radius:14px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}.toolbar .field{margin:0;min-width:0}.toolbar .field.wide{grid-column:span 2}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.notice{margin:12px 0;padding:10px 13px;border-left:3px solid var(--gold);background:#fffaf0;color:#665b49;font-size:12px;border-radius:8px}.status{margin:10px 0 12px;font-size:12px;color:#516056}.kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi{border:1px solid #e2d9ca;border-radius:12px;background:#fff;padding:11px 13px}.kpi span{display:block;font-size:11px;font-weight:700;color:#687067;margin-bottom:6px}.kpi strong{font:600 22px/1.05 'Cormorant Garamond',serif}
.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,253,248,.9);margin-top:12px}.panel h2{margin:0;padding:10px 14px;font:700 22px/1.1 'Cormorant Garamond',serif;background:var(--gold2)}.panel-note{padding:10px 14px;font-size:11px;color:#705f47;background:#fff9ef;border-top:1px solid #efe4d2}.panel.dent h2{background:var(--blue)}.panel.clinic h2{background:var(--green2)}.panel.lab h2{background:var(--orange)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:6px 8px;border-top:1px solid #e6ded1;font-size:11px;line-height:1.25;text-align:right;vertical-align:middle}.table th{background:#faf6ef;position:sticky;top:0;z-index:1;font-weight:700}.table th:first-child,.table td:first-child{text-align:left}.table .money{font-weight:700}.table .period-head{text-align:center}.table .subhead{font-size:10px;font-weight:700;color:#6a7169;text-transform:none}.table .focus{background:var(--focus)}.table .total-col{background:#f8f4ec}.table .total-row td{font-weight:700;background:#faf7f1}.matrix{min-width:1180px}.matrix th,.matrix td{text-align:right;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{text-align:left;white-space:normal;min-width:220px;position:sticky;left:0;background:#fffdf8;z-index:2}.matrix th:first-child{background:#faf6ef;z-index:3}.cell-main{font-weight:700}.cell-sub{font-size:10px;color:#7b817b;margin-top:2px}.delta-pos{color:#2e7d32;font-weight:700}.delta-neg{color:#b04a45;font-weight:700}.delta-neutral{color:#7b817b}.empty{padding:28px;text-align:center;color:#777}.small{font-size:11px;color:var(--muted)}.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:#f0ece5;color:#6b6a64;font-size:10px;font-weight:700}.compare-head{background:#f4efe5}
@media(max-width:1200px){.toolbar{grid-template-columns:repeat(3,minmax(180px,1fr))}}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(140px,1fr))}.topbar{align-items:flex-start;flex-direction:column}.toolbar{position:static;grid-template-columns:repeat(2,minmax(160px,1fr))}.toolbar .field.wide{grid-column:span 1}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.title{font-size:30px}.app{width:96vw}.table th,.table td{padding:5px 6px;font-size:10px}.matrix th:first-child,.matrix td:first-child{min-width:170px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand">Архитектура здоровья</div>
    <div class="sub">Аналитика услуг</div>
    <form id="loginForm">
      <div class="field"><label>Логин</label><input id="loginName" autocomplete="username" required></div>
      <div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%;margin-top:8px" type="submit">Войти</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <div class="topbar">
    <div>
      <div class="title">Аналитика услуг</div>
      <div class="muted">Единые категории по прайсу • январь–август 2026</div>
    </div>
    <div class="top-actions">
      <a class="btn" href="./">Управленческий отчёт</a>
      <a class="btn" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1egOo5bL3Y-zv-bhOChjKQIjwqzv-gZnOpZcBA0BXWtk/edit">Прайс-классификатор</a>
      <button id="logoutBtn" class="btn">Выйти</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Направление</label><select id="direction"></select></div>
    <div class="field"><label>Сравнение</label><select id="grouping"><option value="month">По месяцам</option><option value="quarter">По кварталам</option><option value="half">По полугодиям</option></select></div>
    <div class="field"><label>Выделить период</label><select id="focusPeriod"></select></div>
    <div class="field"><label id="doctorLabel">Врач</label><select id="doctor"></select></div>
    <div id="doctor2Field" class="field hidden"><label>Врач 2</label><select id="doctor2"></select></div>
    <div class="field wide"><label>Категория</label><select id="category"></select></div>
  </div>
  <div id="status" class="status"></div>
  <div id="missingData" class="notice hidden">Данные аналитики ещё не загружены в этот браузер. Откройте защищёё�нную ссылку импорта один разин.</div>

  <div class="tabs">
    <button class="btn active" data-tab="summary">Сводная по всем врачам</button>
    <button class="btn" data-tab="doctor">Таблица врача</button>
    <button class="btn" data-tab="compare">Сравнение 2 врачей</button>
    <button class="btn" data-tab="matrix">Матрица врачи × услуги</button>
  </div>

  <div id="kpis" class="kpis"></div>
  <div id="content"></div>
</div>
