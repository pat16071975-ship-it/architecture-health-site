<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика услуг — Архитектура здоровья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--soft:#fffdf8;--ink:#2d342f;--green:#44634f;--green2:#dfe9e2;--gold:#b59662;--gold2:#efe5d2;--blue:#dfe9f2;--orange:#f1dfc9;--line:#d8cdbb;--red:#9a4b48;--muted:#6d746c}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fcfaf6,var(--paper));color:var(--ink);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.hidden{display:none!important}
a{color:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,94vw);background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(69,55,35,.10)}.brand{font:600 34px/1.05 'Cormorant Garamond',serif;text-align:center}.sub{margin:8px 0 24px;text-align:center;color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:600;color:#60685f}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #cfc5b5;border-radius:10px;background:#fff;font:500 14px Inter}.btn{appearance:none;border:1px solid rgba(68,99,79,.34);background:#fff;color:#334039;border-radius:10px;padding:10px 14px;font:600 13px Inter;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.active{background:var(--green2);border-color:#9eb6a5}.error{min-height:18px;color:var(--red);font-size:12px;margin-top:8px}
.app{width:min(1540px,98vw);margin:0 auto;padding:18px 0 46px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.title{font:600 38px/1 'Cormorant Garamond',serif}.muted{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end;padding:14px;border:1px solid var(--line);background:rgba(255,253,248,.82);border-radius:14px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}.toolbar .field{margin:0;min-width:185px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.notice{margin:12px 0;padding:10px 13px;border-left:3px solid var(--gold);background:#fffaf0;color:#665b49;font-size:12px;border-radius:8px}.status{margin:10px 0 12px;font-size:12px;color:#516056}.kpis{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;margin:14px 0}.kpi{border:1px solid #e2d9ca;border-radius:12px;background:#fff;padding:13px}.kpi span{display:block;font-size:11px;font-weight:700;color:#687067;margin-bottom:7px}.kpi strong{font:600 24px/1.1 'Cormorant Garamond',serif}.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,253,248,.9);margin-top:12px}.panel h2{margin:0;padding:12px 16px;font:700 22px/1.1 'Cormorant Garamond',serif;background:var(--gold2)}.panel.dent h2{background:var(--blue)}.panel.clinic h2{background:var(--green2)}.panel.lab h2{background:var(--orange)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{padding:9px 10px;border-top:1px solid #e6ded1;font-size:12px;text-align:right;vertical-align:top}.table th{background:#faf6ef;position:sticky;top:0;z-index:1}.table th:first-child,.table td:first-child{text-align:left}.table .money{font-weight:700}.bar{height:5px;background:#ebe4d7;border-radius:10px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--green);border-radius:10px}.matrix{min-width:1150px}.matrix th,.matrix td{text-align:right;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{text-align:left;white-space:normal;min-width:260px;position:sticky;left:0;background:#fffdf8;z-index:2}.matrix th:first-child{background:#faf6ef;z-index:3}.cell-main{font-weight:700}.cell-sub{font-size:10px;color:#7b817b;margin-top:2px}.empty{padding:28px;text-align:center;color:#777}.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(140px,1fr))}.topbar{align-items:flex-start;flex-direction:column}.toolbar{position:static}.toolbar .field{min-width:calc(50% - 8px)}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.toolbar .field{min-width:100%;width:100%}.title{font-size:30px}.app{width:96vw}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand">Архитектура здоровья</div>
    <div class="sub">Аналитика услуг</div>
    <form id="loginForm">
      <div class="field"><label>Логин</label><input id="loginName" autocomplete="username" required></div>
      <div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%;margin-top:8px" type="submit">Войти</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <div class="topbar">
    <div><div class="title">Аналитика услуг</div><div class="muted">Единые категории по прайсу • январь–август 2026</div></div>
    <div class="top-actions"><a class="btn" href="./">Управленческий отчёт</a><a class="btn" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1egOo5bL3Y-zv-bhOChjKQIjwqzv-gZnOpZcBA0BXWtk/edit">Прайс-классификатор</a><button id="logoutBtn" class="btn">Выйти</button></div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Направление</label><select id="direction"></select></div>
    <div class="field"><label>Период</label><select id="period"></select></div>
    <div class="field"><label>Врач</label><select id="doctor"></select></div>
    <div class="field"><label>Категория</label><select id="category"></select></div>
  </div>
  <div id="status" class="status"></div>
  <div id="missingData" class="notice hidden">Данные аналитики ещё не загружены в этот браузер. Откройте защищённую ссылку импорта один раз.</div>

  <div class="tabs">
    <button class="btn active" data-tab="summary">Сводная</button>
    <button class="btn" data-tab="categories">По категориям</button>
    <button class="btn" data-tab="doctors">По врачам</button>
    <button class="btn" data-tab="matrix">Матрица</button>
  </div>

  <div id="kpis" class="kpis"></div>
  <div id="content"></div>
</div>

<script>
const AUTH_USER='admin';
const AUTH_HASH='56c30f55c895d1d96f4b82f01c09e91f1e8cdc7eb77851f98a00cdd4d6aeddbf';
const SESSION_KEY='az-management-auth-v1';
const DATA_KEY='az-service-analytics-v1';
const IMPORT_KEY='az-service-import-key';
const META_URL='./services-data.meta.json?v=20260901-1';
const $=s=>document.querySelector(s);
let currentTab='summary';
let data=null;
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n||0)+' ₽';
const count=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0);
const pct=n=>new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(n||0);
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function sha256hex(bytes){const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function sha256(s){return sha256hex(new TextEncoder().encode(s))}
function captureKey(){const h=location.hash||'';if(h.startsWith('#azservices=')){sessionStorage.setItem(IMPORT_KEY,h.slice(12));history.replaceState(null,'',location.pathname+location.search)}}
function localData(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'null')}catch{return null}}
async function importSecureData(){const keyText=sessionStorage.getItem(IMPORT_KEY);if(!keyText)return false;try{const meta=await fetch(META_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('meta');return r.json()});const cipherText=await fetch(meta.part+'?v=20260901-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('part');return r.text()});if(meta.ciphertextSha256&&await sha256(cipherText.trim())!==meta.ciphertextSha256)throw Error('cipher hash');const key=await crypto.subtle.importKey('raw',b64u(keyText),{name:'AES-GCM'},false,['decrypt']);const compressed=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(meta.iv),additionalData:new TextEncoder().encode(meta.aad),tagLength:128},key,b64u(cipherText.trim())));if(await sha256hex(compressed)!==meta.compressedSha256)throw Error('compressed hash');const ds=new DecompressionStream('gzip');const plain=new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer());if(await sha256hex(plain)!==meta.plaintextSha256)throw Error('plain hash');const parsed=JSON.parse(new TextDecoder().decode(plain));localStorage.setItem(DATA_KEY,JSON.stringify(parsed));sessionStorage.removeItem(IMPORT_KEY);data=parsed;return true}catch(e){console.error(e);$('#status').textContent='Не удалось загрузить защищённые данные аналитики.';return false}}
function directionData(){return data?.directions?.[$('#direction').value]||null}
function selectedMonth(){const v=$('#period').value;return v==='all'?null:Number(v)}
function selectedDoctors(d){const v=$('#doctor').value;const names=Object.keys(d.doctors);return v==='all'?names:names.filter(x=>x===v)}
function selectedCategories(d){const v=$('#category').value;return v==='all'?d.categories:d.categories.filter(x=>x===v)}
function metric(doc,cat,m){const arr=doc[cat]||[];if(m==null)return arr.reduce((a,x)=>[a[0]+(+x[0]||0),a[1]+(+x[1]||0)],[0,0]);return arr[m]||[0,0]}
function aggregateSelection(){const d=directionData();if(!d)return {q:0,r:0,active:0,avg:0};const docs=selectedDoctors(d),cats=selectedCategories(d),m=selectedMonth();let q=0,r=0,active=0;cats.forEach(cat=>{let cq=0,cr=0;docs.forEach(name=>{const x=metric(d.doctors[name],cat,m);cq+=x[0];cr+=x[1]});q+=cq;r+=cr;if(cq||cr)active++});return {q,r,active,avg:q?r/q:0}}
function renderFilters(){const dirs=Object.keys(data?.directions||{});const ds=$('#direction');const prev=ds.value;ds.innerHTML=dirs.map(x=>`<option>${x}</option>`).join('');if(dirs.includes(prev))ds.value=prev;const ps=$('#period');if(!ps.options.length){ps.innerHTML='<option value="all">Январь–август</option>'+data.months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}const d=directionData();if(!d)return;const dv=$('#doctor').value,cv=$('#category').value;$('#doctor').innerHTML='<option value="all">Все врачи</option>'+Object.keys(d.doctors).map(x=>`<option>${x}</option>`).join('');if(Object.keys(d.doctors).includes(dv))$('#doctor').value=dv;$('#category').innerHTML='<option value="all">Все категории</option>'+d.categories.map(x=>`<option>${x}</option>`).join('');if(d.categories.includes(cv))$('#category').value=cv}
function renderKpis(){const a=aggregateSelection();$('#kpis').innerHTML=`<div class="kpi"><span>Выручка услуг</span><strong>${money(a.r)}</strong></div><div class="kpi"><span>Количество услуг</span><strong>${count(a.q)}</strong></div><div class="kpi"><span>Средняя цена услуги</span><strong>${money(a.avg)}</strong></div><div class="kpi"><span>Активных категорий</span><strong>${count(a.active)}</strong></div>`}
function categoryRows(){const d=directionData(),docs=selectedDoctors(d),cats=selectedCategories(d),m=selectedMonth();return cats.map(cat=>{let q=0,r=0;docs.forEach(name=>{const x=metric(d.doctors[name],cat,m);q+=x[0];r+=x[1]});return {cat,q,r,avg:q?r/q:0}}).sort((a,b)=>b.r-a.r)}
function doctorRows(){const d=directionData(),docs=selectedDoctors(d),cats=selectedCategories(d),m=selectedMonth();return docs.map(name=>{let q=0,r=0,best={cat:'—',r:-1};cats.forEach(cat=>{const x=metric(d.doctors[name],cat,m);q+=x[0];r+=x[1];if(x[1]>best.r)best={cat,r:x[1]}});return {name,q,r,avg:q?r/q:0,best:best.r>0?best.cat:'—'}}).sort((a,b)=>b.r-a.r)}
function panelClass(){const v=$('#direction').value;return v==='Стоматология'?'dent':v==='Клиника'?'clinic':'lab'}
function renderSummary(){const rows=categoryRows(),total=rows.reduce((a,x)=>a+x.r,0),max=Math.max(...rows.map(x=>x.r),1);let h=`<div class="panel ${panelClass()}"><h2>Структура выручки по категориям</h2><div class="table-wrap"><table class="table"><thead><tr><th>Категория</th><th>Кол-во</th><th>Выручка</th><th>Доля</th></tr></thead><tbody>`;rows.filter(x=>x.q||x.r).slice(0,12).forEach(x=>h+=`<tr><td>${x.cat}<div class="bar"><i style="width:${100*x.r/max}%"></i></div></td><td>${count(x.q)}</td><td class="money">${money(x.r)}</td><td>${total?pct(x.r/total):'—'}</td></tr>`);h+='</tbody></table></div></div>';const d=directionData(),docs=selectedDoctors(d),cats=selectedCategories(d);h+=`<div class="panel ${panelClass()}"><h2>Динамика по месяцам</h2><div class="table-wrap"><table class="table"><thead><tr><th>Месяц</th><th>Количество</th><th>Выручка</th><th>Средняя цена</th></tr></thead><tbody>`;data.months.forEach((mo,mi)=>{let q=0,r=0;docs.forEach(n=>cats.forEach(c=>{const x=metric(d.doctors[n],c,mi);q+=x[0];r+=x[1]}));h+=`<tr><td>${mo}</td><td>${count(q)}</td><td class="money">${money(r)}</td><td>${q?money(r/q):'—'}</td></tr>`});h+='</tbody></table></div></div>';$('#content').innerHTML=h}
function renderCategories(){const rows=categoryRows(),total=rows.reduce((a,x)=>a+x.r,0);let h=`<div class="panel ${panelClass()}"><h2>Категории услуг</h2><div class="table-wrap"><table class="table"><thead><tr><th>Категория</th><th>Кол-во</th><th>Выручка</th><th>Доля</th><th>Средняя цена</th></tr></thead><tbody>`;rows.forEach(x=>h+=`<tr><td>${x.cat}</td><td>${count(x.q)}</td><td class="money">${money(x.r)}</td><td>${total?pct(x.r/total):'—'}</td><td>${x.q?money(x.avg):'—'}</td></tr>`);h+='</tbody></table></div></div>';$('#content').innerHTML=h}
function renderDoctors(){const rows=doctorRows();let h=`<div class="panel ${panelClass()}"><h2>Врачи</h2><div class="table-wrap"><table class="table"><thead><tr><th>Врач</th><th>Кол-во услуг</th><th>Выручка услуг</th><th>Средняя цена</th><th>Ведущая категория</th></tr></thead><tbody>`;rows.forEach(x=>h+=`<tr><td>${x.name}</td><td>${count(x.q)}</td><td class="money">${money(x.r)}</td><td>${x.q?money(x.avg):'—'}</td><td>${x.best}</td></tr>`);h+='</tbody></table></div></div>';$('#content').innerHTML=h}
function renderMatrix(){const d=directionData(),docs=selectedDoctors(d),cats=selectedCategories(d),m=selectedMonth();let h=`<div class="panel ${panelClass()}"><h2>Матрица категорий × врачей</h2><div class="table-wrap"><table class="table matrix"><thead><tr><th>Категория</th>${docs.map(x=>`<th>${x.replace(/ /g,'<br>')}</th>`).join('')}<th>Итого</th></tr></thead><tbody>`;cats.forEach(cat=>{let tq=0,tr=0;let cells='';docs.forEach(name=>{const x=metric(d.doctors[name],cat,m);tq+=x[0];tr+=x[1];cells+=`<td><div class="cell-main">${money(x[1])}</div><div class="cell-sub">${count(x[0])} усл.</div></td>`});h+=`<tr><td>${cat}</td>${cells}<td><div class="cell-main">${money(tr)}</div><div class="cell-sub">${count(tq)} усл.</div></td></tr>`});h+='</tbody></table></div></div>';$('#content').innerHTML=h}
function render(){if(!data){$('#missingData').classList.remove('hidden');$('#kpis').innerHTML='';$('#content').innerHTML='';return}$('#missingData').classList.add('hidden');renderFilters();renderKpis();if(currentTab==='summary')renderSummary();if(currentTab==='categories')renderCategories();if(currentTab==='doctors')renderDoctors();if(currentTab==='matrix')renderMatrix();$('#status').textContent=`Источник: ${data.source}. Данные: ${data.id}.`}
async function login(e){e.preventDefault();const u=$('#loginName').value.trim(),p=$('#loginPassword').value;const h=await sha256(u+'|'+p);if(u===AUTH_USER&&h===AUTH_HASH){sessionStorage.setItem(SESSION_KEY,'1');await showApp()}else $('#loginError').textContent='Неверный логин или пароль'}
async function showApp(){captureKey();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');data=localData();if(sessionStorage.getItem(IMPORT_KEY)){const ok=await importSecureData();if(ok)data=localData()}renderFilters();render()}
function init(){captureKey();$('#loginForm').addEventListener('submit',login);$('#logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem(SESSION_KEY);location.reload()});['direction','period','doctor','category'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(id==='direction')renderFilters();render()}));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));if(sessionStorage.getItem(SESSION_KEY)==='1')showApp()}
init();
</script>
</body>
</html>
