<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прогноз роста — AZ-BAZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--soft:#fffdf8;--ink:#2d342f;--muted:#6d746c;--green:#44634f;--green2:#dfe9e2;--gold:#b59662;--gold2:#efe5d2;--blue:#dfe9f2;--rose:#f1dfdc;--line:#d8cdbb;--red:#9a4b48}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fcfaf6,var(--paper));color:var(--ink);font-family:Montserrat,Arial,sans-serif}body{min-height:100vh}.page{width:min(1560px,97vw);margin:auto;padding:18px 0 42px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.title{margin:0;font:700 40px/1 'Cormorant Garamond',serif}.sub{margin-top:7px;max-width:900px;color:var(--muted);font-size:11px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border:1px solid rgba(68,99,79,.3);border-radius:9px;background:#fff;color:#334039;text-decoration:none;font-size:11px;font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8}.field{display:grid;gap:5px}.field label{font-size:9px;font-weight:700;color:#667067}.field input,.field select{width:100%;padding:8px 9px;border:1px solid #cfc5b5;border-radius:8px;background:#fff;font:600 11px Montserrat}.field small{font-size:8px;color:#7b817b}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scenario{border:1px solid var(--line);border-radius:13px;background:#fffdf8;overflow:hidden}.scenario h2{margin:0;padding:11px 13px;font:700 21px/1.05 'Cormorant Garamond',serif}.scenario.structure h2{background:var(--green2)}.scenario.dent h2{background:var(--blue)}.scenario.lab h2{background:var(--gold2)}.scenario-body{padding:11px}.toggleline{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:10px;font-weight:700}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.baseline{margin-top:9px;padding:8px;border-radius:9px;background:#faf7f1;font-size:9px;line-height:1.5;color:#626a62}.panel{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fffdf8;overflow:hidden}.panel h2{margin:0;padding:11px 14px;background:var(--gold2);font:700 22px/1.1 'Cormorant Garamond',serif}.summary{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;padding:12px}.metric{border:1px solid #e2d9ca;border-radius:10px;background:#fff;padding:10px}.metric span{display:block;font-size:8.5px;font-weight:700;color:#727970}.metric strong{display:block;margin-top:5px;font:700 20px/1 'Cormorant Garamond',serif}.positive{color:#2f7048}.negative{color:var(--red)}.accordion{border-top:1px solid #e7dfd3}.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid #e7dfd3;background:#fffdf8;font:700 12px Montserrat;color:#334039;cursor:pointer}.acc-body{display:none;padding:0 12px 12px}.acc-body.open{display:block}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.card{border:1px solid #dfd6c7;border-radius:10px;background:#fff;overflow:hidden}.card h3{margin:0;padding:9px 10px;font:700 16px/1 'Cormorant Garamond',serif}.card.manage h3{background:var(--blue)}.card.analytics h3{background:var(--green2)}.card.fin h3{background:var(--gold2)}.rows{padding:5px 10px}.r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eee7dc;font-size:9px}.r:last-child{border-bottom:0}.r span{color:#6e756e}.r strong{text-align:right}.table-wrap{overflow:auto;margin-top:10px;border:1px solid #e2d9ca;border-radius:10px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #e8e0d4;border-right:1px solid #eee7dc;text-align:right;font-size:9px;white-space:nowrap}th{background:#faf6ef}th:first-child,td:first-child{text-align:left}.insight{margin-top:12px;border:1px solid #cfdccc;border-left:4px solid var(--green);border-radius:12px;background:#f7fbf7;padding:14px}.insight h2{margin:0;font:700 22px/1 'Cormorant Garamond',serif}.insight p{margin:8px 0 0;font-size:10.5px;line-height:1.55;color:#435047}.badge{display:inline-block;margin-left:8px;font-size:10px;font-weight:700}.loading{padding:12px;color:#6d746c;font-size:10px}
@media(max-width:1000px){.scenario-grid,.three{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.page{width:100%;padding:10px 0 28px}.top{padding:0 10px;flex-direction:column}.title{font-size:32px}.bar{border-radius:0;border-left:0;border-right:0}.scenario-grid{padding:0 8px}.summary{grid-template-columns:repeat(2,1fr);padding:9px}.inputs{grid-template-columns:1fr}.panel{border-radius:0;border-left:0;border-right:0}.insight{margin:10px}.actions .btn{font-size:9px;padding:7px 8px}}
</style>
</head>
<body><main class="page">
<header class="top"><div><h1 class="title">Прогноз роста</h1><div class="sub">Совокупный сценарий по всей клинике. Можно менять только нужные направления, а остальные оставить как есть. Общая картина всегда считается по Отделению структуры, Стоматологии и Лаборатории вместе.</div></div><div class="actions"><a class="btn primary" href="/reports/">К отчётам</a><a class="btn" href="/">На главную</a></div></header>
<div class="bar"><div class="field"><label>Базовый месяц</label><select id="baseMonth"></select></div><div class="field"><label>Горизонт</label><select id="horizon"><option value="3">3 месяца</option><option value="6" selected>6 месяцев</option><option value="12">12 месяцев</option></select></div><div class="field"><label>Повторные</label><select id="repeatCurve"><option value="normal">40% / 35% / 25%</option><option value="fast">60% / 40%</option><option value="same">в том же месяце</option></select></div></div>
<div id="loading" class="loading">Загрузка текущих данных…</div><section id="app" style="display:none">
<div class="scenario-grid" id="scenarioGrid"></div>
<div class="panel"><h2>Общая картина клиники</h2><div id="summary" class="summary"></div><div id="accordion" class="accordion"></div></div>
<div class="insight"><h2>Короткий вывод <span id="badge" class="badge"></span></h2><p id="insight"></p></div>
</section></main>
<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(Number(n)||0))+' ₽', pct=n=>new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(Number(n)||0), num=n=>Number.isFinite(+n)?+n:0;
const DIRS=[['structure','Отделение структуры'],['dent','Стоматология'],['lab','Лаборатория']];let FIN=null,STORE={},ANALYTICS=null,SALARY=null,EXTRA=null;
function parseBlob(k){try{return JSON.parse(STORE[k]||'null')}catch{return null}}function rec(m){return FIN?.management?.[m]||{}}function mi(m){return Math.max(0,(+String(m).slice(5,7)||1)-1)}
function stat(m,d){const r=rec(m);if(d==='dent'){const docs=r.dentists||{};return{rev:Object.values(docs).reduce((a,v)=>a+num(v),0),primary:num(r.dentPrimary),repeat:num(r.dentRepeat),docs}}if(d==='structure'){const docs=r.structureDoctors||{};return{rev:Object.values(docs).reduce((a,v)=>a+num(v),0),primary:num(r.clinicPrimary),repeat:num(r.clinicRepeat),docs}}return{rev:num(r.factLab),primary:0,repeat:0,docs:{}}}
function adir(d){const ds=ANALYTICS?.directions||{};for(const n of d==='dent'?['Стоматология']:d==='structure'?['Отделение структуры','Клиника']:['Лаборатория'])if(ds[n])return ds[n];return null}
function recsum(o,i){if(o==null)return 0;if(Array.isArray(o)){if(typeof o[i]==='number')return num(o[i]);return o.reduce((a,v)=>a+recsum(v,i),0)}if(typeof o==='object')return Object.values(o).reduce((a,v)=>a+recsum(v,i),0);return 0}
function fotRate(m,d,rev){const i=mi(m),names=d==='dent'?['Стоматология']:d==='structure'?['Отделение структуры','Клиника']:['Лаборатория'];let t=0;for(const n of names){if(SALARY?.[n])t+=recsum(SALARY[n],i);if(EXTRA?.[n])t+=recsum(EXTRA[n],i)}return rev>0&&t>0&&t/rev<1.2?t/rev:(d==='dent'?.30:d==='structure'?.35:.40)}
function segments(d,m){const s=stat(m,d),out=[['all','Все направление']];Object.keys(s.docs||{}).sort().forEach(n=>out.push(['doctor:'+n,'Врач: '+n]));(adir(d)?.categories||[]).forEach(n=>out.push(['cat:'+n,'Раздел: '+n]));return out}
function segRev(m,d,seg){const s=stat(m,d);if(seg.startsWith('doctor:'))return num(s.docs?.[seg.slice(7)]);if(seg.startsWith('cat:')){const ad=adir(d),cat=seg.slice(4),i=mi(m);let t=0;for(const doc of Object.values(ad?.doctors||{})){const x=doc?.[cat]?.[i]||[0,0];t+=num(x[1])}return t}return s.rev}
function baseline(m,d,seg){const s=stat(m,d),rev=segRev(m,d,seg);let visits=s.primary+s.repeat;if(seg!=='all'&&s.rev>0)visits*=rev/s.rev;const primary=seg==='all'?s.primary:(s.rev>0?s.primary*rev/s.rev:0),repeat=seg==='all'?s.repeat:(s.rev>0?s.repeat*rev/s.rev:0),avg=visits?rev/visits:(d==='lab'?12000:4500),rr=primary?repeat/primary:(d==='lab'?1:2),fr=fotRate(m,d,rev),med=d==='dent'?.12:d==='lab'?.18:.02,cap=Math.max(Math.ceil(visits*1.5),Math.ceil(visits+20));return{rev,visits,primary,repeat,avg,rr,fr,med,cap}}
function mkScenario(d,label){return `<div class="scenario ${d}"><h2>${label}</h2><div class="scenario-body"><label class="toggleline"><input type="checkbox" id="on-${d}"> Изменять это направление</label><div class="inputs"><div class="field"><label>Специалист / раздел</label><select id="seg-${d}"></select></div><div class="field"><label>+ первичных / мес.</label><input id="prim-${d}" type="number" min="0" value="0"></div><div class="field"><label>Доп. маркетинг / мес.</label><input id="mkt-${d}" type="number" min="0" step="1000" value="0"></div><div class="field"><label>Повторных на 1 первичного</label><input id="rr-${d}" type="number" min="0" step="0.1"></div><div class="field"><label>Средняя выручка / визит</label><input id="avg-${d}" type="number" min="0" step="100"></div><div class="field"><label>ФОТ, %</label><input id="fot-${d}" type="number" min="0" max="100" step="1"></div><div class="field"><label>Переменные мед. затраты, %</label><input id="med-${d}" type="number" min="0" max="100" step="1"></div><div class="field"><label>Макс. приёмов / мес.</label><input id="cap-${d}" type="number" min="0" step="1"></div></div><div class="baseline" id="base-${d}"></div></div></div>`}
function fillSegments(d){const m=$('#baseMonth').value,s=$('#seg-'+d),cur=s.value;s.innerHTML=segments(d,m).map(x=>`<option value="${x[0].replaceAll('"','&quot;')}">${x[1]}</option>`).join('');if([...s.options].some(o=>o.value===cur))s.value=cur}
function applyBase(d,force=false){const m=$('#baseMonth').value,seg=$('#seg-'+d).value||'all',b=baseline(m,d,seg);if(force||!$('#rr-'+d).dataset.touched){$('#rr-'+d).value=b.rr.toFixed(1);$('#avg-'+d).value=Math.round(b.avg);$('#fot-'+d).value=Math.round(b.fr*100);$('#med-'+d).value=Math.round(b.med*100);$('#cap-'+d).value=b.cap}$('#base-'+d).textContent=`Сейчас: выручка ${money(b.rev)} · первичных ${b.primary.toFixed(1)} · повторных ${b.repeat.toFixed(1)} · визитов ${b.visits.toFixed(1)} · ФОТ ~${pct(b.fr)}`}
function curve(kind){return kind==='same'?[1]:kind==='fast'?[.6,.4]:[.4,.35,.25]}
function scenario(d){const m=$('#baseMonth').value,seg=$('#seg-'+d).value||'all',b=baseline(m,d,seg),on=$('#on-'+d).checked,add=on?num($('#prim-'+d).value):0,marketing=on?num($('#mkt-'+d).value):0,rr=num($('#rr-'+d).value),avg=num($('#avg-'+d).value),fot=num($('#fot-'+d).value)/100,med=num($('#med-'+d).value)/100,cap=num($('#cap-'+d).value),h=+$('#horizon').value,c=curve($('#repeatCurve').value),rows=[];for(let k=0;k<h;k++){let repeat=0;for(let j=0;j<c.length;j++){const source=k-j;if(source>=0)repeat+=add*rr*c[j]}const visits=add+repeat,totalVisits=b.visits+visits,load=cap?totalVisits/cap:0,rev=visits*avg,fotCost=rev*fot,medCost=rev*med,profit=rev-fotCost-medCost-marketing;rows.push({k,add,repeat,visits,load,rev,fotCost,medCost,marketing,profit})}return{d,seg,b,on,rows,tot:rows.reduce((a,r)=>{for(const k of ['rev','fotCost','medCost','marketing','profit','visits'])a[k]+=r[k];a.maxLoad=Math.max(a.maxLoad,r.load);return a},{rev:0,fotCost:0,medCost:0,marketing:0,profit:0,visits:0,maxLoad:0})}}
function clinicBase(m){const r=rec(m),rev=num(r.factMedicine)+num(r.factLab),exp=Object.values(FIN?.expenses?.months?.[m]?.operating||{}).reduce((a,x)=>a+num(x.total),0);return{rev,exp,profit:rev-exp}}
function calculate(){const m=$('#baseMonth').value,ss=DIRS.map(x=>scenario(x[0])),base=clinicBase(m),add=ss.reduce((a,s)=>{for(const k of ['rev','fotCost','medCost','marketing','profit'])a[k]+=s.tot[k];a.maxLoad=Math.max(a.maxLoad,s.tot.maxLoad);return a},{rev:0,fotCost:0,medCost:0,marketing:0,profit:0,maxLoad:0}),newRev=base.rev+add.rev,newExp=base.exp+add.fotCost+add.medCost+add.marketing,newProfit=base.profit+add.profit;$('#summary').innerHTML=[[`Текущая выручка`,money(base.rev),''],['Новая выручка',money(newRev),''],['Текущая опер. прибыль',money(base.profit),base.profit>=0?'positive':'negative'],['Новая опер. прибыль',money(newProfit),newProfit>=0?'positive':'negative'],['Доп. маркетинг',money(add.marketing),''],['Макс. загрузка',pct(add.maxLoad),add.maxLoad>1?'negative':'']].map(x=>`<div class="metric"><span>${x[0]}</span><strong class="${x[2]}">${x[1]}</strong></div>`).join('');renderAcc(ss,base,newRev,newExp,newProfit);renderInsight(ss,add,base,newProfit)}
function renderAcc(ss,base,newRev,newExp,newProfit){$('#accordion').innerHTML=ss.map((s,i)=>{const lab=DIRS.find(x=>x[0]===s.d)[1],t=s.tot;return `<button class="acc-head" data-i="${i}"><span>+ ${lab}${s.on?' · сценарий включён':' · без изменений'}</span><strong>${s.on?money(t.profit):'текущие показатели'}</strong></button><div class="acc-body" id="acc-${i}"><div class="three"><div class="card manage"><h3>Управленческий учёт</h3><div class="rows"><div class="r"><span>Доп. визиты</span><strong>${t.visits.toFixed(1)}</strong></div><div class="r"><span>Макс. загрузка</span><strong>${pct(t.maxLoad)}</strong></div><div class="r"><span>Доп. выручка</span><strong>${money(t.rev)}</strong></div></div></div><div class="card analytics"><h3>Аналитика услуг</h3><div class="rows"><div class="r"><span>ФОТ</span><strong>${money(t.fotCost)}</strong></div><div class="r"><span>Мед. затраты</span><strong>${money(t.medCost)}</strong></div><div class="r"><span>Маркетинг</span><strong>${money(t.marketing)}</strong></div></div></div><div class="card fin"><h3>Финрез</h3><div class="rows"><div class="r"><span>Доп. прибыль</span><strong class="${t.profit>=0?'positive':'negative'}">${money(t.profit)}</strong></div><div class="r"><span>Рентабельность прироста</span><strong>${t.rev?pct(t.profit/t.rev):'—'}</strong></div></div></div></div>${monthTable(s)}</div>`}).join('')+`<button class="acc-head" data-i="clinic"><span>+ Клиника целиком</span><strong>${money(newProfit)}</strong></button><div class="acc-body" id="acc-clinic"><div class="three"><div class="card manage"><h3>Управленческий учёт</h3><div class="rows"><div class="r"><span>Выручка было</span><strong>${money(base.rev)}</strong></div><div class="r"><span>Выручка станет</span><strong>${money(newRev)}</strong></div></div></div><div class="card analytics"><h3>Аналитика услуг</h3><div class="rows"><div class="r"><span>Изменения</span><strong>по 3 направлениям</strong></div><div class="r"><span>Неизменённые направления</span><strong>учтены в базе</strong></div></div></div><div class="card fin"><h3>Финрез</h3><div class="rows"><div class="r"><span>Расходы было</span><strong>${money(base.exp)}</strong></div><div class="r"><span>Расходы станет</span><strong>${money(newExp)}</strong></div><div class="r"><span>Опер. прибыль</span><strong class="${newProfit>=0?'positive':'negative'}">${money(newProfit)}</strong></div></div></div></div></div>`;document.querySelectorAll('.acc-head').forEach(b=>b.onclick=()=>$('#acc-'+b.dataset.i).classList.toggle('open'))}
function monthTable(s){return `<div class="table-wrap"><table><thead><tr><th>Месяц</th><th>Новые первичные</th><th>Новые повторные</th><th>Доп. визиты</th><th>Загрузка</th><th>Доп. выручка</th><th>ФОТ</th><th>Мед. затраты</th><th>Маркетинг</th><th>Доп. прибыль</th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.add.toFixed(1)}</td><td>${r.repeat.toFixed(1)}</td><td>${r.visits.toFixed(1)}</td><td>${pct(r.load)}</td><td>${money(r.rev)}</td><td>${money(r.fotCost)}</td><td>${money(r.medCost)}</td><td>${money(r.marketing)}</td><td>${money(r.profit)}</td></tr>`).join('')}</tbody></table></div>`}
function renderInsight(ss,add,base,newProfit){const active=ss.filter(s=>s.on),over=active.filter(s=>s.tot.maxLoad>1),loss=active.filter(s=>s.tot.profit<0),good=active.filter(s=>s.tot.profit>0);let badge='Без изменений',text='Выберите хотя бы одно направление и задайте сценарий роста.';if(active.length){if(over.length){badge='Упирается в мощность';text=`Сценарий перегружает ${over.map(s=>DIRS.find(x=>x[0]===s.d)[1]).join(', ')}. До увеличения маркетинга нужно расширить доступное время или мощность.`}else if(loss.length){badge='Осторожно';text=`Рост не окупается в ${loss.map(s=>DIRS.find(x=>x[0]===s.d)[1]).join(', ')} при заданных ФОТ, среднем чеке и маркетинге. Проверьте стоимость привлечения, повторные и загрузку.`}else{badge='Развивать';text=`Совокупный сценарий добавляет ${money(add.rev)} выручки и ${money(add.profit)} операционной прибыли за выбранный горизонт. ${good.length} из ${active.length} изменяемых направлений дают положительный вклад.`}text+=` Операционная прибыль клиники по модели: ${money(base.profit)} → ${money(newProfit)}.`}$('#badge').textContent=badge;$('#insight').textContent=text}
async function init(){const [fr,sr]=await Promise.all([fetch('/api/reports/finrez',{credentials:'same-origin',cache:'no-store'}),fetch('/api/reports/storage',{credentials:'same-origin',cache:'no-store'})]);FIN=await fr.json();STORE=(await sr.json()).storage||{};ANALYTICS=parseBlob('az-service-analytics-v1');SALARY=parseBlob('az-service-salary-v1');EXTRA=parseBlob('az-service-extra-payments-v1');const months=Object.keys(FIN.management||{}).sort();$('#baseMonth').innerHTML=months.map(m=>`<option value="${m}">${m}</option>`).join('');$('#baseMonth').value=months[months.length-1]||'';$('#scenarioGrid').innerHTML=DIRS.map(x=>mkScenario(x[0],x[1])).join('');for(const [d] of DIRS){fillSegments(d);applyBase(d,true);$('#seg-'+d).onchange=()=>{applyBase(d,true);calculate()};for(const id of ['rr','avg','fot','med','cap'])$('#'+id+'-'+d).oninput=e=>{e.target.dataset.touched='1';calculate()};for(const id of ['on','prim','mkt'])$('#'+id+'-'+d).oninput=calculate}$('#baseMonth').onchange=()=>{for(const[d]of DIRS){fillSegments(d);applyBase(d,true)}calculate()};$('#horizon').onchange=calculate;$('#repeatCurve').onchange=calculate;$('#loading').style.display='none';$('#app').style.display='block';calculate()}
init().catch(e=>{$('#loading').textContent='Не удалось загрузить данные прогноза: '+e.message});
</script></body></html>
