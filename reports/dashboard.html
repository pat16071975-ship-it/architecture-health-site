<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд — AZ-BAZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--ink:#2d342f;--green:#44634f;--gold:#b59662}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6,var(--paper));color:var(--ink);font-family:'Montserrat',Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(640px,94vw);padding:34px;border:1px solid rgba(181,150,98,.42);border-radius:16px;background:#fffdf8;box-shadow:0 18px 50px rgba(69,55,35,.08);text-align:center}h1{margin:0;font-size:36px;font-weight:500}.sub{margin:12px 0 24px;color:#667067;font-size:13px;line-height:1.5}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid rgba(68,99,79,.34);border-radius:10px;background:#fff;color:#334039;text-decoration:none;font-size:12px;font-weight:600}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body><main class="card"><h1>Дашборд</h1><div class="sub">Раздел подготовлен в меню. Состав показателей и внешний вид дашборда настроим отдельно.</div><div class="actions"><a class="btn primary" href="/reports/">К отчётам</a><a class="btn" href="/">На главную</a></div></main></body>
</html>
