<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6650A4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MD Рук-ль">
<title>MD Руководитель — демо</title>
<style>
:root{--p:#6650A4;--bg:#FFFBFE;--text:#1C1B1F;--muted:#49454F;--line:#79747E;--red:#F7D9D7;--redt:#410E0B;--green:#E6F4EA;--greent:#276738;font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{-webkit-tap-highlight-color:transparent}button{font:inherit}#app{width:min(100%,460px);min-height:100svh;margin:0 auto;background:var(--bg)}.screen{min-height:100svh;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:grid;gap:12px;align-content:start}.home{align-content:center;text-align:center;padding-left:24px;padding-right:24px}.app-title{font-size:16px;font-weight:500;margin:0}.greeting,.name{font-size:24px;line-height:32px;margin:8px 0 0}.clinic{font-size:14px;margin:10px 0}.section-title{font-size:16px;font-weight:500;margin:18px 0 2px}h1{font-size:24px;font-weight:400;margin:0 0 8px}h2{font-size:16px;font-weight:500;margin:10px 0 0}.btn{width:100%;min-height:48px;border-radius:24px;padding:10px 18px;cursor:pointer}.outline{color:var(--p);background:transparent;border:1px solid var(--line)}.filled{color:white;background:var(--p);border:1px solid var(--p)}.home .btn{margin-top:7px}.switch{width:auto!important;justify-self:center}.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}.metric{font-size:22px;font-weight:600;margin-top:4px}.small{font-size:12px;line-height:16px;color:var(--muted)}.body{font-size:16px;line-height:24px}.badge{display:inline-block;margin-top:7px;padding:6px 10px;border-radius:10px;border:1px solid;font-size:14px;font-weight:500}.bad{background:var(--red);color:var(--redt);border-color:#B3261E}.good{background:var(--green);color:var(--greent);border-color:#76A982}.good2{background:#D7EFDC;color:#155A2B;border-color:#4B965F}.summary{border-radius:12px;padding:14px 16px;background:#F4F0F5}.warm{background:#FFF5F8}.cool{background:#F8F4FC}.plan{background:#F2E9FF}.back{margin-top:6px}@media(min-width:700px){body{background:#F2EFF4}#app{box-shadow:0 0 24px rgba(0,0,0,.08)}}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.getElementById('app');
const D={name:'Тестовый Руководитель',clinic:'Тестовая клиника'};
function hello(){const h=new Date().getHours();return h>=5&&h<=11?'Доброе утро':h>=12&&h<=17?'Добрый день':'Добрый вечер'}
function firstName(){const p=D.name.split(/\s+/);return p.length>2?p[1]+' '+p[2]:p.slice(-1)[0]}
function go(v){location.hash=v;render()}
function back(){location.hash='';render()}
function home(){return `<section class="screen home"><p class="app-title">MD Руководитель</p><p class="greeting">${hello()}</p><p class="name">${firstName()}!</p><p class="clinic">${D.clinic}</p><button class="btn outline switch">Сменить клинику</button><p class="section-title">Управление клиникой</p><button class="btn outline" onclick="go('attention')">Требуют вашего внимания</button><button class="btn outline" onclick="go('daily')">Ежедневные сводки</button><button class="btn outline" onclick="go('today')">Сегодня</button><button class="btn outline" onclick="go('metrics')">Показатели</button><button class="btn outline" onclick="go('reports')">Отчёты</button></section>`}
function attention(){return `<section class="screen"><h1>Требуют вашего внимания</h1><div class="card"><div class="body">Не закрыта смена</div><span class="badge bad">Требует внимания</span><p class="small">Демонстрационное событие для визуальной проверки manager UI.</p></div><div class="card"><div class="body">Снижение загрузки расписания</div><span class="badge bad">Требует внимания</span><p class="small">Тестовое пояснение. Реальные правила и данные позже приходят с сервера.</p></div><button class="btn filled back" onclick="back()">Назад</button></section>`}
function today(){return `<section class="screen"><h1>Сегодня</h1><h2>Требуют вашего внимания</h2><div class="card"><div class="body">Тестовое событие</div><span class="badge bad">Требует внимания</span><p class="small">Демонстрационные данные для разработки интерфейса.</p></div><h2>Показатели</h2><div class="card"><div class="body">Тестовый показатель</div><div class="metric">—</div><p class="small">Серверные данные ещё не подключены.</p></div><button class="btn filled back" onclick="back()">Назад</button></section>`}
function metrics(){return `<section class="screen"><h1>Показатели</h1><div class="card"><div class="body">Выручка сегодня</div><div class="metric">245 000 ₽</div><p class="small">Демонстрационное значение для визуальной проверки.</p></div><div class="card"><div class="body">Загрузка врачей</div><div class="metric">78%</div><p class="small">Тестовый показатель. Источник данных пока не подключён.</p></div><div class="card"><div class="body">Первичные пациенты</div><div class="metric">14</div><p class="small">Демонстрационная карточка без обращения к backend.</p></div><button class="btn filled back" onclick="back()">Назад</button></section>`}
function reports(){return `<section class="screen"><h1>Отчёты</h1><div class="card"><div class="body"><b>Выручка по направлениям</b></div><p class="small">Демонстрационный отчёт для manager debug-стенда.</p></div><div class="card"><div class="body"><b>Конверсия первичных пациентов</b></div><p class="small">Состав реальных мобильных отчётов позже задаётся сервером/настройками.</p></div><button class="btn filled back" onclick="back()">Назад</button></section>`}
function daily(){return `<section class="screen"><div><h1 style="margin-bottom:4px">Сводка за вчера</h1><div class="small">Дата сводки: 2026-09-12</div></div><div class="summary">Демонстрационная сводка. Реальная AI-сводка позже будет приходить из MD Platform.</div><h2>Показатели</h2><div class="summary cool"><b>Выручка за завершённый день</b><div class="body">245 000 ₽</div><div class="small">Тестовое значение только для проверки интерфейса.</div></div><div class="summary warm"><b>Загрузка расписания</b><div class="body">78%</div><div class="small">Демонстрационный показатель.</div></div><h2>Подтверждённые факты и причины</h2><div class="summary warm">• Число завершённых приёмов выше тестового значения предыдущего дня.</div><div class="summary">• Одна из клиник не выполнила тестовый план.</div><div class="summary plan"><b>Выполнение плана по клиникам</b><br><span class="badge good">План выполнен: 1</span><br><span class="badge good2">План перевыполнен: 1</span><br><span class="badge bad">План не выполнен: 1</span></div><h2>Клиники</h2><div class="summary"><b>Клиника 1</b><br><span class="badge good2">План перевыполнен</span><div class="body">Демонстрационное резюме клиники.</div></div><div class="summary"><b>Клиника 2</b><br><span class="badge good">План выполнен</span><div class="body">Демонстрационное резюме клиники.</div></div><div class="summary"><b>Клиника 3</b><br><span class="badge bad">План не выполнен</span><div class="body">Демонстрационное резюме клиники.</div></div><button class="btn filled back" onclick="back()">Назад</button></section>`}
function render(){const v=location.hash.slice(1);app.innerHTML=({attention,daily,today,metrics,reports}[v]||home)();scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
