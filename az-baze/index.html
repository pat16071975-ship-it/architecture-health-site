<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZ-BAZE — Архитектура здоровья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--paper2:#efe8db;--ink:#2d342f;--green:#44634f;--gold:#b59662;--line:#786d61;--soft:#faf6ef}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcfaf6 0,var(--paper) 65%,var(--paper2) 100%);color:var(--ink);font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
.page{position:relative;width:1400px;max-width:96vw;min-height:100vh;margin:auto;padding:18px 0 48px}
.top{display:grid;grid-template-columns:220px 1fr 220px;gap:24px;align-items:start}
.left,.right{display:flex;flex-direction:column;align-items:center;position:relative}
.logo{width:188px;height:188px;object-fit:contain}
.founder{width:156px;height:156px;object-fit:cover!important;background:transparent!important;border:none!important;border-radius:0!important;outline:none!important;box-shadow:none!important;mix-blend-mode:multiply!important;filter:brightness(1.035) contrast(.985) saturate(.97) sepia(.018)!important;opacity:.985!important;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 94%,transparent 100%);mask-composite:intersect}
.caption{margin-top:10px;text-align:center;font-size:14px;line-height:1.35;color:#515951}
.caption strong{color:var(--ink);font-weight:600}
.clinic-contact{margin-top:10px;text-align:center;color:#394139}
.clinic-phone{white-space:nowrap;font:600 16px/1.12 'Montserrat',Inter,Segoe UI,Arial,sans-serif}
.clinic-phone a{color:#355640;text-decoration:none}
.clinic-hours{margin-top:6px;font:500 10.5px/1.45 'Montserrat',Inter,Segoe UI,Arial,sans-serif;color:#616a62;white-space:nowrap}
.center{text-align:center;padding-top:8px;min-width:0}
.az-title-stack{width:max-content;max-width:100%;margin:0 auto}
.az-system-clinic-label{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 0 4px;text-align:right;font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:600;line-height:1.45;letter-spacing:.11em;text-transform:uppercase;color:#526158;white-space:nowrap}
.az-ecg-inline{flex:0 0 76px;width:76px;height:17px;display:block;overflow:visible}
h1{margin:7px 0 0;font-family:'Montserrat',Inter,Segoe UI,Arial,sans-serif;font-size:68px;font-weight:500;line-height:1.08;letter-spacing:-.035em}
.rule{width:220px;height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.home-shell{position:relative;min-height:610px;margin-top:20px;display:flex;align-items:center;justify-content:center;padding:34px 430px 34px 250px}
.menu-column{position:relative;z-index:5;width:340px;display:grid;gap:18px;transform:translateY(-84px)}
.menu-btn{width:100%;min-height:60px;padding:15px 24px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(181,150,98,.42);border-radius:10px;background:rgba(250,247,241,.96);box-shadow:0 9px 24px rgba(71,58,38,.08);backdrop-filter:blur(7px);color:#354039;font:600 16px/1.15 'Montserrat',Inter,Segoe UI,Arial,sans-serif;letter-spacing:.005em;text-decoration:none;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s}
.menu-btn.active{cursor:pointer}
.menu-btn.active:hover,.menu-btn.active:focus-visible{outline:0;border-color:rgba(68,99,79,.55);background:#fbf8f2;box-shadow:0 12px 30px rgba(71,58,38,.12);transform:translateY(-1px);color:var(--green)}
.menu-btn.placeholder{opacity:.58;cursor:default}
.vit-shell{position:absolute;right:54px;top:calc(50% - 84px);width:360px;height:360px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 50% 44%,#f8f4eb 0,#f2eadc 68%,#ece1d0 100%);border:1px solid rgba(181,150,98,.42);box-shadow:0 18px 60px rgba(76,58,34,.09);overflow:hidden}
.vit-shell:before{content:'';position:absolute;inset:26px;border-radius:50%;border:1px solid rgba(181,150,98,.36);z-index:3;pointer-events:none}
.vit-shell:after{content:'';position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(181,150,98,.14);z-index:0;pointer-events:none}
.vit-img{position:absolute;left:50%;top:53%;width:98%;height:98%;object-fit:cover;object-position:center 52%;transform:translate(-50%,-50%);filter:sepia(.08) saturate(.9) contrast(.97) brightness(1.04);mix-blend-mode:multiply}
@media(max-width:1180px){
  .page{width:1000px;max-width:96vw}
  .top{grid-template-columns:160px 1fr 160px}
  .logo{width:142px;height:142px}
  .founder{width:120px;height:120px}
  .caption{font-size:12px}
  .clinic-phone{font-size:13px}
  .clinic-hours{font-size:9px}
  h1{font-size:54px}
  .az-system-clinic-label{font-size:11px;letter-spacing:.09em;gap:8px}
  .az-ecg-inline{flex-basis:58px;width:58px;height:14px}
  .home-shell{min-height:520px;padding:30px 330px 30px 160px}
  .menu-column{width:300px;gap:15px;transform:translateY(-60px)}
  .menu-btn{min-height:56px;font-size:14px}
  .vit-shell{right:24px;top:calc(50% - 60px);width:290px;height:290px}
}
@media(max-width:720px){
  .page{width:100%;max-width:100vw;padding:10px 12px 30px}
  .top{grid-template-columns:64px minmax(0,1fr) 64px;gap:8px}
  .logo{width:64px;height:64px}
  .founder{width:60px;height:60px}
  .caption{margin-top:4px;font-size:7.5px;line-height:1.2}
  .clinic-contact{display:none}
  .center{padding-top:1px}
  .az-title-stack{width:auto}
  .az-system-clinic-label{justify-content:center;font-size:7.2px;line-height:1.35;letter-spacing:.065em;gap:5px;margin-bottom:2px;white-space:normal}
  .az-ecg-inline{flex:0 0 36px;width:36px;height:10px}
  h1{margin-top:2px;font-size:28px;line-height:1.02;letter-spacing:-.025em}
  .rule{width:92px;margin-top:7px}
  .home-shell{min-height:0;margin-top:24px;padding:0;display:flex;flex-direction:column;gap:24px}
  .menu-column{order:1;width:min(100%,360px);gap:10px;transform:none}
  .menu-btn{min-height:52px;padding:13px 18px;font-size:13px}
  .vit-shell{order:2;position:relative;right:auto;top:auto;width:min(72vw,290px);height:min(72vw,290px);transform:none;margin:0 auto}
}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="left">
      <img class="logo" src="../assets/logo-site.webp?v=20260831-3" alt="Архитектура здоровья">
      <div class="clinic-contact">
        <div class="clinic-phone"><a href="tel:+73832842421">+7 (383) 284-24-21</a></div>
        <div class="clinic-hours">Пн-Пт — 08:00—21:00,<br>Сб-Вс — 09:00—21:00</div>
      </div>
    </div>
    <div class="center">
      <div class="az-title-stack">
        <div class="az-system-clinic-label">
          <svg class="az-ecg-inline" viewBox="0 0 90 22" aria-hidden="true" focusable="false">
            <defs><linearGradient id="azEcgInlineLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#44634f"/><stop offset="48%" stop-color="#7b8f78"/><stop offset="100%" stop-color="#b59662"/></linearGradient></defs>
            <path d="M2 12 H18 L23 8 L29 16 L35 2 L42 19 L49 9 L55 13 H88" fill="none" stroke="url(#azEcgInlineLine)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Медицинская клиника системного подхода</span>
        </div>
        <h1>Архитектура здоровья</h1>
      </div>
      <div class="rule"></div>
    </div>
    <div class="right">
      <img class="founder" src="../assets/founder-site.webp" alt="Зубачёв Роман Николаевич">
      <div class="caption">Основатель клиники<br><strong>Зубачёв Роман Николаевич</strong></div>
    </div>
  </header>
  <section class="home-shell" aria-label="Разделы AZ-BAZE">
    <nav class="menu-column" aria-label="Оглавление">
      <a class="menu-btn active" href="../reports/">Отчёты</a>
      <a class="menu-btn active" href="#knowledge" id="knowledge">База знаний</a>
      <div class="menu-btn placeholder" aria-disabled="true">Рабочие контакты</div>
      <div class="menu-btn placeholder" aria-disabled="true">Дни рождения сотрудников</div>
      <div class="menu-btn placeholder" aria-disabled="true">Раздел в разработке</div>
    </nav>
    <div class="vit-shell" aria-hidden="true">
      <img class="vit-img" src="../assets/vitruvian-original.jpg?v=20260827-1" alt="">
    </div>
  </section>
</main>
</body>
</html>
